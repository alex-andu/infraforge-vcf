    difficulty: intermediate
    topics: [vsan-health]
    objective: "2.3"
    lesson: vsan-health-troubleshooting
    section: network-partition
    context: |
      ```log
      esx-01: Sub-Cluster Member Count: 3
      esx-02: Sub-Cluster Member Count: 3
      esx-03: Sub-Cluster Member Count: 3
      esx-04: Sub-Cluster Member Count: 1
      ```
    stem: "What does this output from `esxcli vsan cluster get` indicate?"
    options:
      - { id: a, text: "esx-04 is partitioned from the other vSAN hosts", correct: true, why: "It sees only itself while the others see three members." }
      - { id: b, text: "esx-04 is the vSAN leader", why: "Leader role is unrelated to member count." }
      - { id: c, text: "The cluster is healthy with 3 + 1 hosts", why: "All hosts should report 4." }
      - { id: d, text: "A device failed on esx-04", why: "A device failure does not change membership.", confusedWith: vsan-resilience }
    explanation:
      correct: "Different member counts mean a network partition; check the vSAN vmk, VLAN, MTU and unicast agents of esx-04."
      concept: "Partition diagnosis."
      trap: "Running the command on one host only hides the partition."

  - id: p03-he-002
    type: single
    kind: troubleshooting
    difficulty: intermediate
    topics: [vsan-health]
    objective: "2.3"
    lesson: vsan-health-troubleshooting
    section: network-partition
    context: |
      `vmkping -I vmk2 10.10.30.22` succeeds, but `vmkping -I vmk2 -s 8972 -d 10.10.30.22` fails. vSAN is configured
      for MTU 9000.
    stem: "What is the most likely problem?"
    options:
      - { id: a, text: "An MTU mismatch somewhere in the vSAN path", correct: true, why: "Small packets pass, jumbo frames with don't-fragment do not." }
      - { id: b, text: "Wrong VLAN on the vSAN port group", why: "Then even small pings would fail.", confusedWith: vds }
      - { id: c, text: "DNS failure", why: "vmkping to an IP does not use DNS.", confusedWith: dns }
      - { id: d, text: "The vSAN service is not tagged on vmk2", why: "Tagging does not affect ICMP reachability." }
    explanation:
      correct: "Check VDS/vSwitch, vmk, physical switch and router MTU; 8972 bytes + headers = 9000."
      concept: "End-to-end MTU validation."
      trap: "Testing only with default-size pings."

  - id: p03-he-003
    type: single
    kind: log
    difficulty: advanced
    topics: [vsan-health, vsan-resilience]
    objective: "2.3"
    lesson: vsan-health-troubleshooting
    section: object-health-states
    context: |
      ```log
      Health Status                                     Number Of Objects
      reduced-availability-with-no-rebuild-delay-timer                 27
      reduced-availability-with-active-rebuild                          0
      inaccessible                                                      0
      healthy                                                         213
      ```
    stem: "A host was rebooted 10 minutes ago. What is the best action?"
    options:
      - { id: a, text: "Wait for the host to return and monitor; vSAN is in the repair delay window", correct: true, why: "Absent components; a delta resync will follow when the host returns." }
      - { id: b, text: "Immediately force a rebuild of all 27 objects", why: "Wasteful while the host is expected back." }
      - { id: c, text: "Restore the 27 VMs from backup", why: "Nothing is inaccessible." }
      - { id: d, text: "Replace the host's NVMe devices", why: "No device failure is indicated.", confusedWith: vsan-resilience }
    explanation:
      correct: "no-rebuild-delay-timer = absent components waiting for the 60-minute repair delay."
      concept: "Reading object health states."
      trap: "Treating reduced availability as data loss."

  - id: p03-he-004
    type: single
