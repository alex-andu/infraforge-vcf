      - { id: d, text: "HCL findings cannot be silenced", why: "They can; silencing just doesn't fix the score." }
    explanation:
      correct: "Silenced checks keep their weighted penalties until the condition is remediated."
      concept: "Skyline Health scoring."
      trap: "Using silence as a fix."

  - id: p03-he-005
    type: ordering
    kind: troubleshooting
    difficulty: advanced
    topics: [vsan-health, troubleshooting-method]
    objective: "2.3"
    lesson: vsan-health-troubleshooting
    section: how-it-works
    stem: "Order the steps of an efficient vSAN troubleshooting flow."
    items:
      - { id: i1, text: "Read Skyline Health: score and highest-impact finding" }
      - { id: i2, text: "Scope: compare esxcli vsan cluster get member counts across hosts" }
      - { id: i3, text: "Classify objects with esxcli vsan debug object health summary get" }
      - { id: i4, text: "Validate the hypothesis (vmkping, device state, vobd.log, capacity)" }
      - { id: i5, text: "Remediate the cause" }
      - { id: i6, text: "Verify: resync reaches zero, objects healthy, RETEST" }
    explanation:
      correct: "Observe, scope, classify, validate, remediate, verify."
      concept: "Structured troubleshooting."
      trap: "Jumping to remediation from the first red line."

