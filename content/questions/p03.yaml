    stem: "Type the esxcli command that shows the host-level default vSAN policy for each object class (cluster, vdisk, vmnamespace, vmswap, vmem)."
    answers: ["esxcli vsan policy getdefault"]
    placeholder: "esxcli vsan policy ..."
    explanation:
      correct: "`esxcli vsan policy getdefault` prints the default policy per object class."
      concept: "Host-level defaults vs vCenter VM storage policies."
      trap: "This is not the datastore default VM storage policy set in vCenter."

  - id: p03-po-010
    type: truefalse
    kind: concept
    difficulty: foundation
    topics: [vsan-policies, vsan-resilience]
    objective: "2.3"
    lesson: vsan-storage-policies
    section: why-compliant-healthy
    stem: "True or false: a VM whose objects are compliant with an FTT=0 policy is protected against a single host failure."
    options:
      - { id: "true", text: "True", why: "FTT=0 means a single component; losing its host makes the data unavailable." }
      - { id: "false", text: "False", correct: true, why: "Compliance means the object matches its policy — and the policy asks for no redundancy." }
    explanation:
      correct: "False. Compliant with FTT=0 still means no redundancy."
      concept: "Compliance vs protection."
      trap: "Equating a green compliance icon with safety."

  # ---------------------------------------------------------------- vsan-resilience-fault-domains
  - id: p03-re-001
    type: single
    kind: concept
    difficulty: foundation
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: component-states
    diagnostic: storage
    stem: "A host in a vSAN cluster is rebooted for patching without maintenance mode. How does vSAN treat its components?"
    options:
      - { id: a, text: "As degraded, and rebuilds them immediately", why: "Degraded is for permanent failures." , confusedWith: vsan-health }
      - { id: b, text: "As absent, and waits for the repair delay (60 minutes by default) before rebuilding elsewhere", correct: true, why: "Temporary failures are absent; the host is expected back." }
      - { id: c, text: "As deleted; the VMs must be restored from backup", why: "Data on other components remains available." }
      - { id: d, text: "As out of date", why: "Out of date relates to policy changes." }
    explanation:
      correct: "Absent components trigger rebuild after 60 minutes; if the host returns earlier only a delta resync is needed."
      concept: "Absent vs degraded."
      trap: "Expecting immediate rebuild for every failure."

  - id: p03-re-002
    type: single
    kind: architecture
    difficulty: intermediate
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: quorum-and-votes
    stem: "An FTT=1 RAID-1 object has replica A on host 1, replica B on host 2 and a witness on host 3. Hosts 2 and 3 fail at the same time. What happens?"
    options:
      - { id: a, text: "The object stays accessible because replica A holds all data", why: "Only 1 of 3 votes remains; quorum (>50 %) is lost." }
      - { id: b, text: "The object becomes inaccessible because fewer than 50 % of its votes remain", correct: true, why: "Two of three components are gone." }
      - { id: c, text: "vSAN converts the object to FTT=0", why: "No such automatic conversion." }
      - { id: d, text: "The witness is rebuilt on host 1 automatically", why: "Components of one object cannot share a host, and quorum is already lost." }
    explanation:
      correct: "An object needs more than 50 % of votes and a full replica; one replica alone has 1 of 3 votes."
      concept: "Quorum and witness components."
      trap: "Thinking a full data copy is always enough."

  - id: p03-re-003
    type: single
    kind: design
    difficulty: advanced
    topics: [vsan-resilience, design-availability]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: fault-domains
    context: |
      Twelve ESX hosts are spread across four racks (three per rack). The ESA cluster uses FTT=1 RAID-5. The customer
      wants to survive the loss of an entire rack and return to full compliance afterwards.
    stem: "What should be configured?"
    options:
      - { id: a, text: "Nothing; vSAN spreads components across hosts already", why: "Without fault domains two components of one object may land in the same rack." }
      - { id: b, text: "Four vSAN fault domains, one per rack", correct: true, why: "RAID-5 2+1 needs three fault domains; the fourth allows rebuild after a rack failure." }
      - { id: c, text: "A stretched cluster with two sites", why: "Stretched clusters address sites, not racks in one room.", confusedWith: design-availability }
      - { id: d, text: "Change to FTT=0 to avoid rebuilds", why: "Removes protection." }
    explanation:
      correct: "One fault domain per rack makes vSAN place components in different racks; the +1 fault domain enables rebuild."
      concept: "Rack awareness."
      architecture: "With fault domains, FTT counts fault-domain failures instead of host failures."
      trap: "Assuming host-level separation equals rack-level separation."

  - id: p03-re-004
    type: single
    kind: concept
    difficulty: intermediate
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: stretched-clusters
    stem: "In a vSAN stretched cluster, what does the witness host store?"
    options:
      - { id: a, text: "A third full copy of every object", why: "The witness stores no VM data." }
      - { id: b, text: "Only witness components (metadata) used as tiebreakers", correct: true, why: "TechDocs: it does not store customer data, only metadata." }
      - { id: c, text: "The vCenter appliance", why: "The witness cannot run VMs." }
      - { id: d, text: "Swap files of VMs in the secondary site", why: "Swap objects follow VM policies on data sites." }
    explanation:
      correct: "The witness host holds witness components and acts as tiebreaker; it cannot run VMs."
      concept: "Stretched cluster witness."
      trap: "Treating the witness as a third data site."

  - id: p03-re-005
    type: single
    kind: scenario
    difficulty: advanced
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: stretched-clusters
    context: |
      A vSAN stretched cluster has Site A (preferred), Site B (secondary) and a witness at Site C. The network link
      between Site A and Site B fails; both sites can still reach the witness.
    stem: "What is the expected behaviour?"
    options:
      - { id: a, text: "Both sites keep running all VMs independently", why: "That would be a split brain; vSAN prevents it." }
      - { id: b, text: "The preferred site keeps running with the witness; VMs from the secondary site are restarted by HA in the preferred site", correct: true, why: "On a partition the preferred site wins." }
      - { id: c, text: "The secondary site takes over because it is closer to the witness", why: "The preferred site designation decides." }
      - { id: d, text: "All VMs stop until the link is repaired", why: "The design keeps one site available." }
    explanation:
      correct: "During an inter-site partition the preferred site remains operational; HA restarts affected VMs there."
      concept: "Preferred vs secondary site."
      architecture: "Three fault domains: preferred, secondary, witness."
      trap: "Assuming a link failure equals a site failure for both sides."

  - id: p03-re-006
    type: matching
    kind: concept
    difficulty: intermediate
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: maintenance-mode-options
    stem: "Match each vSAN maintenance mode option with its best use."
    pairs:
      - { id: p1, left: "Ensure accessibility", right: "Short reboot for patching (default)" }
      - { id: p2, left: "Full data migration", right: "Decommissioning the host or long maintenance" }
      - { id: p3, left: "No data migration", right: "Full cluster shutdown when you accept that FTT=0 objects on the host become inaccessible" }
    explanation:
      correct: "Ensure accessibility moves the minimum; full migration evacuates everything; no migration moves nothing."
      concept: "Maintenance mode data migration options."
      trap: "Using full data migration for every reboot wastes hours of resync."

  - id: p03-re-007
    type: multi
    kind: concept
    difficulty: intermediate
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: stretched-clusters
    select: 2
    stem: "Which round-trip latency limits does vSAN 9.0 document? (Choose two.)"
    options:
      - { id: a, text: "Up to 5 ms RTT between the two data sites of a stretched cluster", correct: true, why: "Network requirements table." }
      - { id: b, text: "Up to 200 ms RTT between a data site and the witness host", correct: true, why: "Network requirements table." }
      - { id: c, text: "Up to 50 ms RTT between hosts of a single-site cluster", why: "Single-site clusters require 1 ms or less." }
      - { id: d, text: "Up to 1 ms RTT to the witness", why: "The witness tolerates much higher latency." }
    explanation:
      correct: "Single site ≤1 ms, between stretched sites ≤5 ms, to witness ≤200 ms, client to storage cluster ≤5 ms."
      concept: "vSAN network latency requirements."
      trap: "Mixing up the site-to-site and site-to-witness numbers."

  - id: p03-re-008
    type: single
    kind: concept
    difficulty: intermediate
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: two-node-clusters
    stem: "Which statement about witness hosts is correct?"
    options:
      - { id: a, text: "One witness host can serve several stretched clusters", why: "A witness serves only one stretched cluster." }
      - { id: b, text: "One witness host can be shared by up to 64 two-node clusters, depending on its memory", correct: true, why: "TechDocs two-node cluster page." }
      - { id: c, text: "The witness host must be at the preferred site", why: "It must be at a third location." }
      - { id: d, text: "Witness hosts can run small VMs", why: "Witness hosts cannot run VMs." }
    explanation:
      correct: "Shared witness: up to 64 two-node clusters; stretched clusters need their own witness."
      concept: "Witness sizing and sharing."
      trap: "Generalizing two-node witness sharing to stretched clusters."

  - id: p03-re-009
    type: single
    kind: concept
    difficulty: expert
    topics: [vsan-resilience]
    objective: "2.3"
    lesson: vsan-resilience-fault-domains
    section: stretched-clusters
    stem: "Which stretched-cluster capability was introduced in VCF 9.0 as generally available, and which as limited availability?"
    options:
      - { id: a, text: "Site maintenance mode GA; manual site takeover limited availability (TQR)", correct: true, why: "As described on the VCF blog for 9.0." }
      - { id: b, text: "Manual site takeover GA; site maintenance mode limited availability", why: "Reversed." }
      - { id: c, text: "Both limited availability", why: "Site maintenance mode is GA." }
      - { id: d, text: "Neither exists; stretched clusters were removed", why: "Stretched clusters remain a vSAN topology." }
    explanation:
      correct: "VCF 9.0: site maintenance mode places a whole site in maintenance in one operation (GA); manual site takeover recovers from simultaneous loss of a data site and the witness (limited availability via TQR)."
      concept: "VCF 9 stretched-cluster operations."
      trap: "Remembering the features but not their availability status."

  # ---------------------------------------------------------------- vsan-space-efficiency-capacity
  - id: p03-ca-001
    type: single
    kind: concept
    difficulty: foundation
    topics: [vsan-capacity]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: techniques-at-a-glance
    stem: "Which space-efficiency feature is enabled by default on a vSAN ESA cluster?"
    options:
      - { id: a, text: "Compression", correct: true, why: "TechDocs: for vSAN ESA, compression is enabled by default on the cluster." }
      - { id: b, text: "Global deduplication", why: "Limited availability in 9.0 and not on by default." }
      - { id: c, text: "Deduplication and compression per disk group", why: "That is OSA and must be enabled." , confusedWith: vsan-architecture }
      - { id: d, text: "RAID-6 for all objects", why: "RAID level comes from the policy." , confusedWith: vsan-policies }
    explanation:
      correct: "ESA compression is on by default and can be turned off per VM via a storage policy."
      concept: "ESA vs OSA data reduction."
      trap: "Assuming dedup is also default."

  - id: p03-ca-002
    type: multi
    kind: concept
    difficulty: advanced
    topics: [vsan-capacity]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: esa-global-deduplication-vcf-9-0
    select: 3
    stem: "Which statements about vSAN ESA global deduplication in VCF 9.0 are correct? (Choose three.)"
    options:
      - { id: a, text: "It is post-process: data is deduplicated after it is persisted and cools down", correct: true, why: "VCF blog description." }
      - { id: b, text: "The whole cluster is one deduplication domain, at 4 KB granularity", correct: true, why: "Unlike OSA's per-disk-group domain." }
      - { id: c, text: "It is initially limited availability through Broadcom's Technical Qualification Request program", correct: true, why: "VCF blog." }
      - { id: d, text: "It is supported on stretched clusters with data-at-rest encryption", why: "Stretched clusters and data-at-rest encryption are not supported at launch." }
      - { id: e, text: "It runs inline during destage from the cache tier", why: "That describes OSA dedup.", confusedWith: vsan-architecture }
    explanation:
      correct: "Global dedup: post-process, 4 KB, cluster-wide, LA via TQR, single-site HCI or storage clusters of 3-16 hosts with 25 GbE+."
      concept: "VCF 9.0 vSAN what's new."
      trap: "Mixing OSA inline per-disk-group dedup with ESA global dedup."

  - id: p03-ca-003
    type: single
    kind: scenario
    difficulty: intermediate
    topics: [vsan-capacity]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: esa-compression
    context: |
      A backup repository VM on vSAN ESA stores already-compressed, encrypted backup files. The admin creates a policy
      with "No space efficiency" and applies it to the VM.
    stem: "What happens to the data already written?"
    options:
      - { id: a, text: "It is decompressed immediately", why: "TechDocs: old blocks are left as they are." }
      - { id: b, text: "Nothing changes for existing blocks; only new writes are stored without compression", correct: true, why: "ESA compression changes apply to new writes." }
      - { id: c, text: "The VM must be powered off", why: "Policies are applied online." }
      - { id: d, text: "The object is converted to RAID-1", why: "Space efficiency and RAID level are separate rules." , confusedWith: vsan-policies }
    explanation:
      correct: "ESA compression settings only affect new writes; existing blocks stay as written."
      concept: "Per-object compression control."
      trap: "Expecting retroactive changes."

  - id: p03-ca-004
    type: single
    kind: concept
    difficulty: intermediate
    topics: [vsan-capacity]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: osa-deduplication-and-compression
    stem: "Why does enabling deduplication and compression on vSAN OSA increase the impact of a single capacity device failure?"
    options:
      - { id: a, text: "Dedup metadata is spread across the disk group, so one device failure fails the entire disk group", correct: true, why: "TechDocs: a single disk failure causes the entire disk group to fail." }
      - { id: b, text: "Dedup disables all redundancy", why: "Policies still provide redundancy." }
      - { id: c, text: "Dedup moves data to the cache device", why: "Dedup happens during destage to capacity." }
      - { id: d, text: "It does not; impact is unchanged", why: "Impact grows to the disk group." }
    explanation:
      correct: "With OSA dedup and compression, deduplicated data and metadata span the disk group, so losing any device fails the group."
      concept: "OSA dedup domain = disk group."
      trap: "Assuming device failures are always isolated (true for ESA, not OSA with dedup)."

  - id: p03-ca-005
    type: single
    kind: design
    difficulty: advanced
    topics: [vsan-capacity, design-sizing]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: reserves-why-free-is-not-free
    context: |
      A four-host vSAN ESA cluster is 74 % used. The team wants to be sure vSAN can rebuild a failed host's data on the
      other three hosts.
    stem: "Which setting addresses this directly, and roughly how much capacity does it reserve on four nodes?"
    options:
      - { id: a, text: "Host rebuild reserve; about 25 % of capacity", correct: true, why: "KB 326889 example: 4-node cluster reserves about 25 %." }
      - { id: b, text: "Operations reserve; about 3 %", why: "Operations reserve covers internal operations; ~3 % is the HRR example for 32 nodes." }
      - { id: c, text: "Object space reservation 100 % for all VMs", why: "Thick provisioning reserves per object, not rebuild headroom.", confusedWith: vsan-policies }
      - { id: d, text: "Compression", why: "Saves space but does not reserve rebuild capacity." }
    explanation:
      correct: "Host rebuild reserve keeps N+1 capacity: about 25 % on 4 nodes, about 3 % on 32 nodes."
      concept: "Capacity reserves."
      architecture: "Smaller clusters pay proportionally more for self-healing."
      trap: "Confusing operations reserve with host rebuild reserve."

  - id: p03-ca-006
    type: single
    kind: design
    difficulty: expert
    topics: [vsan-capacity, vsan-policies]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: sizing-example
    context: |
      A vSAN ESA cluster grows from five to six hosts. All VMs use an FTT=1 RAID-5 policy. 40 TB of VM data is written
      (ignore compression and reserves).
    stem: "Approximately how much raw capacity do these objects consume before and after the sixth host is added (once vSAN has adapted)?"
    options:
      - { id: a, text: "60 TB before (2+1), 50 TB after (4+1)", correct: true, why: "1.5x below six hosts, 1.25x at six or more." }
      - { id: b, text: "53 TB before and after (3+1)", why: "3+1 is the OSA RAID-5 layout." , confusedWith: vsan-architecture }
      - { id: c, text: "80 TB before and after", why: "That is RAID-1 FTT=1." }
      - { id: d, text: "60 TB before and after", why: "ESA adapts the layout to 4+1 when the cluster reaches six hosts." }
    explanation:
      correct: "40 TB × 1.5 = 60 TB with 2+1; 40 TB × 1.25 = 50 TB with 4+1."
      concept: "Adaptive RAID-5 capacity effect."
      trap: "Using the OSA 1.33x ratio for ESA."

  - id: p03-ca-007
    type: single
    kind: troubleshooting
    difficulty: advanced
    topics: [vsan-capacity, vsan-health]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: failure-scenarios
    context: |
      A host failed permanently in a vSAN cluster that was 91 % used. Two hours later, the object health summary shows
      many objects as "reduced-availability-with-no-rebuild".
    stem: "What is the most likely reason the rebuild is not happening?"
    options:
      - { id: a, text: "There is not enough free capacity on the remaining hosts to rebuild", correct: true, why: "At red-threshold usage, vSAN cannot place new components." }
      - { id: b, text: "The 60-minute repair delay has not expired", why: "Two hours have passed, and the object state would say delay-timer." }
      - { id: c, text: "Compression is enabled", why: "Compression does not block rebuilds." }
      - { id: d, text: "The HCL database is outdated", why: "Noise; unrelated to rebuild placement.", confusedWith: vsan-health }
    explanation:
      correct: "Rebuilds need free capacity (and spare hosts/fault domains); a nearly full cluster can survive a failure but not heal."
      concept: "Capacity as an availability dependency."
      trap: "Blaming the timer when the state is explicitly 'no-rebuild'."

  - id: p03-ca-008
    type: truefalse
    kind: concept
    difficulty: intermediate
    topics: [vsan-capacity]
    objective: "2.3"
    lesson: vsan-space-efficiency-capacity
    section: techniques-at-a-glance
    stem: "True or false: on vSAN OSA, deduplication and compression, as well as RAID-5/6 erasure coding, require an all-flash cluster."
    options:
      - { id: "true", text: "True", correct: true, why: "Both are all-flash features on OSA." }
      - { id: "false", text: "False", why: "Hybrid OSA (magnetic capacity disks) supports neither." }
    explanation:
      correct: "True. Dedup/compression and erasure coding on OSA are all-flash only."
      concept: "OSA feature requirements."
      trap: "ESA is all-NVMe, so the question only matters for OSA."

