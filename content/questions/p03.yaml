  - id: p03-he-007
    type: multi
    kind: troubleshooting
    difficulty: expert
    topics: [vsan-health, vsan-resilience]
    objective: "2.3"
    lesson: vsan-health-troubleshooting
    section: device-failure
    select: 2
    context: |
      Skyline Health on a six-host ESA cluster: vSAN object health red, physical disk health red (one device on
      esx-03), HCL DB yellow, time sync yellow on esx-05. All hosts report six members. Objects show active rebuild.
    stem: "Which findings are red herrings for the object health problem? (Choose two.)"
    options:
      - { id: a, text: "HCL DB outdated", correct: true, why: "Cannot cause device failure or object degradation." }
      - { id: b, text: "Time sync warning on esx-05", correct: true, why: "Minor, on another host; does not explain degraded components." }
      - { id: c, text: "Physical disk health on esx-03", why: "This is the root cause: a failed device produces degraded components and immediate rebuild." }
      - { id: d, text: "Object health red", why: "This is the main symptom." }
    explanation:
      correct: "The device failure on esx-03 explains degraded objects with active rebuild; HCL DB and NTP are separate compliance findings."
      concept: "Separating root cause from noise."
      architecture: "On ESA a device failure only affects that device's components."
      trap: "Fixing the easiest finding first instead of the highest-impact one."

  - id: p03-he-008
    type: single
    kind: scenario
    difficulty: expert
    topics: [vsan-health, vsan-architecture]
    objective: "2.3"
    lesson: vsan-health-troubleshooting
    section: troubleshooting
    context: |
      In a nested home lab, the Configure vSAN wizard (ESA) reports no eligible disks on any host. `esxcli storage core
      device list` shows the intended vSAN disks as "Local VMware Disk (mpx.vmhba0:C0:T1:L0)", Is SSD: true.
    stem: "What is the most likely cause?"
    options:
      - { id: a, text: "The virtual disks are attached to a SCSI controller, not an NVMe controller, so ESA will not claim them", correct: true, why: "ESA requires NVMe devices; William Lam documents this exact nested failure." }
      - { id: b, text: "The disks are too small for vSAN", why: "Size is not the issue here; device type is." }
      - { id: c, text: "vSAN ESA requires hybrid disks", why: "ESA is NVMe only." , confusedWith: vsan-architecture }
      - { id: d, text: "HA is enabled", why: "HA blocks enabling vSAN, but it would not make disks ineligible." }
    explanation:
      correct: "Present the disks via an NVMe controller (on Proxmox, QEMU -device nvme) and, in labs, satisfy the ESA compatibility check with the unsupported mock VIB."
      concept: "ESA device eligibility."
      trap: "Marking disks as flash helps OSA, not ESA."
