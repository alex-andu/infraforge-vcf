      - { id: b, text: "Tier-1", why: "Tier-1 advertises to its Tier-0 only; it doesn't run BGP to physical routers.", confusedWith: nsx-routing }
      - { id: c, text: "The distributed router on each host", why: "DRs don't peer with physical routers." }
      - { id: d, text: "NSX Manager", why: "Not in the routing path.", confusedWith: nsx-architecture }
    explanation:
      correct: "Tier-0 SRs peer (BGP/OSPF/static) with physical routers; Tier-1s connect northbound to one Tier-0."
      concept: "Tier-0 vs Tier-1 roles."
