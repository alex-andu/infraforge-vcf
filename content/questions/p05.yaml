    topics: [nsx-routing]
    objective: "2.4"
    lesson: nsx-tier0-tier1-routing
    section: bgp-on-the-tier-0
    context: |
      ```shell
      edge-01(tier0_sr)> get bgp neighbor summary
      Neighbor      AS     State   Up/DownTime  BFD  InMsgs  OutMsgs  InPfx  OutPfx
      10.27.11.1    65000  Active  never        NC   0       0        0      0
      ```
    stem: "What does this state tell you?"
    options:
      - { id: a, text: "The SR is trying to open the TCP 179 session and failing – check IP reachability, VLAN and ACLs first", correct: true, why: "Active = connection attempts failing; no messages exchanged." }
      - { id: b, text: "The session is up and actively exchanging routes", why: "Only Established exchanges routes; 'Active' is a common trap." }
      - { id: c, text: "The neighbor is administratively shut down on the NSX side", why: "Admin-down shows Idle (and BFD AD), not Active." }
      - { id: d, text: "BFD has failed while BGP is fine", why: "BFD is not configured (NC) and BGP isn't up." }
    explanation:
      correct: "BGP states: Idle → Connect → Active → OpenSent → OpenConfirm → Established. 'Active' with zero messages means TCP never came up."
      concept: "BGP finite state machine."
      trap: "'Active' sounds healthy; it isn't."
