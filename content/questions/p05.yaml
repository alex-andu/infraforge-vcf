      - { id: c, text: "TCP 8443 isn't supported by the DFW", why: "Any TCP port works." }
      - { id: d, text: "The gateway firewall overrides the DFW", why: "This is east-west; no gateway firewall is involved.", confusedWith: nsx-security }
    explanation:
      correct: "Top-down first match: grp-shop → grp-shop drop matches web→app before the allow rule."
      concept: "Rule order."
  - id: nsx-sec-008
