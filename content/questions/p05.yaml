      - { id: b, text: "Application → Environment → Infrastructure → Emergency → Ethernet", why: "Reversed." }
      - { id: c, text: "Emergency → Ethernet → Application → Infrastructure → Environment", why: "Wrong order." }
      - { id: d, text: "All categories are evaluated in parallel; the most specific rule wins", why: "DFW is top-down, first match." }
    explanation:
      correct: "Categories in that order, rules top-down, first match wins, default rule last."
