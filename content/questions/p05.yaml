questions:
  # ---------------------------------------------------------------- architecture
  - id: nsx-arch-001
    type: single
    kind: architecture
    difficulty: foundation
    version: vcf9
    topics: [nsx-architecture]
    objective: "2.4"
    lesson: nsx-architecture
    section: concept
    diagnostic: nsx
    stem: "Which NSX component hosts both the management plane and the central control plane (CCP)?"
    options:
      - { id: a, text: "The NSX Manager appliances", correct: true, why: "NSX Manager nodes run the policy/management services, UI/API and the CCP." }
      - { id: b, text: "The NSX Edge nodes", why: "Edges are transport nodes (data plane) that host SRs; they run an LCP, not the CCP.", confusedWith: nsx-edge }
      - { id: c, text: "vCenter Server", why: "vCenter is registered as a compute manager for inventory and host preparation; it is not the NSX control plane." }
      - { id: d, text: "Every ESX host transport node", why: "Hosts run the local control plane (LCP) and data plane, not the CCP.", confusedWith: nsx-transport }
    explanation:
      correct: "The NSX Manager appliance hosts the API services, the management plane and the central control plane. Transport nodes run the LCP and the data plane."
      concept: "Three planes: management (desired state), control (runtime state), data (forwarding)."
      architecture: "MP + CCP on the three-node NSX Manager cluster; LCP + data plane on ESX hosts and Edges."
      trap: "vCenter feels central, but it is only a compute manager to NSX."
  - id: nsx-arch-002
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [nsx-architecture]
    objective: "2.4"
    lesson: nsx-architecture
    section: why-the-data-plane-survives-a-management-outage
    context: |
      In a three-node NSX Manager cluster, two manager VMs are lost when a storage array fails. The third node is up.
    stem: "What is the impact on running workloads attached to existing overlay segments?"
    options:
      - { id: a, text: "Existing traffic keeps flowing; configuration changes are not possible until a majority is restored", correct: true, why: "The data plane forwards with already-programmed state; one node cannot form a majority for changes." }
      - { id: b, text: "All overlay traffic stops immediately because the CCP is unavailable", why: "Forwarding tables are already on the hosts; the managers are not in the data path." }
      - { id: c, text: "Only north-south traffic stops because Edges depend on NSX Manager for BGP", why: "BGP runs on the Edge SRs; it doesn't need the managers to stay up.", confusedWith: nsx-routing }
      - { id: d, text: "Nothing changes; the remaining node accepts changes normally", why: "One of three nodes is not a majority; the cluster cannot accept configuration changes." }
    explanation:
      correct: "Managers are not in the data path. Existing flows, DFW rules already pushed and Edge BGP sessions continue; changes and new state (new VMs, vMotion targets) are impacted."
      concept: "Separation of management/control from data plane."
      architecture: "Quorum-based NSX Manager cluster: 2 of 3 needed for writes."
      trap: "Don't confuse 'no management' with 'no forwarding'."
  - id: nsx-arch-003
    type: single
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [nsx-architecture]
    objective: "2.4"
    lesson: nsx-architecture
    section: nsx-manager-deployment-models-vcf-9-design
    stem: "An automation platform makes thousands of NSX API calls per hour. The three-node NSX Manager cluster uses its built-in VIP. Which design change spreads API load across all three managers?"
    options:
      - { id: a, text: "Place an external load balancer in front of the three NSX Manager nodes", correct: true, why: "The 'HA with external load balancer' model distributes API calls across nodes." }
      - { id: b, text: "Nothing – the built-in VIP already load-balances requests across the three nodes", why: "The VIP is owned by one node at a time and routes API requests to that node." }
      - { id: c, text: "Scale out to five NSX Manager nodes", why: "The NSX Manager cluster model is three nodes; more nodes is not the documented answer." }
      - { id: d, text: "Deploy NSX Edges as API proxies", why: "Edges are data-plane transport nodes, not API endpoints.", confusedWith: nsx-edge }
    explanation:
      correct: "VCF 9 design lists three models: simple (1 node), HA (3 nodes + VIP, VIP routes to a single node) and HA with external load balancer to increase API scale for high-churn environments."
      concept: "VIP = availability, not load balancing."
      trap: "'Virtual IP' sounds like a load balancer; in NSX it isn't."
  - id: nsx-arch-004
    type: single
    kind: scenario
    difficulty: foundation
    version: vcf9
    topics: [nsx-architecture]
    objective: "4.1"
    lesson: nsx-architecture
    section: where-nsx-sits-in-a-vcf-instance
    stem: "While creating a second VI workload domain from VCF Operations, what NSX choice does the wizard offer?"
    options:
      - { id: a, text: "Create a new NSX Manager instance or join an existing NSX Manager instance used by another workload domain", correct: true, why: "Documented choice; new instances can be Standard (1 node) or High-Availability (3 nodes)." }
      - { id: b, text: "Only reuse the management domain's NSX Manager", why: "The wizard offers new or existing instance; it isn't limited to reuse." }
      - { id: c, text: "Deploy NSX Edges only; NSX Manager is optional in VI workload domains", why: "Every workload domain is backed by an NSX Manager instance; Edges are not deployed by the wizard.", confusedWith: nsx-edge }
      - { id: d, text: "Choose between NSX Policy mode and Manager mode", why: "VCF 9.0 NSX Manager works only in Policy mode." }
    explanation:
      correct: "When creating a workload domain you can reuse an existing NSX Manager instance or create a new one (Standard single node or High-Availability three-node)."
      concept: "NSX instance per workload domain: dedicated or shared."
      architecture: "Path: VCF Operations → Inventory → Detailed View → VCF Instances → Add Workload Domain."
      trap: "Manager mode is gone in VCF 9; don't pick options that rely on it."
  - id: nsx-arch-005
    type: multi
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [nsx-architecture, nsx-transport]
    objective: "2.4"
    lesson: nsx-architecture
    section: components
    select: 2
    stem: "Which two run on every ESX host transport node? (Choose two.)"
    options:
      - { id: a, text: "The local control plane (LCP) agent", correct: true, why: "Every transport node runs the LCP." }
      - { id: b, text: "The distributed router (DR) instance of connected gateways", correct: true, why: "DRs exist in every transport node's kernel." }
      - { id: c, text: "The Tier-0 service router (SR)", why: "SRs run only on Edge nodes.", confusedWith: nsx-routing }
      - { id: d, text: "The central control plane (CCP)", why: "The CCP is on NSX Manager nodes.", confusedWith: nsx-architecture }
      - { id: e, text: "The gateway firewall", why: "The gateway firewall runs in SRs on Edges.", confusedWith: nsx-security }
    explanation:
      correct: "Hosts run the LCP and the kernel data plane: switching, DR, DFW. SRs and the gateway firewall live on Edges; the CCP on managers."
      concept: "What is distributed vs centralized in NSX."
      trap: "'Service' things (SR, gateway firewall) are never on plain hosts."
  - id: nsx-arch-006
    type: truefalse
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [nsx-architecture]
    objective: "2.4"
    lesson: nsx-architecture
    section: concept
    stem: "True or false: In VCF 9.0, NSX Manager is configured in Policy mode only; the Manager mode UI and Manager API objects are deprecated for configuration."
    options:
      - { id: "true", text: "True", correct: true, why: "VCF 9.0 documentation states NSX Manager operates exclusively in Policy mode." }
      - { id: "false", text: "False", why: "Older NSX-T versions offered both modes; VCF 9.0 does not." }
    explanation:
      correct: "Beginning with VCF 9.0 NSX Manager uses Policy mode only; automate with /policy/api/v1."
      concept: "Policy (intent-based) API vs legacy Manager API."
      trap: "Old blogs telling you to switch to Manager mode don't apply."
  - id: nsx-arch-007
    type: single
    kind: troubleshooting
    difficulty: advanced
    version: vcf9
    topics: [nsx-architecture, nsx-transport]
    objective: "2.4"
    lesson: nsx-architecture
    section: transport-nodes-and-the-lcp
    context: |
      ```shell
      esx-07> get controllers
       Controller IP   Port  SSL      Status         Is Physical Master  Session State  Controller FQDN
       10.0.10.21      1235  enabled  not connected  false               null           nsx-mgr-01.corp.local
       10.0.10.22      1235  enabled  not connected  false               null           nsx-mgr-02.corp.local
       10.0.10.23      1235  enabled  not connected  false               null           nsx-mgr-03.corp.local
      ```
    stem: "VMs already running on esx-07 work, but a VM newly powered on there cannot reach VMs on other hosts. What does the output indicate?"
    options:
      - { id: a, text: "esx-07 has lost its control-plane sessions, so it keeps old forwarding state but receives no new state", correct: true, why: "No controller connected = LCP isolated from CCP." }
      - { id: b, text: "The NSX Manager cluster is down for every host", why: "The output shows only this host's view; other hosts work normally." }
      - { id: c, text: "The host's TEP MTU is too small", why: "MTU problems don't show up as controller sessions not connected.", confusedWith: nsx-transport }
      - { id: d, text: "A DFW rule blocks the new VM", why: "DFW issues don't appear in controller connectivity.", confusedWith: nsx-security }
    explanation:
      correct: "The host's LCP has no session with any CCP node. Existing state keeps forwarding; new VMs aren't learned or distributed. Check management network reachability, certificates and services on the host."
      concept: "LCP–CCP relationship."
      trap: "Partial symptoms (only new VMs) point to control plane, not data plane."
  - id: nsx-arch-008
    type: matching
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [nsx-architecture]
    objective: "2.4"
    lesson: nsx-architecture
    section: concept
    stem: "Match each NSX plane to its job."
    pairs:
      - { id: p1, left: "Management plane", right: "Single API/UI entry point; persists desired configuration" }
      - { id: p2, left: "Central control plane", right: "Computes runtime state and distributes it to transport nodes" }
      - { id: p3, left: "Local control plane", right: "Agent on each transport node that programs the local data plane" }
      - { id: p4, left: "Data plane", right: "Forwards, encapsulates and filters packets" }
    explanation:
      correct: "MP = intent, CCP = computation/distribution, LCP = local programming, DP = forwarding."
      concept: "SDN plane separation."
  # ---------------------------------------------------------------- transport
  - id: nsx-tn-001
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [nsx-transport]
    objective: "2.4"
    lesson: nsx-transport-nodes-teps
    section: transport-zone
    diagnostic: nsx
    stem: "What does an NSX transport zone define?"
    options:
      - { id: a, text: "Which transport nodes can host which segments", correct: true, why: "A TZ is a scope: overlay or VLAN." }
      - { id: b, text: "A Layer-2 broadcast domain for VMs", why: "That is a segment.", confusedWith: nsx-segments }
      - { id: c, text: "The BGP area between Tier-0 and the ToRs", why: "Routing isn't defined by transport zones.", confusedWith: nsx-routing }
      - { id: d, text: "The set of NSX Manager nodes in a cluster", why: "Unrelated to manager clustering." }
    explanation:
      correct: "Transport zones (overlay or VLAN) define the span of segments over transport nodes. A node can be in many TZs; a segment is in exactly one."
      concept: "Scope vs network."
      trap: "TZ ≠ broadcast domain."
  - id: nsx-tn-002
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [nsx-transport]
    objective: "2.4"
    lesson: nsx-transport-nodes-teps
    section: mtu-the-numbers-to-memorize
    stem: "According to NSX MTU guidance in VCF 9.0, what is the minimum MTU required on the underlay for overlay traffic, and what is recommended?"
    options:
      - { id: a, text: "Minimum 1600 bytes; 1700 bytes recommended (9000 for best performance)", correct: true, why: "Exactly the documented values; 1700 is also the default Global Tunnel Endpoint MTU." }
      - { id: b, text: "Minimum 1500 bytes; 1600 recommended", why: "1500 cannot carry 1500-byte VM frames plus Geneve overhead." }
      - { id: c, text: "Minimum 9000 bytes", why: "9000 is optimal, not required." }
      - { id: d, text: "Minimum 1550 bytes, like VXLAN in NSX-V", why: "Legacy figure; NSX with Geneve documents 1600 minimum." }
    explanation:
      correct: "Minimum 1600, recommended 1700 (the default Global TEP MTU), 9000 if the underlay supports it."
      concept: "Geneve adds headers; underlay must be larger than VM MTU."
      trap: "Don't overstate 9000 as a requirement."
  - id: nsx-tn-003
    type: cli
    kind: command
    difficulty: intermediate
    version: vcf9
    topics: [nsx-transport]
    objective: "2.4"
    lesson: nsx-transport-nodes-teps
    section: testing-mtu-properly
    stem: "From an ESX host shell, write the command that tests reachability to remote TEP 192.168.13.12 for a 1600-byte path MTU using the TEP TCP/IP stack and the don't-fragment bit."
    answers:
      - "vmkping ++netstack=vxlan -d -s 1572 192.168.13.12"
      - "vmkping -d -s 1572 ++netstack=vxlan 192.168.13.12"
      - "vmkping ++netstack=vxlan -s 1572 -d 192.168.13.12"
      - "vmkping -S vxlan -d -s 1572 192.168.13.12"
      - "vmkping -I vmk10 -S vxlan -d -s 1572 192.168.13.12"
    placeholder: "vmkping ..."
    explanation:
      correct: "TEPs live in the vxlan netstack, so ++netstack=vxlan is required; -d sets don't-fragment; -s 1572 = 1600 minus 28 bytes of IP/ICMP headers."
      concept: "Testing underlay MTU end to end."
      trap: "Without ++netstack=vxlan you test the management stack; without -d fragmentation hides the problem."
  - id: nsx-tn-004
    type: single
    kind: troubleshooting
    difficulty: intermediate
    version: vcf9
    topics: [nsx-transport]
    objective: "2.4"
    lesson: nsx-transport-nodes-teps
    section: failure-scenarios
    context: |
      ```shell
      [root@esx-11:~] vmkping ++netstack=vxlan 192.168.13.12
      3 packets transmitted, 3 packets received, 0% packet loss
      [root@esx-11:~] vmkping ++netstack=vxlan -d -s 1572 192.168.13.12
      sendto() failed (Message too long)
      3 packets transmitted, 0 packets received, 100% packet loss
      ```
    stem: "VMs on esx-11 can ping VMs on esx-12 (same overlay segment) but SSH sessions hang after login. What is the most likely cause?"
    options:
      - { id: a, text: "The MTU on the TEP path (VDS, switch port or router) is below what the overlay needs", correct: true, why: "Small pings pass, 1572-byte don't-fragment pings fail – classic MTU." }
      - { id: b, text: "The hosts are in different overlay transport zones", why: "Then the segment wouldn't exist on both hosts and small pings would fail too." }
      - { id: c, text: "A DFW rule blocks SSH", why: "The session starts (login works); DFW wouldn't depend on packet size.", confusedWith: nsx-security }
      - { id: d, text: "BGP is down on the Tier-0", why: "Same-segment east-west traffic doesn't use the Tier-0.", confusedWith: nsx-routing }
    explanation:
      correct: "Reachability works but large packets can't pass with DF set: an MTU mismatch somewhere on the TEP path."
      concept: "Small packets work, large fail = MTU."
      architecture: "Geneve overhead requires ≥1600 underlay MTU; VDS MTU overrides the uplink profile."
      trap: "Don't chase DFW or routing when the symptom is size-dependent."
  - id: nsx-tn-005
    type: single
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [nsx-transport]
    objective: "2.4"
    lesson: nsx-transport-nodes-teps
    section: components
    stem: "An administrator adds two new hosts to an NSX-prepared vSphere cluster. They are automatically prepared with the same VDS, transport zones and TEP settings. Which object makes this happen?"
    options:
      - { id: a, text: "The transport node profile attached to the cluster", correct: true, why: "TNPs apply the same NSX configuration to every host in the cluster, including new ones." }
      - { id: b, text: "The uplink profile", why: "It defines teaming and transport VLAN, but it is referenced by the TNP; it doesn't prepare hosts by itself." }
      - { id: c, text: "The edge cluster profile", why: "Edge cluster profiles relate to Edge HA.", confusedWith: nsx-edge }
      - { id: d, text: "The segment profile", why: "Segment profiles (SpoofGuard, IP discovery…) apply to segment ports.", confusedWith: nsx-segments }
    explanation:
      correct: "A transport node profile is attached to a vSphere cluster; NSX prepares every member host consistently."
      concept: "Cluster-based host preparation."
      trap: "Uplink profile is a building block inside the TNP, not the mechanism."
  - id: nsx-tn-006
    type: single
    kind: design
    difficulty: advanced
    version: vcf9
    topics: [nsx-transport, nsx-edge]
    objective: "4.1"
    lesson: nsx-transport-nodes-teps
    section: tep-addressing-and-routing
    stem: "You deploy Edge VMs with the VCF 9 vCenter Network Connectivity workflow onto NSX-prepared hosts and want the Edge TEPs on the same VLAN as the host TEPs. What does the workflow require?"
    options:
      - { id: a, text: "'Activate NSX on DVPG' must be enabled when using the same VLAN for Edge and host overlay", correct: true, why: "Documented prerequisite of the centralized connectivity workflow." }
      - { id: b, text: "It's impossible; Edge TEPs must always use a separate routed VLAN", why: "That was the common legacy rule; VCF 9 documents reusing the host TEP VLAN.", confusedWith: nsx-transport }
      - { id: c, text: "The Edges must be bare metal", why: "Edge VMs are supported in this design.", confusedWith: nsx-edge }
      - { id: d, text: "The TEP MTU must be 1500", why: "TEP MTU must be ≥ 1600 regardless." }
    explanation:
      correct: "VCF 9's centralized workflow lists 'Activate NSX on DVPG' as a prerequisite when the same VLAN is used for Edge and host overlay, and notes the Edge TEP VLAN can reuse the host TEP VLAN."
      concept: "Edge TEP placement."
      trap: "Legacy NSX-T guidance required separate VLANs for Edges on prepared hosts – know the VCF 9 behaviour."
  - id: nsx-tn-007
    type: multi
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [nsx-transport]
    objective: "2.4"
    lesson: nsx-transport-nodes-teps
    section: transport-zone
    select: 2
    stem: "Which two statements about transport zones are true? (Choose two.)"
    options:
      - { id: a, text: "A transport node can belong to multiple transport zones", correct: true, why: "E.g. an Edge is in an overlay TZ and a VLAN TZ." }
      - { id: b, text: "A segment belongs to exactly one transport zone", correct: true, why: "Documented rule." }
      - { id: c, text: "A transport zone cannot span more than one vSphere cluster", why: "TZs can span one or more clusters." }
      - { id: d, text: "Overlay transport zones require multicast on the physical network", why: "NSX replicates BUM traffic in software.", confusedWith: nsx-segments }
    explanation:
      correct: "Nodes can be in many TZs; segments in exactly one; TZs can span clusters."
      concept: "Transport zone scoping rules."
      trap: "Multicast is not required for NSX overlay."
  - id: nsx-tn-008
    type: single
    kind: log
    difficulty: advanced
    version: vcf9
    topics: [nsx-transport, nsx-edge]
    objective: "2.4"
    lesson: nsx-transport-nodes-teps
    section: bfd-on-tunnels
    context: |
      ```shell
      edge-02> get bfd-sessions
      Local_address : 192.168.13.22   Remote_address : 192.168.13.11   State : up
      Local_address : 192.168.13.22   Remote_address : 192.168.13.12   State : up
      Local_address : 192.168.13.22   Remote_address : 192.168.13.15   State : down   Diag : Control Detection Time Expired
      ```
    stem: "Only VMs on host esx-15 (TEP 192.168.13.15) lose north-south connectivity when edge-02 becomes the active Tier-0 SR. What should you check first?"
    options:
      - { id: a, text: "Underlay reachability and MTU between esx-15's TEP and edge-02's TEP (VLAN trunk, routing, switch MTU)", correct: true, why: "The BFD tunnel between those two TEPs is down; only that host is affected." }
      - { id: b, text: "The Tier-1 route advertisement settings", why: "That would affect all hosts equally.", confusedWith: nsx-routing }
      - { id: c, text: "The DFW rules on esx-15", why: "DFW doesn't take down BFD tunnels.", confusedWith: nsx-security }
      - { id: d, text: "The NSX Manager cluster status", why: "Tunnel liveness is a data-plane matter." }
    explanation:
      correct: "BFD runs inside the Geneve tunnel; a single down session means the underlay path between those two TEPs is broken."
      concept: "Tunnel health via BFD."
      architecture: "North-south from a host needs a working tunnel to the Edge hosting the active SR."
      trap: "A problem limited to one host + one Edge is an underlay pair issue, not a gateway config issue."
  # ---------------------------------------------------------------- segments
  - id: nsx-seg-001
    type: single
    kind: architecture
    difficulty: foundation
    version: vcf9
    topics: [nsx-segments]
    objective: "2.4"
    lesson: nsx-segments-overlay
    section: case-1-same-segment-same-host
    diagnostic: nsx
    diagram: d05-east-west-packet-walk
    stem: "Two VMs on the same overlay segment run on the same ESX host. How is traffic between them forwarded?"
    options:
      - { id: a, text: "Switched locally in the host; it never leaves the host", correct: true, why: "Local MAC = local delivery." }
      - { id: b, text: "Encapsulated in Geneve and hairpinned through the physical switch", why: "Encapsulation is only for remote TEPs.", confusedWith: nsx-transport }
      - { id: c, text: "Sent to an NSX Edge for switching", why: "Edges are not involved in L2 east-west.", confusedWith: nsx-edge }
      - { id: d, text: "Routed by the Tier-1 DR", why: "Same subnet – no routing needed.", confusedWith: nsx-routing }
    explanation:
      correct: "The host switching module finds the destination MAC on a local port and delivers it directly."
      concept: "East-west packet walk, case 1."
      trap: "Overlay doesn't mean every frame is encapsulated."
  - id: nsx-seg-002
    type: ordering
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [nsx-segments, nsx-transport]
    objective: "2.4"
    lesson: nsx-segments-overlay
    section: case-2-same-segment-different-hosts
    diagram: d05-east-west-packet-walk
    stem: "Put the steps of a frame from VM-A (host 1) to VM-C (host 2) on the same overlay segment in order."
    items:
      - { id: s1, text: "VM-A sends the frame to VM-C's MAC" }
      - { id: s2, text: "Host 1 finds VM-C's MAC behind host 2's TEP (learned via the CCP)" }
      - { id: s3, text: "Host 1 encapsulates the frame in Geneve with the segment's VNI" }
      - { id: s4, text: "The underlay carries the UDP packet from TEP to TEP" }
      - { id: s5, text: "Host 2 decapsulates and delivers the frame to VM-C" }
    explanation:
      correct: "Lookup → encapsulate with VNI → underlay → decapsulate → deliver."
      concept: "East-west packet walk, case 2."
  - id: nsx-seg-003
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [nsx-segments, nsx-routing]
    objective: "2.4"
    lesson: nsx-segments-overlay
    section: case-3-different-segments-same-tier-1-routed-east-west
    stem: "VM-A on seg-web (host 1) sends to VM-D on seg-app (host 2). Both segments connect to the same Tier-1, which has no edge cluster. Where is the packet routed?"
    options:
      - { id: a, text: "By the Tier-1 DR on host 1, before encapsulation to host 2", correct: true, why: "Routing happens at the source host's DR." }
      - { id: b, text: "By the Tier-1 SR on an Edge node", why: "There is no SR without an edge cluster.", confusedWith: nsx-routing }
      - { id: c, text: "By the Tier-0 SR", why: "Traffic between segments of one Tier-1 doesn't go to the Tier-0.", confusedWith: nsx-routing }
      - { id: d, text: "By the physical router on the TEP VLAN", why: "The underlay only carries tunnels; it doesn't route VM subnets.", confusedWith: nsx-transport }
    explanation:
      correct: "VM-A's gateway is answered by the local DR, which routes into seg-app; host 1 then tunnels the frame with the seg-app VNI to host 2."
      concept: "Distributed routing at the source."
      architecture: "DR instances exist in every host kernel."
      trap: "Routed east-west does not need an Edge."
  - id: nsx-seg-004
    type: single
    kind: design
    difficulty: foundation
    version: vcf9
    topics: [nsx-segments]
    objective: "2.4"
    lesson: nsx-segments-overlay
    section: concept
    stem: "A team needs 40 new isolated networks per month for test environments, and the physical network team can't add VLANs that fast. Which segment type fits?"
    options:
      - { id: a, text: "Overlay segments in the overlay transport zone", correct: true, why: "Only the TEP network must exist; new segments need no physical change." }
      - { id: b, text: "VLAN-backed segments", why: "Each needs a VLAN on every trunk – exactly what the network team can't deliver." }
      - { id: c, text: "Edge bridges", why: "Bridging extends overlay to VLAN; it's for migrations, not for creating networks.", confusedWith: nsx-edge }
