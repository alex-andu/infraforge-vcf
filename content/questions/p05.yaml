  - id: nsx-mix-001
    type: single
    kind: troubleshooting
    difficulty: expert
    version: vcf9
    topics: [nsx-routing, nsx-edge]
    objective: "2.4"
    lesson: nsx-tier0-tier1-routing
    section: troubleshooting
    context: |
      - VMs on different segments communicate normally.
      - No VM reaches anything outside NSX.
      - Traceflow to an external IP: Tunnel to Edge TEP → Received by t0 SR → Dropped, Reason: No route.
      - `get bgp neighbor summary` on the active Edge: both neighbors Active since 02:13.
      - The SR cannot ping its directly connected ToR addresses.
    stem: "Which is the best next diagnostic step?"
    options:
      - { id: a, text: "Compare the VLAN IDs of the Tier-0 uplink VLAN segments with the ToR trunk/SVI configuration and check what changed at 02:13", correct: true, why: "Directly connected peers unreachable = Layer-2 uplink problem; check VLAN tagging and recent changes." }
      - { id: b, text: "Enable Tier-1 route advertisement", why: "Advertisement doesn't affect BGP session state.", confusedWith: nsx-routing }
      - { id: c, text: "Increase the TEP MTU to 9000", why: "Tunnels to the Edge work (Traceflow reached the SR).", confusedWith: nsx-transport }
      - { id: d, text: "Restart the NSX Manager cluster", why: "Managers aren't in the data path.", confusedWith: nsx-architecture }
    explanation:
      correct: "East-west fine + SR has no route + BGP Active + no ping to connected peers → uplink VLAN / L2 path to the ToR."
      concept: "Layered isolation of north-south failures."
      trap: "Route advertisement and MTU are tempting but contradicted by the evidence."
