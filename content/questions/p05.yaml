    stem: "You must prevent two web servers on the same segment and same host from talking to each other. Which NSX feature can do this?"
    options:
      - { id: a, text: "Distributed firewall", correct: true, why: "Enforced at each vNIC, so it sees same-segment, same-host traffic." }
      - { id: b, text: "Gateway firewall on the Tier-1", why: "That traffic never crosses a gateway.", confusedWith: nsx-security }
      - { id: c, text: "Gateway firewall on the Tier-0", why: "North-south only.", confusedWith: nsx-routing }
      - { id: d, text: "NAT on the Tier-0", why: "NAT doesn't filter.", confusedWith: nsx-routing }
    explanation:
      correct: "Only the DFW sees traffic inside a segment; it's instantiated per vNIC in the host kernel."
      concept: "DFW vs gateway firewall."
      trap: "Gateway firewalls only see traffic through their gateway's SR."
