  - id: nsx-sec-007
    type: single
    kind: log
    difficulty: advanced
    version: vcf9
    topics: [nsx-security]
    objective: "2.4"
    lesson: nsx-security-dfw-gateway-firewall
    section: cli-api
    context: |
