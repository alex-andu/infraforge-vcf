- id: vcfa-arch-012
  type: single
  kind: troubleshooting
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-automation
  objective: '4.4'
  objectiveItem: "4.4.1"
  lesson: vcf-automation-architecture
  section: deep-dive
  stem: The single VCF Automation appliance node is unavailable. What is the expected impact?
  options:
  - id: a
    text: Existing tenant workloads continue, but self-service catalog and Automation day-2 actions are unavailable
    why: Workloads run on vSphere/Supervisor; Automation is their control plane, not data path.
    correct: true
  - id: b
    text: Every tenant VM is powered off immediately
    why: VCF Automation is not in the workload execution path.
  - id: c
    text: NSX removes all VPC routes
    why: NSX maintains the network data path independently.
    confusedWith: nsx-routing
  - id: d
    text: SDDC Manager rolls back the management domain
    why: No such automatic rollback occurs.
  explanation:
    correct: VCF Automation provides provisioning and governance; existing vSphere/Supervisor workloads keep running during its outage.
    concept: Automation control-plane outage
