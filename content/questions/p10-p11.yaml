    correct: Get-NsxOperation (and Get-vSphereOperation, Get-VcfSddcManagerOperation) map API paths to generated SDK cmdlets
      (Initialize-/Invoke-).
    concept: SDK discovery cmdlets
- id: api-008
  type: single
  kind: scenario
  difficulty: expert
  version: vcf9
  topics:
  - apis-powercli
  - certificates
  objective: '4.4'
  objectiveItem: "4.4.10"
  lesson: vcf-apis-powercli
  section: real-world-scenario
  stem: After the vCenter certificates were replaced with CA-signed ones, a scheduled PowerCLI report fails with TLS errors,
    while browsers on admin workstations show no warning. What is the correct fix?
  options:
  - id: a
    text: Import the issuing CA chain into the automation host's trust store
    why: Restores trust properly.
    correct: true
  - id: b
    text: Set InvalidCertificateAction to Ignore permanently
    why: Hides future problems; not for production.
    confusedWith: apis-powercli
  - id: c
    text: Revert the vCenter certificate
    why: Undoes an intentional security change.
    confusedWith: certificates
  - id: d
    text: Upgrade PowerCLI
    why: The module is not the problem.
  explanation:
    correct: The automation host does not trust the new CA; import the CA into its trust store rather than ignoring certificate
      validation.
    concept: Certificate trust for automation clients
    architecture: Same failure mode as VCF Operations adapters after certificate replacement.
- id: ops-arch-008
  type: single
  kind: troubleshooting
  difficulty: expert
  version: vcf9
  topics:
  - vcf-ops-architecture
  - certificates
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: troubleshooting
  stem: Metrics stopped only for objects of the wld01 vCenter at 02:10. Integrations shows "Collection failed - certificate
    is not trusted" for that adapter; NSX for wld01 on the same collector is fine; the service account logs in successfully.
    What is the best next step?
  options:
  - id: a
    text: Edit the adapter, Validate Connection, verify and accept the new certificate
    why: Targets the proven cause.
    correct: true
  - id: b
    text: Reboot the collector
    why: Collector is healthy (other adapters work).
    confusedWith: vcf-ops-architecture
  - id: c
    text: Reset the service account password
    why: Credentials work.
  - id: d
    text: Move the adapter to the Default Collector Group
    why: Not the cause; breaks drift.
    confusedWith: compliance-drift
  explanation:
    correct: Scope is one adapter and the error is certificate trust - validate the connection, compare the fingerprint, accept
      the new certificate.
    concept: Adapter certificate trust
    architecture: Adapters store trust for their endpoint; certificate replacement breaks it.
    trap: Do not chase the collector or credentials.
