  options:
  - id: a
    text: ZIP, PAK or JSON
    why: As listed on the Manage Dashboards page.
    correct: true
  - id: b
    text: PDF or CSV
    why: Those are report formats.
    confusedWith: metrics-properties
  - id: c
    text: Only XML
    why: Not supported.
  - id: d
    text: OVA
