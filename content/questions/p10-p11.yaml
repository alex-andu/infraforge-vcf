  - id: a
    text: Multiple business units need isolated self-service with separate quotas
    why: Organizations, projects and quotas address this requirement.
    correct: true
  - id: b
    text: Provisioning must call an approval and CMDB workflow automatically
    why: Policies, event subscriptions and Orchestrator address this requirement.
