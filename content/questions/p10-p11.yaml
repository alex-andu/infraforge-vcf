  section: concept
  stem: What does an alert definition in VCF Operations combine?
  options:
  - id: a
    text: Symptom definitions and recommendations
    why: Exactly the TechDocs definition.
    correct: true
  - id: b
    text: Dashboards and views
    why: Presentation objects.
  - id: c
    text: Policies and custom groups
    why: Policies activate alert definitions; they are not part of them.
    confusedWith: dashboards-alerts
  - id: d
    text: Log queries only
    why: Log symptoms are one symptom type among several.
  explanation:
    correct: Alert definitions are combinations of symptoms and recommendations for a base object type.
    concept: Alert definition anatomy
    trap: Actions are optional and linked via recommendations.
  diagnostic: vcf
