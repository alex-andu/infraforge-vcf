    confusedWith: vcfa-tenancy
  - id: d
    text: Restart all ESX hosts in the region
    why: Host restart is unnecessary and disruptive.
  explanation:
    correct: The provider library's Refresh action imports direct backing-library additions and removes directly deleted items from VCF Automation.
    concept: Provider library reconciliation
- id: vcfa-ten-014
  type: single
  kind: design
  difficulty: expert
  version: vcf9
  topics:
  - vcfa-tenancy
  objective: '4.4'
  objectiveItem: "4.4.6"
  lesson: vcf-automation-tenancy-regions
  section: deep-dive
  stem: A provider library spans a region backed by three vCenter instances. Which dependency is essential for distributing new images to every backing library?
  options:
  - id: a
    text: Network connectivity between the participating vCenter instances
    why: One backing library becomes publisher and the others subscribe to it.
    correct: true
  - id: b
    text: One Tier-0 gateway per content library
    why: Provider gateway design does not implement vCenter content synchronization.
    confusedWith: nsx-routing
  - id: c
    text: A separate VCF Automation organization per vCenter
    why: The library abstraction can span the selected region.
  - id: d
    text: A writable provider library for every tenant
    why: Provider libraries remain read-only to organizations.
  explanation:
    correct: Backing vCenter libraries use publisher/subscriber synchronization, so the vCenter instances must communicate.
    concept: Provider library backing architecture
