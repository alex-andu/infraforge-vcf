  lesson: vcf-automation-org-admin
  section: deep-dive
  stem: A security image library must be visible only to namespaces created from one hardened namespace class. What should the org admin do when creating the library?
  options:
  - id: a
    text: Disable Assign to all current and future namespaces, then add the library to the hardened namespace class
    why: This preserves selective namespace visibility.
    correct: true
  - id: b
    text: Enable the all-namespaces option and change it later
    why: The option cannot be changed after creation.
  - id: c
    text: Put the images in a provider library and grant write access
    why: Provider libraries are read-only to organizations.
    confusedWith: vcfa-tenancy
  - id: d
    text: Create a new region for the library
    why: Region creation is unnecessary for namespace-level content scope.
  explanation:
    correct: Library-wide namespace assignment is fixed at creation; selective access uses namespace-class assignment.
    concept: Organization library namespace scope
- id: vcfa-org-020
  type: multi
  kind: troubleshooting
  difficulty: advanced
  version: vcf9
  topics:
  - vcfa-org-admin
  objective: '4.4'
  objectiveItem: "4.4.9"
  lesson: vcf-automation-org-admin
  section: failure-scenarios
  stem: Which two conditions can make organization content consume more storage than the image sizes initially suggest? (Choose two.)
  options:
  - id: a
    text: A subscribed external library downloads and stores remote images locally
    why: The local copies count against organization storage quota.
    correct: true
  - id: b
    text: A region backed by multiple vCenter instances replicates the library in each vCenter
    why: Multiple backing copies can increase physical use.
    correct: true
  - id: c
    text: The catalog item has a long display name
    why: Metadata length does not explain material storage growth.
  - id: d
    text: The project contains several user groups
    why: Membership does not replicate image bytes.
  select: 2
  explanation:
    correct: External subscriptions create local copies, and multi-vCenter regions can replicate libraries across vCenter instances.
    concept: Organization content storage accounting
