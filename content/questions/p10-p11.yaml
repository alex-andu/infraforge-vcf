  version: vcf9
  topics:
  - vcfa-org-admin
  objective: '4.4'
  objectiveItem: "4.4.8"
  lesson: vcf-automation-org-admin
  section: deep-dive
  stem: Which VCF Automation address scope gives workloads direct IP reachability to other VPCs inside the same organization through the transit gateway?
  options:
  - id: a
    text: A private TGW IPv4 block
    why: It is advertised within the organization and its transit gateway.
    correct: true
  - id: b
    text: A private VPC CIDR
    why: It is local to one VPC and requires NAT outside that VPC.
    confusedWith: nsx-vpc
  - id: c
    text: An ESX management subnet
    why: It is infrastructure management networking, not tenant VPC addressing.
  - id: d
    text: A vSAN network
    why: It carries storage traffic, not organization workload traffic.
  explanation:
    correct: Private TGW blocks are organization-managed space advertised through the organization's transit gateway for cross-VPC reachability.
    concept: Organization address scopes
    trap: Private VPC CIDRs are local and may overlap between VPCs.
