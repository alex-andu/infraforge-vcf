- id: vcfa-arch-011
  type: matching
  kind: concept
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-automation
  objective: '4.4'
  objectiveItem: "4.4.1"
  lesson: vcf-automation-architecture
  section: concept
  stem: Match each private-cloud requirement to the primary VCF product or interface.
  pairs:
  - id: p1
    left: Governed self-service catalog for tenant teams
    right: VCF Automation
  - id: p2
    left: Performance and capacity monitoring
    right: VCF Operations
  - id: p3
    left: ESX and VCF component lifecycle
    right: SDDC Manager / fleet management
  - id: p4
    left: Direct VM inventory administration
    right: vSphere Client
  explanation:
