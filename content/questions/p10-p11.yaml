# Phase 10 (VCF Operations) and Phase 11 (VCF Automation, APIs) questions - author I
questions:
- id: ops-arch-001
  type: single
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - vcf-ops-architecture
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: components
  stem: Which three node roles make up the analytics cluster in the VCF Operations High Availability model?
  options:
  - id: a
    text: Primary, replica and data node
    why: Exactly the three nodes listed for the High Availability model.
    correct: true
  - id: b
    text: Primary, collector and witness node
    why: Collectors are separate appliances; the HA model table lists no witness.
    confusedWith: vcf-ops-architecture
  - id: c
    text: Primary, fleet management and collector
    why: Fleet management and collector are additional appliances, not analytics nodes.
  - id: d
    text: Three identical primary nodes
    why: There is only one primary; the others are replica and data.
  explanation:
    correct: The HA model is a three-node cluster of a primary node, a replica node and a data node.
    concept: VCF Operations analytics cluster node roles
    architecture: Collectors and the fleet management appliance are separate appliances deployed beside the cluster in every
      model.
    trap: Collector (cloud proxy) is not a cluster node.
  diagnostic: vcf
- id: ops-arch-002
  type: single
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-ops-architecture
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: deep-dive
  stem: An administrator must increase the number of objects a VCF Operations HA cluster can analyse without changing node
    sizes. What should they add?
  options:
  - id: a
    text: Another replica node
    why: There is one replica per cluster and it provides availability, not capacity.
    confusedWith: vcf-ops-architecture
  - id: b
    text: A data node of the same size
    why: Data nodes add analytics and storage capacity; sizes must match.
    correct: true
  - id: c
    text: A second collector
    why: Collectors add collection capacity/failover, not analytics capacity.
  - id: d
    text: A data node of a larger size
    why: Mixing node sizes is not supported (KB 397782).
  explanation:
    correct: Scale-out is done by adding data nodes; all nodes must stay the same size.
    concept: Scale-up vs scale-out
    architecture: The replica protects the primary; it does not add capacity. Collectors gather data but do not analyse or
      store it.
    trap: Replica = availability, data node = capacity.
- id: ops-arch-003
  type: single
  kind: design
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-ops-architecture
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: components
  stem: A customer runs two VCF instances in two availability zones about 5 ms apart and requires that monitoring has no service
    interruption if an entire zone fails. Which VCF Operations model fits?
  options:
  - id: a
    text: Simple
    why: Single node; relies on vSphere HA restart.
  - id: b
    text: High Availability
    why: Protects against one node failure, but all nodes would be in one zone.
    confusedWith: vcf-ops-architecture
  - id: c
    text: Continuous Availability
    why: Node pairs across two AZs within 10 ms; no interruption from a single AZ failure.
    correct: true
  - id: d
    text: High Availability with an external load balancer
    why: A load balancer gives a single VIP, not zone resilience.
  explanation:
    correct: Continuous Availability pairs nodes across two availability zones (max 10 ms) and survives a single AZ failure.
    concept: VCF Operations deployment models
    architecture: CA needs a separate VCF instance in the other AZ and manual operations after installation.
    trap: HA protects against a node failure, not a zone failure.
- id: ops-arch-004
  type: multi
  kind: concept
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-ops-architecture
  - fleet-management
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: components
  stem: Which two appliances are deployed alongside VCF Operations in every VCF Operations model (Simple, High Availability,
    Continuous Availability)? (Choose two.)
  options:
  - id: a
    text: VCF Operations fleet management appliance
    why: Listed in every model.
    correct: true
  - id: b
    text: VCF Operations collector
    why: Listed in every model.
    correct: true
  - id: c
    text: VCF Operations for logs
    why: Optional Day-2 component.
    confusedWith: vcf-ops-logs
  - id: d
    text: VCF Operations for networks platform node
    why: Optional Day-2 component.
    confusedWith: network-ops
  select: 2
  explanation:
    correct: Every model table lists VCF Operations fleet management and VCF Operations collector as additional appliances
      (plus SDDC Manager).
    concept: Additional appliances of VCF Operations
    architecture: Fleet management executes lifecycle, certificate and password tasks; collectors run adapters.
    trap: VCF Operations for logs and for networks are optional Day-2 additions.
- id: ops-arch-005
  type: single
  kind: design
  difficulty: advanced
  version: vcf9
  topics:
  - vcf-ops-architecture
  - certificates
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: components
  stem: You deploy VCF Operations in the HA model behind an external load balancer. Which certificate requirement applies?
  options:
  - id: a
    text: Only the load balancer FQDN in the certificate subject
    why: Node FQDNs must also be in the SAN.
  - id: b
    text: All node FQDNs and the load balancer FQDN in the SAN
    why: Matches the model implications in TechDocs.
    correct: true
  - id: c
    text: A separate self-signed certificate per node
    why: Not what the design requires; trust and SAN coverage matter.
  - id: d
    text: No change; the load balancer terminates TLS
    why: TechDocs explicitly lists the SAN requirement.
  explanation:
    correct: With an external load balancer, the FQDNs of all cluster nodes and the load balancer must be in the certificate's
      SAN.
    concept: Load balancer implications
    architecture: The LB needs its own IP and FQDN; users connect to the LB VIP, but nodes are also reached directly.
    trap: Only the LB FQDN is not enough.
- id: ops-arch-006
  type: truefalse
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - vcf-ops-architecture
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: deep-dive
  stem: In a multi-node VCF Operations cluster you may mix Medium and Large nodes as long as the primary is the largest.
  options:
  - id: 'true'
    text: 'True'
    why: Mixed sizes are not supported.
  - id: 'false'
    text: 'False'
    why: All nodes must be the same size.
    correct: true
  explanation:
    correct: 'False: KB 397782 states that with more than one node all nodes must be scaled equally - no mixing of sizes.'
    concept: Node sizing rule
    trap: Scale up all nodes together.
- id: ops-arch-007
  type: single
  kind: troubleshooting
  difficulty: advanced
  version: vcf9
  topics:
  - vcf-ops-architecture
  objective: '4.3'
  objectiveItem: "4.3.2"
  lesson: vcf-operations-architecture
  section: failure-scenarios
  stem: In a Simple VCF Operations deployment the only collector VM crashes. What do operators observe?
  options:
  - id: a
    text: The VCF Operations UI becomes unreachable
    why: The UI is served by the analytics node, which is still running.
  - id: b
    text: Data from the adapters on that collector stops; objects show stale metrics
    why: Collectors run adapters; no collector group means no failover.
    correct: true
  - id: c
    text: Nothing - analytics nodes automatically poll vCenter directly
    why: Adapters stay assigned to the failed collector unless moved or in a group.
  - id: d
    text: vCenter alarms stop working
    why: vCenter alarms are independent of VCF Operations.
  explanation:
    correct: All adapters on that collector stop, so objects go stale while the UI still works.
    concept: Role of collectors
    architecture: Analytics node still serves UI; without a collector group there is no adapter failover.
    trap: UI being up does not mean data is current.
- id: ops-data-001
  type: single
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - metrics-properties
  objective: '4.3'
  objectiveItem: "4.3.3"
  lesson: metrics-properties-views-reports
  section: concept
  stem: Which item is a property, not a metric, of a VM in VCF Operations?
  options:
  - id: a
    text: Number of vCPUs
    why: Configuration attribute that rarely changes.
    correct: true
  - id: b
    text: CPU usage (%)
    why: Measured each cycle - a metric.
    confusedWith: metrics-properties
  - id: c
    text: Disk latency (ms)
    why: Metric.
  - id: d
    text: Network packets dropped
    why: Metric.
  explanation:
    correct: The number of vCPUs is a configuration attribute (property); CPU usage, latency and IOPS are measurements (metrics).
    concept: Metrics vs properties
    trap: A number can still be a property.
  diagnostic: vcf
- id: ops-data-002
  type: single
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
  - metrics-properties
  objective: '4.3'
  objectiveItem: "4.3.4"
  lesson: metrics-properties-views-reports
  section: concept
  stem: An auditor wants a monthly list of every ESX host and its exact build number. Which data and view type should you
    use?
  options:
  - id: a
    text: A Trend view of a metric
    why: Build number is not a time series metric.
    confusedWith: metrics-properties
  - id: b
    text: A List view with the ESX version/build property
    why: List view, subject Host System, property column.
    correct: true
  - id: c
    text: A Distribution view of CPU usage
    why: Wrong data entirely.
  - id: d
    text: A super metric
    why: Super metrics are formulas over metrics.
  explanation:
    correct: ESX build is a property; a List view gives one row per host.
    concept: Choosing data and view type
    architecture: Properties are collected by the vCenter adapter and are usable in views and reports.
    trap: Trend views are for time series metrics.
- id: ops-data-003
  type: matching
  kind: concept
  difficulty: intermediate
  version: vcf9
  topics:
  - metrics-properties
  objective: '4.3'
  objectiveItem: "4.3.4"
  lesson: metrics-properties-views-reports
  section: components
  stem: Match each requirement to the VCF Operations view type that fits best.
  pairs:
  - id: p1
    left: Table of all VMs with vCPU, OS and average CPU
    right: List view
  - id: p2
    left: Total and average memory used per cluster
    right: Summary view
  - id: p3
    left: Datastore usage growth with a 30-day forecast
    right: Trend view
  - id: p4
    left: Number of VMs per guest OS
    right: Distribution view
  explanation:
    correct: List = per-object table, Summary = aggregated table, Trend = history and forecast, Distribution = spread across
      buckets.
    concept: View types
    trap: Summary aggregates; Distribution buckets.
- id: ops-data-004
  type: multi
  kind: concept
  difficulty: intermediate
  version: vcf9
  topics:
  - metrics-properties
  objective: '4.3'
  objectiveItem: "4.3.4"
  lesson: metrics-properties-views-reports
  section: how-it-works
  stem: Which two statements about reports in VCF Operations are correct? (Choose two.)
  options:
  - id: a
    text: A report template is built from views and dashboards
    why: 'TechDocs: a scheduled snapshot of views and dashboards.'
    correct: true
  - id: b
    text: Generated reports can be PDF or CSV
    why: Both formats are supported.
    correct: true
  - id: c
    text: Reports can only be run manually
    why: They can be scheduled.
  - id: d
    text: Reports are only available to the admin user
    why: They can be delivered to others, e.g. via email outbound settings.
  select: 2
  explanation:
    correct: Reports are scheduled snapshots of views and dashboards and are generated as PDF or CSV.
    concept: Report templates
    architecture: Templates can add a cover page, table of contents and footer.
    trap: Reports do not contain raw data that is not first expressed as a view or dashboard.
- id: ops-data-005
  type: ordering
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
  - metrics-properties
  objective: '4.3'
  objectiveItem: "4.3.4"
  lesson: metrics-properties-views-reports
  section: how-it-works
  stem: Put the steps to deliver a new weekly capacity table to managers in order.
  items:
  - id: i1
    text: Create a List view with the required metrics and properties (Infrastructure Operations > Views > Create)
  - id: i2
    text: Create a report template that includes the view and choose PDF/CSV
  - id: i3
    text: Run the template once against the target object and check the output
  - id: i4
    text: Schedule the report weekly with email delivery via outbound settings
  explanation:
    correct: A report needs a view first; then the template, a test run, and finally the schedule and delivery.
    concept: View then report workflow
    trap: You cannot add data to a report that has no view.
- id: ops-data-006
  type: single
  kind: troubleshooting
  difficulty: advanced
  version: vcf9
  topics:
  - metrics-properties
  - dashboards-alerts
  objective: '4.3'
  objectiveItem: "4.3.3"
  lesson: metrics-properties-views-reports
  section: failure-scenarios
  stem: A super metric you created shows "no data" on a cluster, although the metrics in its formula exist on the cluster
    VMs. What is the most likely cause?
  options:
  - id: a
    text: The super metric is not activated in the policy applied to the cluster
    why: Activation in the effective policy is required.
    correct: true
  - id: b
    text: Super metrics only work on VMs
    why: They can be assigned to object types such as clusters.
  - id: c
    text: The collector must be restarted after creating a super metric
    why: No such requirement.
  - id: d
    text: Super metrics require VCF Operations for logs
    why: Unrelated component.
    confusedWith: vcf-ops-logs
  explanation:
    correct: Super metrics are calculated only for objects whose effective policy activates them.
    concept: Super metrics and policies
    architecture: Policies control which metrics, properties and super metrics are collected or calculated.
    trap: Formula correct but not activated.
