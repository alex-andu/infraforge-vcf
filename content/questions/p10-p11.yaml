- id: ops-alrt-005
  type: single
  kind: scenario
  difficulty: advanced
  version: vcf9
  topics:
  - dashboards-alerts
  objective: '4.3'
  objectiveItem: "4.3.11"
  lesson: dashboards-alerts-policies
  section: how-it-works
  stem: VM web01 belongs to custom group "Prod" (policy Prod, priority 1 - highest) and to custom group "Web" (policy Web,
    priority 3). An engineer also assigned policy Legacy (priority 5) directly to web01. Which policy is enforced on web01?
  options:
  - id: a
    text: Prod
    why: Would win among group assignments, but a direct assignment overrides.
    confusedWith: dashboards-alerts
  - id: b
    text: Web
    why: Lower priority than Prod and not direct.
  - id: c
    text: Legacy
    why: Directly assigned to the object, so it is enforced despite lower priority.
    correct: true
  - id: d
    text: Default policy
    why: Only applies when nothing else does.
  explanation:
    correct: Highest priority wins, except that a lower-priority policy assigned directly to the object is enforced.
    concept: Policy precedence
    trap: Direct assignment beats group priority.
- id: ops-alrt-006
  type: ordering
  kind: concept
  difficulty: intermediate
  version: vcf9
  topics:
  - dashboards-alerts
  objective: '4.3'
  objectiveItem: "4.3.6"
  lesson: dashboards-alerts-policies
  section: how-it-works
  stem: Order the alert pipeline from data to notification.
  items:
  - id: i1
    text: Collected metrics/properties/events are evaluated against symptom definitions
  - id: i2
    text: Alert definition symptom set (all/any) is satisfied for the wait cycle
  - id: i3
    text: Alert is raised on the base object with recommendations
  - id: i4
    text: Notification rule matches and an outbound plugin sends the message
  explanation:
    correct: Data is evaluated by symptoms; alert definitions fire on their symptom sets; the alert shows recommendations;
      notifications send it out.
    concept: Alert pipeline
- id: ops-alrt-007
  type: single
  kind: troubleshooting
  difficulty: advanced
  version: vcf9
  topics:
  - dashboards-alerts
  objective: '4.3'
  objectiveItem: "4.3.6"
  lesson: dashboards-alerts-policies
  section: troubleshooting
  stem: You created a correct alert definition for datastores, but no datastore ever raises it, even while low on space. What
    should you check first?
  options:
  - id: a
    text: Whether the definition is active in the effective policy of those datastores
    why: Most common cause.
    correct: true
  - id: b
    text: Whether VCF Operations for logs is deployed
    why: Not needed for metric symptoms.
    confusedWith: vcf-ops-logs
  - id: c
    text: Whether the dashboard is shared
    why: Unrelated.
  - id: d
    text: Whether the report schedule is active
    why: Unrelated.
  explanation:
    correct: Alert definitions only fire where the effective policy activates them.
    concept: Policies activate alerts
    trap: Correct definition is not enough.
- id: ops-alrt-008
  type: single
  kind: concept
  difficulty: intermediate
  version: vcf9
  topics:
  - dashboards-alerts
  objective: '4.3'
  objectiveItem: "4.3.6"
  lesson: dashboards-alerts-policies
  section: architecture
  stem: An alert indicates that a cluster will run out of memory in about two weeks if growth continues. Which alert impact
    badge does it most likely affect?
  options:
  - id: a
    text: Health
    why: Health alerts indicate current problems.
  - id: b
    text: Risk
    why: Future problems to address before they affect health.
    correct: true
  - id: c
    text: Efficiency
    why: For reclaimable or wasted resources.
  - id: d
    text: Compliance
    why: Not an alert impact badge.
    confusedWith: compliance-drift
  explanation:
    correct: Health = problem now, Risk = potential future problem, Efficiency = wasted resources.
    concept: Alert impact
- id: ops-alrt-009
  type: multi
  kind: design
  difficulty: advanced
  version: vcf9
  topics:
  - dashboards-alerts
  objective: '4.3'
  objectiveItem: "4.3.11"
  lesson: dashboards-alerts-policies
  section: deep-dive
  stem: A dev cluster is intentionally overcommitted and floods the team with CPU contention alerts, while production must
    keep them. Which two actions follow best practice? (Choose two.)
  options:
  - id: a
    text: Create a custom policy inheriting from the default with those alerts deactivated
    why: Only overrides what differs.
    correct: true
  - id: b
    text: Assign it to a custom group containing the dev cluster objects with higher priority than default
    why: Applies it only to dev.
    correct: true
  - id: c
    text: Deactivate the alert definitions in the default policy
    why: Would also silence production.
    confusedWith: dashboards-alerts
  - id: d
    text: Delete the alert definitions
    why: Removes them for everyone.
  select: 2
  explanation:
    correct: Create a custom policy inheriting from default with the alerts deactivated, and assign it to a custom group for
      dev with higher priority.
    concept: Policy design
    trap: Editing the default policy affects every object.
