  objectiveItem: "4.4.10"
  lesson: vcf-apis-powercli
  section: failure-scenarios
  stem: An SDDC Manager API call returns HTTP 403 with a valid access token. What does it indicate?
  options:
  - id: a
    text: The account lacks the privilege for the operation
    why: Correct.
    correct: true
  - id: b
    text: The access token expired
    why: That is 401.
    confusedWith: apis-powercli
  - id: c
