- id: ops-alrt-003
  type: single
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
  - dashboards-alerts
  objective: '4.3'
  objectiveItem: "4.3.5"
  lesson: dashboards-alerts-policies
  section: components
  stem: A NOC team must see a dashboard you built, but must not change it. How do you share it?
  options:
  - id: a
    text: Share it with the NOC user group without Allow Editing
    why: Group sharing with view-only access.
    correct: true
  - id: b
    text: Change ownership to the NOC group
    why: Ownership transfer removes it from your dashboards and gives full control.
  - id: c
    text: Export it as JSON and email the file
    why: They would need to import it; not sharing.
  - id: d
    text: Add the NOC users to the administrator role
    why: Excessive privilege.
  explanation:
    correct: Share with the NOC user group from Dashboards > Manage without 'Allow Editing'; users see it locked.
    concept: Dashboard sharing
    trap: Sharing gives the dashboard, not object permissions.
