  - apis-powercli
  objective: '4.4'
  objectiveItem: "4.4.10"
  lesson: vcf-apis-powercli
  section: failure-scenarios
  stem: A script calling the SDDC Manager API worked for an hour and now returns HTTP 401 on every call. The refresh token
    was obtained 2 hours ago. What should it do?
  options:
  - id: a
    text: Call PATCH /v1/tokens/access-token/refresh with the refresh token
    why: Refresh token still valid.
    correct: true
  - id: b
    text: Reset the account password
    why: Credentials are not the problem.
  - id: c
    text: Switch to the vmware-api-session-id header
    why: Wrong component pattern.
    confusedWith: apis-powercli
  - id: d
    text: Wait 24 hours
    why: Unnecessary.
  explanation:
    correct: Access tokens last 1 hour; refresh tokens 24 hours - call PATCH /v1/tokens/access-token/refresh.
    concept: SDDC Manager token lifecycle
