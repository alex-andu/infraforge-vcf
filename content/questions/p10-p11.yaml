  kind: troubleshooting
  difficulty: advanced
  version: vcf9
  topics:
  - vcfa-org-admin
  objective: '4.4'
  objectiveItem: "4.4.8"
  lesson: vcf-automation-org-admin
  section: failure-scenarios
  stem: After an administrator removes an external IPv4 block from a connectivity profile, several previously healthy VPCs lose northbound connectivity. Why?
  options:
  - id: a
    text: Connectivity profile changes affect every VPC that uses the profile
    why: The profile is a reusable northbound configuration shared by its attached VPCs.
    correct: true
  - id: b
    text: Each VPC automatically deleted its private CIDR
    why: The private CIDR is a separate VPC setting.
  - id: c
    text: The organization region quota became zero
    why: Compute and storage quota does not explain the shared networking change.
    confusedWith: vcfa-tenancy
  - id: d
    text: The provider content library was unpublished
    why: Content availability does not control VPC routing.
  explanation:
    correct: Broadcom documents that editing a connectivity profile changes northbound connectivity for all VPCs using that profile.
    concept: Connectivity profile blast radius
- id: vcfa-org-017
  type: single
  kind: design
  difficulty: intermediate
  version: vcf9
  topics:
  - vcfa-org-admin
  objective: '4.4'
  objectiveItem: "4.4.8"
  lesson: vcf-automation-org-admin
  section: deep-dive
  stem: Three namespaces host one application and may share the same network security boundary. Which VPC design is valid and simplest?
  options:
  - id: a
    text: Associate one VPC with all three namespaces
    why: A VPC can be associated with one or more namespaces.
    correct: true
  - id: b
    text: Create a separate organization for each namespace
    why: This adds unnecessary tenant boundaries.
    confusedWith: vcfa-tenancy
  - id: c
    text: Put every namespace directly on the provider gateway
    why: Namespaces consume organization VPC networking rather than attaching directly to the provider gateway.
  - id: d
    text: Create one Tier-0 gateway per namespace
    why: Tier-0/provider gateway design is provider-side, not the namespace association model.
    confusedWith: nsx-routing
  explanation:
    correct: One VPC can be shared by multiple namespaces when separate network isolation is not required.
    concept: VPC sharing boundary
