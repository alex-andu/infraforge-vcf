  section: deep-dive
  stem: What identifier should a blueprint use to reference one exact VM image uploaded to VCF Automation?
  options:
  - id: a
    text: The image's VMI identifier
    why: Every uploaded VM image receives a unique VMI for blueprint references.
    correct: true
  - id: b
    text: The provider gateway ID
    why: It identifies networking, not content.
    confusedWith: vcfa-tenancy
  - id: c
    text: The vCenter cluster name
    why: It is not the image identifier.
  - id: d
    text: The namespace quota
    why: It limits resources rather than selecting content.
  explanation:
    correct: The unique VMI identifier is the stable reference for a specific VM image in blueprints.
    concept: VM image identifier
- id: vcfa-org-019
  type: single
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
