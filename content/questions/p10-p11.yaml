  difficulty: advanced
  version: vcf9
  topics:
  - vcfa-org-admin
  objective: '4.4'
  objectiveItem: "4.4.8"
  lesson: vcf-automation-org-admin
  section: deep-dive
  stem: Order the organization-admin tasks for a new VPC that needs cross-VPC private addressing and controlled address consumption.
  items:
  - id: i1
    text: Create a private TGW IPv4 block for the region
  - id: i2
    text: Create an IP quota with the required scope and limits
  - id: i3
    text: Create a connectivity profile using the region and required address blocks
  - id: i4
    text: Create the VPC with the connectivity profile, private CIDR and quota
  - id: i5
    text: Associate the VPC with the intended namespace or namespaces
  explanation:
    correct: Define organization address capacity and quota first, package northbound settings in the connectivity profile, create the VPC, then attach workload namespaces.
    concept: Organization network workflow
- id: vcfa-org-016
