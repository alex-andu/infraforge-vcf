- id: f06-md-008
  type: single
  kind: design
  difficulty: expert
  version: vcf9
  topics:
  - management-domain
  - design-sizing
  - workload-domains
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: management-domain
  section: why-workload-domain-management-lives-here
  stem: 'One VCF instance uses the HA model everywhere (3-node NSX Manager clusters). It has three workload domains: "pci"
    with dedicated NSX, and "prod" and "dev" sharing one NSX instance. How many vCenter appliances and NSX Manager nodes run
    in the management domain?'
  options:
  - id: a
    text: 4 vCenter, 9 NSX Manager nodes
    correct: true
    why: 'vCenter: mgmt + 3 WLDs = 4. NSX: mgmt (3) + pci (3) + shared prod/dev (3) = 9.'
  - id: b
    text: 4 vCenter, 12 NSX Manager nodes
    why: Counts a separate NSX for dev although it shares with prod.
    confusedWith: nsx-architecture
  - id: c
    text: 2 vCenter, 6 NSX Manager nodes
    why: Each workload domain has its own vCenter.
    confusedWith: workload-domains
  - id: d
    text: 1 vCenter, 9 NSX Manager nodes
    why: Workload domains never share the management vCenter.
    confusedWith: vcenter
  explanation:
    correct: Every domain adds a vCenter in the management domain; NSX nodes are added per NSX instance (dedicated or shared).
    concept: Management domain capacity planning
    architecture: WLD management appliances are deployed into the management domain.
    trap: Shared NSX counts once.
