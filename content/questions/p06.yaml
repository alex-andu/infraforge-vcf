# Phase 6 - VCF Architecture questions (author F)
questions:
- id: f06-ov-001
  type: single
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - vcf-fleet
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: the-hierarchy-in-one-table
  stem: In VCF 9.0, what defines a VCF fleet?
  options:
  - id: a
    text: A single vCenter Single Sign-On domain shared by all vCenter instances
    why: SSO domains are per vCenter/workload domain; a fleet is defined by its shared management components.
    confusedWith: identity-sso
  - id: b
    text: An environment managed by a single set of fleet-level management components (VCF Operations and VCF Automation),
      containing one or more VCF instances
    correct: true
    why: This is the TechDocs taxonomy definition.
  - id: c
    text: A management domain plus its workload domains
    why: That is a VCF instance.
    confusedWith: management-domain
  - id: d
    text: All ESX hosts commissioned in one SDDC Manager
    why: Commissioned hosts belong to one instance, not a fleet.
    confusedWith: sddc-manager
  explanation:
    correct: A fleet is everything managed by one VCF Operations / VCF Automation set; it contains one or more VCF instances
      (and can include standalone vCenter instances).
    concept: Fleet vs instance vs domain
    architecture: Fleet-level components run once, in the management domain of the first instance.
    trap: Do not equate fleet with SSO domain or with a single instance.
  diagnostic: vcf
- id: f06-ov-002
  type: single
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - vcf-fleet
  - management-domain
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: the-hierarchy-in-one-table
  stem: What does a VCF instance consist of?
  options:
  - id: a
    text: Exactly one management domain and, optionally, additional workload domains
    correct: true
    why: 'TechDocs: "A VCF Instance consists of VCF domains - a management domain and, optionally, additional workload domains."'
  - id: b
    text: One or more management domains and at least one workload domain
    why: There is one management domain per instance and workload domains are optional.
    confusedWith: workload-domains
  - id: c
    text: A single vSphere cluster managed by SDDC Manager
    why: An instance has at least one domain with its own vCenter, not just a cluster.
  - id: d
    text: VCF Operations and VCF Automation
    why: Those define the fleet, not the instance.
    confusedWith: fleet-management
  explanation:
    correct: A VCF instance = one management domain (created at deployment/convergence) + optional workload domains, with
      one SDDC Manager.
    concept: VCF instance composition
    architecture: The management domain hosts instance management; workload domains run consumer workloads.
    trap: Workload domains are optional; a minimal instance is just the management domain.
  diagnostic: vcf
- id: f06-ov-003
  type: multi
  kind: architecture
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-fleet
  - fleet-management
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: fleet-level-vs-instance-level-components
  stem: Which components are fleet-level management components in VCF 9.0? (Choose three.)
  options:
  - id: a
    text: VCF Operations
    correct: true
    why: One per fleet; the central console.
  - id: b
    text: VCF Operations fleet management appliance
    correct: true
    why: Lifecycles fleet components; one per fleet.
  - id: c
    text: VCF Automation
    correct: true
    why: Fleet-level consumption layer.
  - id: d
    text: SDDC Manager
    why: One per VCF instance - an instance-level core component.
    confusedWith: sddc-manager
  - id: e
    text: Management domain vCenter
    why: Instance-level core component.
    confusedWith: vcenter
  - id: f
    text: NSX Manager
    why: Domain/instance-level core component.
    confusedWith: nsx-architecture
  select: 3
  explanation:
    correct: 'Management (fleet-level) components: VCF Operations, fleet management, VCF Automation, Operations for logs and
      networks, Identity Broker. Core (instance-level): SDDC Manager, vCenter, NSX Manager, ESX.'
    concept: Management vs core components
    architecture: Fleet components run in the first instance management domain; core components exist in every instance.
    trap: SDDC Manager feels "central" but is per instance.
- id: f06-ov-004
  type: single
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-fleet
  - deployment-models
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: how-it-works
  stem: A company with a VCF 9 fleet in its Bucharest data center wants a second data center in Cluj, managed from the same
    console. Which outcome matches VCF 9 architecture?
  options:
  - id: a
    text: Deploy a new VCF instance into the existing fleet; Cluj gets its own management domain, SDDC Manager and VCF Operations
      collector, and uses the existing VCF Operations and VCF Automation
    correct: true
    why: This is the "new instance in existing fleet" pathway of the VCF Installer.
  - id: b
    text: Add the Cluj hosts as a workload domain of the Bucharest instance
    why: Possible only for very short distances; a separate site is normally a separate instance with its own management domain.
    confusedWith: workload-domains
  - id: c
    text: Deploy a new fleet in Cluj with its own VCF Operations and link the two VCF Operations
    why: That creates two consoles, contrary to the requirement.
  - id: d
    text: Deploy only a second SDDC Manager in Cluj that manages the Cluj hosts from Bucharest vCenter
    why: Each instance needs its own management domain with vCenter and NSX Manager.
    confusedWith: sddc-manager
  explanation:
    correct: The VCF Installer can deploy a new VCF instance into an existing fleet; the new instance gets instance-level
      components (management domain, SDDC Manager, collector) and reuses fleet-level ones.
    concept: Fleet expansion
    architecture: Collectors in each instance feed the single VCF Operations.
    trap: Additional instances do not get their own VCF Operations.
- id: f06-ov-005
  type: matching
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - vcf-fleet
  - fleet-management
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: deep-dive
  stem: Match each VCF 5.x product or appliance to its VCF 9.0 equivalent.
  pairs:
  - id: p1
    left: VMware Aria Operations
    right: VCF Operations
  - id: p2
    left: VMware Aria Suite Lifecycle
    right: VCF Operations fleet management
  - id: p3
    left: Cloud Builder
    right: VCF Installer
  - id: p4
    left: VMware Aria Automation
    right: VCF Automation
  - id: p5
    left: ESXi
    right: ESX
  explanation:
    correct: These renames come from the VCF 9.0 component table and product support notes; Workspace ONE Access has no direct
      successor - VCF Identity Broker is new.
    concept: VCF 9 naming
    architecture: Fleet management appliance = former Aria Suite Lifecycle role.
    trap: Aria Suite Lifecycle is not renamed to VCF Operations itself.
- id: f06-ov-006
  type: truefalse
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - sddc-manager
  objective: '4.2'
  objectiveItem: "4.2.7"
  lesson: vcf9-architecture-overview
  section: common-exam-traps
  stem: 'True or false: SDDC Manager no longer exists in VCF 9.0 because VCF Operations replaced it.'
  options:
  - id: a
    text: 'True'
    why: Only the SDDC Manager UI is deprecated.
    confusedWith: fleet-management
  - id: b
    text: 'False'
    correct: true
    why: SDDC Manager is deployed with every instance and executes core-component work driven from VCF Operations.
  explanation:
    correct: 'Release notes: "SDDC Manager UI is now deprecated, to be removed in a future major release." The appliance still
      provides lifecycle, domain deployment, vCenter import, certificate and password automation.'
    concept: SDDC Manager in 9.0
    architecture: One SDDC Manager per instance in the management domain.
    trap: Deprecated UI is not the same as removed appliance.
- id: f06-ov-007
  type: ordering
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - vcf-fleet
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: the-hierarchy-in-one-table
  stem: Order the VCF 9 constructs from the largest to the smallest.
  items:
  - id: i1
    text: VCF private cloud
  - id: i2
    text: VCF fleet
  - id: i3
    text: VCF instance
  - id: i4
    text: VCF domain
  - id: i5
    text: vSphere cluster
  - id: i6
    text: ESX host
  explanation:
    correct: Private cloud contains fleets; a fleet contains instances; an instance contains domains; a domain contains clusters;
      clusters contain hosts.
    concept: VCF 9 hierarchy
    architecture: Each level has its own management scope.
    trap: Do not place the domain above the instance.
- id: f06-ov-008
  type: single
  kind: architecture
  difficulty: intermediate
  version: vcf9
  topics:
  - vcf-fleet
  - fleet-management
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: architecture
  diagram: d06-fleet-hierarchy
  stem: Look at the diagram. Which component exists in the management domain of instance 1 but has no equivalent in instance
    2, because it is fleet-level?
  options:
  - id: a
    text: SDDC Manager
    why: Every instance has its own SDDC Manager.
    confusedWith: sddc-manager
  - id: b
    text: VCF Operations collector
    why: Every instance has its own collector.
  - id: c
    text: VCF Operations
    correct: true
    why: One per fleet, in the first instance; instance 2 only has a collector.
  - id: d
    text: NSX Manager
    why: Each instance has its own management NSX Manager.
    confusedWith: nsx-architecture
  explanation:
    correct: VCF Operations (and fleet management, VCF Automation, Identity Broker) are fleet-level and appear only once.
    concept: Fleet-level placement
    architecture: Instance 2 is managed remotely through its collector and SDDC Manager.
    trap: A collector is not a VCF Operations instance.
- id: f06-ov-009
  type: single
  kind: scenario
  difficulty: advanced
  version: vcf9
  topics:
  - vcf-fleet
  - component-communication
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: failure-scenarios
  stem: The VCF Operations analytics node of a simple-model fleet is down for two hours. What is the impact?
  options:
  - id: a
    text: All workload VMs in every instance stop until VCF Operations returns
    why: The data plane does not depend on VCF Operations.
    confusedWith: component-communication
  - id: b
    text: Monitoring and fleet management are unavailable, but workloads keep running and vCenter/NSX can still be managed
      directly
    correct: true
    why: Fleet services are a management layer above the instances.
  - id: c
    text: vCenter logins fail fleet-wide because VCF Operations issues SSO tokens
    why: SSO is brokered by the Identity Broker, not by VCF Operations.
    confusedWith: identity-sso
  - id: d
    text: SDDC Manager automatically takes over the VCF Operations role
    why: There is no such failover.
    confusedWith: sddc-manager
  explanation:
    correct: Losing VCF Operations removes visibility and the fleet management console; instances, vCenter, NSX and VMs continue
      to run.
    concept: Failure impact of fleet services
    architecture: Simple model relies on vSphere HA restart of the single node.
    trap: Management-plane outage is not data-plane outage.
- id: f06-ov-010
  type: single
  kind: architecture
  difficulty: intermediate
  version: vcf9
  topics:
  - workload-domains
  - management-domain
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: vcf9-architecture-overview
  section: where-things-physically-run
  diagram: d06-fleet-hierarchy
  stem: In the diagram, where does the vCenter of the prod workload domain run?
  options:
  - id: a
    text: On the ESX cluster of the prod workload domain
    why: The WLD cluster runs workloads and edges, not its own vCenter.
    confusedWith: workload-domains
  - id: b
    text: In the management domain of the same VCF instance
    correct: true
    why: SDDC Manager deploys workload domain vCenter instances into the management domain.
  - id: c
    text: In the management domain of instance 2
    why: Each instance hosts its own workload domain management appliances.
  - id: d
    text: Embedded in SDDC Manager
    why: vCenter is a separate appliance.
    confusedWith: sddc-manager
  explanation:
    correct: Workload domain vCenter (and NSX Manager) appliances run in the management domain of their instance.
    concept: Placement of WLD management
    architecture: Keeps the management plane off workload clusters.
    trap: The vCenter manages the WLD hosts but does not run on them.
- id: f06-md-001
  type: single
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - management-domain
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: management-domain
  section: minimum-hosts-and-storage
  stem: What is the minimum number of ESX hosts in the management domain default cluster for a VCF 9.0 simple install?
  options:
  - id: a
    text: '2'
    why: Below the documented minimum.
  - id: b
    text: '3'
    correct: true
    why: 'Storage Models page: three hosts for a simple install.'
  - id: c
    text: '4'
    why: Four is the minimum for the highly available install.
    confusedWith: deployment-models
  - id: d
    text: '6'
    why: Not a documented minimum.
  explanation:
    correct: 'Management default cluster: 3 hosts (simple), 4 hosts (highly available). Workload domain clusters: 3.'
    concept: Management domain sizing
    architecture: Three vSAN hosts tolerate one failure without automatic rebuild.
    trap: The 4-host rule is legacy (5.x) or the 9.0 HA install.
  diagnostic: vcf
- id: f06-md-002
  type: single
  kind: design
  difficulty: intermediate
  version: vcf9
  topics:
  - management-domain
  - deployment-models
  - vsan-resilience
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: management-domain
  section: minimum-hosts-and-storage
  stem: Why does the highly available install require four hosts in the management default cluster on vSAN rather than three?
  options:
  - id: a
    text: Because NSX Manager needs one host per node plus a spare for the VIP
    why: The VIP needs no host; anti-affinity needs 3 hosts.
    confusedWith: nsx-architecture
  - id: b
    text: Because with four hosts vSAN can automatically rebuild objects to policy compliance after a host failure
    correct: true
    why: Three hosts tolerate a failure but cannot rebuild to compliance.
  - id: c
    text: Because VCF Operations requires a dedicated host
    why: No dedicated host is required.
  - id: d
    text: Because SDDC Manager must run alone on a host
    why: No such rule.
    confusedWith: sddc-manager
  explanation:
    correct: 'Storage Models: 3 nodes tolerate one host failure but "does not support rebuild of vSAN objects to storage policy
      compliance"; 4 nodes support automatic rebuild.'
    concept: Host count vs resilience
    architecture: HA install hosts 3-node clusters with anti-affinity on a 4-host cluster.
    trap: Do not attribute the fourth host to NSX.
- id: f06-md-003
  type: multi
  kind: design
  difficulty: intermediate
  version: vcf9
  topics:
  - management-domain
  - wld-storage
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: management-domain
  section: minimum-hosts-and-storage
  stem: Which storage types can be principal storage for the management domain default cluster in VCF 9.0? (Choose three.)
  options:
  - id: a
    text: vSAN ESA
    correct: true
    why: Supported (as is vSAN OSA).
  - id: b
    text: Fibre Channel (VMFS)
    correct: true
    why: Principal or supplemental.
  - id: c
    text: NFS v3
    correct: true
    why: Principal with v3; v4.1 only supplemental.
  - id: d
    text: iSCSI
    why: Supplemental only.
    confusedWith: datastores
  - id: e
    text: vSAN compute cluster
    why: Not supported for the default management cluster.
    confusedWith: vsan-architecture
  - id: f
    text: NVMe/TCP
    why: Supplemental only.
    confusedWith: datastores
  select: 3
  explanation:
    correct: 'Default management cluster principal storage: vSAN ESA, vSAN OSA, FC, NFS v3. vSAN storage/compute clusters
      only in additional clusters.'
    concept: Principal vs supplemental storage
    architecture: Principal storage is chosen at cluster creation.
    trap: iSCSI and NVMe are always supplemental.
- id: f06-md-004
  type: single
  kind: design
  difficulty: advanced
  version: vcf9
  topics:
  - management-domain
  - design-availability
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: management-domain
  section: cluster-models
  stem: An architect wants the management domain default cluster spread across four racks with a separate L2 broadcast domain
    (subnets per rack). Which statement is correct?
  options:
  - id: a
    text: Use the Layer 3 multi-rack cluster model for the default management cluster
    why: L3 multi-rack is not supported for the management default cluster.
    confusedWith: vcf-network-design
  - id: b
    text: Use the Layer 2 multi-rack model for the default cluster; L3 multi-rack is only possible for additional clusters
    correct: true
    why: 'TechDocs: L3 multi-rack - "Management domain default cluster not supported."'
  - id: c
    text: Multi-rack models are only available for workload domains
    why: L2 multi-rack is supported for the default management cluster.
  - id: d
    text: Use a stretched cluster during initial deployment
    why: Stretching the default management cluster is a Day-2 action and is for availability zones, not racks.
    confusedWith: design-availability
  explanation:
    correct: 'Default management cluster: single-rack, L2 multi-rack, or stretched (Day 2). L3 multi-rack only for additional
      clusters/workload domains.'
    concept: Cluster models
    architecture: L3 multi-rack needs per-rack subnets/VLANs.
    trap: Per-rack L3 is attractive but not allowed for the first cluster.
- id: f06-md-005
  type: single
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
  - management-domain
  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: management-domain
  section: running-business-workloads-in-the-management-domain
  stem: A small company wants to run a few business VMs in the management domain to save hardware. What does VCF 9.0 guidance
    say?
  options:
  - id: a
    text: Not supported; business workloads must always run in a workload domain
    why: The management domain model allows business workloads.
    confusedWith: workload-domains
  - id: b
    text: Supported; create resource pools such as <cluster>-rp-sddc-mgmt and <cluster>-rp-user-vm so management components
      keep priority
    correct: true
    why: Recommendation VCF-WLD-RCMD-CFG-001.
  - id: c
    text: Supported only if VCF Operations is removed
    why: VCF Operations is mandatory.
    confusedWith: fleet-management
  - id: d
    text: Supported only with the HA install
    why: No such restriction.
  explanation:
    correct: The management domain can run business workloads; VCF-WLD-RCMD-CFG-001 recommends resource pools for sddc-mgmt,
      sddc-edge, user-edge and user-vm.
    concept: Business workloads in management domain
    architecture: Management appliances share the cluster with workloads.
    trap: Allowed but needs resource pools.
