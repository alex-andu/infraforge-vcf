  options:
  - id: a
    text: The deployment fails because the installer must be outside
    why: It is allowed but changes the appliance role.
    confusedWith: vcf-installer
  - id: b
    text: The appliance switches into SDDC Manager mode and can no longer be used in installer mode
    correct: true
    why: Quoted from "What Is the VCF Installer?".
  - id: c
    text: The installer deploys a second SDDC Manager next to itself
    why: It becomes the SDDC Manager.
  - id: d
    text: It becomes the VCF Operations fleet management appliance
    why: Different appliance.
    confusedWith: fleet-management
  explanation:
    correct: The VCF Installer ships in the SDDC Manager OVA; deployed inside the management infrastructure it becomes SDDC
      Manager.
    concept: VCF Installer vs SDDC Manager
    architecture: Outside the management domain it can deploy multiple platforms.
    trap: Same OVA, two modes.
- id: f06-wld-001
  type: single
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - workload-domains
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: attributes-of-the-workload-domain-model
  stem: Which component is always dedicated to each VI workload domain in VCF 9.0?
  options:
  - id: a
    text: NSX Manager
    why: NSX can be shared between workload domains.
    confusedWith: nsx-architecture
  - id: b
    text: vCenter
    correct: true
    why: Each workload domain is assigned its own vCenter.
  - id: c
    text: NSX Edge cluster
    why: Edge clusters can be shared between domains sharing NSX.
    confusedWith: nsx-edge
  - id: d
    text: SDDC Manager
    why: One SDDC Manager per instance serves all its domains.
    confusedWith: sddc-manager
  explanation:
    correct: A workload domain always has a dedicated vCenter (and SSO domain); NSX and edge clusters may be shared.
    concept: Workload domain composition
    architecture: The vCenter runs in the management domain.
    trap: Shared NSX is common; shared vCenter never.
  diagnostic: vcf
- id: f06-wld-002
  type: single
  kind: concept
  difficulty: intermediate
  version: vcf9
  topics:
  - workload-domains
  - identity-sso
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: attributes-of-the-workload-domain-model
  stem: A new VI workload domain is created in a greenfield VCF 9.0 instance. How is its vCenter Single Sign-On configured?
  options:
  - id: a
    text: It joins the management domain SSO domain with Enhanced Linked Mode
    why: That was the classic VCF 4.x/5.x default; ELM is deprecated in 9.0.
    confusedWith: identity-sso
  - id: b
    text: It gets a dedicated vCenter SSO domain
    correct: true
    why: 'Workload domain model: vCenter SSO domain = Dedicated.'
  - id: c
    text: It uses SDDC Manager as its identity source
    why: SDDC Manager is not an identity provider.
    confusedWith: sddc-manager
  - id: d
    text: It has no SSO domain; only VCF SSO is used
    why: vCenter still has its own SSO domain; VCF SSO is layered on top.
  explanation:
    correct: Each workload domain has a dedicated vCenter SSO domain; cross-component single sign-on comes from VCF SSO with
      the Identity Broker. Upgraded instances may still have shared SSO domains.
    concept: WLD identity isolation
    architecture: Dedicated SSO adds password-management overhead.
    trap: Legacy ELM behaviour.
- id: f06-wld-003
  type: single
  kind: design
  difficulty: intermediate
  version: vcf9
  topics:
  - workload-domains
  - nsx-edge
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: shared-vs-dedicated-nsx
  stem: Two workload domains must use the same NSX Edge cluster for north-south traffic. What is the prerequisite?
  options:
  - id: a
    text: Both domains must share the same vCenter
    why: Domains never share vCenter.
    confusedWith: vcenter
  - id: b
    text: Both domains must share the same NSX Manager instance
    correct: true
    why: Edge nodes can be shared across workload domains that share the same NSX Manager cluster.
  - id: c
    text: Both domains must be in the management domain
    why: They are workload domains.
    confusedWith: management-domain
  - id: d
    text: The edge cluster must be bare metal
    why: Form factor is irrelevant.
    confusedWith: nsx-edge
  explanation:
    correct: Sharing an edge cluster requires a shared NSX Manager instance.
    concept: Edge cluster sharing
    architecture: Edges are managed by exactly one NSX Manager.
    trap: You cannot share edges across different NSX instances.
- id: f06-wld-004
  type: single
  kind: design
  difficulty: advanced
  version: vcf9
  topics:
  - workload-domains
  - design-tradeoffs
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: shared-vs-dedicated-nsx
  stem: A PCI environment requires separate administration, separate network policy and an upgrade schedule independent from
    other environments. What is the best fit?
  options:
  - id: a
    text: A new cluster in the existing production workload domain
    why: Shares vCenter, SSO, NSX and lifecycle.
    confusedWith: vsphere-cluster
  - id: b
    text: A new workload domain that shares NSX with production
    why: Shared NSX means shared policy space and NSX lifecycle.
    confusedWith: nsx-architecture
  - id: c
    text: A new workload domain with a dedicated NSX instance
    correct: true
    why: Dedicated vCenter, SSO, NSX and independent lifecycle.
  - id: d
    text: Resource pools in the management domain
    why: No isolation of administration or policy.
    confusedWith: management-domain
  explanation:
    correct: Dedicated NSX gives separate NSX policy and lifecycle; the new domain gives separate vCenter/SSO and domain lifecycle.
    concept: Isolation design
    architecture: More appliances in the management domain.
    trap: Sharing NSX saves resources but weakens isolation.
- id: f06-wld-005
  type: single
  kind: scenario
  difficulty: intermediate
  version: vcf9
  topics:
  - workload-domains
  - cluster-expansion
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: domain-vs-cluster
  stem: The production team needs 8 more hosts with a different CPU generation. Same admins, same upgrade schedule. What should
    you create?
  options:
  - id: a
    text: A new workload domain
    why: Adds a vCenter, SSO domain and lifecycle overhead you do not need.
    confusedWith: workload-domains
  - id: b
    text: A new cluster in the existing production workload domain
    correct: true
    why: Capacity without new isolation boundaries.
  - id: c
    text: A new VCF instance
    why: Far too much for extra capacity.
    confusedWith: vcf-fleet
  - id: d
    text: A new fleet
    why: Unrelated to capacity.
  explanation:
    correct: Use a new cluster for capacity/hardware differences; a new domain for isolation or separate lifecycle.
    concept: Domain vs cluster
    architecture: Clusters in a domain share vCenter and are upgraded together.
    trap: Over-isolating increases management overhead.
