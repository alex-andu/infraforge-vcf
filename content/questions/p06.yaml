  section: flow-table
  stem: ESX hosts send heartbeats to vCenter. Which protocol and port are used by default?
  options:
  - id: a
    text: TCP 443 from vCenter to host
    why: API traffic, not the heartbeat.
  - id: b
    text: UDP 902 from host to vCenter
    correct: true
    why: KB 323612.
  - id: c
    text: TCP 1234 from host to vCenter
    why: NSX management channel port.
    confusedWith: nsx-architecture
  - id: d
    text: UDP 123 from vCenter to host
    why: NTP.
    confusedWith: ntp
  explanation:
    correct: Heartbeats every 10 s on UDP 902 host → vCenter; after 60 s without heartbeat the host is marked disconnected.
    concept: vCenter-host communication
    architecture: vCenter → host also uses TCP 902 and 443.
