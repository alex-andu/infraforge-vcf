    text: The workload domain vCenter
    correct: true
    why: Deployed into the management domain.
  - id: b
    text: The workload domain NSX Manager nodes
    correct: true
    why: Deployed into the management domain.
  - id: c
    text: The workload domain NSX Edge nodes
    why: Edges run in the workload domain (or shared edge cluster).
    confusedWith: nsx-edge
  - id: d
