  section: deployment-pathways
  stem: A customer has an existing standalone vSphere 9 environment (vCenter and hosts) and wants it to become the management
    domain of a new VCF instance without rebuilding it. Which pathway applies?
  options:
  - id: a
    text: Import vCenter as a workload domain
    why: Import adds a workload domain to an existing instance.
    confusedWith: vcenter-import
  - id: b
    text: Converge the existing vCenter with the VCF Installer
    correct: true
    why: Convergence turns existing vSphere into the management domain.
  - id: c
    text: Deploy a new fleet on new hosts and migrate VMs
    why: Not "without rebuilding".
  - id: d
    text: Upgrade from VCF 5.x
    why: There is no VCF 5.x here.
    confusedWith: lcm-workflow
  explanation:
