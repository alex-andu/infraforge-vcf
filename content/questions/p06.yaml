  objective: '4.1'
  objectiveItem: "4.1.1"
  lesson: component-communication
  section: why-dns-and-ntp-break-everything
  stem: After a hypervisor maintenance, SDDC Manager API token requests fail intermittently and VCF Operations reports authentication
    errors toward SDDC Manager, although passwords are unchanged. What should you check first?
  options:
  - id: a
    text: Time synchronization (NTP) on SDDC Manager and the involved components
    correct: true
    why: Clock skew breaks token and certificate validation.
  - id: b
    text: vSAN storage policy compliance
    why: Unrelated.
    confusedWith: vsan-policies
  - id: c
    text: NSX Edge BGP sessions
    why: Unrelated to management authentication.
    confusedWith: nsx-routing
  - id: d
    text: The VCF Automation organization configuration
    why: Not in this path.
    confusedWith: vcf-automation
  explanation:
    correct: Tokens and certificates are time-bound; skew produces errors that look like credential problems.
    concept: NTP dependency
    architecture: Every management flow depends on consistent time.
    trap: Do not reset passwords for a time problem.
