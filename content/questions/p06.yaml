  lesson: workload-domains-architecture
  section: components
  stem: A design uses a vSAN compute cluster that mounts the datastore of a vSAN storage cluster. Which constraint applies
    in VCF 9.0?
  options:
  - id: a
    text: The compute cluster must be in the management domain
    why: Not a requirement.
    confusedWith: management-domain
  - id: b
    text: The compute cluster must be co-located in the same workload domain as its vSAN storage cluster
    correct: true
    why: Quoted constraint from Storage Models.
  - id: c
    text: The storage cluster must use vSAN OSA
    why: No such restriction stated.
    confusedWith: vsan-architecture
  - id: d
    text: Compute clusters are only supported as supplemental storage
