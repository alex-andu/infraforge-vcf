  section: flow-1-monitoring
  stem: After a firewall change, VCF Operations shows instance B objects with metrics frozen since Saturday. vCenter B works
    normally and workloads are fine. Which link is the most likely problem?
  options:
  - id: a
    text: ESX hosts of instance B to vCenter B
    why: vCenter B works normally.
    confusedWith: esx-host
  - id: b
    text: VCF Operations collector of instance B to VCF Operations (or to the instance B endpoints)
    correct: true
    why: Monitoring flows through the instance collector.
  - id: c
    text: Identity Broker to the IdP
    why: Would affect logins, not metrics.
    confusedWith: identity-sso
  - id: d
    text: TEP-to-TEP Geneve in instance B
    why: Would affect workloads.
    confusedWith: nsx-segments
  explanation:
