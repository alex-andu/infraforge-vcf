    confusedWith: vcf-installer
  explanation:
    correct: 'KB 408116: with a non-expiring vCenter license, VCF Instances tabs are empty in 9.0.0; use SDDC Manager UI/API
      for certificates and passwords; fixed in 9.0.1.'
    concept: Deprecated UI still useful
    architecture: SDDC Manager executes core password operations anyway.
    trap: Changing passwords outside VCF breaks automation.
