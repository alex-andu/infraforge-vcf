    why: Three nodes in HA.
    confusedWith: vcf-automation
  explanation:
    correct: Fleet management, collector, vCenter and SDDC Manager stay single in the HA model.
    concept: HA model composition
    architecture: HA protects the services with the most users/API load.
    trap: Not everything is tripled.
