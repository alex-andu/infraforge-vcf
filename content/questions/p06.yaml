    trap: Edges are data plane, not management.
- id: f06-wld-007
  type: single
  kind: log
  difficulty: intermediate
  version: vcf9
  topics:
  - workload-domains
  - lcm-concepts
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: troubleshooting
  context: |-
    ```log
    domainmanager.log (SDDC Manager)
    Failed to get install image for component NSX_T_MANAGER, version 9.0.2.0.25150386
    Failed to get install image for component VCENTER, version 9.0.2.0.25148086
    Domain Creation Spec validations for SKU EMS failed with errors [FAILED_TO_RETRIEVE_COMPONENT_BINARY]
    ```
  stem: Creating a workload domain from VCF Operations fails at the Review step. What should the administrator do?
  options:
  - id: a
    text: Download the required vCenter and NSX install binaries, then retry
    correct: true
    why: 'KB 439510: missing install binaries cause this validation failure.'
  - id: b
    text: Recommission all hosts
    why: Hosts are not the reported problem.
    confusedWith: host-commissioning
  - id: c
    text: Restart VCF Operations
    why: The spec validation runs in SDDC Manager and the binary is missing.
    confusedWith: fleet-management
  - id: d
    text: Change the principal storage to NFS
    why: Unrelated to binaries.
    confusedWith: wld-storage
  explanation:
    correct: Domain creation needs install binaries for vCenter and NSX on SDDC Manager; download them through binary management
      and retry.
    concept: Binary dependency of domain creation
    architecture: VCF Operations UI → SDDC Manager domainmanager validation.
    trap: The error surfaces in VCF Operations but originates in SDDC Manager.
