  - nsx-architecture
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: shared-vs-dedicated-nsx
  diagram: d06-workload-domain-layout
  stem: In the diagram, NSX Manager B becomes unavailable. Which domains lose their NSX management and control plane?
  options:
  - id: a
    text: Only prod
    why: Dev shares the same NSX instance.
  - id: b
    text: Prod and dev
    correct: true
    why: Both share NSX Manager B.
  - id: c
    text: PCI, prod and dev
    why: PCI has its own NSX Manager A.
  - id: d
    text: None - the management domain NSX takes over
