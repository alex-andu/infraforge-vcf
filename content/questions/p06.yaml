  lesson: component-communication
  section: management-vs-data-plane-failures
  stem: All three NSX Manager nodes of a workload domain are powered off for 20 minutes. What happens to existing east-west
    overlay traffic between running VMs?
  options:
  - id: a
    text: It stops immediately
    why: Hosts keep their forwarding state.
    confusedWith: nsx-architecture
  - id: b
    text: It continues using the forwarding state already on the transport nodes; configuration changes are not possible
    correct: true
    why: Management/control plane loss does not immediately stop the data plane.
  - id: c
    text: It is rerouted through the management domain NSX
    why: No such failover.
  - id: d
    text: It switches to VLAN-backed port groups automatically
    why: No such behaviour.
    confusedWith: vds
  explanation:
    correct: Data plane runs on hosts and edges; losing NSX Manager freezes management/control but existing flows continue.
    concept: Plane separation
    architecture: Hosts keep their state; new changes cannot be pushed.
    trap: Treat management outages differently from data-plane outages.
