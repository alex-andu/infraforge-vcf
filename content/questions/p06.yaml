  type: single
  kind: concept
  difficulty: foundation
  version: vcf9
  topics:
  - workload-domains
  objective: '4.1'
  objectiveItem: "4.1.7"
  lesson: workload-domains-architecture
  section: attributes-of-the-workload-domain-model
  stem: What is the minimum number of hosts in a VI workload domain cluster in VCF 9.0?
  options:
  - id: a
    text: '1'
    why: Not supported for production clusters.
  - id: b
    text: '2'
    why: Below the documented minimum.
  - id: c
    text: '3'
    correct: true
    why: 'Storage Models: all workload domain clusters - three hosts.'
  - id: d
    text: '4'
    why: Four is the HA management default cluster minimum.
    confusedWith: management-domain
  explanation:
    correct: All workload domain clusters (and additional management clusters) need at least three hosts.
    concept: WLD cluster minimum
    architecture: Three-host vSAN clusters cannot rebuild to compliance after a failure.
    trap: Mixing up with the 4-host HA management minimum.
