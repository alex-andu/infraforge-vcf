questions:
  # ---------------------------------------------------------------- deployment-planning-prereqs
  - id: dep-plan-001
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [deployment-planning, vcf-installer]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: concept
    diagnostic: vcf
    stem: "Which tool does Broadcom provide to gather the inputs and check the prerequisites for deploying a VCF 9.0 fleet?"
    options:
      - { id: a, text: "The Planning and Preparation Workbook", correct: true, why: "An Excel workbook that gathers inputs, lists prerequisites, helps sizing and acts as a living specification." }
      - { id: b, text: "The Deployment Parameters Workbook uploaded to Cloud Builder", why: "That is the VCF 5.x bring-up process; the VCF 9.0 installer no longer requires it.", confusedWith: vcf-installer }
      - { id: c, text: "VCF Operations fleet management", why: "Fleet management runs after deployment; it does not plan the first deployment.", confusedWith: fleet-management }
      - { id: d, text: "The SDDC Manager API explorer", why: "An API tool, not a planning and prerequisite checklist." }
    explanation:
      correct: "The VCF 9.0 Planning and Preparation Workbook is the planning tool: prerequisite checklist, sizing and the values for every wizard field."
      concept: "Planning artefact vs deployment input"
      architecture: "The workbook is used before the VCF Installer exists; the installer itself takes wizard input or a JSON spec."
      trap: "Do not carry the VCF 5.x Deployment Parameters Workbook / Cloud Builder flow into VCF 9."
  - id: dep-plan-002
    type: multi
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [deployment-planning, host-commissioning]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: deep-dive
    select: 3
    context: |
      You are preparing four freshly installed ESX 9 hosts for a new VCF 9.0 management domain on vSAN ESA.
    stem: "Which three host preparation tasks are required? (Choose three.)"
    options:
      - { id: a, text: "Set the hostname to the FQDN and create forward and reverse DNS records", correct: true, why: "Hostname must equal the FQDN, with A and PTR records." }
      - { id: b, text: "Regenerate the self-signed certificate after setting the FQDN", correct: true, why: "The certificate must be regenerated based on the FQDN." }
      - { id: c, text: "Delete all existing partitions on the disks vSAN will claim", correct: true, why: "vSAN claims only empty devices." }
      - { id: d, text: "Create a vSphere Distributed Switch on each host", why: "The installer creates the VDS; hosts start with management on the standard switch.", confusedWith: vds }
      - { id: e, text: "Join the hosts to an existing vCenter", why: "For a new deployment the installer deploys vCenter; existing vCenter means convergence.", confusedWith: vcenter-import }
    explanation:
      correct: "FQDN with forward/reverse DNS, a regenerated certificate and empty disks are explicit host prerequisites."
      concept: "ESX host preparation for VCF"
      architecture: "The installer migrates the management VMkernel from the standard switch to a VDS it creates."
      trap: "Pre-building VDS or vCenter is not preparation — it changes the workflow into convergence."
  - id: dep-plan-003
    type: single
    kind: design
    difficulty: intermediate
    version: vcf9
    topics: [deployment-planning, wld-storage, management-domain]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: concept
    stem: "Which storage types can be selected as principal storage for the default cluster of a new VCF 9.0 management domain?"
    options:
      - { id: a, text: "vSAN (ESA or OSA), NFS v3, VMFS on Fibre Channel", correct: true, why: "These are the principal options in the installer and the Storage Models table." }
      - { id: b, text: "vSAN only", why: "That was the rule in earlier VCF versions.", confusedWith: vsan-architecture }
      - { id: c, text: "vSAN, NFS v4.1 and iSCSI", why: "NFS v4.1 and iSCSI are supplemental only.", confusedWith: datastores }
      - { id: d, text: "vSAN storage cluster or vSAN compute cluster", why: "Not supported for the management domain default cluster." }
    explanation:
      correct: "VCF 9.0 allows vSAN ESA/OSA, NFS v3 and VMFS on FC as principal storage for the management domain default cluster."
      concept: "Principal storage options"
      architecture: "The choice is made on the installer's storage page and cannot be changed later."
      trap: "NFS v3 is principal; NFS v4.1 is supplemental."
  - id: dep-plan-004
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [deployment-models, deployment-planning]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: concept
    stem: "Compared with the simple model, what does the high availability deployment model change for a new fleet?"
    options:
      - { id: a, text: "NSX Manager, VCF Operations and VCF Automation are deployed as three-node clusters", correct: true, why: "HA triples the clustered components (minimum 13 appliances vs 7)." }
      - { id: b, text: "vCenter is deployed with vCenter HA", why: "The model does not add vCenter HA.", confusedWith: vcenter }
      - { id: c, text: "Two SDDC Manager appliances are deployed", why: "There is one SDDC Manager per instance." }
      - { id: d, text: "The management domain is stretched across two sites", why: "Stretching is a separate design decision." , confusedWith: design-availability }
    explanation:
      correct: "The HA model deploys three-node NSX Manager, VCF Operations and VCF Automation clusters and is recommended for production."
      concept: "Simple vs HA deployment model"
      architecture: "The selected model applies only to appliances the installer deploys new."
      trap: "HA here means component clustering, not vCenter HA or stretched clusters."
  - id: dep-plan-005
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [deployment-planning, vcf-installer, lcm-concepts]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: deep-dive
    context: |
      A bank's VCF Installer appliance will run in an isolated management network without internet access.
    stem: "How should the deployment binaries be provided?"
    options:
      - { id: a, text: "Populate an offline depot with the VCF Download Tool on an internet-connected system and point the installer at it", correct: true, why: "This is the documented path when the installer cannot reach the online depot." }
      - { id: b, text: "They are already in the installer OVA", why: "The installer does not include software binaries." }
      - { id: c, text: "Upload the binaries to SDDC Manager in the management domain first", why: "No management domain exists yet." , confusedWith: sddc-manager }
      - { id: d, text: "Download them from VCF Operations", why: "VCF Operations is deployed by the installer; it cannot supply day-0 binaries." , confusedWith: fleet-management }
    explanation:
      correct: "Offline depot + VCF Download Tool is the air-gapped path; one depot can serve several instances."
      concept: "Online vs offline depot"
      architecture: "The installer pulls from a depot over HTTPS by default."
      trap: "The OVA has no product binaries."
  - id: dep-plan-006
    type: ordering
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [deployment-planning, certificates]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: deep-dive
    stem: "Put the host preparation steps for a freshly installed ESX host in the correct order."
    items:
      - { id: s1, text: "Configure the management IP, VLAN, gateway and DNS servers in the DCUI" }
      - { id: s2, text: "Set the hostname as an FQDN (esxcli system hostname set --fqdn=...)" }
      - { id: s3, text: "Regenerate the self-signed certificate (/sbin/generate-certificates)" }
      - { id: s4, text: "Restart hostd and vpxa" }
      - { id: s5, text: "Confirm forward and reverse lookup and NTP before running validation" }
    explanation:
      correct: "Network first, then FQDN, then certificate regeneration and agent restart, then verification."
      concept: "Order dependency between hostname and certificate"
      trap: "Regenerating the certificate before the FQDN is set produces a certificate for the old name."
  - id: dep-plan-007
    type: single
    kind: scenario
    difficulty: advanced
    version: vcf9
    topics: [deployment-planning, vcf-installer]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: deep-dive
    context: |
      The management hosts have different root passwords that the security team will not align, and the uplinks
      must use Link Aggregation Groups.
    stem: "How should the deployment be performed?"
    options:
      - { id: a, text: "Use a JSON specification with the VCF Installer", correct: true, why: "JSON is required for LAG uplinks and for hosts with different passwords." }
      - { id: b, text: "Use the wizard; it asks for each host's password and LAG settings", why: "The wizard takes one common ESX password and does not cover LAG." }
      - { id: c, text: "Use Cloud Builder with the Deployment Parameters Workbook", why: "VCF 5.x tooling.", confusedWith: vcf-installer }
      - { id: d, text: "Deploy vCenter manually and converge it", why: "Convergence is for existing environments, not a workaround for passwords.", confusedWith: vcenter-import }
    explanation:
      correct: "The installer UI requires a common host password; LAG and per-host passwords need a JSON spec."
      concept: "UI vs JSON spec"
      architecture: "The JSON spec (SddcSpec) can be downloaded after review, edited and uploaded."
      trap: "Choosing Cloud Builder because 'JSON = Cloud Builder'."
  - id: dep-plan-008
    type: truefalse
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [deployment-planning, wld-storage]
    objective: "4.1"
    lesson: deployment-planning-prereqs
    section: concept
    stem: "The principal storage type selected for the management domain can be changed later from SDDC Manager."
    options:
      - { id: "true", text: "True", why: "There is no workflow to change principal storage after creation." }
      - { id: "false", text: "False", correct: true, why: "Principal storage cannot be changed after creation; changing it means rebuilding." }
    explanation:
      correct: "False. The installer explicitly notes principal storage cannot be changed after creation."
      concept: "Irreversible design decisions"
      trap: "Supplemental storage can be added later; principal storage cannot be changed."
  # ---------------------------------------------------------------- vcf-installer-workflow
  - id: dep-inst-001
    type: single
    kind: architecture
    difficulty: foundation
    version: vcf9
    topics: [vcf-installer, sddc-manager]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: concept
    diagnostic: vcf
    stem: "Which component replaces Cloud Builder in VCF 9.0?"
    options:
      - { id: a, text: "VCF Installer", correct: true, why: "The VCF Installer appliance deploys new VCF/VVF platforms and converges existing vSphere." }
      - { id: b, text: "VCF Operations fleet management", why: "Fleet management handles day-2 lifecycle of management components.", confusedWith: fleet-management }
      - { id: c, text: "vSphere Lifecycle Manager", why: "vLCM manages host images.", confusedWith: vlcm }
      - { id: d, text: "VCF Automation", why: "Self-service consumption, not deployment.", confusedWith: vcf-automation }
    explanation:
      correct: "The VCF Installer replaces Cloud Builder and adds binary download and convergence workflows."
      concept: "VCF 9 renames and new components"
      architecture: "It ships in the SDDC Manager OVA."
      trap: "Cloud Builder and bring-up are VCF 5.x terms."
  - id: dep-inst-002
    type: single
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [vcf-installer, sddc-manager]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: concept
    context: |
      An architect deploys the VCF Installer OVA on one of the four ESX hosts that will form the management domain,
      and plans to reuse the same installer next month for a second VCF instance at another site.
    stem: "What is the problem with this plan?"
    options:
      - { id: a, text: "On a management host the appliance switches to SDDC Manager mode and loses its installer capabilities", correct: true, why: "TechDocs: deployed inside the management infrastructure it becomes SDDC Manager." }
      - { id: b, text: "The installer cannot run on ESX hosts at all", why: "It is an OVA deployed on ESX." }
      - { id: c, text: "One installer can only download binaries for one version", why: "Not the issue described." }
      - { id: d, text: "The installer must be deployed in VCF Operations", why: "VCF Operations does not host the installer.", confusedWith: vcf-ops-architecture }
    explanation:
      correct: "Deploy the installer outside the management infrastructure if you want to reuse it for several platforms."
      concept: "Installer dual personality"
      architecture: "Installer and SDDC Manager share the VCF-SDDC-Manager-Appliance OVA."
      trap: "Assuming the installer stays an installer after deployment."
  - id: dep-inst-003
    type: ordering
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [vcf-installer]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: how-it-works
    stem: "Order the high-level VCF Installer process for a new VCF fleet."
    items:
      - { id: s1, text: "Prepare the ESX hosts" }
      - { id: s2, text: "Deploy the VCF Installer appliance" }
      - { id: s3, text: "Connect a depot and download the binaries" }
      - { id: s4, text: "Complete the deployment wizard (or upload a JSON spec)" }
      - { id: s5, text: "Validate and fix errors" }
      - { id: s6, text: "Deploy and monitor tasks" }
      - { id: s7, text: "License in VCF Operations and deploy the remaining components" }
    explanation:
      correct: "Preparation, deployment wizard and validation, deploy, then post-deployment tasks."
      concept: "Preparation / deployment / post-deployment phases"
      trap: "Binaries must be downloaded before deployment can start."
  - id: dep-inst-004
    type: multi
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [vcf-installer, vcf-ops-logs, network-ops]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: components
    select: 2
    context: |
      The VCF Installer reports success for a new VCF fleet deployed with the simple model.
    stem: "Which two components must the administrator still deploy to complete the platform? (Choose two.)"
    options:
      - { id: a, text: "VCF Operations for logs", correct: true, why: "Deployed after the installer finishes." }
      - { id: b, text: "VCF Operations for networks", correct: true, why: "Deployed after the installer finishes (VCF only)." }
      - { id: c, text: "NSX Manager for the management domain", why: "The installer deploys it.", confusedWith: nsx-architecture }
      - { id: d, text: "The VCF Operations collector", why: "The installer deploys a collector." }
      - { id: e, text: "SDDC Manager", why: "Deployed by the installer (or the installer converts into it).", confusedWith: sddc-manager }
    explanation:
      correct: "Logs, networks, the orchestrator and optionally a three-node identity broker are post-deployment components."
      concept: "Additional components required to complete deployment (objective 4.1)"
      architecture: "VCF Operations, fleet management and the collector come from the installer."
      trap: "Logs and networks are VCF Operations family members but are not deployed by the installer."
  - id: dep-inst-005
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [vcf-installer, vcf-automation]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: how-it-works
    context: |
      A customer will first upgrade its existing Aria Automation 8.x and wants VCF Automation in the new fleet only
      after that.
    stem: "What should be selected on the VCF Automation page of the installer wizard?"
    options:
      - { id: a, text: "I want to connect a VCF Automation instance later", correct: true, why: "VCF Automation can be deferred and deployed or connected as a day-N operation." }
      - { id: b, text: "Deploy a new VCF Automation instance and delete it later", why: "Wasteful and unnecessary." }
      - { id: c, text: "Leave the page empty; deployment fails until it is filled in", why: "There is an explicit deferral option." }
      - { id: d, text: "Select the existing vCenter instead", why: "Unrelated to VCF Automation; selecting vCenter triggers convergence.", confusedWith: vcenter-import }
    explanation:
      correct: "The deferral option exists precisely for upgrading Aria Automation 8.x first or deploying later."
      concept: "Optional components at day 0"
      trap: "Assuming every fleet component must be deployed by the installer."
  - id: dep-inst-006
    type: matching
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [vcf-installer]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: how-it-works
    stem: "Match each wizard decision with the page where it is made."
    pairs:
      - { id: p1, left: "New fleet vs instance in existing fleet", right: "Deployment type" }
      - { id: p2, left: "Simple vs High Availability", right: "General information" }
      - { id: p3, left: "vSAN ESA, VMFS on FC or NFS v3", right: "Storage" }
      - { id: p4, left: "Default vs storage/NSX traffic separation", right: "Distributed switch" }
      - { id: p5, left: "Download the JSON specification", right: "Review" }
    explanation:
      correct: "Each design decision lives on a specific wizard page; the JSON spec is offered at review."
      concept: "Installer wizard structure"
      trap: "The deployment model is chosen in general information, not on the VCF Operations page."
  - id: dep-inst-007
    type: single
    kind: command
    difficulty: advanced
    version: vcf9
    topics: [vcf-installer, apis-powercli]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: cli-api
    stem: "Which VCF Installer API call validates a deployment specification without deploying it?"
    options:
      - { id: a, text: "POST /v1/sddcs/validations", correct: true, why: "Validates an SddcSpec and returns executionStatus/resultStatus." }
      - { id: b, text: "POST /v1/sddcs", why: "This starts the deployment." }
      - { id: c, text: "POST /v1/hosts/validations", why: "SDDC Manager API for host commissioning specs.", confusedWith: host-commissioning }
      - { id: d, text: "GET /v1/sddcs/latest", why: "Returns the latest deployment task." }
    explanation:
      correct: "POST /v1/sddcs/validations runs validation; POST /v1/sddcs deploys."
      concept: "VCF Installer API"
      architecture: "Authenticate with POST /v1/tokens first."
      trap: "Confusing installer and SDDC Manager endpoints."
  - id: dep-inst-008
    type: single
    kind: scenario
    difficulty: advanced
    version: vcf9
    topics: [vcf-installer, vcf-fleet]
    objective: "4.1"
    lesson: vcf-installer-workflow
    section: real-world-scenario
    context: |
      A second data centre will become a new VCF instance that shares VCF Operations with the first instance.
    stem: "Which option is selected in the installer and what does it deploy for VCF Operations?"
    options:
      - { id: a, text: "A VCF instance in an existing VCF fleet; connect to the existing VCF Operations and deploy a new collector", correct: true, why: "The new instance joins the fleet; only a collector is added for VCF Operations." }
      - { id: b, text: "A new VCF fleet; deploy a new VCF Operations and link it to the first", why: "That creates a separate fleet.", confusedWith: vcf-fleet }
      - { id: c, text: "Converge the first site's vCenter", why: "Convergence is for existing vSphere." , confusedWith: vcenter-import }
      - { id: d, text: "Deploy a new fleet management appliance and a new VCF Operations in HA", why: "Fleet-level components already exist in the fleet." }
    explanation:
      correct: "Instance in existing fleet: connect to the existing VCF Operations; enter new collector details."
      concept: "Fleet vs instance"
      architecture: "Fleet-level services (VCF Operations, fleet management, VCF Automation) are shared; each instance has its own management domain."
      trap: "Custom networking for VCF Operations is unavailable in this scenario."
  # ---------------------------------------------------------------- deployment-validation-failures
  - id: dep-val-001
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [deployment-validation]
    objective: "4.1"
    lesson: deployment-validation-failures
    section: concept
    diagnostic: troubleshooting
    stem: "During VCF Installer validation, what is the difference between a warning and an error?"
    options:
      - { id: a, text: "Warnings can be acknowledged to proceed; errors must be resolved before deploying", correct: true, why: "As documented for the validation step." }
      - { id: b, text: "Both block deployment", why: "Warnings can be acknowledged." }
      - { id: c, text: "Errors can be acknowledged; warnings must be fixed", why: "Reversed." }
      - { id: d, text: "Neither blocks deployment; they are informational", why: "Errors block." }
    explanation:
      correct: "Acknowledge warnings consciously; fix errors in the wizard or by uploading a corrected JSON."
      concept: "Validation outcomes"
      trap: "Acknowledging warnings without understanding them stores up problems (e.g. NTP)."
  - id: dep-val-002
    type: single
    kind: troubleshooting
    difficulty: intermediate
    version: vcf9
    topics: [deployment-validation, dns]
    objective: "4.1"
    lesson: deployment-validation-failures
    section: deep-dive
    context: |
      ```shell
      $ nslookup esx03.lab.local
      Address: 10.0.10.13
      $ nslookup 10.0.10.13
      13.10.0.10.in-addr.arpa  name = esx-old-03.lab.local.
      ```
      Validation reports a DNS error for esx03.
    stem: "What is the root cause?"
    options:
      - { id: a, text: "The PTR record for 10.0.10.13 points to an old name", correct: true, why: "Reverse lookup must return the same FQDN." }
      - { id: b, text: "The host certificate is stale", why: "A certificate problem shows as a thumbprint/certificate failure.", confusedWith: certificates }
      - { id: c, text: "NTP skew", why: "Time does not affect name resolution.", confusedWith: ntp }
      - { id: d, text: "The vSAN IP range is too small", why: "Unrelated to DNS." }
    explanation:
      correct: "Forward is fine but reverse returns a different name; fix the PTR record and re-validate."
      concept: "Forward and reverse DNS consistency"
      trap: "Adding hosts-file entries instead of fixing DNS."
  - id: dep-val-003
    type: single
    kind: troubleshooting
    difficulty: intermediate
    version: vcf9
    topics: [deployment-validation, mtu]
    objective: "4.1"
    lesson: deployment-validation-failures
    section: deep-dive
    context: |
      ```shell
      [root@esx01:~] vmkping -I vmk2 10.0.12.12
      3 packets transmitted, 3 packets received
      [root@esx01:~] vmkping -I vmk2 -d -s 8972 10.0.12.12
      3 packets transmitted, 0 packets received, 100% packet loss
      ```
    stem: "What does this output indicate on the vSAN VLAN?"
    options:
      - { id: a, text: "A device in the path does not pass 9000-byte frames (MTU mismatch)", correct: true, why: "Small pings pass, large don't-fragment pings fail." }
      - { id: b, text: "The VLAN is not trunked", why: "Then the small ping would also fail.", confusedWith: l2-l3 }
      - { id: c, text: "DNS is broken", why: "The test uses IP addresses.", confusedWith: dns }
      - { id: d, text: "vmk2 has no IP address", why: "Small pings work." }
    explanation:
      correct: "The classic MTU signature: connectivity works, jumbo frames with DF bit are dropped."
      concept: "End-to-end MTU"
      trap: "Concluding the network is fine because ping works."
  - id: dep-val-004
    type: single
    kind: troubleshooting
    difficulty: advanced
    version: vcf9
    topics: [deployment-validation, certificates]
    objective: "4.1"
    lesson: deployment-validation-failures
    section: deep-dive
    context: |
      A host was installed as `localhost`, then renamed to esx04.lab.local with esxcli. DNS forward and reverse are
      correct. Validation fails on certificate/thumbprint validation for esx04 only.
    stem: "What is the best fix?"
    options:
      - { id: a, text: "Run /sbin/generate-certificates on esx04, restart hostd and vpxa, then re-confirm its thumbprint", correct: true, why: "The certificate still matches the old name." }
      - { id: b, text: "Set skipEsxThumbprintValidation in the JSON spec", why: "Hides the problem; the certificate still does not match." }
      - { id: c, text: "Reinstall the VCF Installer", why: "The installer is not the problem." , confusedWith: vcf-installer }
      - { id: d, text: "Add a PTR record for localhost", why: "DNS is already correct.", confusedWith: dns }
    explanation:
      correct: "Regenerate the self-signed certificate after the FQDN change and restart the agents."
      concept: "Certificate identity must match the FQDN"
      trap: "Skipping validation instead of fixing identity."
  - id: dep-val-005
    type: ordering
    kind: troubleshooting
    difficulty: intermediate
    version: vcf9
    topics: [deployment-validation, troubleshooting-method]
    objective: "4.1"
    lesson: deployment-validation-failures
    section: how-it-works
    stem: "Order the diagnostic loop for a failed VCF Installer validation."
    items:
      - { id: s1, text: "Read the exact check that failed and the object it names" }
      - { id: s2, text: "Classify the layer (DNS, NTP, network/MTU, host, certificate, password)" }
      - { id: s3, text: "Test from the installer's point of view" }
      - { id: s4, text: "Fix the source (record, switch, host, password)" }
      - { id: s5, text: "Re-run validation" }
    explanation:
      correct: "Read, classify, test from the right vantage point, fix the source, re-validate."
      concept: "Structured troubleshooting"
      trap: "Testing from your laptop instead of the installer, whose resolver and routes are what matter."
  - id: dep-val-006
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [deployment-validation, vcf-installer]
    objective: "4.1"
    lesson: deployment-validation-failures
    section: real-world-scenario
    context: |
