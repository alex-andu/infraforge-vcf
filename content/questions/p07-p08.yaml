      - { id: c, text: "Commission the vCenter as a host", why: "Commissioning is for ESX hosts.", confusedWith: host-commissioning }
      - { id: d, text: "Upgrade the vCenter with fleet management", why: "Not an adoption path." , confusedWith: fleet-management }
