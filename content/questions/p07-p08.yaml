      - { id: c, text: "These checks only apply to workload domains, not the management domain", why: "They apply at deployment too." }
      - { id: d, text: "Using NFS v3 principal storage still requires vSAN ESA certified disks", why: "Disk certification is a vSAN requirement.", confusedWith: wld-storage }
