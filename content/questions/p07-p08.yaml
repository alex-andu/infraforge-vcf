      - { id: b, text: "Add the nodes to the NFS cluster and enable vSAN on it", why: "Principal storage cannot be changed and hosts must share the cluster's type." }
      - { id: c, text: "Create a new workload domain", why: "Would create a new vCenter/NSX, violating the requirement.", confusedWith: workload-domains }
      - { id: d, text: "Import the nodes as an existing vCenter", why: "Import is for vCenters, not hosts.", confusedWith: vcenter-import }
    explanation:
      correct: "New cluster in the same domain with vSAN ESA principal storage."
