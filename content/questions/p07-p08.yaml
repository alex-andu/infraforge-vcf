    topics: [wld-storage, host-commissioning]
    objective: "4.1"
    lesson: workload-domain-storage
    section: failure-scenarios
    context: |
      You create network pool wld02-np with vMotion and vSAN networks. You then try to commission hosts with storage
      type NFS using this pool for an NFS-based workload domain.
    stem: "What will happen and why?"
    options:
      - { id: a, text: "The pool cannot be used because it lacks an NFS network for the NFS VMkernels", correct: true, why: "The pool must support the storage type selected for the host." }
      - { id: b, text: "It works; NFS traffic uses the vSAN network", why: "VCF assigns NFS VMkernel IPs from an NFS network in the pool." }
      - { id: c, text: "It works; NFS uses the management VMkernel", why: "VCF uses a dedicated NFS network from the pool in this workflow." , confusedWith: vcf-network-design }
      - { id: d, text: "The hosts commission but the domain will use vSAN instead", why: "Storage type is explicit." }
    explanation:
      correct: "Create a pool with vMotion and NFS networks; subnets cannot be added by editing an existing network."
      concept: "Pool and storage type consistency"
      trap: "Treating the pool as storage-agnostic."
  # ---------------------------------------------------------------- cluster-host-expansion
  - id: wld-exp-001
    type: single
