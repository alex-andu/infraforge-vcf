      - { id: b, text: "Redeploy the VCF Installer and start over", why: "Unnecessary; deployment resumes from the failed task." }
      - { id: c, text: "Re-image all hosts", why: "Hosts are not the problem." }
      - { id: d, text: "Deploy NSX Manager manually from OVA", why: "Breaks the automated workflow." , confusedWith: nsx-architecture }
    explanation:
