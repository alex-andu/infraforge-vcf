    stem: "After a host is removed from a VCF cluster, it can immediately be added to a cluster in another workload domain."
    options:
      - { id: "true", text: "True", why: "It must first be decommissioned, re-imaged and commissioned." }
      - { id: "false", text: "False", correct: true, why: "Remove, decommission, re-image and commission before reuse." }
    explanation:
      correct: "False."
      concept: "Host reuse"
      trap: "Unassigned after removal does not mean reusable."
  - id: wld-exp-008
    type: single
    kind: scenario
    difficulty: expert
    version: vcf9
    topics: [cluster-expansion, vsan-resilience]
    objective: "4.1"
    lesson: cluster-host-expansion
    section: deep-dive
    context: |
      A three-host vSAN OSA cluster uses a storage policy with FTT=1 RAID-1. The team wants to remove one host
      permanently to reuse it elsewhere, and the wizard offers Force Remove.
    stem: "What is the correct assessment?"
    options:
      - { id: a, text: "Do not remove it until another host is added; two hosts cannot satisfy FTT=1 RAID-1 and data availability is at risk", correct: true, why: "FTT=1 mirroring needs at least three hosts; forced removal can make objects non-compliant or the datastore unavailable." }
      - { id: b, text: "Force Remove is safe because vSAN rebuilds on the remaining hosts", why: "There are not enough hosts to rebuild compliant objects.", confusedWith: vsan-resilience }
      - { id: c, text: "Change the policy to FTT=2 first", why: "FTT=2 needs even more hosts.", confusedWith: vsan-policies }
      - { id: d, text: "Decommission the host directly", why: "Assigned hosts cannot be decommissioned." }
    explanation:
      correct: "Keep enough hosts for configured vSAN availability before removing."
      concept: "Shrink safety"
      trap: "Treating Force Remove as harmless."
