  - id: dep-val-008
    type: single
    kind: troubleshooting
    difficulty: expert
    version: vcf9
    topics: [deployment-validation, ntp, certificates]
    objective: "4.1"
    lesson: deployment-validation-failures
    section: deep-dive
    context: |
      After an otherwise successful deployment, logins between components intermittently fail with token errors,
      and one appliance logs a certificate "not yet valid" message. Validation had shown an NTP warning that was
      acknowledged.
    stem: "What is the most likely root cause?"
    options:
      - { id: a, text: "Time skew between hosts and appliances (NTP)", correct: true, why: "Skew breaks token lifetimes and certificate validity checks." }
      - { id: b, text: "Missing PTR records", why: "Would surface as name-resolution failures.", confusedWith: dns }
      - { id: c, text: "MTU mismatch on the management VLAN", why: "Would cause transfer failures, not 'not yet valid' certificates.", confusedWith: mtu }
      - { id: d, text: "Expired licences", why: "Licensing does not produce certificate validity errors." , confusedWith: licensing }
    explanation:
      correct: "'Not yet valid' and token errors are time symptoms; fix NTP everywhere."
      concept: "NTP as a hard dependency"
      trap: "Acknowledging NTP warnings at validation time."
