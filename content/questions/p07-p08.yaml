      trap: "Trying to change the storage type of an existing cluster."
  - id: wld-exp-006
    type: single
    kind: troubleshooting
    difficulty: advanced
    version: vcf9
    topics: [cluster-expansion, host-commissioning]
    objective: "4.1"
    lesson: cluster-host-expansion
    section: failure-scenarios
    context: |
      Adding two hosts to a cluster fails at the VMkernel configuration subtask. The network pool shows vMotion range
      10.0.21.11-10.0.21.14, all four addresses in use.
    stem: "What is the fix?"
    options:
      - { id: a, text: "Add a new IP range to the network pool and retry", correct: true, why: "Ranges cannot be edited, but new ranges can be added." }
      - { id: b, text: "Edit the existing range to .11-.30", why: "IP ranges cannot be edited after creation." }
      - { id: c, text: "Change the pool subnet to a /23", why: "The subnet cannot be changed." }
      - { id: d, text: "Assign IPs manually in vCenter", why: "Creates drift from SDDC Manager's inventory." , confusedWith: compliance-drift }
    explanation:
      correct: "Grow the pool by adding a range, then retry the task."
      concept: "Pool exhaustion"
      trap: "Expecting to edit existing pool ranges."
