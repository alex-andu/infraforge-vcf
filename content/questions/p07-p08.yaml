      - { id: a, text: "In VI workload domains and additional management domain clusters, but not the management domain default cluster", correct: true, why: "Per the Storage Models table." }
      - { id: b, text: "Only in the management domain default cluster", why: "Reversed." }
      - { id: c, text: "Nowhere; it is supplemental only", why: "It is a principal option outside the default management cluster." }
      - { id: d, text: "Only in imported workload domains", why: "No such restriction." , confusedWith: vcenter-import }
    explanation:
      correct: "vSAN storage clusters and compute clusters are not supported for the management default cluster."
      concept: "Disaggregated vSAN in VCF"
      trap: "Assuming every vSAN model is allowed everywhere."
