    stem: "In VCF 9.0, where does TechDocs document adding an unassigned host to an existing SDDC cluster?"
    options:
      - { id: a, text: "vSphere Client > cluster > Actions > Add Hosts > Add Unassigned Hosts", correct: true, why: "Documented path." }
      - { id: b, text: "VCF Installer > Expand", why: "The installer is for deployment.", confusedWith: vcf-installer }
      - { id: c, text: "ESX Host Client > Join cluster", why: "Not a VCF workflow." }
      - { id: d, text: "NSX Manager > Transport Nodes > Add", why: "NSX preparation is automated by VCF.", confusedWith: nsx-transport }
    explanation:
      correct: "Expansion is started in the vSphere Client and executed by SDDC Manager."
      concept: "Expansion UI"
      trap: "Adding hosts with plain vCenter 'Add Host' bypasses VCF for SDDC clusters."
  - id: wld-exp-002
    type: multi
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [cluster-expansion, vlcm]
    objective: "4.1"
    lesson: cluster-host-expansion
    section: architecture
    select: 3
    stem: "Which three actions does VCF perform automatically when a commissioned host is added to an SDDC cluster? (Choose three.)"
    options:
      - { id: a, text: "Remediates the new host to the cluster's vLCM image", correct: true, why: "Remediation is scoped to the newly added hosts." }
      - { id: b, text: "Assigns vMotion and storage VMkernel IPs from the network pool", correct: true, why: "Pool IPs are consumed on assignment." }
      - { id: c, text: "Prepares the host as an NSX transport node", correct: true, why: "TEPs from the static pool or DHCP." }
      - { id: d, text: "Zones FC LUNs to the new host", why: "FC zoning must be done beforehand." , confusedWith: datastores }
      - { id: e, text: "Remediates every host in the cluster to the latest ESX build", why: "Only the new hosts are remediated." , confusedWith: lcm-workflow }
    explanation:
      correct: "Image, VDS, pool IPs, storage and NSX preparation are automated for the new host."
      concept: "Automated expansion"
      trap: "External storage preparation remains manual."
  - id: wld-exp-003
    type: ordering
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [cluster-expansion, host-commissioning]
    objective: "4.1"
    lesson: cluster-host-expansion
    section: how-it-works
    stem: "Order the steps to replace an old host in a vSAN SDDC cluster without dropping below capacity."
    items:
      - { id: s1, text: "Commission the new host with the same storage type" }
      - { id: s2, text: "Add the new host to the cluster (Add Unassigned Hosts)" }
      - { id: s3, text: "Wait for DRS rebalancing and vSAN resync" }
      - { id: s4, text: "Move any NSX Edge node off the old host" }
      - { id: s5, text: "Remove the old host from the cluster" }
      - { id: s6, text: "Decommission the old host" }
    explanation:
      correct: "Grow first, then shrink: commission, add, stabilise, clear edges, remove, decommission."
      concept: "Hardware refresh order"
      trap: "Removing first can leave vSAN below its policy minimum."
  - id: wld-exp-004
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [cluster-expansion, nsx-edge]
    objective: "4.1"
    lesson: cluster-host-expansion
    section: how-it-works
    stem: "Removing a host from a workload domain cluster is blocked. The host runs an NSX Edge node VM. What must be done first?"
    options:
      - { id: a, text: "Relocate or delete the NSX Edge node", correct: true, why: "Hosts cannot be removed while they host NSX Edge nodes." }
      - { id: b, text: "Decommission the host first", why: "Decommission requires the host to be unassigned." }
      - { id: c, text: "Force remove", why: "Force is for host-count warnings, not edges; and risky." }
      - { id: d, text: "Delete the Tier-0 gateway", why: "Unnecessarily disruptive.", confusedWith: nsx-routing }
    explanation:
      correct: "Move edges first, then remove the host."
      concept: "Shrink prerequisites"
      trap: "Using Force Remove as a universal fix."
  - id: wld-exp-005
    type: single
    kind: design
    difficulty: advanced
