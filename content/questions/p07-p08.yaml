      - { id: c, text: "Both are destroyed", why: "NFS is only unmounted." }
      - { id: d, text: "vSAN data is migrated automatically to another cluster", why: "Migration is the administrator's job before deletion." , confusedWith: vsan-resilience }
    explanation:
