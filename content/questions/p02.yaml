  - id: p02-vm-001
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vm-management]
    objective: "2.2"
    objectiveItem: "2.2.3"
    lesson: vm-lifecycle-templates
    section: content-libraries
    stem: "An administrator tries to import an ISO into a content library and the Import item action is unavailable. What type of library is it most likely?"
    options:
      - { id: a, text: "A local library with publishing enabled", why: "Published libraries are local and accept new items." }
      - { id: b, text: "A subscribed library", correct: true, why: "Subscribers cannot upload or import items; only the publisher manages content." }
      - { id: c, text: "A local library without publishing", why: "Local libraries accept items." }
      - { id: d, text: "A library stored on vSAN", why: "Backing storage does not restrict imports." }
    explanation:
      correct: "Subscribed libraries are read-only copies of a published library."
      concept: "Content library types."
      trap: "Add the item to the publisher; subscribers sync it."
  - id: p02-vm-002
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [vm-management]
    objective: "2.2"
    objectiveItem: "2.2.3"
    lesson: vm-lifecycle-templates
    section: how-it-works
    stem: "VMs deployed from a Linux template all boot with the template's hostname even though a customization specification was selected. What is the most likely cause?"
    options:
      - { id: a, text: "VMware Tools (open-vm-tools) is not installed in the template", correct: true, why: "Guest customization runs through VMware Tools in the guest." }
      - { id: b, text: "The template's VM hardware version is too new", why: "That would block deployment on older hosts, not customization." }
      - { id: c, text: "The template is stored in a content library", why: "Library templates support customization as well." }
      - { id: d, text: "DRS is in manual mode", why: "DRS placement has nothing to do with guest customization.", confusedWith: drs }
    explanation:
      correct: "Customization specs are applied on first boot by VMware Tools; without it nothing changes."
      concept: "Guest customization requirements."
      trap: "Check Tools first, then the guest's customization log."
  - id: p02-vm-003
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [vm-management]
    objective: "2.2"
    objectiveItem: "2.2.4"
    lesson: vm-lifecycle-templates
    section: migration-types-vsphere-9-0
    stem: "A running VM must move from a host's local datastore on esx01 to esx02, which cannot see that datastore. No shared storage exists between them. Which migration achieves this without downtime?"
    options:
      - { id: a, text: "vMotion (change compute resource only)", why: "Compute-only vMotion requires storage visible to both hosts." }
      - { id: b, text: "Storage vMotion (change storage only)", why: "That would keep the VM on esx01." }
      - { id: c, text: "Change both compute resource and storage", correct: true, why: "Combined migration moves memory and disks together; no shared storage is needed." }
      - { id: d, text: "Cold migration", why: "Works, but requires powering off the VM." }
    explanation:
      correct: "A combined compute + storage migration moves a powered-on VM between hosts that share no storage."
      concept: "vSphere migration types."
      trap: "'vMotion needs shared storage' is only true for compute-only vMotion."
  - id: p02-vm-004
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [vm-management, vsphere-cluster]
    objective: "2.2"
    objectiveItem: "2.2.4"
    lesson: vm-lifecycle-templates
    section: evc
    stem: "A cluster of Intel Ice Lake hosts is being expanded with Intel Sapphire Rapids hosts. vMotion between old and new hosts must keep working. What should be configured?"
    options:
      - { id: a, text: "EVC on the cluster set to a baseline supported by all hosts (for example Ice Lake)", correct: true, why: "EVC masks CPU features to a common baseline so VMs can move across generations of the same vendor." }
      - { id: b, text: "DRS fully automated", why: "DRS cannot fix CPU incompatibility.", confusedWith: drs }
      - { id: c, text: "Upgrade all VM hardware versions", why: "Hardware version does not mask CPU features." }
      - { id: d, text: "Nothing; vMotion always works within one vendor", why: "Newer CPU features exposed to VMs can block migration to older hosts." }
    explanation:
      correct: "Set the cluster EVC mode to the oldest CPU generation present. vSphere 9.0 can also build custom EVC modes."
      concept: "EVC."
      trap: "EVC never enables Intel ↔ AMD vMotion."
  - id: p02-vm-005
    type: multi
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [vm-management]
    objective: "2.2"
    objectiveItem: "2.2.3"
    lesson: vm-lifecycle-templates
    section: content-libraries
    stem: "Which item types can be stored in a vSphere 9 content library? (Choose three.)"
    select: 3
    options:
      - { id: a, text: "OVF templates", correct: true, why: "Core library item type." }
      - { id: b, text: "VM templates", correct: true, why: "Supported since vSphere 7.0 U1, with check-out/check-in." }
      - { id: c, text: "ISO images", correct: true, why: "Libraries can store ISO and other files." }
      - { id: d, text: "Running VMs", why: "Libraries store templates and files, not running VMs." }
      - { id: e, text: "Distributed switch configurations", why: "Not a library item type.", confusedWith: vds }
    explanation:
      correct: "Content libraries hold OVF templates, VM templates, ISOs and other files."
      concept: "Content library contents."
      trap: "VM templates distribute across vCenters only when linked; use OVF templates otherwise."
  - id: p02-vm-006
    type: single
    kind: design
    difficulty: advanced
    version: vcf9
    topics: [vm-management, vcfa-tenancy]
    objective: "2.2"
    objectiveItem: "2.2.3"
    lesson: vm-lifecycle-templates
    section: real-world-scenario
    stem: "In VCF 9, two VI workload domains have separate vCenters and SSO domains (not linked). The platform team wants one set of golden images shared to both, with storage used at the subscriber only for images actually deployed. What is the best design?"
    options:
      - { id: a, text: "Publish OVF templates from a library in wld01 and subscribe from wld02 with 'download content when needed'", correct: true, why: "OVF templates distribute across unlinked vCenters; on-demand download saves subscriber space." }
      - { id: b, text: "Publish VM templates and subscribe with immediate download", why: "VM template distribution requires linked vCenters, and immediate download copies everything." }
      - { id: c, text: "Copy templates manually to each datastore with the datastore browser", why: "Works but has no versioning or sync." }
      - { id: d, text: "Join both vCenters in Enhanced Linked Mode", why: "Deprecated in vCenter 9.0 and contrary to the VCF 9 dedicated-SSO design.", confusedWith: vcenter }
    explanation:
      correct: "Published local library + subscribed library with on-demand download, using OVF templates for unlinked vCenters."
      concept: "Content library distribution design."
      trap: "VM templates vs OVF templates across vCenters."
  - id: p02-vm-007
    type: truefalse
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vm-management]
    objective: "2.2"
    objectiveItem: "2.2.4"
    lesson: vm-lifecycle-templates
    section: snapshots
    stem: "True or false: a VM snapshot is a suitable backup because it captures the VM's disk state."
    options:
      - { id: "true", text: "True", why: "Snapshots live on the same datastore and depend on the base disk; losing the datastore loses both." }
      - { id: "false", text: "False", correct: true, why: "Snapshots are short-term rollback points, not backups." }
    explanation:
      correct: "Snapshots redirect writes to delta disks that depend on the base disk. Keep them short-lived and use a real backup product."
      concept: "Snapshots versus backups."
      trap: "Lingering snapshots consume space and hurt performance."
  - id: p02-vm-008
    type: single
    kind: troubleshooting
    difficulty: expert
    version: vcf9
    topics: [vm-management, vds]
    objective: "2.2"
    objectiveItem: "2.2.4"
    lesson: vm-lifecycle-templates
    section: troubleshooting
    context: |
      vMotion between two hosts in the same cluster fails at about 20% with a timeout. Compatibility checks pass. Each host has
      a vMotion VMkernel adapter. The adapters were configured on different VLAN IDs by mistake.
    stem: "What is the root cause and the right verification?"
    options:
      - { id: a, text: "The vMotion VMkernel adapters cannot reach each other; verify with vmkping from the vMotion interface", correct: true, why: "vMotion data flows between vMotion vmk adapters; a VLAN mismatch breaks connectivity mid-migration." }
      - { id: b, text: "EVC is missing; enable EVC", why: "CPU compatibility issues fail the compatibility check up front, which passed." }
      - { id: c, text: "The VM has a CPU limit", why: "Limits don't stop migrations." }
      - { id: d, text: "HA admission control blocks the migration", why: "Admission control would refuse the migration at start, not time out at 20%.", confusedWith: vsphere-ha }
    explanation:
      correct: "A timeout during the memory copy usually means the vMotion network is broken (VLAN, IP, MTU). Test vmk-to-vmk with vmkping and fix the port group VLAN."
      concept: "vMotion network requirements (≥250 Mbps per concurrent vMotion, vMotion vmk on each host)."
      trap: "Compatibility checks validate configuration, not the data path."
  - id: p02-vm-009
    type: ordering
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [vm-management]
    objective: "2.2"
    objectiveItem: "2.2.3"
    lesson: vm-lifecycle-templates
    section: how-it-works
    stem: "Order the steps to produce consistent, uniquely named VMs from a golden image."
    items:
      - { id: s1, text: "Build and patch the golden VM and install VMware Tools" }
      - { id: s2, text: "Shut it down and clone or convert it to a template" }
      - { id: s3, text: "Create a VM customization specification" }
      - { id: s4, text: "Deploy a new VM from the template, selecting the customization specification" }
      - { id: s5, text: "On first boot, VMware Tools applies the hostname and network settings" }
    explanation:
      correct: "Golden VM → template → customization spec → deploy → customization runs in the guest."
      concept: "Template-based provisioning."
      trap: "Without VMware Tools in step 1, step 5 never happens."
