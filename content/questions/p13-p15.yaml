  - id: ts-svc-011
    type: single
    kind: troubleshooting
    difficulty: expert
    topics: [host-commissioning, vcf-ops-architecture]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: troubleshooting-vcf-services
    section: deep-dive
    context: |
      In a VCF 9.1 environment two hosts appear in the workload domain vCenter cluster and run VMs, but VCF Operations
      shows them blank or missing on the lifecycle page for the domain. They were added with vCenter's "Add Host" wizard
      during an urgent capacity request.
    stem: "What is the correct long-term fix?"
    options:
      - { id: a, text: "Remove the hosts from vCenter, reinstall ESX and commission them through the VCF workflow, then add them to the cluster", correct: true, why: "KB 427267: hosts added outside commissioning are not in the VCF inventory; the fix is proper commissioning." }
      - { id: b, text: "Restart VCF Operations so it discovers the hosts", why: "An inventory sync may refresh mappings, but hosts never commissioned remain outside VCF lifecycle." }
      - { id: c, text: "Add the hosts to a vSphere Lifecycle Manager baseline", why: "VCF uses image-based lifecycle and its own inventory; baselines do not commission hosts.", confusedWith: vlcm }
      - { id: d, text: "Edit the SDDC Manager database to insert the hosts", why: "Unsupported and dangerous." }
