    explanation:
      correct: "hostd = host agent (Host Client/API). vpxa = vCenter agent and heartbeat sender. Host Client OK + vCenter disconnected → vpxa/heartbeat path."
      concept: "hostd vs vpxa."
      architecture: "vCenter's vpxd talks to vpxa, which relays to hostd; vpxa sends UDP 902 heartbeats to vCenter."
      trap: "Restarting hostd because it is the more famous agent."

  - id: ts-svc-004
    type: single
    kind: concept
    difficulty: intermediate
    topics: [esx-host, vcenter]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: troubleshooting-vcf-services
    section: components
    stem: "According to Broadcom, how do ESX hosts prove liveness to vCenter, and when does vCenter mark a host Not Responding?"
    options:
      - { id: a, text: "UDP heartbeats to port 902 every 10 seconds; Not Responding after 60 seconds without heartbeats", correct: true, why: "Matches KB 323612 / KB 307364." }
      - { id: b, text: "TCP 443 keepalives every second; Not Responding after 3 seconds", why: "Not the documented mechanism." }
      - { id: c, text: "Datastore heartbeats every 5 seconds; Not Responding after 15 seconds", why: "Datastore heartbeats are a vSphere HA mechanism.", confusedWith: vsphere-ha }
      - { id: d, text: "ICMP pings from vCenter every 30 seconds", why: "vCenter does not use ICMP for host connection state." }
    explanation:
      correct: "vpxa sends UDP heartbeats on 902 every 10 s; vCenter allows a 60 s window."
      concept: "The host connection heartbeat."
      architecture: "Firewalls between host management networks and vCenter must allow UDP 902."
      trap: "Confusing vCenter heartbeats with HA network/datastore heartbeats."

  - id: ts-svc-005
    type: single
    kind: log
    difficulty: intermediate
    topics: [logs-locations, esx-host]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: troubleshooting-vcf-services
    section: deep-dive
    context: |
      ```log
      2026-10-03T10:01:12.004Z In(166) Vpxa[2100221]: [Originator@6876 sub=Heartbeat opID=HostSync-host-1012-4ff474ef-5c] Started heartbeating..
      2026-10-03T10:02:12.117Z In(166) Vpxa[2100221]: [Originator@6876 sub=Heartbeat opID=HostSync-host-1012-51a2c0d3-1e] Started heartbeating..
      2026-10-03T10:03:12.230Z In(166) Vpxa[2100221]: [Originator@6876 sub=Heartbeat opID=HostSync-host-1012-a83e9c71-04] Started heartbeating..
      ```
    stem: "What does this vpxa.log pattern most likely indicate, and what is the best next test?"
    options:
      - { id: a, text: "Heartbeats are not reaching vCenter; capture UDP 902 on the host uplink and on vCenter", correct: true, why: "Repeated restarts every minute are the KB 323612 signature; a two-ended capture locates the loss." }
      - { id: b, text: "vpxa is upgrading itself; wait for it to finish", why: "No upgrade is indicated." }
      - { id: c, text: "hostd crashed; restart hostd", why: "The log is vpxa's heartbeat, not a hostd failure.", confusedWith: esx-host }
      - { id: d, text: "DNS is failing; recreate the A record", why: "DNS failures do not produce a one-minute heartbeat restart cycle.", confusedWith: dns }
    explanation:
      correct: "vpxa restarts heartbeating whenever vCenter drops and reconnects the host; the usual cause is UDP 902 being blocked or lost."
      concept: "Log interpretation for host disconnects."
      architecture: "pktcap-uw on the host uplink + tcpdump on vCenter show where packets disappear."
      trap: "Treating the agent as broken when the path is."

  - id: ts-svc-006
    type: single
    kind: log
    difficulty: expert
    topics: [lcm-concepts, workload-domains, logs-locations]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: troubleshooting-vcf-services
    section: deep-dive
    context: |
      Workload domain creation fails with "Failed to validate domain spec". domainmanager.log shows:
      ```log
      Failed to get install image for component VCENTER, version 9.0.2.0.25148086
      Failed to get install image for component NSX_T_MANAGER, version 9.0.2.0.25150386
      ```
      The offline depot connection test reports "Depot Unknown Error" on port 80.
    stem: "Which remediation matches Broadcom's guidance?"
    options:
      - { id: a, text: "Seed the depot with the required binaries, set the depot port to 443 in Fleet Management > Lifecycle > Depot Settings, download the bundles, then retry", correct: true, why: "Matches KB 439546: missing binaries plus wrong depot port." }
      - { id: b, text: "Redeploy the management vCenter", why: "The management vCenter is not the problem; binaries for the new domain are missing." }
      - { id: c, text: "Reduce the workload domain to two hosts", why: "Host count is unrelated to missing install images.", confusedWith: workload-domains }
      - { id: d, text: "Restart all SDDC Manager services and retry immediately", why: "Retrying without the binaries fails again." }
    explanation:
      correct: "The domain manager needs install images for the target versions; they must be in the depot, reachable on the correct port, and downloaded before the retry."
      concept: "Workflow failure → executor log → missing dependency."
      architecture: "VCF Operations fleet management lifecycle settings define the depot; SDDC Manager services consume the binaries."
      trap: "Seeing a validation error and assuming the spec values are wrong."

