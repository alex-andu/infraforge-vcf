      trap: "A host that works in vCenter is not necessarily a VCF-managed host."

  # ---------------------------------------------------------------- network / NSX / vSAN
  - id: ts-net-001
    type: cli
    kind: command
    difficulty: intermediate
    topics: [mtu, vsan-health]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: troubleshooting-network-nsx-vsan
    section: deep-dive
    stem: "From an ESX host, type the vmkping command that tests a 9000-byte MTU path without fragmentation from vmk2 to 10.10.30.102."
    answers:
      - "vmkping -I vmk2 -d -s 8972 10.10.30.102"
      - "vmkping -d -s 8972 -I vmk2 10.10.30.102"
      - "vmkping -I vmk2 -s 8972 -d 10.10.30.102"
    placeholder: "vmkping ..."
    explanation:
      correct: "vmkping -I vmk2 -d -s 8972 10.10.30.102: -d forbids fragmentation, -s 8972 = 9000 − 28 bytes of IP/ICMP headers."
      concept: "MTU testing."
      architecture: "Choose the vmknic of the traffic type you are testing (vSAN, vMotion) with -I."
      trap: "Using -s 9000 (too big) or forgetting -d (fragmentation makes it 'pass')."

  - id: ts-net-002
    type: single
    kind: troubleshooting
    difficulty: intermediate
    topics: [mtu, nsx-segments]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: troubleshooting-network-nsx-vsan
    section: deep-dive
    context: |
      VMs on an overlay segment on different hosts can ping each other and open SSH sessions, but web pages and file
      copies between them hang. From host A: `vmkping ++netstack=vxlan -d -s 1472 <TEP-B>` succeeds;
      `vmkping ++netstack=vxlan -d -s 1572 <TEP-B>` fails.
    stem: "What is the most likely cause?"
    options:
      - { id: a, text: "A hop between the TEPs has an MTU below the 1600 bytes NSX overlay needs", correct: true, why: "1472 works, 1572 fails: the path supports 1500 but not the Geneve overhead." }
      - { id: b, text: "The TEP VLAN is missing on the switch", why: "Then even the 1472-byte test would fail.", confusedWith: l2-l3 }
      - { id: c, text: "A distributed firewall rule blocks HTTP", why: "DFW would not cause the TEP vmkping difference.", confusedWith: nsx-security }
      - { id: d, text: "The Tier-0 BGP session is down", why: "East-west traffic on one segment does not traverse the Tier-0.", confusedWith: nsx-routing }
    explanation:
      correct: "Small packets fit, encapsulated large ones do not. Raise MTU on the offending hop (switch port, inter-switch link, router)."
      concept: "MTU symptoms are hangs, not hard failures."
      architecture: "Geneve adds headers; NSX requires at least 1600 bytes on the underlay, many designs use 9000."
      trap: "Blaming the application or firewall because 'ping works'."

  - id: ts-net-003
    type: single
    kind: command
    difficulty: advanced
    topics: [nsx-transport]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: troubleshooting-network-nsx-vsan
    section: cli-api
    stem: "Why does an administrator use `++netstack=vxlan` when testing TEP-to-TEP connectivity with vmkping?"
    options:
      - { id: a, text: "Because NSX TEP vmknics live in a separate TCP/IP stack, so the test must be sent from that stack", correct: true, why: "Without it, vmkping uses the default stack and may test the wrong interface or route." }
      - { id: b, text: "Because NSX uses VXLAN encapsulation in VCF 9", why: "NSX uses Geneve; the netstack name is historical.", confusedWith: nsx-segments }
      - { id: c, text: "To force jumbo frames", why: "Packet size is controlled by -s and -d." }
      - { id: d, text: "To bypass the distributed firewall", why: "vmkping from the TEP stack is not about DFW." }
    explanation:
      correct: "TEPs use their own netstack; ++netstack=vxlan sends from it."
      concept: "VMkernel TCP/IP stacks."
      trap: "Reading 'vxlan' as the encapsulation protocol; NSX overlay uses Geneve."

  - id: ts-net-004
    type: matching
    kind: concept
    difficulty: advanced
    topics: [vsan-health, vsan-resilience]
    objective: "2.3"
    objectiveItem: "2.3.5"
    lesson: troubleshooting-network-nsx-vsan
    section: deep-dive
    stem: "Match each vSAN condition with its meaning."
    pairs:
      - { id: p1, left: "Network partition", right: "Hosts cannot reach each other over the vSAN network and form more than one group" }
      - { id: p2, left: "Reduced availability / degraded object", right: "A component is missing but the object is still accessible and can be rebuilt" }
      - { id: p3, left: "Inaccessible object", right: "Not enough components are available to satisfy the policy; data cannot be accessed" }
    explanation:
      correct: "Partition = network; degraded = still accessible, rebuildable; inaccessible = policy cannot be satisfied with what is reachable."
      concept: "vSAN health states."
      architecture: "Check membership with esxcli vsan cluster get and the vSAN vmknic with esxcli vsan network list."
      trap: "Rebooting more hosts while objects are inaccessible makes it worse."

  - id: ts-net-005
    type: single
    kind: troubleshooting
    difficulty: intermediate
    topics: [nsx-routing, nsx-edge]
    objective: "2.4"
    objectiveItem: "2.4.3"
    lesson: troubleshooting-network-nsx-vsan
    section: how-it-works
    context: |
      Overlay VMs connected to a Tier-1 gateway can reach each other and the Tier-1's interfaces, but nothing outside.
      The Tier-0 BGP sessions with the physical routers are Established. The physical router has no routes for the
      overlay subnets.
    stem: "What should be checked first?"
    options:
      - { id: a, text: "Route advertisement of connected segments on the Tier-1 (and redistribution on the Tier-0)", correct: true, why: "If the overlay subnets are not advertised up and redistributed into BGP, the router never learns them." }
      - { id: b, text: "MTU on the host TEP VLAN", why: "East-west works; the missing routes on the router point to advertisement.", confusedWith: mtu }
      - { id: c, text: "The NSX Manager cluster status", why: "Management plane health does not explain a missing route on an established BGP session.", confusedWith: nsx-architecture }
      - { id: d, text: "vSAN health", why: "Unrelated.", confusedWith: vsan-health }
    explanation:
      correct: "North-south needs Tier-1 route advertisement, Tier-0 redistribution into BGP and BGP sessions; here only the first two can explain the evidence."
      concept: "Routing chain from segment to physical router."
      architecture: "Tier-1 DR on hosts, Tier-0 SR on edges peering with the physical network."
      trap: "An established BGP session does not mean the right prefixes are advertised."

  - id: ts-net-006
    type: ordering
    kind: troubleshooting
    difficulty: intermediate
    topics: [troubleshooting-method, mtu, l2-l3]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: troubleshooting-network-nsx-vsan
    section: troubleshooting
    stem: "Order these data-path checks bottom-up for 'VMs on different hosts cannot communicate'."
    items:
      - { id: a, text: "Physical link up and correct VLAN trunked on every host port" }
      - { id: b, text: "IP addressing and reachability of the vmknic/TEP (vmkping -s 1472)" }
      - { id: c, text: "MTU end-to-end (vmkping -d -s 1572 / 8972)" }
      - { id: d, text: "NSX tunnel and segment realization status" }
      - { id: e, text: "Distributed firewall rules for the flow" }
      - { id: f, text: "Application test with real payload sizes" }
    explanation:
      correct: "Link/VLAN → IP → MTU → overlay state → security policy → application."
      concept: "Bottom-up walk with a proof at each layer."
      trap: "Starting with the application or the firewall before proving the underlay."

  - id: ts-net-007
    type: single
    kind: scenario
    difficulty: expert
    topics: [mtu, vsan-health, nsx-transport]
    objective: "2.3"
    objectiveItem: "2.3.5"
    lesson: troubleshooting-network-nsx-vsan
    section: real-world-scenario
    context: |
      After a switch replacement, all hosts report vSAN network health warnings and NSX tunnels down. The vSphere Client
      and SSH to hosts work. Management uses MTU 1500; vSAN and TEP networks use 9000. `vmkping -I vmk2 -d -s 1472`
      succeeds between hosts; `-s 8972` fails.
    stem: "Which action resolves the root cause?"
    options:
      - { id: a, text: "Enable jumbo frames (≥9000, e.g. 9216) on the new switch ports carrying vSAN and TEP VLANs", correct: true, why: "Exactly the traffic types at 9000 fail; 1472 works, 8972 fails: the new switch is at 1500." }
      - { id: b, text: "Lower the vSAN vmknic MTU to 1500 on every host and the TEP MTU to 1500", why: "TEP needs ≥1600; lowering everything breaks NSX and only hides the switch misconfiguration.", confusedWith: nsx-transport }
      - { id: c, text: "Restart the vSAN health service on vCenter", why: "The health service correctly reports a real network problem.", confusedWith: vsan-health }
      - { id: d, text: "Recreate the NSX transport node profile", why: "Configuration on hosts did not change; the switch did." }
    explanation:
      correct: "The split between working (1500) and failing (9000) traffic types plus the vmkping sizes points to the new switch's MTU."
      concept: "Scoping by traffic type and test size."
      architecture: "MTU must be consistent on every hop: switch, Proxmox/VDS, vmknic, TEP."
      trap: "Lowering host MTUs instead of fixing the fabric."

  - id: ts-net-008
    type: single
    kind: command
    difficulty: advanced
    topics: [vsan-health]
    objective: "2.3"
    objectiveItem: "2.3.5"
    lesson: troubleshooting-network-nsx-vsan
    section: cli-api
    context: |
      On esx-03: `esxcli vsan cluster get` shows `Sub-Cluster Member Count: 1` while the other two hosts show 2.
    stem: "Which command on esx-03 is the most useful next check?"
    options:
      - { id: a, text: "esxcli vsan network list", correct: true, why: "Shows whether a vmknic is configured/tagged for vSAN traffic on that host — a common cause of a single-host partition." }
      - { id: b, text: "esxcli system version get", why: "Version mismatch is possible but far less likely and not the first test." }
      - { id: c, text: "esxcli hardware cpu list", why: "CPU inventory does not explain a partition." }
      - { id: d, text: "services.sh restart", why: "Explicitly discouraged on vSAN hosts (KB 320280) and not a check." }
    explanation:
      correct: "A host alone in its partition → verify its vSAN vmknic (esxcli vsan network list), then vmkping -I <vsan-vmk> -d to peers."
      concept: "vSAN partition diagnosis."
      architecture: "vSAN membership communication uses the vSAN-tagged vmknic."
      trap: "Jumping to disruptive restarts."

