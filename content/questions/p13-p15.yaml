      Host esx-05 shows Not Responding in vCenter. The VMware Host Client at https://esx-05/ui works, VMs are running and
      can be managed locally.
    stem: "Which component is the most likely focus?"
    options:
      - { id: a, text: "vpxa or the heartbeat path between the host and vCenter", correct: true, why: "hostd works (Host Client), so the vCenter relationship (vpxa, UDP 902 heartbeat) is the suspect." }
      - { id: b, text: "hostd", why: "A hung hostd would also break the Host Client.", confusedWith: esx-host }
      - { id: c, text: "The VMkernel storage stack", why: "VMs run and are manageable; no storage symptom." }
