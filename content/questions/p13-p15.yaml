questions:
  # ---------------------------------------------------------------- methodology
  - id: ts-method-001
    type: ordering
    kind: troubleshooting
    difficulty: foundation
    version: general
    topics: [troubleshooting-method]
    objective: "4.3"
    objectiveItem: "4.3.8"
    lesson: troubleshooting-methodology
    section: concept
    stem: "Put the steps of the troubleshooting method used in this course in the correct order."
    items:
      - { id: a, text: "Observe – write a precise, timestamped symptom statement" }
      - { id: b, text: "Scope – determine breadth, plane and timing (blast radius)" }
      - { id: c, text: "Hypothesize – list and rank possible causes" }
      - { id: d, text: "Validate – run discriminating tests to confirm one cause" }
      - { id: e, text: "Remediate – apply the smallest safe change" }
      - { id: f, text: "Verify – re-test the original symptom through the original path" }
    explanation:
      correct: "Observe → Scope → Hypothesize → Validate → Remediate → Verify. Each step produces an output the next one needs: you cannot rank hypotheses before you know the scope, and you must not remediate before a cause is validated."
      concept: "A repeatable method replaces guessing and restarting."
      architecture: "Scoping maps the symptom onto the VCF layers (physical, host, cluster, domain, instance, fleet) before any change."
      trap: "Remediating straight after Observe (reboot, restart) destroys evidence and rarely fixes the cause."
    diagnostic: troubleshooting

  - id: ts-method-002
    type: single
    kind: scenario
    difficulty: foundation
    topics: [troubleshooting-method]
    objective: "4.3"
    objectiveItem: "4.3.8"
    lesson: troubleshooting-methodology
    section: architecture
    context: |
      At 03:00 UTC VCF Operations starts raising alerts for vCenter collection, the NSX Manager adapter and the SDDC
      Manager integration at the same time. VMs keep running. Nobody changed any VCF component.
    stem: "Which area should the administrator investigate first?"
    options:
      - { id: a, text: "Restart the VCF Operations cluster", why: "VCF Operations is reporting the failures; restarting it changes nothing about the integrations and destroys evidence.", confusedWith: vcf-ops-architecture }
      - { id: b, text: "Shared dependencies such as NTP, DNS, certificates or the identity source", correct: true, why: "Many unrelated components failing at the same minute is the classic signature of a shared dependency underneath them." }
      - { id: c, text: "The NSX Manager cluster health", why: "NSX is only one of several failing integrations; it cannot explain the vCenter and SDDC Manager failures." }
      - { id: d, text: "The vSAN object health of the management cluster", why: "VMs run normally and the symptoms are integration/authentication failures, not storage." , confusedWith: vsan-health }
    explanation:
      correct: "When several components fail at the same moment without a change to them, look down the stack at what they all depend on: time, name resolution, trust and identity."
      concept: "Scoping by breadth and time points to the lowest unhealthy layer."
      architecture: "DNS, NTP, the CA and the identity provider are external services every VCF component relies on."
      trap: "The UI that shows the alerts (VCF Operations) is rarely the component that is broken."
    diagnostic: troubleshooting

  - id: ts-method-003
    type: single
    kind: troubleshooting
    difficulty: intermediate
    topics: [troubleshooting-method, esx-host]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: troubleshooting-methodology
    section: troubleshooting
    context: |
      An ESX host in a vSAN cluster with NSX shows Not Responding in vCenter. A colleague proposes running
      `services.sh restart` on the host "to restart all management agents".
    stem: "What is the best response?"
    options:
      - { id: a, text: "Agree; services.sh restart is the standard non-disruptive fix", why: "Broadcom KB 320280 warns against services.sh restart on hosts using vSAN, NSX, LACP or shared graphics." }
      - { id: b, text: "First gather evidence; if an agent restart is justified, restart only hostd and/or vpxa with /etc/init.d/<agent> restart", correct: true, why: "Evidence first, and the targeted restart avoids the side effects of restarting every service on a vSAN/NSX host." }
      - { id: c, text: "Reboot the host immediately", why: "Disruptive (vSAN data, running VMs) and skips diagnosis; VMs on a Not Responding host are usually still running.", confusedWith: vsphere-ha }
      - { id: d, text: "Remove the host from vCenter and add it again", why: "Disruptive in VCF (vSAN, NSX, inventory) and does not address an unknown cause." }
    explanation:
      correct: "Collect evidence (vpxa.log, Host Client reachability, heartbeat captures) and, when an agent is at fault, restart only that agent."
      concept: "Smallest safe change; know which actions are explicitly discouraged."
      architecture: "hostd is the host agent, vpxa the vCenter agent; services.sh restarts far more, including services vSAN and NSX depend on."
      trap: "'Restart all agents' sounds harmless; on VCF hosts it is the wrong reflex."

  - id: ts-method-004
    type: multi
    select: 3
    kind: concept
    difficulty: intermediate
    topics: [health-diagnostics, troubleshooting-method]
    objective: "4.3"
    objectiveItem: "4.3.8"
    lesson: troubleshooting-methodology
    section: components
    stem: "Which areas does VCF Health in VCF Operations diagnostics summarise? (Choose three.)"
    options:
      - { id: a, text: "Certificates health", correct: true, why: "Certificates health is one of the VCF Health cards." }
      - { id: b, text: "NTP and DNS health", correct: true, why: "VCF Health has an NTP and DNS card to catch time drift and reverse lookup failures." }
      - { id: c, text: "vSphere vMotion health", correct: true, why: "vMotion health identifies root causes of vMotion failures." }
      - { id: d, text: "Physical switch firmware compliance", why: "Not one of the documented VCF Health areas.", confusedWith: compliance-drift }
      - { id: e, text: "VCF Automation blueprint versioning", why: "Not a VCF Health card; unrelated to diagnostics.", confusedWith: vcf-automation }
    explanation:
      correct: "The documented VCF Health areas are Certificates, NTP and DNS, vCenter, Virtual Machine operations, vSphere vMotion and Virtual Machine snapshots."
      concept: "VCF Health gives the Observe/Scope view of the stack."
      architecture: "Part of VCF Operations diagnostics, alongside Diagnostics Findings and Log Assist."
      trap: "Do not confuse VCF Health with compliance/drift features, which are separate VCF Operations capabilities."

  - id: ts-method-005
    type: single
    kind: concept
    difficulty: intermediate
    topics: [health-diagnostics, logs-locations]
    objective: "4.3"
    objectiveItem: "4.3.8"
    lesson: troubleshooting-methodology
    section: components
    stem: "An administrator wants to send log bundles from vCenter, ESX, SDDC Manager and NSX to Broadcom Support for an open case, including the currently active diagnostic findings, without using an FTP client. Which feature should be used?"
    options:
      - { id: a, text: "Log Assist in VCF Operations diagnostics", correct: true, why: "Log Assist generates bundles for these components, adds active findings and uploads them without external FTP clients." }
      - { id: b, text: "The Troubleshooting Workbench", why: "The Workbench investigates objects and alerts over a time range; it does not upload bundles." }
      - { id: c, text: "VCF Operations for logs dashboards", why: "Central log search, not support-bundle generation and upload.", confusedWith: vcf-ops-logs }
      - { id: d, text: "The sos utility on each ESX host", why: "sos runs on SDDC Manager/VCF Installer, not on ESX hosts, and does not cover all listed components." }
    explanation:
      correct: "Log Assist is reached from the Diagnostics Findings tab and supports VCF Operations, vCenter, ESX, SDDC Manager, NSX, VCF Operations for logs and fleet management."
      concept: "Preserve and share evidence with the documented tool."
      architecture: "Bundles are collected through the VCF Operations collector; Log Assist validates connectivity to the collector, the component and the support portal first."
      trap: "sos is real but SDDC Manager/installer specific."

  - id: ts-method-006
    type: single
    kind: scenario
    difficulty: intermediate
    topics: [troubleshooting-method]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: troubleshooting-methodology
    section: deep-dive
    context: |
      Host commissioning failed for esx-07. You corrected the stale PTR record for its IP on the DNS server, and
      `nslookup 10.10.10.107` from SDDC Manager now returns esx-07.vcf.lab.
    stem: "What completes the Verify step?"
    options:
      - { id: a, text: "Close the ticket because the lookup now succeeds", why: "The lookup proves the fix to the dependency, not that the original workflow succeeds." }
      - { id: b, text: "Retry the commissioning validation for esx-07 from the vCenter workflow and confirm it passes, then document the root cause", correct: true, why: "Verification re-tests the original symptom through the original path and records the result." }
      - { id: c, text: "Reboot SDDC Manager to clear its DNS cache", why: "An unnecessary disruptive step; the lookup already shows the correct answer." }
      - { id: d, text: "Run a full sos bundle and send it to support", why: "Evidence collection belongs before remediation; it does not verify the fix." }
    explanation:
      correct: "Verify = repeat the original action (commissioning validation in vCenter's Unassigned Hosts workflow) and confirm no new alarms, then write symptom, scope, cause, fix and prevention."
      concept: "Verification against the original symptom path."
      architecture: "In VCF 9.0, commissioning starts in vCenter (Global Inventory List > Hosts > Unassigned Hosts)."
      trap: "A healthy dependency is necessary, not sufficient."

  - id: ts-method-007
    type: truefalse
    kind: concept
    difficulty: foundation
    topics: [nsx-architecture, troubleshooting-method]
    objective: "2.4"
    objectiveItem: "2.4.1"
    lesson: troubleshooting-methodology
    section: deep-dive
    stem: "True or false: if the NSX Manager cluster becomes unavailable, all overlay traffic between running VMs stops immediately."
    options:
      - { id: t, text: "True", why: "NSX Manager is management and control plane; established forwarding state lives on the transport nodes.", confusedWith: nsx-architecture }
      - { id: f, text: "False", correct: true, why: "Data-plane forwarding on ESX transport nodes and edges continues; configuration changes and new control-plane updates are what stop." }
    explanation:
      correct: "False. A management/control-plane outage stops changes, not existing data-plane forwarding."
      concept: "Separate management, control and data planes when scoping."
      architecture: "Distributed routing and firewalling run in the kernel of each transport node."
      trap: "Treating a management-plane outage as a workload outage leads to panicked, disruptive actions."

  - id: ts-method-008
    type: single
    kind: concept
    difficulty: foundation
    topics: [troubleshooting-method]
    objective: "4.3"
    objectiveItem: "4.3.8"
    lesson: troubleshooting-methodology
    section: concept
    stem: "Which statement is a root cause rather than a symptom?"
    options:
      - { id: a, text: "esx-04 shows Not Responding in vCenter", why: "That is what is observed, not why it happens." }
      - { id: b, text: "A new firewall rule pushed at 14:02 drops UDP 902 heartbeats from esx-04 to vCenter", correct: true, why: "Names the mechanism (heartbeats dropped) and the trigger (firewall change)." }
      - { id: c, text: "The vSphere Client is slow", why: "A symptom, and a vague one." }
      - { id: d, text: "vpxa.log contains repeated 'Started heartbeating' lines", why: "Evidence supporting a hypothesis, not the cause itself." }
    explanation:
      correct: "A root cause statement explains the mechanism and the trigger so both the fix and prevention are obvious."
      concept: "Symptom vs evidence vs cause vs trigger."
      trap: "Log lines are evidence; do not stop at quoting them."

  - id: ts-method-009
    type: single
    kind: concept
    difficulty: intermediate
    topics: [health-diagnostics]
    objective: "4.3"
    objectiveItem: "4.3.8"
    lesson: troubleshooting-methodology
    section: components
    stem: "Where is the Troubleshooting Workbench opened in VCF Operations 9.0?"
    options:
      - { id: a, text: "Infrastructure Operations > Troubleshooting Workbench", correct: true, why: "This is the documented menu path." }
      - { id: b, text: "Fleet Management > Lifecycle > Troubleshooting", why: "Fleet Management Lifecycle handles upgrades, depots and backups.", confusedWith: fleet-management }
      - { id: c, text: "The SDDC Manager UI > Developer Center", why: "Not where the Workbench lives." }
      - { id: d, text: "vCenter > Monitor > Troubleshooting Workbench", why: "The Workbench is a VCF Operations feature, not a vCenter tab.", confusedWith: vcenter }
    explanation:
      correct: "Infrastructure Operations > Troubleshooting Workbench. Sessions do not persist after logout; they reappear under Recent Searches."
      concept: "Investigation of an object or alert with adjustable scope and time range."
      trap: "Fleet Management is the lifecycle/certificates/passwords area, not troubleshooting."

  - id: ts-method-010
    type: single
    kind: troubleshooting
    difficulty: advanced
    topics: [troubleshooting-method, logs-locations]
    objective: "4.3"
    objectiveItem: "4.3.7"
    lesson: troubleshooting-methodology
    section: failure-scenarios
    context: |
      A workload domain task fails at the same step on every retry. The domain manager log contains hundreds of ERROR
      lines from several services in the ten minutes before the failure.
    stem: "Which approach is most effective?"
    options:
      - { id: a, text: "Retry the task until it succeeds", why: "Retries without a fix just add noise to the log." }
      - { id: b, text: "Start at the failure timestamp and search backwards for the first error related to the failed step, then check that error's dependency", correct: true, why: "Cascading failures produce many secondary errors; the first one is closest to the cause." }
      - { id: c, text: "Read the last ERROR line in the file and fix that", why: "The last line is usually a consequence (e.g. task rollback), not the cause." }
      - { id: d, text: "Redeploy SDDC Manager", why: "A massive change with no validated cause." }
    explanation:
      correct: "First relevant error at the failure time, then validate its dependency (DNS, NTP, credentials, depot)."
      concept: "Reading logs efficiently during Validate."
      architecture: "In VCF 9, domain workflows are executed by SDDC Manager services logging to /var/log/vmware/vcf/domainmanager/domainmanager.log."
      trap: "The noisiest error is not necessarily the root cause."

  # ---------------------------------------------------------------- core dependencies
  - id: ts-deps-001
    type: single
    kind: troubleshooting
    difficulty: foundation
    topics: [dns, host-commissioning]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: troubleshooting-core-dependencies
    section: deep-dive
    context: |
      Commissioning validation fails for one new host only. From SDDC Manager:
      ```shell
      $ nslookup esx-07.vcf.lab
      Address: 10.10.10.107
      $ nslookup 10.10.10.107
      ** server can't find 107.10.10.10.in-addr.arpa: NXDOMAIN
      ```
    stem: "What is the most likely cause?"
    options:
      - { id: a, text: "Missing PTR (reverse) record for the host's IP", correct: true, why: "Forward lookup works, reverse fails with NXDOMAIN: the reverse record is missing." }
      - { id: b, text: "The host's NTP server is unreachable", why: "Nothing in the evidence concerns time.", confusedWith: ntp }
      - { id: c, text: "The host certificate has expired", why: "Certificates are not involved in an NXDOMAIN answer.", confusedWith: certificates }
      - { id: d, text: "The forward A record is wrong", why: "The forward lookup returns the expected IP." }
    explanation:
      correct: "VCF validations require forward and reverse records that agree. NXDOMAIN on the reverse lookup proves the PTR is missing."
      concept: "Forward + reverse DNS as a hard dependency."
      architecture: "Run the test from the component that validates (SDDC Manager / installer), not from a laptop."
      trap: "A working forward lookup tempts you to declare DNS healthy."
    diagnostic: troubleshooting

  - id: ts-deps-002
    type: single
    kind: log
    difficulty: intermediate
    topics: [ntp, certificates]
    objective: "4.2"
    objectiveItem: "4.2.4"
    lesson: troubleshooting-core-dependencies
    section: deep-dive
    context: |
      ```log
      ERROR ... SSLHandshakeException: certificate not yet valid (notBefore: 2026-10-03T10:00:00Z)
      ```
      The certificate was issued ten minutes ago. `date -u` on the calling appliance shows 2026-10-03T09:52:10Z.
    stem: "What should be fixed?"
    options:
      - { id: a, text: "Reissue the certificate with a longer validity period", why: "Validity length is irrelevant; the client thinks it is earlier than notBefore.", confusedWith: certificates }
      - { id: b, text: "The time source of the calling appliance (NTP), so its clock matches the rest of the environment", correct: true, why: "The client clock is behind; the certificate is fine." }
      - { id: c, text: "Add the CA to the trust store", why: "An untrusted issuer gives a path-building error, not 'not yet valid'." }
      - { id: d, text: "Replace the certificate SAN with the IP address", why: "Name mismatch produces a hostname verification error." }
    explanation:
      correct: "'Not yet valid' with a recently issued certificate means the client's clock is behind. Fix NTP at the source and let the client resync."
      concept: "Time skew masquerades as certificate errors."
      architecture: "TLS validity checks and SSO tokens both rely on synchronized time."
      trap: "Reading 'certificate' in the error and debugging PKI."

  - id: ts-deps-003
    type: ordering
    kind: troubleshooting
    difficulty: intermediate
    topics: [dns, ntp, certificates, identity-sso]
    objective: "4.2"
    objectiveItem: "4.2.2"
    lesson: troubleshooting-core-dependencies
    section: how-it-works
    stem: "An integration between two VCF components fails with a generic connection error. Order the checks from first to last as recommended in this course."
    items:
      - { id: a, text: "Forward and reverse DNS from the complaining component" }
      - { id: b, text: "Time on both ends (NTP)" }
      - { id: c, text: "Certificate presented by the target (validity, SAN, issuer trust)" }
      - { id: d, text: "Authentication / identity source" }
      - { id: e, text: "Service status and service logs" }
      - { id: f, text: "Retry the workflow and verify" }
    explanation:
      correct: "DNS → NTP → certificates → identity → services → workflow. Each later check depends on the earlier ones being healthy."
      concept: "The dependency chain."
      architecture: "Components call each other by FQDN over TLS with time-bound tokens."
      trap: "Starting with service logs: when a dependency is broken every service logs errors."

  - id: ts-deps-004
    type: single
    kind: scenario
    difficulty: intermediate
    topics: [identity-sso]
    objective: "4.2"
    objectiveItem: "4.2.2"
    lesson: troubleshooting-core-dependencies
    section: deep-dive
    context: |
      Users from the corporate directory cannot log in to vCenter or VCF Operations. The local administrator account of
      vCenter logs in normally. Time is synchronized everywhere.
    stem: "Where should the investigation focus next?"
    options:
      - { id: a, text: "Reachability and health of the identity source used by the VCF Identity Broker", correct: true, why: "Local accounts working while directory users fail scopes the problem to the external identity path." }
      - { id: b, text: "vSAN health of the management cluster", why: "Storage problems would not spare local logins.", confusedWith: vsan-health }
      - { id: c, text: "Regenerating all machine certificates", why: "No evidence of certificate issues; a disruptive guess.", confusedWith: certificates }
      - { id: d, text: "Rebuilding the NSX Manager cluster", why: "Unrelated to authentication." }
    explanation:
      correct: "A local account is a quick scoping test: if it works, vCenter and the UI are fine and the identity source (or path to it) is the suspect."
      concept: "Scoping identity failures."
      architecture: "VCF SSO is provided by the VCF Identity Broker (embedded in vCenter or as an appliance) federated with an identity source."
      trap: "Assuming the broker is down without testing a local account."

  - id: ts-deps-005
    type: matching
    kind: architecture
    difficulty: intermediate
    topics: [identity-sso]
    objective: "4.2"
    objectiveItem: "4.2.2"
    lesson: troubleshooting-core-dependencies
    section: architecture
    stem: "Match each VCF Identity Broker model with its characteristic."
    pairs:
      - { id: p1, left: "Embedded model", right: "Runs as part of vCenter; availability through vSphere HA; no extra appliance" }
      - { id: p2, left: "Appliance model", right: "Three-node cluster that tolerates an ESX host failure, at extra resource cost" }
      - { id: p3, left: "Moving from embedded to external broker", right: "Requires an SSO reset" }
    explanation:
      correct: "Embedded = inside vCenter, protected by vSphere HA; appliance = three-node cluster; switching from embedded to external requires an SSO reset."
      concept: "Identity broker deployment models."
      architecture: "Placement can be fleet-wide, cross-instance or per instance, trading unified SSO against blast radius."
      trap: "Thinking the embedded broker is more resilient because it has no extra appliance."

  - id: ts-deps-006
    type: single
    kind: concept
    difficulty: intermediate
    topics: [dns, ntp]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: troubleshooting-core-dependencies
    section: configuration
    stem: "In VCF 9.0, where does an administrator change the DNS and NTP servers used by a VCF instance?"
    options:
      - { id: a, text: "VCF Operations: Inventory > VCF Instance > Actions > Manage VCF Instance Settings > Network Settings", correct: true, why: "Documented VCF 9.0 location (moved from SDDC Manager)." }
      - { id: b, text: "SDDC Manager UI: Administration > Network Settings", why: "That is the VCF 5.x location.", confusedWith: sddc-manager }
      - { id: c, text: "vCenter: Global Inventory List > Hosts > Network Pools", why: "Network pools are configured there, not DNS/NTP.", confusedWith: host-commissioning }
      - { id: d, text: "NSX Manager: System > Settings > DNS", why: "Not the VCF instance-wide setting." }
    explanation:
      correct: "VCF 9.0 moved instance DNS/NTP settings to VCF Operations (Manage VCF Instance Settings > Network Settings)."
      concept: "Day-2 workflow locations in VCF 9."
      architecture: "VCF Operations orchestrates; SDDC Manager services still execute behind the scenes."
      trap: "Answering with the VCF 5.x SDDC Manager path."

  - id: ts-deps-007
    type: single
    kind: log
    difficulty: advanced
    topics: [vcf-installer, dns, deployment-validation]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: troubleshooting-core-dependencies
    section: deep-dive
    context: |
      VCF Installer specification validation fails. In /var/log/vmware/vcf/domainmanager/domainmanager.log:
      ```log
      SSH: Failed to establish SSH session to sddcm01.vcf.lab Auth fail
      ```
      During OVA deployment the "DNS Domain Name" field was set to `sddcm01.vcf.lab` and "Host Name" to `sddcm01.vcf.lab`.
    stem: "What is the documented resolution?"
    options:
      - { id: a, text: "Redeploy the VCF Installer with DNS Domain Name = vcf.lab (domain only) and Host Name = the FQDN; optionally export and reuse the JSON spec", correct: true, why: "Matches Broadcom KB 418890: the domain field must contain only the domain name." }
      - { id: b, text: "Reset the vcf user's password on the installer", why: "The auth failure is a consequence of the naming input, not a wrong password." }
      - { id: c, text: "Enable root SSH login on all ESX hosts", why: "The failing SSH session is to the installer itself, not to hosts." }
      - { id: d, text: "Add a second DNS server to the spec", why: "DNS server redundancy does not change the misconfigured domain field." }
    explanation:
      correct: "KB 418890: power off, deploy a new installer with the domain name only in 'DNS Domain Name' (FQDN in 'Host Name'), and continue — the previous IP can be reused and the JSON spec can be imported."
      concept: "Naming inputs are dependency inputs."
      architecture: "The installer validates by connecting to itself and other components by FQDN."
      trap: "'Auth fail' suggests credentials, but the cause is naming."

  - id: ts-deps-008
    type: multi
    select: 2
    kind: troubleshooting
    difficulty: expert
    topics: [certificates, troubleshooting-method]
    objective: "4.2"
    objectiveItem: "4.2.4"
    lesson: troubleshooting-core-dependencies
    section: deep-dive
    context: |
      After a vCenter machine certificate was replaced directly in vCenter with one from a new enterprise CA, SDDC Manager
      prechecks and the VCF Operations adapter for that vCenter fail with "unable to find valid certification path".
    stem: "Which two actions best address the problem? (Choose two.)"
    options:
      - { id: a, text: "Verify from SDDC Manager with openssl s_client which issuer the vCenter presents and whether it verifies", correct: true, why: "Validates the hypothesis from the failing client." }
      - { id: b, text: "Make the new CA chain trusted by the VCF clients and perform future replacements through VCF Operations certificate management", correct: true, why: "Fixes trust where it is broken and keeps future changes on the path that distributes trust." }
      - { id: c, text: "Disable certificate validation on SDDC Manager", why: "Unsupported and removes TLS protection." }
      - { id: d, text: "Set all appliance clocks manually to the CA's time", why: "The error is about trust, not validity time; manual clocks cause new problems.", confusedWith: ntp }
    explanation:
      correct: "Prove the trust failure from the client, then distribute trust and use the VCF workflow (Fleet Management > Certificates)."
      concept: "Certificates fail on the client side."
      architecture: "SDDC Manager, VCF Operations and NSX are TLS clients of vCenter."
      trap: "A browser padlock on an admin laptop proves nothing about service-to-service trust."

  # ---------------------------------------------------------------- VCF services
  - id: ts-svc-001
    type: single
    kind: concept
    difficulty: foundation
    topics: [host-commissioning]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: troubleshooting-vcf-services
    section: concept
    stem: "In VCF 9.0, where does an administrator start host commissioning?"
    options:
      - { id: a, text: "In vCenter: Global Inventory List > Hosts > Unassigned Hosts", correct: true, why: "VCF 9.0 moved commissioning into vCenter." }
      - { id: b, text: "In the SDDC Manager UI: Inventory > Hosts", why: "That was the VCF 5.x location.", confusedWith: sddc-manager }
      - { id: c, text: "In VCF Operations: Fleet Management > Passwords", why: "That is password management." , confusedWith: passwords }
      - { id: d, text: "In the VCF Installer UI", why: "The installer deploys the initial fleet/instance; it is not the day-2 commissioning UI.", confusedWith: vcf-installer }
    explanation:
      correct: "Commissioning and decommissioning are done in vCenter (Global Inventory List > Hosts > Unassigned Hosts) in VCF 9.0."
      concept: "VCF 9 day-2 workflow locations."
      architecture: "The UI moved; SDDC Manager services still perform validation and inventory work behind it."
      trap: "Answering with the SDDC Manager path from VCF 5.x material."

