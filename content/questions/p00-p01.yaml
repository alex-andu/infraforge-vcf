    objectiveItem: "2.2.2"
    lesson: cpu-memory-virtualization
    section: components
    stem: "True or false: by default, ESX shares identical memory pages between different VMs (inter-VM transparent page sharing)."
    options:
      - { id: "true", text: "True", why: "Inter-VM TPS has been disabled by default for security; sharing is restricted to within a VM." }
      - { id: "false", text: "False", correct: true, why: "Inter-VM TPS is deactivated by default; page sharing is intra-VM." }
    explanation:
      correct: "TPS between VMs is disabled by default; ESX still shares pages within a VM."
      concept: "TPS defaults."
      trap: "Older material describes inter-VM TPS as on by default."

  # ---------------------------------------------------------------- storage-network-virtualization-basics
  - id: fnd-snv-001
    type: single
    kind: concept
    difficulty: foundation
    version: general
    topics: [l2-l3, vds]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: storage-network-virtualization-basics
    section: concept
    stem: "On an ESX host, what is vmk0?"
    options:
      - { id: a, text: "A VMkernel adapter: the host's own IP interface, normally for management", correct: true, why: "vmk = VMkernel adapter." }
      - { id: b, text: "The first physical NIC", why: "Physical NICs are vmnic0, vmnic1…", confusedWith: vds }
      - { id: c, text: "The first VM's virtual NIC", why: "VM NICs are not named vmk." }
      - { id: d, text: "The default port group", why: "Port groups have names like 'Management Network'." }
    explanation:
      correct: "VMkernel adapters carry the host's own traffic (management, vMotion, vSAN); vmk0 is typically management."
      concept: "vmk vs vmnic."
      trap: "Swapping vmk and vmnic."

  - id: fnd-snv-002
    type: single
    kind: troubleshooting
    difficulty: intermediate
    version: general
    topics: [l2-l3]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: storage-network-virtualization-basics
    section: troubleshooting
    context: |
      A VM moved to the new port group "App-VLAN30" (VLAN ID 30) cannot reach its default gateway. VMs on VLAN 20 on
      the same vSwitch work. `esxcli network nic list` shows both uplinks Up at 10000 Mb.
    stem: "What should you check next?"
    options:
      - { id: a, text: "Whether VLAN 30 is allowed on the physical switch trunk ports", correct: true, why: "With VST, the physical trunk must carry the VLAN." }
      - { id: b, text: "Whether the VM's disk is thin provisioned", why: "Storage does not affect network reachability." }
      - { id: c, text: "Whether DRS is enabled", why: "DRS does not configure VLANs.", confusedWith: drs }
      - { id: d, text: "Whether vmk0 is on VLAN 30", why: "vmk0 is host management, not the VM path." }
    explanation:
      correct: "Uplinks are healthy and other VLANs work, so the missing piece is the VLAN on the physical trunk."
      concept: "Virtual switch tagging."
      trap: "Assuming the port group VLAN ID is the whole configuration."

  - id: fnd-snv-003
    type: single
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [datastores]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: storage-network-virtualization-basics
    section: concept
    stem: "Which datastore technology is deprecated starting with VCF 9.0 and should not be chosen for a new design?"
    options:
      - { id: a, text: "vSphere Virtual Volumes (vVols)", correct: true, why: "Broadcom KB 401070 announces deprecation of vVols starting with VCF/VVF 9.0." }
      - { id: b, text: "vSAN", why: "vSAN is the default principal storage for VCF." }
      - { id: c, text: "NFS", why: "NFS remains supported." }
      - { id: d, text: "VMFS", why: "VMFS remains supported." }
    explanation:
      correct: "vVols capabilities are deprecated beginning with VCF 9.0 and will be discontinued in a future release."
      concept: "Storage options in VCF 9."
      trap: "Picking vVols because it was strategic in earlier versions."

  - id: fnd-snv-004
    type: single
    kind: scenario
    difficulty: advanced
    version: general
    topics: [datastores]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: storage-network-virtualization-basics
    section: failure-scenarios
    context: |
      A 2 TB VMFS datastore holds 30 VMs with thin disks totalling 3.5 TB provisioned. Over a weekend several VMs pause
      and one VM fails to power on with an error about creating its swap file.
    stem: "What is the root cause?"
    options:
      - { id: a, text: "The datastore ran out of space because thin disks grew (overcommitted thin provisioning)", correct: true, why: "Thin disks consume space as written; when the datastore fills, VMs stun and .vswp creation fails." }
      - { id: b, text: "Thin disks cannot be powered on", why: "Thin disks power on normally." }
      - { id: c, text: "The VMFS version is too old", why: "Version does not cause these symptoms." }
      - { id: d, text: "vSphere HA isolated the host", why: "Isolation would affect all VMs and is unrelated to space errors.", confusedWith: vsphere-ha }
    explanation:
      correct: "Thin provisioning lets provisioned space exceed capacity; monitoring and alarms are mandatory."
      concept: "Thin vs thick provisioning."
      trap: "Forgetting the .vswp file also needs free space at power-on."

  - id: fnd-snv-005
    type: single
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [vds, vcf-network-design]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: storage-network-virtualization-basics
    section: components
    stem: "Which virtual switch type does VCF use for system traffic (management, vMotion, vSAN) in its domains?"
    options:
      - { id: a, text: "vSphere Distributed Switch configured in vCenter", correct: true, why: "VCF domains use VDS; one configuration applies to all hosts." }
      - { id: b, text: "vSphere Standard Switch on each host", why: "vSwitch0 exists at install but VCF domains use VDS.", confusedWith: l2-l3 }
      - { id: c, text: "NSX overlay segments", why: "Overlay segments carry workload traffic, not host system traffic.", confusedWith: nsx-segments }
      - { id: d, text: "A Proxmox Linux bridge", why: "Only in a nested lab, outside ESX." }
    explanation:
      correct: "The VCF taxonomy lists vSphere distributed switches for system traffic in every domain; NSX segments are for workloads."
      concept: "vSS vs VDS vs NSX."
      trap: "Confusing workload overlays with host system networks."

  - id: fnd-snv-006
    type: single
    kind: troubleshooting
    difficulty: expert
    version: general
    topics: [mtu]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: storage-network-virtualization-basics
    section: deep-dive
    context: |
      After enabling jumbo frames (MTU 9000) on a VDS and the vMotion VMkernel adapters, small pings between hosts'
      vMotion interfaces succeed but vMotion operations time out.
    stem: "What is the most likely cause?"
    options:
      - { id: a, text: "The physical switch ports or VLAN are still at MTU 1500, so large frames are dropped", correct: true, why: "MTU must match end to end; small packets fit, large ones are dropped." }
      - { id: b, text: "vMotion does not support jumbo frames", why: "It does." }
      - { id: c, text: "The VMs need VMware Tools upgraded", why: "Guest tools are not involved in host-to-host vMotion transport." }
      - { id: d, text: "DRS is set to Manual", why: "Manual vMotion would still transfer data." }
    explanation:
      correct: "Classic MTU mismatch symptom: small traffic works, large transfers fail. Test with vmkping and do-not-fragment (Networking phase)."
      concept: "End-to-end MTU."
      trap: "Concluding the network is fine because ping works."

  # ---------------------------------------------------------------- clusters-ha-drs-intro
  - id: fnd-cl-001
    type: single
    kind: concept
    difficulty: foundation
    version: general
    topics: [vsphere-ha]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: clusters-ha-drs-intro
    section: concept
    stem: "An ESX host in an HA cluster loses power. What does vSphere HA do with its VMs?"
    options:
      - { id: a, text: "Restarts them on surviving hosts in the cluster", correct: true, why: "HA restarts VMs after a host failure (with downtime)." }
      - { id: b, text: "Live-migrates them with vMotion before they stop", why: "A failed host cannot vMotion anything.", confusedWith: drs }
      - { id: c, text: "Keeps them running with zero downtime", why: "That is Fault Tolerance, not HA." }
      - { id: d, text: "Nothing until vCenter approves", why: "HA acts on its own via host agents." }
    explanation:
      correct: "HA restarts protected VMs on other hosts; it is a restart, not a migration."
      concept: "HA vs vMotion vs FT."
      trap: "Expecting zero downtime from HA."
    diagnostic: vsphere

  - id: fnd-cl-002
    type: single
    kind: concept
    difficulty: intermediate
    version: general
    topics: [drs]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: clusters-ha-drs-intro
    section: components
    stem: "A cluster has DRS set to Partially Automated. What happens?"
    options:
      - { id: a, text: "Initial placement is automatic; load-balancing migrations are recommendations you must apply", correct: true, why: "That is the Partially Automated definition." }
      - { id: b, text: "Placement and balancing are both automatic", why: "That is Fully Automated." }
      - { id: c, text: "Placement and balancing are both recommendations", why: "That is Manual." }
      - { id: d, text: "Balancing is automatic but placement requires approval", why: "The reverse of the real behaviour." }
    explanation:
      correct: "Manual: recommendations only. Partially Automated: automatic placement only. Fully Automated: both automatic."
      concept: "DRS automation levels."
      trap: "Reversing Partially Automated."
    diagnostic: vsphere

  - id: fnd-cl-003
    type: single
    kind: scenario
    difficulty: advanced
    version: general
    topics: [vsphere-ha, drs, vcenter]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: clusters-ha-drs-intro
    section: deep-dive
    context: |
      The vCenter VM of a cluster runs on host esx-02. esx-02 suffers a hardware failure.
    stem: "Which statement is correct?"
    options:
      - { id: a, text: "HA restarts vCenter and the other VMs on surviving hosts; DRS is unavailable until vCenter is back", correct: true, why: "HA agents work without vCenter; DRS is a vCenter function." }
      - { id: b, text: "Nothing restarts because HA requires vCenter", why: "HA operates through host agents independently of vCenter.", confusedWith: vcenter }
      - { id: c, text: "DRS migrates vCenter to another host", why: "DRS needs vCenter and cannot migrate VMs from a failed host." }
      - { id: d, text: "vCenter fails over automatically to the VCF Installer", why: "The installer is not a failover target." }
    explanation:
      correct: "vSphere HA's primary host detects the failure and restarts protected VMs including vCenter. DRS resumes once vCenter is running."
      concept: "HA independence from vCenter."
      architecture: "In VCF, all management appliances in the management domain rely on this behaviour."
      trap: "Believing vCenter must be up for HA to act."

  - id: fnd-cl-004
    type: single
    kind: troubleshooting
    difficulty: expert
    version: general
    topics: [vsphere-ha]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: clusters-ha-drs-intro
    section: how-it-works
    context: |
      The HA primary stops receiving network heartbeats from esx-03, and esx-03 does not answer ICMP on its management
      IP. However, esx-03 is still updating its datastore heartbeats.
    stem: "How does vSphere HA classify esx-03?"
    options:
      - { id: a, text: "Not failed: it is isolated or partitioned, because it is still alive on storage", correct: true, why: "Datastore heartbeating distinguishes a live but unreachable host from a failed one." }
      - { id: b, text: "Failed: restart all its VMs immediately", why: "That would risk two copies of the VM attempting to run; datastore heartbeats prove it is alive." }
      - { id: c, text: "In maintenance mode", why: "Maintenance mode is administrator-initiated." }
      - { id: d, text: "Disconnected from vCenter only, with no HA impact", why: "HA does evaluate the host's state." }
    explanation:
      correct: "If a host stops network heartbeats but keeps datastore heartbeats, HA treats it as isolated/partitioned rather than failed; an isolated host applies the configured isolation response."
      concept: "HA failure detection: network heartbeat, ping, datastore heartbeat, isolation addresses."
      trap: "Treating loss of network heartbeat as host failure."

  - id: fnd-cl-005
    type: single
    kind: design
    difficulty: intermediate
    version: general
    topics: [drs]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: clusters-ha-drs-intro
    section: deep-dive
    context: |
      An administrator creates 20 resource pools named after departments, all with default settings, just to organise
      VMs in the inventory.
    stem: "What is the best recommendation?"
    options:
      - { id: a, text: "Use VM folders for organisation; use resource pools only to apply shares, reservations and limits", correct: true, why: "Resource pools change resource entitlement; folders only organise." }
      - { id: b, text: "Keep the pools; they have no effect with default settings", why: "Pools with shares still affect entitlement under contention, often unexpectedly." }
      - { id: c, text: "Disable DRS to remove the overhead", why: "Disabling DRS removes resource pools entirely and loses balancing." }
      - { id: d, text: "Convert the pools into vSAN fault domains", why: "Unrelated construct." }
    explanation:
      correct: "Resource pools are resource-management objects (requiring DRS in a cluster). Folders are for organisation and permissions."
      concept: "Resource pools vs folders."
      trap: "Treating resource pools as folders."

  - id: fnd-cl-006
    type: multi
    kind: architecture
    difficulty: advanced
    version: vcf9
    topics: [vsphere-cluster, workload-domains]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: clusters-ha-drs-intro
    section: why-this-matters
    stem: "According to the VCF 9 taxonomy, which two features are enabled on the vSphere clusters of every VCF domain? (Choose two.)"
    select: 2
    options:
      - { id: a, text: "vSphere HA", correct: true, why: "Domains contain clusters with HA enabled." }
      - { id: b, text: "vSphere DRS", correct: true, why: "Domains contain clusters with DRS enabled." }
      - { id: c, text: "vSphere Fault Tolerance for all VMs", why: "FT is optional per VM with strict limits." }
      - { id: d, text: "Distributed Power Management", why: "DPM is optional and not a VCF requirement." }
    explanation:
      correct: "Each VCF domain has one or more vSphere clusters with HA and DRS enabled."
      concept: "VCF cluster baseline."
      trap: "Adding optional features to the baseline."

  - id: fnd-cl-007
    type: single
    kind: concept
    difficulty: intermediate
    version: general
    topics: [vsphere-ha]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: clusters-ha-drs-intro
    section: how-it-works
    stem: "Which vSphere HA feature restarts an individual VM whose guest OS has hung while the host is healthy?"
    options:
      - { id: a, text: "VM Monitoring, based on VMware Tools heartbeats", correct: true, why: "VM Monitoring restarts VMs when Tools heartbeats are not received within a set time." }
      - { id: b, text: "Datastore heartbeating", why: "Used for host failure vs isolation detection." }
      - { id: c, text: "Admission control", why: "Reserves failover capacity; does not detect hung guests." }
      - { id: d, text: "DRS affinity rules", why: "Placement constraints, not monitoring.", confusedWith: drs }
    explanation:
      correct: "VM Monitoring watches VMware Tools heartbeats per VM; it requires Tools in the guest."
      concept: "HA host monitoring vs VM monitoring."
      trap: "Expecting HA host monitoring to catch guest OS hangs."
