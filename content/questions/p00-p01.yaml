      correct: "VCF 9 uses unified five-field versions: major (9.0.0.0), minor (9.1.0.0), maintenance (9.2.1.0), express patch (9.2.1.0100), hot patch."
      concept: "Unified versioning."
      trap: "Applying vSphere 8 'U3' style naming to 9.x."

