      - { id: b, text: "It uses locally installed NVMe devices as a slower memory tier behind DRAM", correct: true, why: "DRAM = tier 0, NVMe = tier 1." }
      - { id: c, text: "It can use the vSAN cache or capacity disks as its tier", why: "Pre-configured vSAN disks cannot be used." }
      - { id: d, text: "It is supported in nested ESX labs", why: "William Lam notes it is not interoperable with nested virtualization." }
    explanation:
