questions:
  # ---------------------------------------------------------------- what-is-vcf
  - id: fnd-vcf-001
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vcf-overview]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: what-is-vcf
    section: concept
    stem: "Which set of products makes up the five pillars of VMware Cloud Foundation 9?"
    options:
      - { id: a, text: "vSphere, vSAN, NSX, VCF Operations, VCF Automation", correct: true, why: "These are the five components Broadcom lists for VCF 9." }
      - { id: b, text: "vSphere, vSAN, NSX, Cloud Builder, Aria Suite Lifecycle", why: "Cloud Builder and Aria Suite Lifecycle are VCF 5.x-era tools, replaced by the VCF Installer and VCF Operations fleet management.", confusedWith: vcf-terminology }
      - { id: c, text: "ESX, vCenter, SDDC Manager, HCX, Site Recovery Manager", why: "SDDC Manager is an instance component, not one of the five pillars; HCX and SRM are not pillars.", confusedWith: sddc-manager }
      - { id: d, text: "vSphere, vSAN, VCF Operations only", why: "That is close to vSphere Foundation; it omits NSX and VCF Automation." }
    explanation:
      correct: "VCF 9 consists of vSphere (compute), vSAN (storage), NSX (networking and security), VCF Operations (operate) and VCF Automation (consume)."
      concept: "The SDDC pillars (compute, storage, network) plus operate and consume layers."
      architecture: "SDDC Manager, the installer and fleet management are enabling components that deploy and lifecycle these pillars."
      trap: "Old VCF 5.x names (Cloud Builder, Aria) appear as distractors."
    diagnostic: vcf

  - id: fnd-vcf-002
    type: single
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [vcf-overview, vcf-fleet]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: what-is-vcf
    section: components
    diagram: d00-vcf-big-picture
    stem: "An organisation runs one VCF fleet with two VCF instances in two data centers. How many VCF Operations instances and how many SDDC Manager appliances does the design need at minimum?"
    options:
      - { id: a, text: "One VCF Operations and two SDDC Managers", correct: true, why: "VCF Operations is fleet-level (one per fleet); SDDC Manager is instance-level (one per instance)." }
      - { id: b, text: "Two VCF Operations and two SDDC Managers", why: "VCF Operations is not deployed per instance; one serves the whole fleet.", confusedWith: vcf-fleet }
      - { id: c, text: "One VCF Operations and one SDDC Manager", why: "Each instance has its own SDDC Manager.", confusedWith: sddc-manager }
      - { id: d, text: "Two VCF Operations and one SDDC Manager", why: "Both scopes are reversed." }
    explanation:
      correct: "A fleet is defined by a single set of fleet-level components (VCF Operations, VCF Automation). Each instance has its own SDDC Manager, management domain, vCenter and NSX."
      concept: "Fleet-level vs instance-level scope."
      architecture: "Fleet components run in the management domain of the first instance; instance 2 has only instance-level appliances."
      trap: "Assuming every site needs its own operations console."

  - id: fnd-vcf-003
    type: single
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [workload-domains, management-domain]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: what-is-vcf
    section: architecture
    stem: "An administrator creates the first workload domain, WLD-01, with four new hosts. Where is the vCenter appliance that manages WLD-01 deployed?"
    options:
      - { id: a, text: "In the management domain", correct: true, why: "For the first workload domain, VCF deploys a vCenter and an NSX Manager instance in the management domain." }
      - { id: b, text: "On the four WLD-01 hosts", why: "The workload domain hosts are for consumer workloads; their vCenter runs in the management domain.", confusedWith: workload-domains }
      - { id: c, text: "On the VCF Installer appliance", why: "The installer is a deployment tool, not a host for vCenter." }
      - { id: d, text: "Inside VCF Operations", why: "VCF Operations requests the domain but does not host vCenter." }
    explanation:
      correct: "Workload domain vCenter (and NSX Manager unless shared) appliances run in the management domain, managing hosts in the workload domain."
      concept: "Management/workload separation in VCF."
      architecture: "Management domain capacity must be sized for every workload domain's management appliances."
      trap: "Picturing each domain as self-contained including its own vCenter VM."

  - id: fnd-vcf-004
    type: multi
    kind: scenario
    difficulty: advanced
    version: vcf9
    topics: [vcf-overview, component-communication]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: what-is-vcf
    section: failure-scenarios
    context: |
      The management domain cluster of a VCF instance suffers a complete power outage for 30 minutes. The workload
      domain WLD-01 runs on separate hosts in another rack that remain powered on.
    stem: "Which two statements describe the impact during the outage? (Choose two.)"
    select: 2
    options:
      - { id: a, text: "VMs already running in WLD-01 continue to run", correct: true, why: "Workload VMs run on WLD-01 hosts; the management plane being down does not stop them." }
      - { id: b, text: "WLD-01 cannot be managed (for example, no new VMs or DRS) because its vCenter runs in the management domain", correct: true, why: "The WLD-01 vCenter is a VM in the management domain." }
      - { id: c, text: "All WLD-01 VMs are powered off by vSphere HA", why: "HA restarts VMs after host failures; WLD-01 hosts did not fail.", confusedWith: vsphere-ha }
      - { id: d, text: "WLD-01 automatically fails over to a second VCF Operations", why: "There is one VCF Operations per fleet and it is also down; there is no such failover." }
    explanation:
      correct: "Management-plane outages stop changes, not running workloads. Since the WLD-01 vCenter and NSX Manager live in the management domain, management of WLD-01 is lost while its VMs keep running."
      concept: "Separation of management plane and data plane."
      architecture: "Management domain hosts all management appliances of the instance, plus fleet components in the first instance."
      trap: "Equating 'cannot manage' with 'workloads down'."

  - id: fnd-vcf-005
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vcf-overview, vcf-installer]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: what-is-vcf
    section: how-it-works
    stem: "Which tool performs the initial (day 0) deployment of a new VCF 9 fleet?"
    options:
      - { id: a, text: "VCF Installer", correct: true, why: "The VCF Installer deploys vCenter, NSX, SDDC Manager, VCF Operations and VCF Automation on pre-installed ESX hosts." }
      - { id: b, text: "Cloud Builder", why: "Cloud Builder was the VCF 5.x bring-up appliance.", confusedWith: vcf-terminology }
      - { id: c, text: "VCF Operations fleet management", why: "Fleet management lifecycle-manages fleet components after deployment." }
      - { id: d, text: "vSphere Lifecycle Manager", why: "vLCM manages host images within a cluster." }
    explanation:
      correct: "VCF 9 is deployed with the VCF Installer appliance, using a wizard or a JSON specification."
      concept: "Day 0 deployment tooling in VCF 9."
      trap: "Cloud Builder appears in older study material."

  - id: fnd-vcf-006
    type: single
    kind: design
    difficulty: advanced
    version: vcf9
    topics: [vcf-overview, deployment-models]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: what-is-vcf
    section: deep-dive
    stem: "A customer wants a VCF 9 deployment with high-availability (clustered) NSX Manager. Based on the documented minimums, how many ESX hosts are required for the management domain?"
    options:
      - { id: a, text: "4", correct: true, why: "A high-availability VCF deployment needs a minimum of 4 ESX hosts, largely because NSX Manager nodes are kept on separate hosts." }
      - { id: b, text: "3", why: "3 hosts with vSAN is the minimum for a simple (non-HA) deployment." }
      - { id: c, text: "2", why: "2 hosts is the simple-deployment minimum with external storage." }
      - { id: d, text: "1", why: "Single-host builds exist only as unsupported lab techniques." }
    explanation:
      correct: "For VCF 9.x: simple deployment = 3 hosts with vSAN or 2 hosts with external storage; high availability = 4 hosts."
      concept: "Minimum host counts depend on deployment mode and storage."
      architecture: "NSX Manager anti-affinity keeps its three nodes on separate hosts; one extra host leaves room for failure/maintenance."
      trap: "Remembering only one number for all modes. Always confirm against the docs for your version."

  # ---------------------------------------------------------------- private-cloud-and-sddc
  - id: fnd-pc-001
    type: single
    kind: concept
    difficulty: foundation
    version: general
    topics: [private-cloud]
    objective: "2.1"
    objectiveItem: "2.1.1"
    lesson: private-cloud-and-sddc
    section: concept
    stem: "Which capability most clearly distinguishes a private cloud from a merely virtualized data center?"
    options:
      - { id: a, text: "Self-service provisioning governed by policies and quotas", correct: true, why: "Self-service plus governance is the defining cloud operating model." }
      - { id: b, text: "Running many VMs on each physical server", why: "That is server virtualization, a prerequisite but not the defining principle.", confusedWith: hypervisors }
      - { id: c, text: "Using shared SAN storage", why: "Shared storage exists in traditional virtualized data centers." }
      - { id: d, text: "Having vCenter manage the hosts", why: "Central management alone does not provide cloud consumption." }
    explanation:
      correct: "A private cloud adds on-demand self-service, tenancy, governance and metering on top of the SDDC."
      concept: "Virtualized DC → SDDC → private cloud maturity."
      trap: "Picking virtualization as the defining feature."
    diagnostic: vcf

  - id: fnd-pc-002
    type: matching
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [private-cloud, vcf-overview]
    objective: "2.1"
    objectiveItem: "2.1.1"
    lesson: private-cloud-and-sddc
    section: concept
    stem: "Match each private cloud principle to the VCF component that primarily delivers it."
    pairs:
      - { id: p1, left: "Self-service consumption with quotas", right: "VCF Automation" }
      - { id: p2, left: "Measured service, capacity and cost visibility", right: "VCF Operations" }
      - { id: p3, left: "Software-defined networks and micro-segmentation", right: "NSX" }
      - { id: p4, left: "Pooled storage from hosts' local disks", right: "vSAN" }
      - { id: p5, left: "Automated per-instance workflows (domains, host commissioning)", right: "SDDC Manager" }
    explanation:
      correct: "Each principle maps to the component built to deliver it: consume (VCF Automation), operate/measure (VCF Operations), network (NSX), storage pooling (vSAN), instance automation (SDDC Manager)."
      concept: "Private cloud principles mapped to VCF."
      trap: "Attributing self-service to VCF Operations."

  - id: fnd-pc-003
    type: single
    kind: scenario
    difficulty: intermediate
    version: general
    topics: [private-cloud]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: private-cloud-and-sddc
    section: deep-dive
    context: |
      A bank must keep customer data in its own data centers to meet regulations, but its developers complain that
      getting a VM takes three weeks and have started using unapproved public cloud accounts.
    stem: "Which private cloud value proposition addresses BOTH problems?"
    options:
      - { id: a, text: "Public-cloud-like agility through self-service, with data sovereignty and control on-premises", correct: true, why: "Self-service fixes speed; on-premises control meets regulation." }
      - { id: b, text: "Lower hardware cost through server consolidation", why: "True benefit but addresses neither the speed nor the shadow-IT problem directly." }
      - { id: c, text: "Unlimited elasticity by bursting all workloads to public cloud", why: "Moving data to public cloud conflicts with the regulatory requirement." }
      - { id: d, text: "Replacing vSphere HA with Fault Tolerance", why: "Availability is not the problem described." }
    explanation:
      correct: "Private cloud combines cloud agility (self-service, automation) with on-premises control, security and sovereignty."
      concept: "Value proposition of private cloud."
      trap: "Choosing a true but irrelevant benefit."

  - id: fnd-pc-004
    type: multi
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [private-cloud]
    objective: "2.1"
    objectiveItem: "2.1.2"
    lesson: private-cloud-and-sddc
    section: deep-dive
    stem: "Which three are use-case themes Broadcom positions for VCF 9? (Choose three.)"
    select: 3
    options:
      - { id: a, text: "Infrastructure modernization", correct: true, why: "Includes private cloud on-premises/edge, automated IaaS, extending the data center." }
      - { id: b, text: "Unified cloud experience", correct: true, why: "Kubernetes and modern apps, Private AI, traditional workloads." }
      - { id: c, text: "Secure and resilient platform", correct: true, why: "Ransomware recovery, disaster recovery, integrated security and compliance." }
      - { id: d, text: "Multi-public-cloud cost brokerage", why: "VCF 9 messaging focuses on private cloud, not brokering public clouds." }
      - { id: e, text: "Desktop virtualization licensing", why: "Not one of the VCF 9 use-case themes." }
    explanation:
      correct: "The VCF 9 use cases are grouped into infrastructure modernization, unified cloud experience, and secure and resilient platform."
      concept: "VCF 9 use cases (objective 2.1)."
      trap: "Distractors that sound like generic cloud marketing."

  - id: fnd-pc-005
    type: single
    kind: concept
    difficulty: foundation
    version: general
    topics: [sddc]
    objective: "2.1"
    objectiveItem: "2.1.1"
    lesson: private-cloud-and-sddc
    section: concept
    stem: "What makes a data center 'software-defined'?"
    options:
      - { id: a, text: "Compute, storage and networking are all virtualized and controlled through software and automation", correct: true, why: "That is the SDDC definition." }
      - { id: b, text: "All servers run a hypervisor", why: "Only compute is virtualized; storage and network may still be manual.", confusedWith: hypervisors }
      - { id: c, text: "All workloads run in containers", why: "Containers are a workload type, not the SDDC definition." }
      - { id: d, text: "The data center uses only public cloud services", why: "SDDC can be entirely on-premises." }
    explanation:
      correct: "An SDDC virtualizes all three resource types and manages them as software, enabling automation of provisioning and lifecycle."
      concept: "SDDC definition."
      trap: "Equating virtualization of servers with SDDC."

  - id: fnd-pc-006
    type: single
    kind: scenario
    difficulty: advanced
    version: vcf9
    topics: [private-cloud, vcf-automation]
    objective: "2.1"
    objectiveItem: "2.1.1"
    lesson: private-cloud-and-sddc
    section: failure-scenarios
    context: |
      Two years after deploying VCF, an internal survey shows that application teams still open tickets for every VM,
      and infrastructure staff create VMs manually in the vSphere Client.
    stem: "Which private cloud principle has the organisation failed to implement, and which component should it adopt?"
    options:
      - { id: a, text: "Self-service; adopt VCF Automation with organizations, quotas and catalogs", correct: true, why: "Tickets and manual creation mean no self-service consumption layer." }
      - { id: b, text: "Measured service; adopt VCF Operations dashboards", why: "Visibility is useful but does not remove tickets.", confusedWith: vcf-ops-architecture }
      - { id: c, text: "Resource pooling; enable vSAN", why: "Pooling already exists through clusters." }
      - { id: d, text: "Automated lifecycle; use SDDC Manager upgrades", why: "Lifecycle does not change how VMs are requested.", confusedWith: sddc-manager }
    explanation:
      correct: "Without VCF Automation, VCF behaves like well-run vSphere; the cloud operating model needs self-service."
      concept: "Operating model vs technology."
      trap: "Confusing operate (VCF Operations) with consume (VCF Automation)."

  # ---------------------------------------------------------------- vcf-vs-vsphere
  - id: fnd-vvs-001
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vcf-overview]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf-vs-vsphere
    section: components
    stem: "Which capability is included in VMware Cloud Foundation but NOT in vSphere Foundation (VVF)?"
    options:
      - { id: a, text: "VCF Automation self-service and multi-tenancy", correct: true, why: "VVF does not include cloud management and integrated automation." }
      - { id: b, text: "vSAN hyperconverged storage", why: "VVF includes vSAN." }
      - { id: c, text: "VCF Operations monitoring", why: "VVF includes VCF Operations." }
      - { id: d, text: "vCenter and ESX", why: "Both editions include vSphere." }
    explanation:
      correct: "VVF = vSphere + vSAN + VCF Operations. VCF adds NSX, VCF Automation, SDDC Manager and the domain architecture."
      concept: "Edition differences."
      trap: "Assuming VVF lacks vSAN or operations."

  - id: fnd-vvs-002
    type: single
    kind: architecture
    difficulty: intermediate
    version: vcf9
    topics: [vcf-installer, vcf-overview]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf-vs-vsphere
    section: components
    stem: "An administrator uses the VCF Installer and selects vSphere Foundation instead of VCF. Which components will the installer deploy?"
    options:
      - { id: a, text: "vCenter and VCF Operations (primary node only)", correct: true, why: "This is the documented VVF deployment scope." }
      - { id: b, text: "vCenter, VCF Operations, NSX, VCF Automation and SDDC Manager", why: "That is the VCF scope.", confusedWith: vcf-installer }
      - { id: c, text: "vCenter, NSX and SDDC Manager", why: "VVF does not deploy NSX or SDDC Manager." }
      - { id: d, text: "Only vCenter", why: "VCF Operations is included in VVF and is deployed." }
    explanation:
      correct: "VVF: vCenter and VCF Operations (primary node). VCF: vCenter, VCF Operations, NSX, VCF Automation, SDDC Manager (and HA variants)."
      concept: "One installer, two platforms."
      trap: "Expecting SDDC Manager in VVF."

  - id: fnd-vvs-003
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [vcf-overview, host-commissioning]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf-vs-vsphere
    section: failure-scenarios
    context: |
      An experienced vSphere administrator adds a new ESX host directly to a workload domain cluster using "Add Host"
      in the vSphere Client. Later, a VCF workflow on that cluster fails.
    stem: "What is the most likely reason?"
    options:
      - { id: a, text: "The host was not commissioned into the VCF inventory, so SDDC Manager does not know it", correct: true, why: "VCF expects hosts to be commissioned and added through VCF workflows." }
      - { id: b, text: "vCenter does not support adding hosts to clusters", why: "vCenter supports it; the problem is VCF inventory drift." }
      - { id: c, text: "The host must first be added to VCF Automation", why: "VCF Automation consumes capacity; it does not inventory hosts." }
      - { id: d, text: "DRS was disabled when the host joined", why: "DRS state would not cause VCF inventory mismatch." }
    explanation:
      correct: "Changes made outside VCF workflows cause drift between SDDC Manager's inventory and reality."
      concept: "Use the VCF workflow when one exists."
      architecture: "SDDC Manager orchestrates instance-level changes; vCenter is only one of the systems it updates."
      trap: "Treating VCF like standalone vSphere."

  - id: fnd-vvs-004
    type: ordering
    kind: concept
    difficulty: advanced
    version: vcf9
    topics: [vcf-overview, lcm-workflow]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf-vs-vsphere
    section: how-it-works
    stem: "Put the high-level steps of upgrading a VCF 5.x environment to VCF 9.0 in order (as described in the VCF upgrade guidance)."
    items:
      - { id: i1, text: "Assess the environment and validate prerequisites" }
      - { id: i2, text: "Upgrade existing Aria Automation and Aria Operations components to VCF 9.0" }
      - { id: i3, text: "Upgrade management domain core components (SDDC Manager, NSX, vCenter, ESX)" }
      - { id: i4, text: "Deploy VCF Operations if it was not previously installed" }
      - { id: i5, text: "Finalize the remaining components" }
    explanation:
      correct: "The documented sequence is assess, upgrade Aria components, upgrade management domain core components, deploy VCF Operations if absent, finalize."
      concept: "Upgrade path into VCF 9."
      trap: "VCF 4.x environments must first reach 5.2 before this path applies. Detailed sequencing is covered in the Lifecycle phase."

  - id: fnd-vvs-005
    type: single
    kind: design
    difficulty: advanced
    version: vcf9
    topics: [vcf-overview, private-cloud]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf-vs-vsphere
    section: deep-dive
    context: |
      Requirements: hyperconverged storage; run VMs and Kubernetes side by side; isolated tenants for three business
      units who create their own networks without involving the network team.
    stem: "Which platform meets all requirements?"
    options:
      - { id: a, text: "VMware Cloud Foundation", correct: true, why: "Tenant isolation with self-service networks requires VCF Automation and NSX, which are VCF-only." }
      - { id: b, text: "vSphere Foundation", why: "Meets storage and VM/Kubernetes needs but lacks VCF Automation tenancy and NSX overlays.", confusedWith: vcf-overview }
      - { id: c, text: "Standalone vSphere with vSAN", why: "No tenancy, self-service or overlay networking." }
      - { id: d, text: "vSphere Foundation plus VCF Operations for networks", why: "VCF Operations for networks is VCF-only and is monitoring, not tenancy." }
    explanation:
      correct: "Map each requirement to a capability: tenancy and self-service (VCF Automation) and software-created networks (NSX) force VCF."
      concept: "Choose edition from requirements."
      trap: "Picking the cheaper edition because most requirements fit."

  - id: fnd-vvs-006
    type: truefalse
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vcf-overview, vcenter-import]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf-vs-vsphere
    section: how-it-works
    stem: "True or false: a standalone vCenter must be converted into a VCF instance before VCF Operations in a fleet can manage it."
    options:
      - { id: "true", text: "True", why: "The taxonomy explicitly allows standalone vCenter instances in a fleet." }
      - { id: "false", text: "False", correct: true, why: "A fleet can contain standalone vCenter instances managed by the fleet's VCF Operations." }
    explanation:
      correct: "VCF fleets can include standalone vCenter instances; convergence into an instance is optional."
      concept: "Fleet membership."
      trap: "Assuming everything in a fleet must be a full instance."

  # ---------------------------------------------------------------- vcf9-terminology
  - id: fnd-term-001
    type: matching
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vcf-terminology]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf9-terminology
    section: components
    stem: "Match each legacy product name to its VCF 9 name."
    pairs:
      - { id: r1, left: "VMware Aria Operations", right: "VCF Operations" }
      - { id: r2, left: "VMware Aria Automation", right: "VCF Automation" }
      - { id: r3, left: "VMware Aria Operations for Logs", right: "VCF Operations for logs" }
      - { id: r4, left: "VMware Aria Suite Lifecycle", right: "VCF Operations fleet management" }
      - { id: r5, left: "Cloud Builder", right: "VCF Installer" }
      - { id: r6, left: "VMware ESXi", right: "VMware ESX" }
    explanation:
      correct: "VCF 9 rebrands the Aria products under VCF, replaces Cloud Builder with the VCF Installer, and renames ESXi to ESX."
      concept: "VCF 9 renames."
      trap: "Old documentation uses legacy names for the same functions."
    diagnostic: vcf

  - id: fnd-term-002
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vcf-terminology, vcf-fleet]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf9-terminology
    section: concept
    stem: "In VCF 9, what defines a VCF fleet?"
    options:
      - { id: a, text: "An environment managed by a single set of fleet-level management components: VCF Operations and VCF Automation", correct: true, why: "This is the documented definition." }
      - { id: b, text: "All hosts managed by one vCenter", why: "That describes a domain's vCenter scope.", confusedWith: vcenter }
      - { id: c, text: "All domains managed by one SDDC Manager", why: "That is a VCF instance.", confusedWith: sddc-manager }
      - { id: d, text: "A group of ESX hosts with HA and DRS", why: "That is a vSphere cluster.", confusedWith: vsphere-cluster }
    explanation:
      correct: "Fleet = one VCF Operations + one VCF Automation, managing one or more instances and optionally standalone vCenters."
      concept: "VCF 9 hierarchy."
      trap: "Mixing up fleet, instance, domain and cluster scopes."

  - id: fnd-term-003
    type: ordering
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [vcf-terminology]
    objective: "2.1"
    objectiveItem: "2.1.3"
    lesson: vcf9-terminology
    section: concept
    stem: "Order the VCF 9 constructs from the largest scope to the smallest."
    items:
      - { id: o1, text: "VCF private cloud" }
      - { id: o2, text: "VCF fleet" }
      - { id: o3, text: "VCF instance" }
      - { id: o4, text: "VCF domain" }
      - { id: o5, text: "vSphere cluster" }
      - { id: o6, text: "ESX host" }
    explanation:
