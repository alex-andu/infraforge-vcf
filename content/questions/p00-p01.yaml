      - { id: a, text: "The appliance switches into SDDC Manager mode and can no longer be used as the installer", correct: true, why: "Deployed inside the management infrastructure, the appliance switches to SDDC Manager mode." }
      - { id: b, text: "The appliance runs as the installer and later converts itself to SDDC Manager after bring-up", why: "The documented behaviour for this placement is SDDC Manager mode, not installer mode.", confusedWith: vcf-installer }
      - { id: c, text: "The OVA fails to deploy because the installer and SDDC Manager are separate OVAs", why: "They are delivered together in one OVA." }
