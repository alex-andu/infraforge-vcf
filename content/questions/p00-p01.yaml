  - id: fnd-hyp-007
    type: single
    kind: troubleshooting
    difficulty: advanced
    version: vcf9
    topics: [hypervisors, esx-host]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: hypervisors-and-esx
    section: troubleshooting
    context: |
      In a home lab, ESX 9 is installed as a VM on Proxmox. The host works, but powering on any 64-bit guest VM fails
      with an error that hardware virtualization is not available.
    stem: "What is the most likely cause?"
    options:
      - { id: a, text: "The Proxmox VM does not expose VT-x/AMD-V to ESX (nested virtualization off or CPU type not 'host')", correct: true, why: "Nested ESX needs the virtualization extensions passed through." }
      - { id: b, text: "The VM uses a thin-provisioned disk", why: "Disk format does not affect CPU virtualization." }
      - { id: c, text: "VMware Tools is not installed in the guest", why: "Tools is installed after the guest boots; it does not affect power-on." }
      - { id: d, text: "The ESX host has no vCenter", why: "Standalone hosts run VMs fine." }
    explanation:
      correct: "ESX needs hardware-assisted virtualization to run 64-bit VMs. Nested, that means nested=Y on Proxmox and CPU type host for the ESX VM."
      concept: "Hardware-assisted CPU virtualization."
      architecture: "Two hypervisor layers: Proxmox (KVM) → ESX → guest."
      trap: "Looking at storage or Tools for a CPU feature problem."

  # ---------------------------------------------------------------- cpu-memory-virtualization
  - id: fnd-cpu-001
    type: ordering
    kind: concept
    difficulty: intermediate
    version: general
    topics: [cpu-memory-virt]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: cpu-memory-virtualization
    section: how-it-works
    stem: "As host memory pressure increases, order the reclamation techniques ESX relies on, from least to most performance impact."
    items:
      - { id: m1, text: "Transparent page sharing" }
      - { id: m2, text: "Ballooning" }
      - { id: m3, text: "Memory compression" }
      - { id: m4, text: "Host swapping" }
    explanation:
      correct: "Sharing and ballooning are cheap, compression avoids disk I/O, swapping to .vswp is the costly last resort."
      concept: "Memory reclamation."
      trap: "Putting swapping before compression."
    diagnostic: virtualization

  - id: fnd-cpu-002
    type: single
    kind: concept
    difficulty: foundation
    version: general
    topics: [cpu-memory-virt]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: cpu-memory-virtualization
    section: components
    stem: "Ballooning is not happening on a VM even though the host is under memory pressure. What is the most likely reason?"
    options:
      - { id: a, text: "VMware Tools (with the balloon driver) is not installed or not running in the guest", correct: true, why: "The vmmemctl balloon driver comes with VMware Tools." }
      - { id: b, text: "The VM uses vmxnet3", why: "NIC type is unrelated." }
      - { id: c, text: "DRS is in Manual mode", why: "Ballooning is a host-level mechanism independent of DRS.", confusedWith: drs }
      - { id: d, text: "The VM has a thin disk", why: "Disk format is unrelated." }
    explanation:
      correct: "Without the balloon driver, ESX must use compression or swapping instead."
      concept: "Ballooning requires guest cooperation."
      trap: "Blaming cluster features for a host mechanism."

  - id: fnd-cpu-003
    type: single
    kind: scenario
    difficulty: advanced
    version: general
    topics: [cpu-memory-virt, drs]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: cpu-memory-virtualization
    section: failure-scenarios
    context: |
      A VM configured with 16 GB of memory is swapping heavily. The host has 120 GB free memory. Edit Settings shows
      Memory reservation 0 MB, Shares Normal, Limit 4096 MB.
    stem: "What explains the swapping?"
    options:
      - { id: a, text: "The 4096 MB limit caps the VM's physical memory regardless of free host memory", correct: true, why: "Limits are always enforced, even on an idle host." }
      - { id: b, text: "Normal shares give the VM too low a priority", why: "Shares matter only under contention; the host has plenty free." }
      - { id: c, text: "The zero reservation forces swapping", why: "No reservation just means no guarantee." }
      - { id: d, text: "Inter-VM TPS is disabled", why: "TPS settings do not cause swapping on a host with free memory." }
    explanation:
      correct: "A limit below configured memory makes the guest believe it has 16 GB while ESX gives it at most 4 GB; the rest is reclaimed via ballooning/swapping."
      concept: "Shares vs reservations vs limits."
      trap: "Thinking limits apply only under contention."

  - id: fnd-cpu-004
    type: single
    kind: concept
    difficulty: intermediate
    version: general
    topics: [cpu-memory-virt]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: cpu-memory-virtualization
    section: components
    stem: "A VM has 32 GB configured memory and a 24 GB memory reservation. What is the size of its .vswp file when powered on?"
    options:
      - { id: a, text: "8 GB", correct: true, why: "Swap file size = configured memory − reservation." }
      - { id: b, text: "32 GB", why: "Would be true with no reservation." }
      - { id: c, text: "24 GB", why: "That is the reserved amount, which never needs swap." }
      - { id: d, text: "0 GB", why: "Only with a full reservation." }
    explanation:
      correct: "The reserved portion is guaranteed in RAM, so only the unreserved 8 GB needs swap backing."
      concept: "Reservation and swap file."
      trap: "Forgetting reservations reduce .vswp size; useful when datastore space is tight."

  - id: fnd-cpu-005
    type: single
    kind: scenario
    difficulty: intermediate
    version: general
    topics: [cpu-memory-virt]
    objective: "2.2"
    objectiveItem: "2.2.2"
    lesson: cpu-memory-virtualization
    section: deep-dive
    context: |
      A single-threaded legacy application runs in a VM with 8 vCPUs on a busy host. Users report slowness; the
      guest shows one vCPU at 100% and seven idle; the host reports high CPU ready for this VM.
    stem: "What is the best first change?"
    options:
      - { id: a, text: "Reduce the VM to 1 or 2 vCPUs", correct: true, why: "Docs recommend uniprocessor VMs for single-threaded apps; fewer vCPUs are easier to schedule." }
      - { id: b, text: "Increase to 16 vCPUs", why: "Makes scheduling harder and cannot help a single thread." }
      - { id: c, text: "Set a CPU limit", why: "Limits only restrict further." }
      - { id: d, text: "Enable inter-VM TPS", why: "Memory feature; unrelated." }
    explanation:
      correct: "Right-sizing vCPUs reduces CPU ready and overhead; a single thread cannot use more vCPUs."
      concept: "vCPU scheduling and overcommit."
      trap: "Assuming more vCPUs equals more performance."

