      correct: "The VCF Installer and SDDC Manager share one OVA. Placement decides the mode: deploy it outside the future management infrastructure to use installer mode."
      concept: "VCF Installer vs SDDC Manager."
      architecture: "After deployment, the instance's SDDC Manager runs in the management domain."
      trap: "Assuming any placement works as long as the OVA is correct."

