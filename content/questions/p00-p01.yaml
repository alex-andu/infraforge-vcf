      - { id: c, text: "vMotion downgrades it to version 21", why: "Hardware version upgrades are one-way; vMotion does not downgrade." }
      - { id: d, text: "It runs, because hardware version only affects VMware Tools", why: "Hardware version determines virtual hardware, not Tools." }
