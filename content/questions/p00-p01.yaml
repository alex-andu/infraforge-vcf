    section: concept
    stem: "What makes ESX a type 1 hypervisor?"
    options:
      - { id: a, text: "It runs directly on the server hardware without a general-purpose host OS", correct: true, why: "Type 1 = bare metal." }
      - { id: b, text: "It can run only one VM at a time", why: "ESX runs many VMs." }
      - { id: c, text: "It is installed as an application on Linux", why: "That would be type 2." }
      - { id: d, text: "It provides a shell and CLI", why: "A CLI does not determine the hypervisor type." }
    explanation:
      correct: "A type 1 hypervisor's kernel (the VMkernel) owns the hardware directly."
      concept: "Type 1 vs type 2."
      trap: "Confusing management interfaces with architecture."
    diagnostic: virtualization

  - id: fnd-hyp-002
    type: single
    kind: troubleshooting
    difficulty: intermediate
    version: general
    topics: [esx-host]
    objective: "2.2"
    objectiveItem: "2.2.1"
    lesson: hypervisors-and-esx
    section: failure-scenarios
    context: |
      A standalone ESX host's Host Client shows errors and vCenter reports the host as "not responding". The VMs on
      the host are still answering on the network.
    stem: "What is the most appropriate first action?"
    options:
      - { id: a, text: "Restart the management agents from the DCUI", correct: true, why: "VMs are running, so the hypervisor is fine; the management agents (hostd/vpxa) are the likely problem." }
      - { id: b, text: "Reboot the host immediately", why: "Would take down running VMs unnecessarily." }
      - { id: c, text: "Reinstall ESX", why: "Far too disruptive for a management-agent issue." }
      - { id: d, text: "Power off all VMs from the guest OS", why: "The VMs are healthy." }
    explanation:
      correct: "hostd/vpxa problems block management but not running VMs; restarting management agents from the DCUI is the standard first step."
      concept: "Management plane vs data plane on a host."
      trap: "Assuming 'not responding' means the VMs are down."
    diagnostic: esxi

