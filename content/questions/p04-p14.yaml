questions:
  # ---------------------------------------------------------------------------
  # network-fundamentals-for-vcf
  # ---------------------------------------------------------------------------
  - id: net-fund-001
    type: single
    kind: concept
    difficulty: foundation
    topics: [l2-l3]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: concept
    diagnostic: networking
    stem: "An ESX host's vSAN VMkernel adapter (172.16.13.11/24) sends traffic to another host at 172.16.13.12/24 in the same VLAN. Which device forwards the traffic?"
    options:
      - { id: a, text: "The default gateway of VLAN 1613", why: "Same subnet traffic never needs the gateway; it is delivered by MAC address within the VLAN.", confusedWith: l2-l3 }
      - { id: b, text: "The layer 2 switch(es) carrying VLAN 1613", correct: true, why: "Both IPs are in the same subnet and VLAN, so the frame is switched at layer 2." }
      - { id: c, text: "vCenter", why: "vCenter is a management plane and never forwards data traffic." }
      - { id: d, text: "An NSX Tier-0 gateway", why: "vSAN VMkernel traffic is VLAN-backed infrastructure traffic, not routed through NSX gateways.", confusedWith: nsx-routing }
    explanation:
      correct: "Hosts in the same VLAN and subnet reach each other directly at layer 2 through the switches; the gateway is used only for other subnets."
      concept: "Layer 2 switching inside a VLAN vs layer 3 routing between subnets."
      architecture: "In a single-rack VCF cluster, vMotion, vSAN and TEP traffic between hosts stays inside each VLAN on the ToR pair."
      trap: "Do not assume all traffic goes through the gateway – only traffic leaving the subnet does."
  - id: net-fund-002
    type: single
    kind: concept
    difficulty: foundation
    topics: [mtu]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: mtu-the-largest-frame-a-link-carries
    diagnostic: networking
    stem: "What is the minimum MTU the VCF Installer accepts for the distributed switch used for host overlay (NSX TEP) traffic?"
    options:
      - { id: a, text: "1500", why: "1500 is rejected: the installer reports the MTU must be at least 1600." }
      - { id: b, text: "1600", correct: true, why: "1600 is the enforced minimum for Geneve overlay; VCF 9 design guidance recommends 1700 as the design minimum and 9000 overall." }
      - { id: c, text: "9000", why: "9000 is the recommendation, not the minimum." }
      - { id: d, text: "9216", why: "9216 is a common physical switch setting, not a host overlay requirement." }
    explanation:
      correct: "The installer validation error reads that the host overlay switch MTU 'Must be at least 1600'. VCF 9 design guidance uses 1700 as the design minimum and recommends 9000."
      concept: "Geneve encapsulation overhead requires a larger MTU than the inner 1500-byte frame."
      trap: "Know three numbers: 1600 enforced minimum, 1700 design minimum, 9000 recommended."
  - id: net-fund-003
    type: single
    kind: command
    difficulty: foundation
    topics: [mtu]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: why-8972-and-1472
    diagnostic: networking
    stem: "You must prove that the vSAN network carries 9000-byte packets end to end. Which command is correct?"
    options:
      - { id: a, text: "`vmkping -I vmk2 -s 9000 172.16.13.12`", why: "No DF bit, so the ping can be fragmented; and 9000 payload plus 28 bytes of headers exceeds 9000." }
      - { id: b, text: "`vmkping -I vmk2 -d -s 8972 172.16.13.12`", correct: true, why: "DF set and 8972 + 28 bytes of IP/ICMP headers = 9000." }
      - { id: c, text: "`ping 172.16.13.12` from vCenter", why: "Wrong source interface and no size/DF control." }
      - { id: d, text: "`vmkping -I vmk2 -d -s 1472 172.16.13.12`", why: "That proves only a 1500-byte path." }
    explanation:
      correct: "-d sets the do-not-fragment bit and -s sets the ICMP payload; 9000 − 20 (IP) − 8 (ICMP) = 8972."
      concept: "MTU testing requires DF and the correct payload size from the correct VMkernel adapter."
      trap: "A ping without -d may succeed on a 1500 path through fragmentation."
  - id: net-fund-004
    type: single
    kind: troubleshooting
    difficulty: intermediate
    topics: [mtu, l2-l3]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: troubleshooting
    diagnostic: troubleshooting
    context: |
      ```shell
      [root@esx-03:~] vmkping -I vmk1 -S vmotion 172.16.12.14
      3 packets transmitted, 3 packets received, 0% packet loss
      [root@esx-03:~] vmkping -I vmk1 -S vmotion -d -s 8972 172.16.12.14
      3 packets transmitted, 0 packets received, 100% packet loss
      ```
    stem: "vMotion to esx-04 stalls. Based on the output, what is the most likely cause?"
    options:
      - { id: a, text: "The vMotion VLAN is not allowed on esx-04's trunk", why: "Then the small ping would also fail.", confusedWith: l2-l3 }
      - { id: b, text: "A device on the path to esx-04 has an MTU smaller than 9000", correct: true, why: "Small packets pass, large DF packets fail: classic MTU mismatch." }
      - { id: c, text: "The vMotion gateway is down", why: "Same-subnet traffic does not use the gateway." }
      - { id: d, text: "vCenter is unavailable", why: "vMotion data transfer is host to host; vCenter does not forward it." }
    explanation:
      correct: "Size-dependent failure with DF set means at least one hop (vmk, VDS, switch port) is below 9000."
      concept: "Distinguish VLAN problems (nothing works), routing problems (only other subnets fail) and MTU problems (only large packets fail)."
      trap: "A successful small ping does not clear the network."
  - id: net-fund-005
    type: multi
    kind: concept
    difficulty: intermediate
    topics: [mtu, vcf-network-design]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: infrastructure-vlans-and-their-mtu-vcf-9-guidance
    select: 2
    stem: "According to VCF 9 design guidance, which TWO networks are recommended to use an MTU of 9000?"
    options:
      - { id: a, text: "ESX management VMkernel", why: "Recommended at 1500 because vSAN witness traffic may cross WAN links without jumbo support." }
      - { id: b, text: "vMotion VMkernel", correct: true, why: "VCF-NET-RCMD-MTU-004 recommends 9000+." }
      - { id: c, text: "NSX host TEP", correct: true, why: "VCF-NET-RCMD-MTU-005 recommends 9000+ for host/edge TEPs." }
      - { id: d, text: "vSAN witness traffic over a WAN", why: "Witness traffic may cross links without jumbo frames; 1500 is listed." }
    explanation:
      correct: "vMotion, storage and TEP networks are recommended at 9000; ESX management stays at 1500."
      concept: "VCF 9 per-traffic-type MTU guidance."
      trap: "'Set everything to 9000' is not the VCF 9 recommendation for the management VMkernel."
  - id: net-fund-006
    type: single
    kind: architecture
    difficulty: intermediate
    topics: [mtu, nsx-segments]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: overlay-segment-mtu-tep-mtu-200
    stem: "Host TEP MTU is 9000 across the fabric. What is the largest MTU you can configure on an NSX overlay segment for workload VMs per VCF 9 requirements?"
    options:
      - { id: a, text: "9000", why: "Encapsulation overhead would make the outer packet exceed 9000; DF packets would be dropped." }
      - { id: b, text: "8800", correct: true, why: "VCF-NET-REQD-OVL-001: overlay segment MTU = host TEP MTU − 200." }
      - { id: c, text: "8972", why: "8972 is the vmkping payload for a 9000 test, not a segment MTU." }
      - { id: d, text: "1500 only", why: "Larger overlay MTUs are possible when the TEP MTU allows it." }
    explanation:
      correct: "The VCF design reserves 200 bytes for Geneve overhead: 9000 − 200 = 8800."
      concept: "Inner (segment) MTU vs outer (TEP) MTU."
      trap: "Do not confuse the 28-byte ping header subtraction with the 200-byte overlay allowance."
  - id: net-fund-007
    type: single
    kind: design
    difficulty: advanced
    topics: [l2-l3, vcf-network-design]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: addressing-rules-worth-memorising
    stem: "A team deploys a workload domain with a /26 vMotion subnet for a cluster expected to grow from 8 to 70 hosts. What is the problem with this design?"
    options:
      - { id: a, text: "None – the subnet mask can be widened later in SDDC Manager", why: "VCF does not support changing subnet masks for infrastructure networks." }
      - { id: b, text: "vMotion must use IPv6", why: "Infrastructure networks must be IPv4 in VCF 9." }
      - { id: c, text: "The subnet cannot hold 70 hosts and VCF does not support changing infrastructure subnet masks later", correct: true, why: "A /26 has 62 usable addresses; masks cannot be changed, only ranges added inside the mask." }
      - { id: d, text: "vMotion must share the management subnet", why: "Separate VLANs per traffic type are recommended." }
    explanation:
      correct: "Size infrastructure subnets for maximum growth: VCF-NET-RCMD-IPA-001 notes expanding subnets later is disruptive and mask changes are unsupported."
      concept: "IP planning for growth."
      trap: "Adding IP ranges within an existing mask is supported; changing the mask is not."
  - id: net-fund-008
    type: matching
    kind: concept
    difficulty: intermediate
    topics: [vcf-network-design, l2-l3]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: network-fabric-models
    stem: "Match each VCF 9 network fabric model with the vSphere cluster model it supports."
    pairs:
      - { id: p1, left: "Single-Rack network fabric", right: "Single-rack cluster model" }
      - { id: p2, left: "Multi-Rack network fabric", right: "Layer 2 or layer 3 multi-rack cluster models" }
      - { id: p3, left: "Multi Availability Zone network fabric", right: "Stretched cluster model" }
    explanation:
      correct: "Fabric models mirror cluster models: single-rack, multi-rack (L2/L3) and multi-AZ (stretched)."
      concept: "The physical fabric must support the cluster's failure-domain span."
      trap: "A multi-rack fabric does not by itself provide availability-zone resilience."
  - id: net-fund-009
    type: single
    kind: design
    difficulty: intermediate
    topics: [l2-l3]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: network-fundamentals-for-vcf
    section: concept
    stem: "Which VCF 9 recommendation keeps an infrastructure VLAN's gateway available when one top-of-rack switch fails?"
    options:
      - { id: a, text: "Use a floating VRRP/HSRP gateway IP across the ToR pair", correct: true, why: "VCF-NET-RCMD-GTW-001 recommends a first hop redundancy protocol." }
      - { id: b, text: "Configure two default gateways on each VMkernel adapter", why: "A vmk netstack uses one default gateway; redundancy belongs to the network." }
      - { id: c, text: "Use beacon probing on the VDS", why: "Beacon probing detects upstream link failures; it does not provide a gateway." , confusedWith: vds }
      - { id: d, text: "Put the gateway on vCenter", why: "vCenter does not route infrastructure traffic." }
    explanation:
      correct: "A first hop redundancy protocol (VRRP/HSRP) presents one gateway IP served by either switch."
      concept: "First hop gateway availability (VCF-NET-REQD-GTW-001 and RCMD-GTW-001)."
      trap: "Host-side teaming protects the link to the switch, not the gateway function itself."

  # ---------------------------------------------------------------------------
  # dns-ntp-dependencies
  # ---------------------------------------------------------------------------
  - id: dns-ntp-001
    type: single
    kind: concept
    difficulty: foundation
    topics: [dns]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: concept
    diagnostic: networking
    stem: "Which DNS records does VCF 9 require for every management component?"
    options:
      - { id: a, text: "Forward (A) records only", why: "Reverse lookup is also validated." }
      - { id: b, text: "Forward (A) and reverse (PTR) records that match", correct: true, why: "VCF-NET-REQD-IPA-002: forward and reverse DNS records for all management components." }
      - { id: c, text: "CNAME aliases for each component", why: "Aliases cause validation failures for vCenter." }
      - { id: d, text: "SRV records", why: "Not a VCF component requirement." }
    explanation:
      correct: "Each component's FQDN must resolve to its IP and the IP back to the same FQDN."
      concept: "Forward and reverse DNS as a hard VCF dependency."
      trap: "Forward-only DNS is the classic cause of validation failures."
  - id: dns-ntp-002
    type: single
    kind: log
    difficulty: intermediate
    topics: [dns, deployment-validation]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: deep-dive
    context: |
      ```log
      Validation failed with the following errors:
        VcManager vcenterFQDN vcenter-01.lab.internal:
        Please ensure there are no DNS aliases configured for vCenter FQDN. vCenter IP 10.10.10.20 ...
      ```
      `nslookup vcenter-01.lab.internal` returns 10.10.10.20.
    stem: "What should you check next?"
    options:
      - { id: a, text: "The reverse lookup of 10.10.10.20 – it must return exactly one name, vcenter-01.lab.internal", correct: true, why: "The check verifies the IP uniquely resolves back to the FQDN; missing or duplicate PTRs fail it." }
      - { id: b, text: "The NTP offset of the VCF Installer", why: "The message is about DNS aliases.", confusedWith: ntp }
      - { id: c, text: "Whether vCenter responds to ping", why: "In a greenfield deployment vCenter does not exist yet." }
      - { id: d, text: "The certificate of the VCF Installer", why: "Unrelated to DNS validation.", confusedWith: certificates }
    explanation:
      correct: "Forward works, so test reverse; a missing PTR or a second PTR (alias) causes this message (KB 437102)."
      concept: "Uniqueness of reverse resolution."
      trap: "Pinging a not-yet-deployed vCenter is a red herring."
  - id: dns-ntp-003
    type: single
    kind: troubleshooting
    difficulty: advanced
    topics: [ntp, host-commissioning, certificates]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: failure-scenarios
    context: |
      Host commissioning fails at "Install Temporary VMCA Certificate For Host Commissioning".
      domainmanager.log: `java.net.NoRouteToHostException`
      operationsmanager.log: `Time validation failed. Check host Time and/or Certificate expiration data (notBefore, notAfter).`
      The credential validation subtask succeeded.
    stem: "What is the most likely root cause?"
    options:
      - { id: a, text: "Missing static route from SDDC Manager to the host subnet", why: "Credential validation reached the host; the routing-looking error is a symptom.", confusedWith: l2-l3 }
      - { id: b, text: "The host clock is far from SDDC Manager's time, typically because NTP (UDP 123) is not reaching the host", correct: true, why: "The time validation message plus a dropped TLS connection is the documented pattern (KB 448781)." }
      - { id: c, text: "The host's PTR record is missing", why: "DNS failures produce name/validation errors, not certificate time validation errors.", confusedWith: dns }
      - { id: d, text: "The vSAN disks are not claimed", why: "Unrelated to certificate installation." }
    explanation:
      correct: "A host whose clock is behind sees the new certificate as not yet valid; fix NTP reachability, resync, retry."
      concept: "Time skew breaks certificate validation."
      architecture: "SDDC Manager installs a temporary VMCA certificate on hosts during commissioning."
      trap: "NoRouteToHostException does not always mean routing."
  - id: dns-ntp-004
    type: single
    kind: command
    difficulty: intermediate
    topics: [ntp]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: ntp-sync-health-on-esx
    diagnostic: troubleshooting
    context: |
      ```shell
      [root@esx-05:~] ntpq -p
           remote        refid  st t when poll reach   delay   offset  jitter
      ======================================================================
       10.10.10.2      .INIT.  16 u    -   64    0    0.000    0.000   0.000
      ```
    stem: "What does this output tell you?"
    options:
      - { id: a, text: "The host is synchronized to 10.10.10.2", why: "No '*' and reach 0 mean it is not synchronized." }
      - { id: b, text: "The host has not received any NTP replies from 10.10.10.2", correct: true, why: "Reach 0 and stratum 16/.INIT. indicate no successful polls." }
      - { id: c, text: "NTP is disabled on the host", why: "ntpq shows a configured peer being polled." }
      - { id: d, text: "DNS resolution of the NTP server fails", why: "The peer is shown by IP and is being polled." }
    explanation:
      correct: "Reach is an octal bitmask of the last eight polls: 0 = none succeeded, 377 = all eight succeeded."
      concept: "Configured is not synchronized."
      trap: "esxcli system ntp get would show Enabled: true here too."
  - id: dns-ntp-005
    type: multi
    kind: concept
    difficulty: intermediate
    topics: [ntp, certificates]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: concept
    select: 2
    stem: "Which TWO problems are direct consequences of significant time skew between VCF components? (Choose two.)"
    options:
      - { id: a, text: "Certificates are rejected as not yet valid or expired", correct: true, why: "Certificate validity is time-based." }
      - { id: b, text: "Authentication tokens or Kerberos tickets are rejected", correct: true, why: "SSO tokens and Kerberos have validity windows." }
      - { id: c, text: "Jumbo frames are dropped", why: "MTU is unrelated to time.", confusedWith: mtu }
      - { id: d, text: "VLAN tags are stripped", why: "VLAN tagging is unrelated to time.", confusedWith: l2-l3 }
    explanation:
      correct: "Time is an input to certificate validation and to authentication protocols."
      concept: "Why NTP is a hard dependency."
      trap: "DNS and NTP failures often appear as certificate or login errors."
  - id: dns-ntp-006
    type: single
    kind: design
    difficulty: advanced
    topics: [dns, ntp, deployment-planning]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: designing-dns-and-ntp-for-vcf
    stem: "A customer plans to run their only DNS servers as VMs inside the VCF management domain they are about to deploy. What is the main design concern?"
    options:
      - { id: a, text: "DNS VMs cannot run on vSAN", why: "They can; that is not the issue." }
      - { id: b, text: "Circular dependency: DNS must exist before deployment, and a management domain outage would take name resolution down with it", correct: true, why: "DNS is an external prerequisite; place at least one copy outside the management domain." }
      - { id: c, text: "VCF requires Windows DNS", why: "Any standards-compliant DNS works." }
      - { id: d, text: "DNS VMs need jumbo frames", why: "DNS traffic is small." }
    explanation:
      correct: "External services must not depend on the infrastructure that depends on them."
      concept: "DNS and NTP as external services."
      trap: "Convenient consolidation can create a chicken-and-egg recovery problem."
  - id: dns-ntp-007
    type: single
    kind: troubleshooting
    difficulty: intermediate
    topics: [ntp]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: troubleshooting
    stem: "`vmkping -I vmk0 10.10.10.2` to the NTP server succeeds from a host, but ntpq shows reach 0. Which tool best proves whether UDP 123 replies arrive?"
    options:
      - { id: a, text: "`tcpdump-uw -n -i vmk0 host 10.10.10.2 and port 123`", correct: true, why: "Shows NTP requests leaving and whether replies return." }
      - { id: b, text: "`vmkping -d -s 8972 10.10.10.2`", why: "Tests MTU, not UDP 123.", confusedWith: mtu }
      - { id: c, text: "`esxcli network vswitch dvs vmware list`", why: "Shows switch configuration, not NTP traffic.", confusedWith: vds }
      - { id: d, text: "`nslookup 10.10.10.2`", why: "DNS is irrelevant when the peer is configured by IP." }
    explanation:
      correct: "A packet capture on the VMkernel adapter shows requests without replies when a firewall blocks UDP 123 (KB 442868, KB 443781)."
      concept: "ICMP reachability does not prove a UDP service is reachable."
      trap: "A successful ping is false reassurance."
  - id: dns-ntp-008
    type: cli
    kind: command
    difficulty: foundation
    topics: [dns]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: cli-api
    stem: "Type the esxcli command that lists the DNS servers an ESX host is configured to use."
    answers: ["esxcli network ip dns server list"]
    placeholder: "esxcli ..."
    explanation:
      correct: "`esxcli network ip dns server list` shows the DNSServers line."
      concept: "Verify which DNS servers the failing component actually uses."
      trap: "Testing from your laptop may use different DNS servers than the host."
  - id: dns-ntp-009
    type: ordering
    kind: troubleshooting
    difficulty: intermediate
    topics: [dns, troubleshooting-method]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: dns-ntp-dependencies
    section: troubleshooting
    stem: "Put the DNS troubleshooting steps for a failed VCF validation in the most efficient order."
    items:
      - { id: s1, text: "Read the exact validation message and note the FQDN/IP it names" }
      - { id: s2, text: "From the failing component, run a forward lookup of the FQDN" }
      - { id: s3, text: "Run a reverse lookup of the IP and count the names returned" }
      - { id: s4, text: "Repeat against each configured DNS server" }
      - { id: s5, text: "Fix the zone data at the source and rerun validation" }
    explanation:
      correct: "Message → forward → reverse → each server → fix and retry."
      concept: "Test from the failing component; test both directions; test every server."
      trap: "Fixing only one DNS server leads to intermittent failures."

  # ---------------------------------------------------------------------------
  # vsphere-distributed-switch
  # ---------------------------------------------------------------------------
  - id: vds-001
    type: single
    kind: architecture
    difficulty: foundation
    topics: [vds]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: vsphere-distributed-switch
    section: concept
    stem: "vCenter becomes unavailable. What happens to running VMs connected to a vSphere Distributed Switch?"
    options:
      - { id: a, text: "They lose network connectivity until vCenter returns", why: "The data plane runs on each host and keeps forwarding.", confusedWith: vcenter }
      - { id: b, text: "They keep forwarding traffic; only VDS configuration changes are impossible", correct: true, why: "vCenter is the management plane; host proxy switches are the data plane." }
      - { id: c, text: "They fail over to a standard switch automatically", why: "No such automatic migration exists." }
      - { id: d, text: "They are restarted by vSphere HA", why: "HA reacts to host failures, not vCenter outages.", confusedWith: vsphere-ha }
    explanation:
      correct: "The VDS configuration is cached on every host; forwarding continues without vCenter."
      concept: "VDS management plane vs data plane."
      trap: "Many learners think the VDS 'lives in vCenter'."
  - id: vds-002
    type: single
    kind: design
    difficulty: intermediate
    topics: [vds]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: vsphere-distributed-switch
    section: teaming-policies
    stem: "Which teaming policy does VCF 9 design guidance recommend for the ESX management, vMotion and storage distributed port groups?"
    options:
      - { id: a, text: "Route based on IP hash", why: "Requires EtherChannel/LACP on the physical switches." }
      - { id: b, text: "Route based on physical NIC load", correct: true, why: "VCF-VDS-COM-RCMD-DPG-004/005 and SDS-RCMD-DPG-001 recommend it; no switch configuration needed." }
      - { id: c, text: "Use explicit failover order", why: "Provides no load balancing." }
      - { id: d, text: "Route based on source MAC hash", why: "Not the VCF recommendation." }
    explanation:
      correct: "Load-based teaming rebalances when an uplink is busy and needs no physical switch configuration."
      concept: "Teaming policy selection."
      trap: "LBT is VDS-only and does not need LACP."
  - id: vds-003
    type: single
    kind: scenario
    difficulty: intermediate
    topics: [vds]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: vsphere-distributed-switch
    section: port-binding
    stem: "The management vCenter VM must be recoverable even when vCenter itself is down and its port must be reassigned. Which port binding does VCF 9 recommend for the VM management port group?"
    options:
      - { id: a, text: "Static binding", why: "Static ports are assigned through vCenter; recommended for other port groups." }
      - { id: b, text: "Ephemeral binding", correct: true, why: "VCF-VDS-COM-RCMD-DPG-001: ephemeral binding enables recovering the vCenter that manages the switch." }
      - { id: c, text: "Dynamic binding", why: "Deprecated option, not the recommendation." }
      - { id: d, text: "No binding – use a standard switch", why: "VCF uses the VDS." }
    explanation:
      correct: "Ephemeral ports are created at power-on without vCenter."
      concept: "Port binding types."
