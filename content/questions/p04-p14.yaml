    lesson: vsphere-distributed-switch
    section: real-world-scenario
    stem: "After an admin changed the vMotion port group teaming to 'Route based on IP hash', vMotion became unreliable and the switches log MAC flapping. No switch change was made. What is the best fix?"
    options:
      - { id: a, text: "Enable beacon probing", why: "Does not address the mismatch between IP hash and the switch." }
      - { id: b, text: "Revert to 'Route based on physical NIC load'", correct: true, why: "IP hash requires matching switch aggregation; LBT needs none and is the VCF recommendation." }
      - { id: c, text: "Increase the vMotion MTU", why: "MTU is not the problem.", confusedWith: mtu }
      - { id: d, text: "Disable NIOC", why: "NIOC does not cause MAC flapping." }
    explanation:
      correct: "IP hash spreads one MAC across several uplinks; without EtherChannel/LACP on the switch the MAC flaps between ports."
      concept: "Teaming policies that require switch configuration."
      trap: "More bandwidth comes from more/faster NICs, not mismatched hashing."
