    stem: "A network team proposes static EtherChannel between ESX hosts and ToR switches in a VCF 9 environment. What is the correct response?"
    options:
      - { id: a, text: "Accept – it is the VCF default", why: "Independent uplinks are the recommendation." }
      - { id: b, text: "Reject – static link aggregation is not supported; use independent uplinks (or LACP only where its conditions are met)", correct: true, why: "VCF 9 physical design: static aggregation unsupported, LACP with conditions, independent uplinks recommended." }
      - { id: c, text: "Accept, but only for vSAN traffic", why: "The restriction applies regardless of traffic type." }
      - { id: d, text: "Accept if beacon probing is enabled", why: "Unrelated." }
    explanation:
      correct: "VCF-NET-REQD-LAG-001 recommends that each host-to-switch connection operates as an independent uplink."
