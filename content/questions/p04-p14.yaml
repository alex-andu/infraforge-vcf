      correct: "With three NSX Manager nodes on three hosts, a fourth host keeps anti-affinity satisfied during maintenance."
      concept: "What drives minimum host counts."
      trap: "Minimum counts are not sizing results."
  - id: dsg-size-002
    type: single
    kind: scenario
    difficulty: advanced
    topics: [design-sizing, workload-domains]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: design-sizing-scalability
    section: components
    stem: "A customer plans five new workload domains over two years, each with its own NSX Manager cluster. Which resource must grow the most?"
    options:
      - { id: a, text: "The management domain, because each workload domain's vCenter and NSX Managers run there", correct: true, why: "Workload domain management appliances are deployed into the management domain." }
      - { id: b, text: "Only the workload domain hosts", why: "Ignores management appliances.", confusedWith: workload-domains }
      - { id: c, text: "The VCF Installer appliance", why: "Used for deployment, not to host domain components.", confusedWith: vcf-installer }
      - { id: d, text: "The DNS servers", why: "Records grow, but DNS load is negligible." }
    explanation:
      correct: "Size the management domain for all future workload domain vCenters and dedicated NSX Managers."
      concept: "Management domain sizing."
      trap: "Adding a workload domain consumes management capacity too."
  - id: dsg-size-003
    type: single
    kind: design
    difficulty: advanced
    topics: [design-sizing]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: design-sizing-scalability
    section: worked-example-cpu-ram
    stem: "Demand after growth and target utilisation is 160 cores and 4.9 TB RAM. Hosts have 64 cores and 1 TB RAM. How many hosts do you need including N+1?"
    options:
      - { id: a, text: "3", why: "Covers CPU only." }
      - { id: b, text: "4", why: "Covers CPU plus N+1, ignores RAM." }
      - { id: c, text: "5", why: "Covers RAM but no failure reserve." }
      - { id: d, text: "6", correct: true, why: "RAM needs 5 hosts (4.9 TB / 1 TB) plus one for N+1." }
    explanation:
      correct: "Compute both dimensions, take the larger (RAM: 5), then add N+1."
      concept: "Sizing by the constraining resource."
      trap: "CPU is not always the constraint."
  - id: dsg-size-004
    type: single
    kind: concept
    difficulty: foundation
    topics: [design-sizing, workload-domains]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: design-sizing-scalability
    section: scale-units-in-vcf
    stem: "According to the VCF 9 Workload Domain Models page, how many workload domains can a single VCF instance scale to?"
    options:
      - { id: a, text: "4", why: "Too low." }
      - { id: b, text: "12", why: "Not the documented value." }
      - { id: c, text: "24", correct: true, why: "Documented as up to 24 workload domains per VCF instance." }
      - { id: d, text: "Unlimited", why: "Limits apply." }
    explanation:
      correct: "Workload domains scale up to 24 per VCF instance; beyond that, add instances."
      concept: "Scale units: host, cluster, domain, instance."
      trap: "Always check ConfigMax for your exact version."
  - id: dsg-size-005
    type: single
    kind: design
    difficulty: expert
    topics: [design-sizing, design-availability]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: design-sizing-scalability
    section: how-it-works
    stem: "A stretched cluster has 8 hosts per AZ and runs at 80% average utilisation across all 16 hosts. What happens if one AZ fails?"
    options:
      - { id: a, text: "All VMs restart in the surviving AZ with no impact", why: "Eight hosts cannot absorb 160% of their capacity." }
      - { id: b, text: "Not all protected VMs can restart; each AZ should be sized to run the protected load alone (≈50% utilisation)", correct: true, why: "Stretched clusters need per-AZ capacity reserves." }
      - { id: c, text: "vSAN converts to RAID-0 to free capacity", why: "No such behavior.", confusedWith: vsan-policies }
      - { id: d, text: "The witness hosts the extra VMs", why: "The witness stores metadata only." }
    explanation:
      correct: "Surviving AZ must carry the protected workloads; plan ~50% utilisation per AZ for full protection."
      concept: "Failure reserve in stretched designs."
      trap: "N+1 is not enough for an AZ failure."
  - id: dsg-size-006
    type: truefalse
    kind: concept
    difficulty: foundation
    topics: [design-sizing, management-domain]
    objective: "4.1"
    objectiveItem: "4.1.3"
    lesson: design-sizing-scalability
    section: minimum-host-counts-management-domain
    stem: "True or false: With simple (non-HA) management components and external principal storage, VCF 9 documents a management domain minimum of two ESX hosts."
    options:
      - { id: "true", text: "True", correct: true, why: "Documented minimum: 3 hosts with vSAN or 2 with external storage for the simple deployment." }
      - { id: "false", text: "False", why: "Two hosts are documented for external storage with simple components." }
    explanation:
      correct: "Simple: 3 (vSAN) or 2 (external storage); HA: 4."
      concept: "Minimum host counts depend on storage type and component availability model."
      trap: "A minimum is not a recommendation for production."

  # ---------------------------------------------------------------------------
  # design-network-security-tradeoffs
  # ---------------------------------------------------------------------------
  - id: dsg-sec-001
    type: single
    kind: design
    difficulty: intermediate
    topics: [design-tradeoffs, nsx-security]
    objective: "2.4"
    objectiveItem: "2.4.4"
    lesson: design-network-security-tradeoffs
    section: the-isolation-ladder
    stem: "Requirement: web, app and database tiers of one application may only talk on approved ports. Admins and lifecycle are shared. What is the most appropriate construct?"
    options:
      - { id: a, text: "A separate workload domain per tier", why: "Massive over-design for a traffic requirement.", confusedWith: workload-domains }
      - { id: b, text: "NSX distributed firewall rules (microsegmentation)", correct: true, why: "Enforces east-west policy at each vNIC without new hardware or domains." }
      - { id: c, text: "A separate VCF instance", why: "Over-design." }
      - { id: d, text: "Storage separation switch model", why: "Separates storage paths, not app tiers.", confusedWith: vds }
    explanation:
      correct: "Traffic isolation between app tiers is the DFW's job."
      concept: "The isolation ladder: choose the lowest sufficient rung."
      trap: "Bigger isolation units add cost without adding traffic control."
  - id: dsg-sec-002
    type: single
    kind: design
    difficulty: advanced
    topics: [design-tradeoffs, workload-domains]
    objective: "4.1"
    objectiveItem: "4.1.7"
    lesson: design-network-security-tradeoffs
    section: how-it-works
    stem: "PCI workloads need separate administrators, a separate change window and a network control plane whose failure cannot affect other workloads. What is the least costly design that meets all three?"
    options:
      - { id: a, text: "DFW rules in the existing workload domain", why: "Does not separate admins, lifecycle or NSX management plane." }
      - { id: b, text: "A dedicated workload domain with a dedicated NSX Manager cluster", correct: true, why: "Separate vCenter/SSO and lifecycle plus an isolated network management/control plane." }
      - { id: c, text: "A dedicated workload domain sharing the existing NSX instance", why: "Meets admin and lifecycle but shares the NSX management plane." }
      - { id: d, text: "A separate VCF instance", why: "Meets the requirements but at higher cost than needed." }
    explanation:
      correct: "Each requirement maps to a construct: admins/lifecycle → workload domain; control plane isolation → dedicated NSX."
      concept: "Mapping requirement types to constructs."
      trap: "A shared NSX instance couples the domains' network management planes."
  - id: dsg-sec-003
    type: single
    kind: concept
    difficulty: intermediate
    topics: [design-tradeoffs, nsx-vpc]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: design-network-security-tradeoffs
    section: network-consumption-models-how-users-get-networks
    stem: "Which limitation does the VCF 9 documentation list for the VLAN network consumption model?"
    options:
      - { id: a, text: "It cannot be used with vSphere", why: "VLAN port groups are standard vSphere." }
      - { id: b, text: "It lacks network virtualization benefits and is tightly coupled to the physical network", correct: true, why: "As listed in the networking models." }
      - { id: c, text: "It requires NSX Federation", why: "No." , confusedWith: nsx-architecture }
      - { id: d, text: "It requires VCF Automation", why: "No." }
    explanation:
      correct: "VLANs are familiar but need physical network changes for every new network."
      concept: "Network consumption models."
      trap: "VLAN-backed networks do not give VPC-style self-service."
  - id: dsg-sec-004
    type: single
    kind: design
    difficulty: expert
    topics: [design-tradeoffs, vds]
    objective: "2.4"
    objectiveItem: "2.4.2"
    lesson: design-network-security-tradeoffs
    section: software-segmentation-vs-physical-separation
    stem: "A regulator requires that storage traffic never shares physical links or switches with VM traffic. Which approach satisfies this?"
    options:
      - { id: a, text: "DFW rules blocking VMs from the vSAN subnet", why: "Policy enforcement does not change the physical path.", confusedWith: nsx-security }
      - { id: b, text: "Storage separation distributed switch model with storage NICs connected to a separate storage fabric", correct: true, why: "Moves storage to dedicated NICs and, optionally, an air-gapped fabric." }
      - { id: c, text: "A separate VLAN for vSAN on the same NICs", why: "Still the same physical links." , confusedWith: l2-l3 }
      - { id: d, text: "NIOC with storage at High shares", why: "Prioritises bandwidth but still shares links." }
    explanation:
      correct: "Physical path requirements need physical separation (dedicated NICs/fabric)."
      concept: "Software segmentation vs physical separation."
      trap: "VLANs and DFW are logical separation only."
  - id: dsg-sec-005
    type: single
    kind: concept
    difficulty: advanced
    topics: [design-tradeoffs, identity-sso]
    objective: "4.1"
    objectiveItem: "4.1.7"
    lesson: design-network-security-tradeoffs
    section: management-plane-security
    stem: "What is the main trade-off of a fleet-wide VCF single sign-on scope?"
    options:
      - { id: a, text: "It cannot integrate with an external identity provider", why: "All scopes integrate with an IdP." }
      - { id: b, text: "Unified SSO across the fleet, but a single point of failure for fleet authentication", correct: true, why: "As listed in the VCF SSO models." }
      - { id: c, text: "It requires one Identity Broker per cluster", why: "No." }
      - { id: d, text: "It disables RBAC", why: "No.", confusedWith: rbac }
    explanation:
      correct: "Wider scope is simpler but has a larger blast radius; per-instance scope contains failures."
      concept: "Blast radius in identity design."
      trap: "Simplicity and blast radius trade off against each other."
  - id: dsg-sec-006
    type: single
    kind: design
    difficulty: advanced
    topics: [design-tradeoffs, nsx-edge]
    objective: "2.4"
    objectiveItem: "2.4.3"
    lesson: design-network-security-tradeoffs
    section: components
    stem: "Several tenants share one NSX edge cluster. One tenant's traffic spikes regularly degrade others' north-south throughput. Which change addresses this with the smallest scope?"
    options:
      - { id: a, text: "Give that tenant a dedicated edge cluster", correct: true, why: "Isolates north-south capacity and failure for the noisy tenant." }
      - { id: b, text: "Move all tenants to separate VCF instances", why: "Far larger change than needed." }
      - { id: c, text: "Disable the distributed firewall", why: "Unrelated to edge throughput and weakens security.", confusedWith: nsx-security }
      - { id: d, text: "Increase the TEP MTU to 9216 on hosts", why: "Exceeds the VDS maximum and does not address edge capacity.", confusedWith: mtu }
    explanation:
      correct: "Shared edges are efficient but share capacity; dedicated edges isolate it."
      concept: "Shared vs dedicated edge clusters."
      trap: "Solve capacity isolation at the edge layer, not with a new instance."
