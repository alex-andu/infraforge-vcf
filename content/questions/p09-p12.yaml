      - { id: b, text: "A precheck with no errors run shortly before the window", correct: true, why: "Prevents most failures from happening at all." }
      - { id: c, text: "Enough cluster capacity to evacuate one host at a time and free disk space on appliances", correct: true, why: "Capacity and space failures are common causes." }
      - { id: d, text: "Enhanced Linked Mode enabled between all vCenters", why: "Unrelated to lifecycle recovery; and VCF SSO requires ELM to be deactivated.", confusedWith: identity-sso }
      - { id: e, text: "DRS set to manual so VMs do not move during the upgrade", why: "Remediation needs DRS to evacuate hosts; manual DRS blocks it.", confusedWith: drs }
    explanation:
      correct: "Backups, clean prechecks and capacity are the preparation that turns failures into retries."
      concept: "Preparation is the recovery plan."
      trap: "DRS manual mode looks 'safe' but stalls remediation."

