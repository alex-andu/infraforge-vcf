  # ---------------------------------------------------------------- failures and recovery
  - id: lcm-033
    type: single
    kind: log
    difficulty: advanced
    version: vcf9
    topics: [lcm-recovery, logs-locations]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-failures-recovery
    section: real-examples-decoded
    context: |
      Task error: VCENTER upgrade bundle is not compatible with your existing version
      ```log
      ERROR ... Exception while fetching the current version for hosts belonging to vcenter with cluster MOID: domain-c12
      java.lang.NullPointerException ...
      ```
    stem: "What is the most likely root cause, and what should you do?"
    options:
      - { id: a, text: "The downloaded vCenter bundle is corrupt; delete and download it again", why: "The message mentions compatibility, but the log shows a failure reading host versions." }
      - { id: b, text: "A host in cluster domain-c12 is Not Responding or Disconnected; restore its connectivity (or remove it from the cluster) and retry", correct: true, why: "KB 390255: unresponsive hosts make the LCM service fail to read host versions." }
      - { id: c, text: "vCenter must be upgraded manually with the CLI installer", why: "The workflow is fine once the host state is fixed." }
      - { id: d, text: "Roll back NSX, which was upgraded earlier", why: "NSX is not involved in this error, and rollback is not the first step." }
    explanation:
      correct: "The top-level message is a symptom; the log points to unresponsive hosts in a specific cluster."
      concept: "Error text vs root cause in logs."
      architecture: "SDDC Manager queries vCenter for host versions during pre-validation."
      trap: "'Not compatible' sounds like a binaries problem; read the log before re-downloading."

