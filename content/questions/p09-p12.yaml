  - id: sec-012
    type: single
    kind: log
    difficulty: advanced
    version: vcf9
    topics: [certificates]
    objective: "4.2"
    objectiveItem: "4.2.4"
    lesson: certificate-management
    section: reading-a-chain-problem
    context: |
      Run on the SDDC Manager appliance after vCenter's certificate was replaced:
      ```log
      $ openssl s_client -connect vcenter-mgmt.lab.local:443 -servername vcenter-mgmt.lab.local -showcerts
      depth=0 CN = vcenter-mgmt.lab.local
      verify error:num=20:unable to get local issuer certificate
      verify error:num=21:unable to verify the first certificate
       0 s:CN = vcenter-mgmt.lab.local
         i:DC = local, DC = lab, CN = LAB-ISSUING-CA
      Verify return code: 21 (unable to verify the first certificate)
      ```
    stem: "What does this output tell you?"
    options:
      - { id: a, text: "The certificate has expired", why: "Expiry would show 'certificate has expired' (error 10)." }
      - { id: b, text: "The client cannot build a chain to a trusted root: the issuing CA (and its root) is not trusted on this appliance and/or the server does not send the intermediate", correct: true, why: "Errors 20/21 mean the issuer is unknown to the client and only the leaf was sent." }
      - { id: c, text: "The SAN does not match the hostname", why: "s_client reports chain errors here; a name mismatch is reported by the application, and the CN shown matches." }
      - { id: d, text: "DNS resolution failed", why: "The connection succeeded and a certificate was received.", confusedWith: dns }
    explanation:
      correct: "Fix trust: send the full chain from the server and make sure the client trusts the root; replace through VCF Operations so VCF components get the chain."
      concept: "Chain building and trust stores."
      trap: "Run the test from the failing client, not only from a laptop that already trusts the CA."

