      - { id: d, text: "The browser console", why: "The UI only displays the task result." }
    explanation:
      correct: "Engine log first, then the target component's own logs."
      concept: "Two engines, two log trails."
      trap: "The task was started in VCF Operations, but VCF Operations is not the engine for core components."

