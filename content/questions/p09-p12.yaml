  - id: lcm-036
    type: single
    kind: scenario
    difficulty: advanced
    version: vcf9
    topics: [lcm-recovery]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-failures-recovery
    section: real-examples-decoded
    context: |
