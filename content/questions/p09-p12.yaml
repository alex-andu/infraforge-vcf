    stem: "What is the best next action?"
    options:
      - { id: a, text: "Retry again during a quieter period", why: "Identical failures mean the cause is still present." }
      - { id: b, text: "Stop retrying, inspect the appliance nodes and logs (for example disk and log file growth), fix the cause, then retry", correct: true, why: "KB 425321: /var/log/messages growth on VCFA nodes caused the timeout; truncating it allowed the retry to succeed." }
      - { id: c, text: "Delete the VCF Automation appliance and redeploy an empty one", why: "Destroys tenant configuration; not an upgrade fix." }
      - { id: d, text: "Upgrade SDDC Manager first", why: "SDDC Manager does not upgrade VCF Automation.", confusedWith: sddc-manager }
    explanation:
      correct: "Retry is only useful after the cause is fixed."
      concept: "Fix, then retry."
      trap: "Repeated retries waste the maintenance window."

  - id: lcm-037
    type: single
    kind: scenario
    difficulty: expert
    version: vcf9
    topics: [lcm-recovery, lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-failures-recovery
    section: retry-first-restore-last
    context: |
      In a workload domain upgrade, NSX completed. The vCenter upgrade then failed in pre-validation because of a
      transient storage problem that has now been fixed. The change manager asks you to "roll back NSX and everything
      else" to be safe.
    stem: "What do you recommend?"
    options:
      - { id: a, text: "Retry the vCenter upgrade now that the cause is fixed, then continue the sequence; VCF upgrades are forward-only and there is no generic rollback", correct: true, why: "The state is consistent (NSX ahead is expected in the sequence) and the cause is resolved." }
      - { id: b, text: "Restore NSX from backup, then restart the whole domain upgrade", why: "Creates risk and downtime without fixing anything; NSX on the new version is a valid intermediate state." }
      - { id: c, text: "Skip vCenter and upgrade ESX now", why: "vCenter must precede ESX." }
      - { id: d, text: "Use the planner to select an older NSX target", why: "Upgrades are forward-only." }
    explanation:
      correct: "Fix and retry from the failed stage; restore only if a component is left unusable."
      concept: "Retry first, restore last; forward-only."
      trap: "'Rollback to be safe' is usually the less safe option."

