questions:
  # ---------------------------------------------------------------- lifecycle concepts
  - id: lcm-001
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [lcm-concepts, fleet-management]
    objective: "4.2"
    objectiveItem: "4.2.1"
    lesson: lifecycle-concepts
    section: what-gets-lifecycle-managed
    stem: "In VCF 9.0, where does an administrator plan and start upgrades of both management components and core components?"
    options:
      - { id: a, text: "In the SDDC Manager UI, Lifecycle Management page", why: "That was the VCF 5.x location. In 9.0 the day-N lifecycle UI moved to VCF Operations.", confusedWith: sddc-manager }
      - { id: b, text: "In the VCF Operations console, Fleet Management > Lifecycle", correct: true, why: "VCF Operations is the single console for lifecycle, with VCF Management and VCF Instances views." }
      - { id: c, text: "In the vSphere Client, Lifecycle Manager tab of each cluster", why: "vLCM in vCenter remediates hosts, but VCF upgrades are planned and orchestrated from VCF Operations.", confusedWith: vlcm }
      - { id: d, text: "In the VCF Installer appliance", why: "The VCF Installer deploys a new fleet; it is not the day-N lifecycle console.", confusedWith: vcf-installer }
    explanation:
      correct: "VCF Operations > Fleet Management > Lifecycle is where binaries, prechecks, plans and updates are managed for the whole fleet in VCF 9.0."
      concept: "One lifecycle console, two engines: fleet management (management components) and SDDC Manager (core components)."
      architecture: "VCF Operations drives the fleet management appliance and each instance's SDDC Manager; SDDC Manager in turn drives NSX, vCenter and vLCM."
      trap: "SDDC Manager still does the work for core components, so it is tempting to answer 'SDDC Manager UI'. In 9.0 you drive it from VCF Operations."
    diagnostic: vcf

  - id: lcm-002
    type: single
    kind: architecture
    difficulty: foundation
    version: vcf9
    topics: [lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: what-gets-lifecycle-managed
    stem: "Binaries for which components are downloaded to the VCF Operations fleet management appliance?"
    options:
      - { id: a, text: "SDDC Manager, vCenter, NSX Manager and ESX", why: "Those are core components; their binaries go to SDDC Manager of each instance.", confusedWith: sddc-manager }
      - { id: b, text: "VCF Operations, VCF Automation, VCF Operations for logs and for networks, VCF Identity Broker and fleet management itself", correct: true, why: "These are the VCF management components handled by fleet management." }
      - { id: c, text: "Only ESX components for vLCM images", why: "ESX component data belongs to SDDC Manager (and the umds-patch-store on an offline depot)." }
      - { id: d, text: "All VCF components, because fleet management replaced SDDC Manager", why: "SDDC Manager was not replaced; it still owns core component binaries and upgrades." }
    explanation:
      correct: "TechDocs: fleet management handles binaries for management components; SDDC Manager handles binaries for core components in each VCF instance."
      concept: "Management components vs core components."
      architecture: "Fleet-wide components are few, so one engine serves the fleet; core components are per instance, so each SDDC Manager owns its own."
      trap: "Do not assume fleet management replaced SDDC Manager."
    diagnostic: vcf

  - id: lcm-003
    type: multi
    select: 3
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: what-gets-lifecycle-managed
    stem: "Which three of these are VCF **core components** whose lifecycle is orchestrated by SDDC Manager? (Choose three.)"
    options:
      - { id: a, text: "vCenter", correct: true, why: "Core component, upgraded by SDDC Manager after NSX." }
      - { id: b, text: "NSX Manager", correct: true, why: "Core component, upgraded by SDDC Manager." }
      - { id: c, text: "ESX", correct: true, why: "Core component, remediated through vLCM under SDDC Manager orchestration." }
      - { id: d, text: "VCF Identity Broker", why: "A management component, lifecycle-managed by fleet management.", confusedWith: identity-sso }
      - { id: e, text: "VCF Operations for logs", why: "A management component handled by fleet management.", confusedWith: vcf-ops-logs }
    explanation:
      correct: "TechDocs classifies SDDC Manager, vCenter, NSX Manager and ESX as core components."
      concept: "Component families decide which engine and which binary store apply."
      architecture: "Core components live in each domain of each VCF instance; management components are fleet-level."
      trap: "The Identity Broker can run embedded in vCenter, but as a product it is a management component."

  - id: lcm-004
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: how-it-works
    context: |
      A VCF fleet runs in a plant network with no route to the internet. The appliances can reach an internal Linux
      web server. A DMZ workstation can reach Broadcom.
    stem: "Which binary management approach fits best?"
    options:
      - { id: a, text: "Online depot through the plant proxy", why: "There is no internet path from the plant, so an online depot cannot be used." }
      - { id: b, text: "Offline depot: populate the internal web server with the VCF Download Tool from the DMZ workstation and point the appliances to it", correct: true, why: "Exactly the offline depot use case: appliances reach an internal server that you fill from a machine with internet access." }
      - { id: c, text: "Copy ISO images to each ESX host datastore", why: "VCF lifecycle does not consume ISOs on datastores, and vCenter 9.0 removed ISO import in vLCM.", confusedWith: vlcm }
      - { id: d, text: "Redeploy with the VCF Installer for each new version", why: "Upgrades are done in place through lifecycle management, not by redeploying." }
    explanation:
      correct: "An offline depot is the documented method when appliances cannot reach the internet but can reach a computer/web server that can be populated from one that does."
      concept: "Online depot, offline depot and no depot."
      architecture: "Fleet management and each SDDC Manager are pointed at the depot URL; the depot must be HTTPS and trusted."
      trap: "'Offline' does not mean 'no network'; it means no internet. 'No depot' is the manual upload case."

  - id: lcm-005
    type: truefalse
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [lcm-concepts, lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: release-types
    stem: "True or false: according to Broadcom's VCF 9.0 update sequence guidance, patches can be applied in any order, while the documented order matters for major and minor releases."
    options:
      - { id: "true", text: "True", correct: true, why: "KB 390634 states that patches can be applied in any order and the order only matters for major/minor releases." }
      - { id: "false", text: "False", why: "The KB explicitly relaxes ordering for patches." }
    explanation:
      correct: "Patches are not synchronised across components and can be applied independently."
      concept: "Release types: major, minor, maintenance, patch."
      trap: "Do not over-apply the strict sequence to patches; do not under-apply it to upgrades."

  - id: lcm-006
    type: single
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: release-types
    stem: "Moving a domain from VCF 9.0.0.0 to 9.0.1.0 is which type of release according to TechDocs?"
    options:
      - { id: a, text: "Major", why: "Major releases are platform generations with breaking changes (for example 5.x to 9.0)." }
      - { id: b, text: "Minor", why: "Minor releases are feature releases within a major version (for example 9.0 to 9.1)." }
      - { id: c, text: "Maintenance", correct: true, why: "TechDocs uses 9.0.0.0 to 9.0.1.0 as its maintenance update example." }
      - { id: d, text: "Patch", why: "Patches are time-sensitive fixes between releases and are not synchronised across components." }
    explanation:
      correct: "Maintenance releases are scheduled cumulative updates (stability, bug and security fixes)."
      concept: "VCF release types."
      trap: "The third digit looks small, but it is not a 'patch' in VCF's vocabulary."

  - id: lcm-007
    type: single
    kind: troubleshooting
    difficulty: advanced
    version: vcf9
    topics: [lcm-concepts, lcm-recovery]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: depot-structure
    context: |
      An offline depot web server serves /depot/PROD and /depot/umds-patch-store. Basic authentication was enabled on
      the whole site. SDDC Manager connects and shows SDDC Manager, NSX and vCenter binaries, but no ESX components.
    stem: "What is the most likely cause?"
    options:
      - { id: a, text: "The umds-patch-store path must be reachable without authentication", correct: true, why: "The depot layout expects basic auth only on PROD; ESX content in umds-patch-store must stay unauthenticated." }
      - { id: b, text: "ESX binaries are always downloaded by fleet management, not SDDC Manager", why: "ESX content belongs to SDDC Manager.", confusedWith: fleet-management }
      - { id: c, text: "The download token expired", why: "An expired token would affect downloads into the depot, not the selective visibility of one path." }
      - { id: d, text: "vSAN HCL data is missing", why: "HCL data affects compatibility checks, not the listing of ESX components." }
    explanation:
      correct: "William Lam's 9.0 depot deep dive: basic auth applies to PROD only; umds-patch-store must remain unauthenticated."
      concept: "Depot structure: PROD tree vs UMDS patch store."
      architecture: "ESX content is produced by UMDS through the VCF Download Tool and consumed by SDDC Manager."
      trap: "Partial visibility (some binaries yes, ESX no) points at a path-level problem, not at entitlement."

  - id: lcm-008
    type: single
    kind: troubleshooting
    difficulty: intermediate
    version: vcf9
    topics: [lcm-concepts, certificates]
    objective: "4.2"
    objectiveItem: "4.2.4"
    lesson: lifecycle-concepts
    section: troubleshooting
    context: |
      You built an offline depot on an HTTPS web server whose certificate is issued by your internal lab CA. Connecting
      SDDC Manager to the depot fails with a TLS/certificate error. A browser on your laptop opens the depot URL without a warning.
    stem: "What should you do?"
    options:
      - { id: a, text: "Switch the web server to plain HTTP for production use", why: "The depot is expected to be HTTPS; weakening it is not the fix (HTTP shortcuts exist only for labs and are version specific)." }
      - { id: b, text: "Import the internal CA root certificate into the consuming appliance's trust store, then reconnect", correct: true, why: "The appliance must trust the depot's issuing CA; your laptop already trusts it, the appliance does not." }
      - { id: c, text: "Regenerate the download token", why: "The token is about entitlement to Broadcom downloads, not TLS to your server." }
      - { id: d, text: "Upgrade SDDC Manager first", why: "You cannot upgrade without binaries; and the version is not the issue." }
    explanation:
      correct: "TLS trust is evaluated by the client: the SDDC Manager (or fleet management) appliance must trust the CA that signed the depot certificate."
      concept: "Trust is per client trust store."
      architecture: "Offline depot = internal HTTPS server consumed by VCF appliances."
      trap: "A clean browser on your laptop proves nothing about the appliance's trust store."

  - id: lcm-009
    type: matching
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: release-types
    stem: "Match each VCF release type with its description."
    pairs:
      - { id: p1, left: "Major", right: "Significant platform evolution, possible breaking changes, fully synchronised" }
      - { id: p2, left: "Minor", right: "New features within a major version, non-disruptive, fully synchronised" }
      - { id: p3, left: "Maintenance", right: "Scheduled cumulative stability, bug and security fixes with component selection flexibility" }
      - { id: p4, left: "Patch", right: "Time-sensitive security/critical fixes between releases, not synchronised across components" }
    explanation:
      correct: "These are the four release types in the VCF 9.0 lifecycle documentation."
      concept: "Release type decides planning effort and ordering rules."
      trap: "Maintenance and patch are often confused; only patches are explicitly unsynchronised."

  - id: lcm-010
    type: single
    kind: scenario
    difficulty: expert
    version: vcf9
    topics: [lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: release-types
    context: |
      A domain runs a recent 9.0 maintenance build. A colleague downloads a component build with a higher-looking
      version number from an older release train (released earlier than your current build) and asks why the planner
      does not offer it as a target.
    stem: "What is the explanation?"
    options:
      - { id: a, text: "VCF upgrades are forward-only: the target must have been released after the current version's release date", correct: true, why: "TechDocs describes strict validation that upgrades only proceed to versions released after the current one." }
      - { id: b, text: "The binary must first be imported into vLCM", why: "vLCM import applies to ESX images, not to choosing VCF target versions.", confusedWith: vlcm }
      - { id: c, text: "Flexible BOM must be enabled in SDDC Manager settings", why: "Flexible BOM is an option in the planner (Customize Upgrade), and it still only allows supported, forward targets.", confusedWith: lcm-workflow }
      - { id: d, text: "The download token does not include that version", why: "Entitlement is not the reason the planner rejects older-dated releases." }
    explanation:
      correct: "VCF enforces forward-only upgrades by release date, whichever version number looks higher."
      concept: "Forward-only upgrade validation."
      trap: "Version numbers across trains are not a reliable 'newer' signal; release dates are what VCF checks."

  - id: lcm-011
    type: cli
    kind: command
    difficulty: intermediate
    version: vcf9
    topics: [lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: cli-api
    context: |
      Your download token is stored in /root/token. You want to list the INSTALL binaries of VCF 9.0.1 for the VCF SKU
      using the VCF Download Tool (options as in the lesson).
    stem: "Type the command."
    answers:
      - "vcf-download-tool binaries list --depot-download-token-file=/root/token --vcf-version=9.0.1 --type=INSTALL --sku=VCF"
      - "vcf-download-tool binaries list --depot-download-token-file=/root/token --vcf-version=9.0.1 --sku=VCF --type=INSTALL"
    placeholder: "vcf-download-tool ..."
    explanation:
      correct: "The binaries list subcommand with the token file, version, type and SKU lists what can be downloaded."
      concept: "The VCF Download Tool builds offline depots."
      trap: "Use 'binaries list' to plan; 'binaries download' needs a target directory (-d)."

  - id: lcm-012
    type: single
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [lcm-concepts, lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-concepts
    section: the-bill-of-materials-bom
    stem: "What does the flexible BOM option (Customize Upgrade) in the VCF 9.0 upgrade planner allow?"
    options:
      - { id: a, text: "Selecting any supported target version for each core component, validated by VCF, which then computes the update order", correct: true, why: "That is the documented flexible BOM capability." }
      - { id: b, text: "Upgrading ESX before vCenter to reduce downtime", why: "The sequence is still generated by VCF; vCenter precedes ESX.", confusedWith: lcm-workflow }
      - { id: c, text: "Installing any version, including unsupported combinations, at your own risk", why: "Selections are validated; unsupported combinations are rejected." }
      - { id: d, text: "Skipping the precheck", why: "A completed precheck remains a prerequisite." }
    explanation:
      correct: "Customize Upgrade lets you pick a target per core component in the Target Version column, then Validate Selection and Confirm."
      concept: "BOM vs flexible BOM."
      trap: "Flexibility is bounded by VCF's compatibility validation."

  # ---------------------------------------------------------------- upgrade workflow
  - id: lcm-013
    type: ordering
    kind: concept
    difficulty: intermediate
    version: vcf9
    topics: [lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: the-order-and-the-reason-for-it
    stem: "Put the VCF 9.0 maintenance update in the documented order for a fleet with one instance (management domain only)."
    items:
      - { id: i1, text: "VCF Operations fleet management appliance" }
      - { id: i2, text: "VCF Operations" }
      - { id: i3, text: "Remaining management components (logs, Automation, Identity Broker, networks)" }
      - { id: i4, text: "SDDC Manager" }
      - { id: i5, text: "NSX" }
      - { id: i6, text: "vCenter" }
      - { id: i7, text: "ESX hosts" }
      - { id: i8, text: "vSAN" }
    explanation:
      correct: "Management components first (fleet management, VCF Operations, the rest), then core components SDDC Manager, NSX, vCenter, ESX, vSAN."
      concept: "Manager before managed; management before workload."
      architecture: "Each engine is upgraded before the components it upgrades."
      trap: "VCF Operations is not first; fleet management is. And NSX precedes vCenter."

  - id: lcm-014
    type: ordering
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: the-order-and-the-reason-for-it
    stem: "Order the core components of the management domain for a maintenance update."
    items:
      - { id: i1, text: "SDDC Manager" }
      - { id: i2, text: "NSX" }
      - { id: i3, text: "vCenter" }
      - { id: i4, text: "ESX hosts" }
      - { id: i5, text: "vSAN" }
    explanation:
      correct: "TechDocs: SDDC Manager, NSX, vCenter, ESX hosts, vSAN; workload domains follow in the same order."
      concept: "Core component sequence."
      trap: "vCenter before ESX is intuitive; NSX before vCenter is the part people miss."
    diagnostic: vcf

  - id: lcm-015
    type: ordering
    kind: scenario
    difficulty: advanced
    version: vcf9
    topics: [lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: core-components-vcf-instances-tab-per-domain
    stem: "Binaries are downloaded. Order the steps to upgrade a domain's core components in VCF Operations."
    items:
      - { id: i1, text: "Open Fleet Management > Lifecycle > VCF Instances > domain > Updates" }
      - { id: i2, text: "Run Precheck and resolve the issues" }
      - { id: i3, text: "Click Plan Upgrade and choose the target VCF version" }
      - { id: i4, text: "Customize Upgrade, set target versions, Validate Selection and Confirm" }
      - { id: i5, text: "Review the generated update sequence and click Done" }
      - { id: i6, text: "Update Now or Schedule Update for each component" }
    explanation:
      correct: "This is the documented planner flow for core components."
      concept: "Precheck, plan, (customize), review, execute."
      trap: "The precheck comes before planning, not after scheduling."

  - id: lcm-016
    type: single
    kind: concept
    difficulty: foundation
    version: vcf9
    topics: [lcm-workflow, fleet-management]
    objective: "4.2"
    objectiveItem: "4.2.1"
    lesson: lifecycle-upgrade-workflow
    section: management-components-vcf-management-tab
    stem: "Which component must be upgraded or patched before any other VCF management component?"
    options:
      - { id: a, text: "VCF Operations", why: "VCF Operations is second.", confusedWith: vcf-ops-architecture }
      - { id: b, text: "VCF Operations fleet management appliance", correct: true, why: "TechDocs: it must be upgraded or patched before the remaining management components." }
      - { id: c, text: "SDDC Manager", why: "SDDC Manager is first among core components, after the management components.", confusedWith: sddc-manager }
      - { id: d, text: "VCF Identity Broker", why: "It is one of the remaining management components, in any preferred order.", confusedWith: identity-sso }
    explanation:
      correct: "Fleet management is the engine that upgrades the other management components, so it goes first."
      concept: "Engine before engine-managed components."
      trap: "VCF Operations is the console you click in, but not the first thing upgraded."

  - id: lcm-017
    type: single
    kind: scenario
    difficulty: advanced
    version: vcf9
    topics: [lcm-workflow, lcm-concepts]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: multiple-instances-and-shared-nsx
    context: |
      A fleet has two VCF instances, each with a management domain and one workload domain. Management components
      are already on the target version.
    stem: "Which statement about the core component upgrades is correct?"
    options:
      - { id: a, text: "Each instance's SDDC Manager upgrades its own core components; in each instance, the management domain goes before its workload domain", correct: true, why: "Core components are per instance with their own SDDC Manager, binaries and locks." }
      - { id: b, text: "One SDDC Manager upgrades both instances in parallel", why: "There is one SDDC Manager per instance; each owns its instance." }
      - { id: c, text: "Workload domains of both instances must be upgraded before any management domain", why: "Management domain first within each instance." }
      - { id: d, text: "Fleet management upgrades vCenter and NSX in both instances", why: "Fleet management handles management components, not core components.", confusedWith: fleet-management }
    explanation:
      correct: "Core binaries are downloaded to and applied by each instance's SDDC Manager."
      concept: "Fleet-level vs instance-level lifecycle."
      trap: "Management components are once per fleet; core components are per instance."

  - id: lcm-018
    type: single
    kind: troubleshooting
    difficulty: advanced
    version: vcf9
    topics: [lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: resource-locks
    context: |
      While ESX hosts in cluster wld01-cl01 are being upgraded through VCF, a colleague tries to commission a new host
      and add it to wld01-cl01. The task is rejected. Adding a host to a different domain at the same time succeeds.
    stem: "What explains this behaviour?"
    options:
      - { id: a, text: "SDDC Manager holds a resource lock on the domain/cluster being upgraded, blocking conflicting host operations there", correct: true, why: "Host add/remove/commission is blocked for the same domain and cluster as the active upgrade, allowed elsewhere." }
      - { id: b, text: "The new host is on a different ESX version and must be imaged first", why: "That could cause a different error, but does not explain why the same operation succeeds in another domain." }
      - { id: c, text: "VCF Operations licensing is exceeded", why: "Licensing would not depend on which domain is targeted during an upgrade.", confusedWith: licensing }
      - { id: d, text: "Host commissioning is always disabled during any lifecycle task anywhere in the fleet", why: "Locks are scoped (SYSTEM, DOMAIN, CLUSTER); operations elsewhere can continue." }
    explanation:
      correct: "Resource locks prevent concurrent day-N operations on the resources being upgraded."
      concept: "SYSTEM, DOMAIN and CLUSTER locks."
      trap: "The 'works elsewhere' detail rules out a global block and points to scoped locks."

  - id: lcm-019
    type: multi
    select: 3
    kind: concept
    difficulty: advanced
    version: vcf9
    topics: [lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: resource-locks
    stem: "Which three operations does TechDocs list as blocked in all core component upgrade scenarios? (Choose three.)"
    options:
      - { id: a, text: "SDDC Manager upgrades or patches", correct: true, why: "Listed as blocked in all scenarios." }
      - { id: b, text: "Backup and restore", correct: true, why: "Listed as blocked in all scenarios." }
      - { id: c, text: "Certificate rotation for management components", correct: true, why: "Listed as blocked in all scenarios.", confusedWith: certificates }
      - { id: d, text: "Viewing dashboards in VCF Operations", why: "Monitoring is not a day-N lifecycle operation; it is not locked." }
      - { id: e, text: "Commissioning a host into a different domain that does not share NSX", why: "Host operations in other domains/clusters can be permitted." }
    explanation:
      correct: "TechDocs lists SDDC Manager upgrades/patches, backup and restore, certificate rotation for management components and concurrent upgrades of the same component type."
      concept: "Plan certificate, password and backup work outside upgrade windows."
      trap: "Read-only operations are not locked."

  - id: lcm-020
    type: single
    kind: scenario
    difficulty: intermediate
    version: vcf9
    topics: [lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: prechecks
    context: |
      The precheck for a workload domain returns one error (a host is disconnected) and two warnings.
    stem: "What should you do before clicking Plan Upgrade?"
    options:
      - { id: a, text: "Ignore the error; errors are informational", why: "Errors block the upgrade." }
      - { id: b, text: "Fix the error, read and assess the warnings, then re-run the precheck", correct: true, why: "Resolve blocking issues, consciously accept or fix warnings, confirm with a new precheck." }
      - { id: c, text: "Start the upgrade; it will reconnect the host automatically", why: "The upgrade does not repair host connectivity; it fails on it (see KB 390255).", confusedWith: lcm-recovery }
      - { id: d, text: "Disable the precheck in SDDC Manager properties", why: "Disabling validation is a KB-specific workaround with support guidance, not normal practice." }
    explanation:
      correct: "A clean precheck is a documented prerequisite; re-running it is cheap and read-only."
      concept: "Errors block, warnings inform."
      trap: "Precheck findings are much cheaper to fix now than mid-upgrade."

  - id: lcm-021
    type: single
    kind: design
    difficulty: intermediate
    version: vcf9
    topics: [lcm-workflow]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: the-order-and-the-reason-for-it
    context: |
      A team wants to upgrade a production workload domain first "to get experience" before touching the management domain.
    stem: "What is the correct guidance?"
    options:
      - { id: a, text: "Upgrade the management domain core components first, then workload domains in the same component order", correct: true, why: "The documented order is management domain, then workload domains." }
      - { id: b, text: "Workload domains first is fine because SDDC Manager is shared", why: "SDDC Manager is upgraded as part of the management domain stage, before any workload domain." }
      - { id: c, text: "Upgrade all vCenters in all domains first, then all NSX", why: "The order is per domain: SDDC Manager, NSX, vCenter, ESX, vSAN." }
      - { id: d, text: "It does not matter for maintenance releases", why: "Ordering matters for major/minor/maintenance; only patches are free order." }
    explanation:
      correct: "Management domain hosts the components that manage everything else; it goes first."
      concept: "Management before workload."
      trap: "Gaining experience belongs in a lab, not in production order changes."

  - id: lcm-022
    type: single
    kind: troubleshooting
    difficulty: expert
    version: vcf9
    topics: [lcm-workflow, lcm-recovery]
    objective: "4.2"
    objectiveItem: "4.2.7"
    lesson: lifecycle-upgrade-workflow
    section: how-vcenter-is-upgraded
    context: |
      After an SDDC Manager driven vCenter upgrade, the new vCenter is running and working, but the inventory shows
      the original vCenter VM powered off and the new VM still has a temporary name. The post-upgrade task failed.
      The ESX host running both VMs was briefly Not Responding during the task.
    stem: "What is the best course of action?"
    options:
      - { id: a, text: "Power the original vCenter back on to roll back", why: "The upgrade completed; running two vCenters with the same identity would cause conflicts." }
      - { id: b, text: "Restore host connectivity, then complete the cleanup: verify the original VM is off, rename it, rename the new VM to the original name, delete the old VM", correct: true, why: "This matches KB 427385 for a failed post-upgrade cleanup." }
      - { id: c, text: "Restore vCenter from file-based backup", why: "The new vCenter works; restore is unnecessary and risky." }
      - { id: d, text: "Re-run the full vCenter upgrade from the start", why: "The data migration and switchover already completed; only cleanup is missing." }
    explanation:
      correct: "SDDC Manager's vCenter upgrade deploys a new VM, migrates, switches over, powers off and deletes the original, and renames the new VM. If the cleanup fails, finish it manually after fixing the host."
      concept: "Reduced downtime vCenter upgrade mechanics."
      architecture: "The original VM is retained until cleanup, which is why a window for recovery exists before switchover."
      trap: "A powered-off original vCenter after switchover is not a rollback option."

