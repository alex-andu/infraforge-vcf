id: lab-vcf-ops-logs-network
title: "VCF Operations: Logs, Network Operations, Health, Storage, Compliance and Drift"
level: intermediate
complexity: 4
minutes: 180
version: vcf9
technologies: [VCF Operations 9.0, VCF Operations for logs, VCF Operations for networks, vSAN, ESX 9.0]
topics: [vcf-ops-logs, network-ops, health-diagnostics, compliance-drift]
lessons: [vcf-operations-logs-network-ops, compliance-drift-app-monitoring]
objectives:
  - Deploy VCF Operations for logs (Simple model) as a Day-2 operation and confirm VCF components send logs.
  - Search log events, use extracted fields and create a log-based alert.
  - Use the Network Operations page and, if capacity allows, VCF Operations for networks.
  - Check the platform with VCF Health and vSAN with Storage Operations.
  - Configure a compliance benchmark and a configuration drift template, fixing the collector prerequisite.
prerequisites:
  - "lab-vcf-ops-dashboards-alerts completed (VCF Operations running and collecting)."
  - "Free capacity on the Proxmox host for one VCF Operations for logs node; check the size options shown in the deployment wizard against your free RAM."
  - "DNS A/PTR records for the logs node and its VIP FQDN (required even in the Simple model)."
topology:
  logical: d-lab-vcf-ops-logs-network-logical
requirements:
  network:
    - "Management VLAN with DNS and NTP."
    - "Path from ESX, vCenter and NSX to the logs VIP."
  vms:
    - "VCF Operations for logs: 1 node (Simple), deployed from VCF Operations fleet management."
    - "VCF Operations for networks: optional - platform must be Extra Large with 100% CPU and RAM reservation plus a collector; usually not possible on a single home-lab host next to VCF. Treat its steps as conceptual if so."
  ip:
    - "Logs node IP + VIP IP, both with A/PTR records."
    - "Networks platform and collector IPs only if you deploy it."
startingState: |
  VCF Operations collects from the management domain. VCF Operations for logs and for networks are not deployed.

  :::warning
  Be honest with your hardware: a nested VCF management domain plus VCF Operations for logs fits on 256 GB only if
  other optional appliances are powered off. VCF Operations for networks needs an Extra Large, fully reserved platform
  node - skip deployment and do the conceptual walk-through unless you have spare capacity.
  :::
steps:
  - id: deploy-logs
    title: Deploy VCF Operations for logs (Day 2)
    why: Logs is a Day-2 component deployed and lifecycled from VCF Operations; the VIP FQDN is required even for one node.
    instructions: |
      1. Create DNS records for the node and the VIP.
      2. In VCF Operations fleet management, start the deployment of VCF Operations for logs, choose the **Simple** model.
      3. Enter node and VIP details; review and deploy.
      4. When done, confirm the integration appears and VCF Operations configures log collection for the VCF components.
    validate: The logs cluster shows healthy; the VIP resolves and answers HTTPS.
    expected: One-node logs cluster with VIP; integration visible in VCF Operations.
  - id: verify-sources
    title: Confirm ESX, vCenter and NSX logs arrive
    why: Missing sources are the most common logs problem; check per component, not "logs work".
    instructions: |
      1. On a nested ESX host run `esxcli system syslog config get` and note the remote host.
      2. In the VCF Operations log pages search the last 15 minutes for each host name, the vCenter and the NSX Manager.
      3. If a source is missing, check its forwarding configuration and path to the VIP; on ESX `esxcli system syslog reload` after a change.
    validate: Each source returns recent events.
    expected: Recent log events from every ESX host, vCenter and NSX Manager.
  - id: search-and-alert
    title: Search, extract a field and create a log-based alert
    why: Log symptoms are new in 9.0; exam item "monitor log events in VCF Operations".
    instructions: |
      1. Generate an event: log in to an ESX host's shell or Host Client with a wrong password three times.
      2. Search for the authentication failure messages; add a filter on the host name field.
      3. Use field management to extract the user name if it is not already a field.
      4. Save the query and create a log-based alert (log symptom) with criticality Warning.
      5. Repeat the failed logins and watch the alert.
    validate: The alert appears and links back to the matching log events.
    expected: Log-based alert raised for repeated failed logins.
  - id: network-ops
    title: Network Operations page (and optional VCF Operations for networks)
    why: Exam item "monitor networks using VCF Network Operations".
    instructions: |
      1. Open **Infrastructure Operations > Network Operations**.
      2. Identify: NSX instances, transport nodes, edge clusters, the network alerts overview, NSX health.
      3. If VCF Operations for networks is deployed: open Business Applications with Flows and the Traffic Summary
         (last 24 hours), then launch into VCF Operations for networks and view a VM-to-VM path and recommended firewall rules.
      4. If not deployed: write down which of these widgets would be empty and why (no flow data source).
    validate: Explain the difference between what VCF Operations shows natively and what needs VCF Operations for networks.
    expected: NSX inventory/health visible natively; flow-based widgets need VCF Operations for networks.
  - id: health-storage
    title: VCF Health and Storage Operations
    why: Exam items on Health and Diagnostics and on vSAN Storage Operations.
    instructions: |
      1. Open VCF Health: compare the **Component View** with the **VCF View** (drill from management domain to an ESX host).
      2. Review Certificates Health and NTP and DNS Health.
      3. Open **Infrastructure Operations > Storage Operations**, filter vSAN, read the vSAN Cluster Health Score and
         hover the cluster for IOPS, latency and throughput.
      4. Run a new vSAN performance diagnostic in **Troubleshooting** mode.
      5. Open Diagnostics Findings and note any known issue matched.
    validate: Record the health score, the latency figure and any finding.
    expected: Health cards with drill-downs; a vSAN diagnostics run started (nested vSAN latency will be higher than physical).
  - id: compliance
    title: Configure a compliance benchmark
    why: Exam item "monitor security hardening and compliance".
    instructions: |
      1. **Security > Compliance**: configure the VMware SDDC / VCF security configuration benchmark for the policy that
         covers your hosts.
      2. After the next collection read the compliance score of an ESX host and the failed rules.
      3. Pick one harmless rule (for example a shell warning or timeout setting), check it with PowerCLI
         `Get-AdvancedSetting`, remediate one host and wait for re-evaluation.
    validate: Compare the score before and after the fix.
    expected: Score improves for the remediated host only.
  - id: drift
    title: Configuration drift template
    why: Exam item "configure configuration drift"; also teaches the collector prerequisite.
    instructions: |
      1. **Fleet Management > Configuration Drifts**: start a template and open the Configuration Source list.
      2. If your vCenter is missing, go to **Administration > Integrations**, edit the vCenter adapter, set Collector/Group
         to the cloud proxy, **Validate Connection**, **Save** (KB 438361). Wait several minutes.
      3. Create the template from the vCenter, assign it as target (or a second vCenter if you have a workload domain).
      4. Change a harmless vCenter setting and check drift after the next collection; revert it.
    validate: The drift view lists the changed setting.
    expected: Drift detected for the changed setting and cleared after revert.
troubleshooting:
  - symptom: Logs deployment fails validation.
    fix: Create both A and PTR records for the node and the VIP; check NTP and free capacity.
  - symptom: No logs from one ESX host.
    fix: Check `esxcli system syslog config get` on that host, firewall/path to the VIP, then `esxcli system syslog reload`.
  - symptom: vCenter not listed as configuration source; drift Unavailable.
    fix: Move the vCenter adapter to a cloud proxy (Administration > Integrations), validate, save, wait (KB 438361).
  - symptom: Compliance shows no data for some hosts.
    fix: The benchmark is configured for a different policy than the hosts' effective policy.
challenge: |
  Write a one-page runbook: "Users report slow app X". Show which page you open first (alert, VCF Health, Network
  Operations, Storage Operations, logs), what each would prove or exclude, and in which order. Add the compliance and
  drift checks you would run after the incident to prevent recurrence.
cleanup: |
  Keep VCF Operations for logs if you have capacity (later labs use it); otherwise power it off or delete it through
  fleet management. Remove test drift templates and revert any remediated setting you changed only for practice.
