id: lab-vcf-ops-logs-network
title: "VCF Operations: Logs, Network, Storage, Application Monitoring, Compliance and Drift"
level: intermediate
complexity: 4
minutes: 240
version: vcf9
technologies: [VCF Operations 9.0, VCF Operations for logs, VCF Operations for networks, Telegraf, vSAN, ESX 9.0]
topics: [vcf-ops-logs, network-ops, health-diagnostics, compliance-drift]
lessons: [vcf-operations-logs-network-ops, compliance-drift-app-monitoring]
objectives:
  - Deploy VCF Operations for logs (Simple model) as a Day-2 operation and confirm VCF components send logs.
  - Search log events, use extracted fields and create a log-based alert.
  - Use the Network Operations page and, if capacity allows, VCF Operations for networks.
  - Check the platform with VCF Health and vSAN with Storage Operations.
  - Install product-managed Telegraf on a disposable vCenter-managed VM, activate a service and model a Business Application.
  - Configure a compliance benchmark and a configuration drift template, fixing the collector prerequisite.
prerequisites:
  - "lab-vcf-ops-dashboards-alerts completed (VCF Operations running and collecting)."
  - "VCF Operations 9.0 URL: https://ops01.vcf.home.arpa; sign in with an account permitted to view Infrastructure Operations and integrations. Discover the exact role in Administration > Control Panel > Access Control if access is denied."
  - "For application monitoring: one disposable Linux VM managed by vcenter01, reachable from collector01, with supported guest tools and a temporary OS account that meets the product-managed Telegraf prerequisites. Credentials stay in the runtime wizard and never in evidence."
  - "For Configuration Drift: Configuration Drifts Manage privilege (or View for observation only) and the vcenter01 account registered to collector01/cloud proxy group."
  - "Free capacity on the Proxmox host for one VCF Operations for logs node; check the size options shown in the deployment wizard against your free RAM."
  - "DNS A/PTR records for the logs node and its VIP FQDN (required even in the Simple model)."
topology:
  logical: d-lab-vcf-ops-logs-network-logical
requirements:
  network:
    - "Management VLAN with DNS and NTP."
    - "Path from ESX, vCenter and NSX to the logs VIP."
    - "Path from the disposable application VM to collector01.vcf.home.arpa for OS/application metrics."
  vms:
    - "VCF Operations for logs: 1 node (Simple), deployed from VCF Operations fleet management."
    - "VCF Operations for networks: optional - platform must be Extra Large with 100% CPU and RAM reservation plus a collector; usually not possible on a single home-lab host next to VCF. Treat its steps as conceptual if so."
    - "One disposable vCenter-managed Linux VM for product-managed Telegraf; discover its exact name as <APP_VM>."
  ip:
    - "Logs node IP + VIP IP, both with A/PTR records."
    - "Networks platform and collector IPs only if you deploy it."
startingState: |
  VCF Operations collects from the management domain. VCF Operations for logs and for networks are not deployed. No
  application-monitoring agent, custom compliance activation or configuration template has been validated for this
  guide.

  :::warning
  **PREPARED — NOT YET LAB-VALIDATED.** The documented lab contains VCF Operations at `ops01.vcf.home.arpa`, its
  collector, NSX and a vSAN OSA management cluster, but current collection state and exact 9.0.2 screen labels have
  not been observed. VCF Operations for networks is not in the supplied inventory. Record current screens and values
  during the run; do not infer success from this guide.

  Be honest with your hardware: a nested VCF management domain plus VCF Operations for logs fits on 256 GB only if
  other optional appliances are powered off. VCF Operations for networks needs an Extra Large, fully reserved platform
  node - skip deployment and do the conceptual walk-through unless you have spare capacity.
  :::
steps:
  - id: deploy-logs
    title: Deploy VCF Operations for logs (Day 2)
    why: Logs is a Day-2 component deployed and lifecycled from VCF Operations; the VIP FQDN is required even for one node.
    instructions: |
      1. Create DNS records for the node and the VIP.
      2. In VCF Operations fleet management, start the deployment of VCF Operations for logs, choose the **Simple** model.
      3. Enter node and VIP details; review and deploy.
      4. When done, confirm the integration appears and VCF Operations configures log collection for the VCF components.
    validate: The logs cluster shows healthy; the VIP resolves and answers HTTPS.
    expected: One-node logs cluster with VIP; integration visible in VCF Operations.
  - id: verify-sources
    title: Confirm ESX, vCenter and NSX logs arrive
    why: Missing sources are the most common logs problem; check per component, not "logs work".
    instructions: |
      1. On a nested ESX host run `esxcli system syslog config get` and note the remote host.
      2. In the VCF Operations log pages search the last 15 minutes for each host name, the vCenter and the NSX Manager.
      3. If a source is missing, check its forwarding configuration and path to the VIP; on ESX `esxcli system syslog reload` after a change.
    validate: Each source returns recent events.
    expected: Recent log events from every ESX host, vCenter and NSX Manager.
  - id: search-and-alert
    title: Search, extract a field and create a log-based alert
    why: Log symptoms are new in 9.0; exam item "monitor log events in VCF Operations".
    instructions: |
      1. Generate an event: log in to an ESX host's shell or Host Client with a wrong password three times.
      2. Search for the authentication failure messages; add a filter on the host name field.
      3. Use field management to extract the user name if it is not already a field.
      4. Save the query and create a log-based alert (log symptom) with criticality Warning.
      5. Repeat the failed logins and watch the alert.
    validate: The alert appears and links back to the matching log events.
    expected: Log-based alert raised for repeated failed logins.
  - id: network-ops
    title: Network Operations page (and optional VCF Operations for networks)
    why: Exam item "monitor networks using VCF Network Operations".
    instructions: |
      1. Browse to `https://ops01.vcf.home.arpa`, sign in and record the displayed VCF Operations build. Do not record
         credentials in the evidence sheet.
      2. Open **Infrastructure Operations > Network Operations**. If the page is absent, stop and record the role,
         build and navigation shown; do not substitute an assumed path.
      3. In **Networking Inventory**, record the count of NSX instances, transport nodes and edge clusters. Open the
         NSX instance that represents `nsx.vcf.home.arpa` and confirm its last collection time/status.
      4. In **Network Alerts**, record active alert count and highest criticality. In **NSX Health**, identify any
         manager, transport node or edge node reporting an issue; open one object to preserve its name and evidence.
      5. Review **NSX Managers and VPCs** and record whether VPC inventory exists. The current lab may legitimately
         have no VPCs.
      6. Inspect **Business Applications with Flows** and **Traffic Summary**. The supplied inventory has no VCF
         Operations for networks appliance, so record them as `Unavailable — appliance not deployed` if they contain
         no flow data. The top-right **Install Operations Network Appliance** action confirms this capability boundary;
         do not select it during this guide.
      7. If a future run has the appliance, open **Business Applications with Flows**, select a test application,
         launch the networks console, set the incident time range, and inspect its VM-to-VM path, observed ports and
         firewall-rule evidence. Save only a sanitized screenshot.
      8. Complete a checkpoint table: widget, data source, observed state, timestamp, evidence reference. No change is
         committed in this read-only step.
    validate: The checkpoint distinguishes NSX inventory/health supplied by core integrations from flow/path evidence supplied by VCF Operations for networks.
    expected: Native NSX inventory and health are populated if the NSX adapter is collecting; flow widgets are explicitly unavailable until the networks appliance is deployed.
  - id: health-storage
    title: VCF Health and Storage Operations
    why: Exam items on Health and Diagnostics and on vSAN Storage Operations.
    instructions: |
      1. In VCF Operations open **VCF Health**. Record the collection timestamp, compare **Component View** with **VCF
         View**, and drill from `mgmt-domain` to one ESX host.
      2. Open **Certificates Health** and **NTP and DNS Health**. Record status and evidence without changing settings.
      3. Open **Infrastructure Operations > Storage Operations** and select the **vSAN** storage-type filter.
      4. Confirm cluster `mgmt-domain-cl01` and datastore `mgmt-domain-cl01-ds-vsan01` appear. If they do not, open
         **Administration > Integrations**, inspect the vCenter account for `vcenter01.vcf.home.arpa`, and verify it is
         connected and collecting vSAN data. Do not edit the account in this step.
      5. Record the **vSAN Cluster Health Score**. Hover the cluster pin and record IOPS, latency and throughput with
         the same timestamp; avoid comparing readings from different windows.
      6. In **vSAN Cluster Performance**, select **View Diagnostics > Run New Diagnostics**. Choose goal
         **Troubleshooting**, target `mgmt-domain-cl01`, and a time range containing normal lab activity. Review the
         summary before selecting **Run New Diagnostics**; this starts analysis but does not change the cluster.
      7. On the results page record cluster, selected window, findings, remediation suggestions and report timestamp.
         The diagnostics history covers only seven days.
      8. Open **Diagnostics Findings** and note any known issue matched. Preserve a sanitized screenshot of the health
         score and diagnostics result; this is the commit checkpoint for the step.
    validate: Evidence contains the vSAN cluster and datastore, integration state, health score, IOPS/latency/throughput from one timestamp, diagnostic goal/window and any findings.
    expected: The documented vSAN OSA management cluster is collected and a Troubleshooting diagnostics report is available; exact health and latency values remain observed results, not guide assumptions.
  - id: application-monitoring
    title: Monitor a service with product-managed Telegraf and a Business Application
    why: The exam asks how VCF Operations monitors an application inside the guest, not only the VM resource object.
    instructions: |
      1. Choose one disposable Linux VM managed by `vcenter01.vcf.home.arpa`; record its exact name as `<APP_VM>`, OS,
         IP, vCenter and owner. Confirm `collector01.vcf.home.arpa` is reachable from the guest. Do not store the OS
         password in the evidence sheet.
      2. In VCF Operations open **Workload Operations > Applications > Manage Telegraf Agents**. Confirm `<APP_VM>` is
         listed as a **Virtual Machine** object. A physical or unmanaged **Endpoint** does not support installation from
         this UI; it requires the product-managed helper script.
      3. Select `<APP_VM>`, then **Agent Actions > Install**. If the Application Monitoring Adapter does not exist for
         this vCenter, select **Cloud Proxies** and choose `collector01` (or select an HA-enabled collector group when
         one is actually configured), then select **Done**.
      4. In **How do you want to provide VM Credentials**, choose **Common username and password** for this single VM.
         Leave restore-from-backup disabled for a first install. Select **Next**, enter the temporary runtime account in
         **Provide Credentials**, keep Linux runtime-user creation enabled only if it matches your prerequisite plan,
         then select **Next**.
      5. On **Summary**, verify only `<APP_VM>` is listed, then select **Install Agent**. Refresh the page until **Agent
         Status** is `Agent Running` and **Last Operation Status** is `Install Success`. If it fails, hover the red
         exclamation icon and record the message without credentials.
      6. Expand `<APP_VM>`, select one discovered supported service and activate its application-service plugin. Wait
         for collection, open **Go to Details > Metrics**, expand the object relationship and select the OS/service
         object. Record one OS metric and one service metric with timestamp.
      7. Open **Workload Operations > Business Applications > Add Business Application > Define Manually**. Name it
         `Lab monitored service`, set description, application tag `lab`, business criticality **Low** and environment
         **Test**.
      8. Add tiers `Web or service` and `Infrastructure`. From **Select Members > Inventory**, drag the discovered
         application/service object into the first tier and `<APP_VM>` into the second. Select **Save**, open the new
         Business Application and record its health and member preview. This is the commit checkpoint.
    validate: Evidence shows Agent Running/Install Success, one current OS metric, one service metric and the Business Application with the expected two tiers and members.
    expected: VCF Operations monitors guest OS and service data through collector01 and aggregates the selected objects into `Lab monitored service`; values remain runtime observations.
  - id: compliance
    title: Enable a VCF compliance benchmark for the lab policy
    why: The exam item requires monitoring security hardening and compliance through scorecards and policy scope.
    instructions: |
      1. Open **Security > Compliance** and select **VMware Cloud Foundation** in the data-source carousel. If the card
         is absent, record the configured data sources and stop; do not substitute a different benchmark silently.
      2. In **VCF Benchmarks**, locate **VCF Compliance based on the VCF Audit Guides** and select **Enable**.
      3. In the policy selector choose the active policy covering `esx01.vcf.home.arpa`. Record the policy name and
         current effective policy on `esx01`; avoid selecting a parent policy if a child policy should own this scope.
      4. Select **Enable** to confirm. Wait for assessment, then open the scorecard and record score, evaluated-object
         count, non-compliant-object count and collection timestamp.
      5. Filter/drill into `esx01.vcf.home.arpa`, open one failed rule and record rule name, severity, current evidence
         and recommendation. Do not change the host solely to force a better score.
      6. If the recommendation is safe in the nested lab, capture the current value with read-only PowerCLI
         `Get-AdvancedSetting`, obtain Alex's change approval during the lab run, apply the one change, and wait for
         re-evaluation. Otherwise keep this as a read-only finding. Preserve before/after evidence when a change occurs.
    validate: The scorecard is enabled in the intended effective policy and evidence links one ESX object to a specific failed rule and timestamp; any remediation has separate approval and before/after proof.
    expected: A percentage score and object/rule details are visible after assessment; this guide does not assume a particular score or that remediation is safe.
  - id: drift
    title: Create, activate and run a vCenter configuration template
    why: Configuration Drift requires desired state, policy activation and a successful detection run; the collector is a prerequisite.
    instructions: |
      1. Open **Administration > Integrations**, locate the vCenter account for `vcenter01.vcf.home.arpa` and record its
         status and **Collector/Group**. It must use `collector01` or its cloud proxy group. If it uses the Default
         Collector Group, edit only after Alex approves the lab change: select the cloud proxy/group, **Validate
         Connection**, then **Save** and wait for collection (KB 438361).
      2. Open **Fleet Management > Configuration Drifts > Configuration Templates** and select **Create Config
         Template**. Set name `Lab vCenter desired state` and describe the exact lab scope and rollback owner.
      3. In **Template Setup**, choose `vcenter01.vcf.home.arpa` as **Configuration Source** and select **Next**.
      4. In **Configuration Schema**, select a small, documented set of non-secret settings that you intend to keep
         stable; record every selected schema path. Select **Next**.
      5. In **Assign vCenters using Policy (Optional)**, select the active policy applied to `vcenter01`, then **Next**.
         On **Review**, compare source, schema and policy with the evidence sheet and select **Create**.
      6. If no policy was selected in the wizard, open **Infrastructure Operations > Configurations > Policy
         Definition**, edit the effective policy, open **Configuration Templates**, select `Lab vCenter desired state`,
         set it to **Activated**, and **Save**.
      7. Return to **Fleet Management > Configuration Drifts**, expand **VCF Instances**, select the lab VCF instance,
         and open **Drifts**. Select `vcenter01` and **Detect Drift**. Open the vCenter result, select the template and
         record status plus any **Current vCenter Value** versus **Config Template Value** differences.
      8. Select `vcenter01` and **Download Drift Status Report**. Confirm date, resource, template and drift status are
         present. Do not alter a production-sensitive vCenter setting merely to manufacture drift.
      9. Optional controlled proof: after Alex approves a harmless setting and rollback, record the old value, change
         it, run **Detect Drift**, preserve the detected row, restore the old value, run again and confirm **Not
         Drifted**. This is the commit checkpoint.
    validate: The vCenter uses a cloud proxy, the template lists the intended source/schema/policy, Detect Drift completes, and the report records the current status; an optional change has approval, rollback and both results.
    expected: The template is active through the vCenter's effective policy and the current configuration returns Not Drifted or an evidence-backed difference; no drift is invented.
troubleshooting:
  - symptom: Logs deployment fails validation.
    fix: Create both A and PTR records for the node and the VIP; check NTP and free capacity.
  - symptom: No logs from one ESX host.
    fix: Check `esxcli system syslog config get` on that host, firewall/path to the VIP, then `esxcli system syslog reload`.
  - symptom: vCenter not listed as configuration source; drift Unavailable.
    fix: Move the vCenter adapter to a cloud proxy (Administration > Integrations), validate, save, wait (KB 438361).
  - symptom: Compliance shows no data for some hosts.
    fix: The benchmark is configured for a different policy than the hosts' effective policy.
  - symptom: "<APP_VM> does not appear on Manage Telegraf Agents."
    fix: Confirm it is a VM in the configured vCenter cloud account. Endpoint objects use the helper script and cannot be selected for UI installation.
  - symptom: Agent install shows Install Failed.
    fix: Hover the red exclamation icon, then verify guest credentials/prerequisites and reachability to collector01; do not retry before recording the specific error.
  - symptom: "Template exists but vCenter is not configuration-enabled."
    fix: Activate the template under Policy Definition > Configuration Templates in the effective policy assigned to the vCenter, then run Detect Drift.
challenge: |
  Write a one-page runbook: "Users report slow app X". Show which page you open first (alert, VCF Health, Network
  Operations, Storage Operations, Telegraf/service metrics, Business Application, logs), what each would prove or
  exclude, and in which order. Add the compliance and drift checks you would run after the incident to prevent recurrence.
cleanup: |
  Keep VCF Operations for logs if you have capacity (later labs use it); otherwise power it off or delete it through
  fleet management. The Network Operations and Storage Operations checkpoints are read-only and need no rollback.
  Under **Workload Operations > Applications > Manage Telegraf Agents**, select `<APP_VM>` and uninstall the test agent
  if it is not needed; delete `Lab monitored service`. Disable the lab compliance scorecard only if this guide enabled
  it in a policy that should not retain it. Deactivate and delete `Lab vCenter desired state`, and revert every approved
  setting change using the recorded old value. Preserve sanitized evidence and confirm the vCenter's collector
  assignment remains the intended operational configuration.
