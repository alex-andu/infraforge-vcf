id: lab-password-rotation
title: Update, Rotate and Remediate VCF Passwords
level: intermediate
complexity: 3
minutes: 90
version: vcf9
technologies: [VCF Operations, SDDC Manager, NSX, vCenter, ESX]
topics: [passwords]
lessons: [password-management]
objectives:
  - Find managed accounts, their expiry and connection status in VCF Operations.
  - Update a password with a value you choose.
  - Rotate a password from SDDC Manager and understand scheduling limits.
  - Create credential drift on purpose and fix it with Remediate.
  - Confirm stored credentials with lookup_passwords and the SDDC Manager API.
prerequisites:
  - A running VCF 9 management domain.
  - Lesson password-management read.
  - A password vault or encrypted notes file for the new passwords.
topology:
  logical: d-lab-password-rotation-logical
requirements:
  network:
    - Workstation reaches VCF Operations, SDDC Manager and NSX Manager over HTTPS, and SDDC Manager over SSH.
  vms:
    - The VCF management domain appliances on nested ESX hosts.
  ip:
    - Use the Home Lab IP plan; no new addresses are required.
startingState: |
  Management domain healthy; no failed or running workflows. You know the current passwords (from your deployment
  notes or `lookup_passwords`).

  **Honest note for the nested Proxmox lab:** password workflows behave the same on nested hosts. Use low-risk accounts
  (NSX `audit`, one ESX host) for the drift exercise, and keep the vsphere.local administrator and SDDC Manager local
  admin credentials safe: they are your break-glass accounts.
steps:
  - id: s1-explore
    title: Explore the account inventory
    why: You must know which accounts VCF manages, which it uses, and when they expire.
    instructions: |
      VCF Operations > Fleet Management > Passwords > **VCF Management**, then **VCF Instances** > your domain. Record
      for vCenter, NSX, ESX and SDDC Manager: account, type, expiry, status. On SDDC Manager (SSH as `vcf`) run
      `lookup_passwords`, choose VCENTER and authenticate with an ADMIN-role SDDC Manager account.
    hint: VCF Operations status refreshes once a day; the API is real time.
    validate: Your table lists root/admin/audit/service accounts with expiry dates.
    expected: NSX root/admin/audit and vCenter root with 90-day expiry by default; svc-* accounts system managed.
  - id: s2-update
    title: Update the vCenter root password
    why: Update is the planned change with a password you choose; VCF changes both sides.
    instructions: |
      Fleet Management > Passwords > VCF Instances > domain > vCenter `root` > **Update Password**. Use a 15-20 character
      password with upper, lower, digit and one of `! @ # $ ^ *`. Watch the progress indicator.
    hint: Update one account at a time and only when no other workflow runs.
    validate: SSH to vCenter as root with the new password works; lookup_passwords shows the new value.
    expected: Task succeeds; status connected.
  - id: s3-rotate
    title: Rotate an ESX root password from SDDC Manager
    why: Rotation generates a policy-compliant random password; in 9.0 it is performed in SDDC Manager.
    instructions: |
      SDDC Manager UI > **Security > Password Management** > select `root` of esx01 > **Rotate password** > Rotate.
      Then try to create a rotation **schedule** for the same ESX account and note the result.
    hint: ESX accounts can be rotated but scheduled rotation is not supported for ESX.
    validate: lookup_passwords (ESX entity type) shows a new generated password that works for SSH to esx01.
    expected: Rotation succeeds; no schedule option for ESX.
  - id: s4-drift
    title: Create drift on purpose
    why: Seeing the failure mode makes the Remediate action obvious.
    instructions: |
      In NSX Manager change the `audit` user's password directly (outside VCF). Then, in VCF, trigger something that
      uses that credential or check its status through the SDDC Manager API (`GET /v1/credentials`).
    hint: The VCF Operations status may not change until the daily refresh; the API shows it sooner.
    validate: VCF reports the NSX audit credential as failed/disconnected (API or after refresh).
    expected: A credential mismatch between NSX and VCF's store.
  - id: s5-remediate
    title: Remediate the drifted password
    why: Remediate re-syncs VCF's copy without changing the password on the component again.
    instructions: |
      Fleet Management > Passwords > VCF Instances > domain > NSX `audit` > **Remediate Password**, enter the password
      you set in NSX, confirm.
    hint: "Do not use Update here, it would change the NSX password again."
    validate: The API shows the credential healthy; a lifecycle precheck shows no credential errors.
    expected: Remediation succeeds; VCF and NSX agree.
  - id: s6-schedule
    title: Design a rotation policy
    why: A schedule turns a one-off exercise into hygiene.
    instructions: |
      In SDDC Manager, configure scheduled rotation for at least one vCenter or NSX account (preset interval). Write a
      short policy: which accounts are scheduled, which are rotated on demand (ESX), who may Update/Remediate
      (Fleet Management Passwords Manage permission), and the emergency procedure (manual change, then Remediate).
    hint: "Avoid rotations during upgrade windows: resource locks block conflicting operations."
    validate: A schedule exists and your written policy covers every account type.
    expected: Scheduled rotation for selected accounts plus a written policy.
troubleshooting:
  - symptom: Update or Remediate refused with a workflow error.
    fix: Resolve any failed workflow and wait for running workflows to finish, then retry one account at a time.
  - symptom: Status in VCF Operations still red after a successful remediation.
    fix: Status refreshes once a day; check with GET /v1/credentials on SDDC Manager for real-time status.
  - symptom: Remediate fails validation.
    fix: The password you entered does not match the component. Log in to the component directly to confirm it, check for account lockout, then retry.
  - symptom: Rotate option missing for VCF Operations or VCF Automation accounts.
    fix: Known 9.0.x behaviour (KB 430609); use Update for management component accounts.
challenge: |
  Script the drift check: use the SDDC Manager API to list credentials and flag any that are not in a healthy state,
  then explain how you would alert on accounts within 14 days of expiry.
cleanup: |
  Store the final passwords in your vault. Remove any rotation schedule you do not want to keep in the lab. Clear
  terminal history that contains passwords (`history -c` in the session you used).
sources:
