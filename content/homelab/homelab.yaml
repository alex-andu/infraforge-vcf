dnsPlan: |
  **Server:** infra01 (10.10.10.10). Everything in the lab — Proxmox, nested ESX, all appliances — uses it as the only
  DNS server. It forwards other names to your home router or a public resolver.

  **Zones**

  | Zone | Type | Contents |
  |---|---|---|
  | `vcf.lab` | Forward | A record for **every** entry of the IP plan |
  | `10.10.10.in-addr.arpa` | Reverse | PTR for every management IP (hosts, appliances, NSX VIP *and* nodes, edges) |
  | `20/30/40/50.10.10.in-addr.arpa` | Reverse (optional) | Only if you give vmknics/TEPs names; VCF uses IP pools here |

  **Unbound example** (William Lam's `vcf-9x-in-box` uses Unbound on Photon OS; the same records work in BIND or
  Windows DNS):

  ```text
  server:
    interface: 10.10.10.10
    access-control: 10.10.0.0/16 allow
    local-zone: "vcf.lab." static
    local-data: "vc01.vcf.lab. A 10.10.10.20"
    local-data-ptr: "10.10.10.20 vc01.vcf.lab"
    local-data: "nsx01.vcf.lab. A 10.10.10.22"
    local-data-ptr: "10.10.10.22 nsx01.vcf.lab"
    # ... one A + one PTR line per IP plan entry
  forward-zone:
    name: "."
    forward-addr: 192.168.1.1
  ```

  **Verify** every name both ways (from infra01, and later from the VCF Installer appliance):

  ```shell
  for h in rtr01 pve01 infra01 vc01 sddcm01 nsx01 nsx01a ops01 opsfm01 opscp01 edge01a edge01b esx01 esx02 esx03; do
    ip=$(dig +short $h.vcf.lab); ptr=$(dig +short -x $ip)
    echo "$h.vcf.lab -> $ip -> $ptr"
  done
  ```

  Every line must end with the same FQDN it started with (with a trailing dot). A missing or different PTR is the
  number-one cause of failed VCF validation.

naming: |
  | Object | Pattern | Examples |
  |---|---|---|
  | Lab DNS domain | one domain you control; avoid `.local` (mDNS conflicts) | `vcf.lab` (or a subdomain of `home.arpa`) |
  | ESX hosts | `esxNN` | `esx01` … `esx07` (01–04 management, 05+ workload) |
  | vCenter | `vcNN` per domain | `vc01` (management), `vc02` (workload) |
  | NSX Manager | `nsxNN` VIP, `nsxNNa/b/c` nodes | `nsx01`, `nsx01a` |
  | NSX Edges | `edgeNNa/b` | `edge01a`, `edge01b` |
  | VCF Operations family | `ops01`, `opsfm01` (fleet mgmt), `opscp01` (collector), `logs01` | |
  | Infrastructure | `infra01`, `rtr01`, `jump01`, `pve01` | |
  | Proxmox VM IDs | 1xx infra, 2xx management hosts, 3xx workload hosts | `101 infra01`, `201 esx01`, `305 esx05` |
  | vSphere objects | `<site>-<domain>-<object>` | datacenter `lab-m01-dc`, cluster `lab-m01-cl01`, VDS `lab-m01-vds01` |

  Hostnames are lowercase, no underscores, and the hostname you type into the ESX DCUI, the OVA form and DNS must be
  identical. In OVA forms the *Host Name* field takes the FQDN and the *DNS Domain Name* field only the domain — mixing
  them broke VCF Installer validation in Broadcom KB 418890.

sections:
  - id: dns
    title: DNS service design
    body: |
      - One authoritative lab DNS server (infra01) on the management VLAN, started first after Proxmox boots
        (`onboot: 1`, startup order 1).
      - Forward **and** reverse records for every IP plan entry before you install the first ESX host.
      - Create records for the NSX VIP as well as the node(s); forgetting the VIP PTR is a classic bring-up failure.
      - Keep a text export of the zone files on the HDD pool; a rebuilt DNS server without its reverse zone silently breaks
        VCF validation the next day.
  - id: ntp
    title: NTP design
    body: |
      - infra01 runs an NTP server (for example chrony) that syncs to public pool servers and serves the lab
        (`allow 10.10.0.0/16` in chrony). Optionally also rtr01 as a second source.
      - Configure the same NTP server(s) in: Proxmox host, every nested ESX host, the VCF Installer deployment spec, and
        every appliance (VCF pushes this during deployment).
      - Verify on ESX with `esxcli system ntp get` and compare `date -u` everywhere. Never fix skew by setting one clock by
        hand.
  - id: gateway-router
    title: Gateway and router design
    body: |
      - **rtr01** (a small Linux VM with FRR, VyOS, or OPNsense with its FRR plugin — your choice) has one trunk NIC on
        `vmbr0` with a sub-interface `.1` on every lab VLAN, and one NIC (or VLAN) towards your home LAN for internet.
      - Routes: all lab VLANs are directly connected; NAT the lab to the home LAN for internet/depot downloads.
      - Later: BGP with the Tier-0 on VLANs 60/61 (for example rtr01 AS 65001, Tier-0 AS 65000) so overlay networks
        (172.16.0.0/16) are learned dynamically.
      - Alternative: your physical L3 switch as gateway. Keep the MTU 9000 sub-interfaces for vMotion, vSAN and TEP VLANs,
        and remember that inter-VLAN routing at 9000 needs the router interfaces at 9000 too (edge TEP ↔ host TEP).
  - id: mtu
    title: MTU end-to-end
    body: |
      Jumbo frames must be consistent on every hop or large frames silently drop:

      | Hop | Setting |
      |---|---|
      | Physical switch ports to the server | 9216 (or the switch's max ≥ 9000) |
      | Proxmox physical NICs, bond0, vmbr0 | `mtu 9000` in `/etc/network/interfaces` |
      | VM tap devices | Inherit the bridge MTU automatically at VM start |
      | rtr01 sub-interfaces for VLAN 20/30/40/50/70 | 9000 |
      | Nested VDS | 9000 |
      | vmknics vMotion / vSAN | 9000 (or 8900) |
      | NSX TEP | from the uplink profile / VDS, ≥ 1600 |

      Example `/etc/network/interfaces` (Proxmox, ifupdown2):

      ```text
      auto bond0
      iface bond0 inet manual
          bond-slaves enp65s0f0 enp65s0f1
          bond-miimon 100
          bond-mode active-backup
          mtu 9000

      auto vmbr0
      iface vmbr0 inet manual
          bridge-ports bond0
          bridge-stp off
          bridge-fd 0
          bridge-vlan-aware yes
          bridge-vids 2-4094
          mtu 9000

      auto vmbr0.10
      iface vmbr0.10 inet static
          address 10.10.10.5/24
          gateway 10.10.10.1
          mtu 1500
      ```

      Each physical NIC also needs `mtu 9000`. Prove it from a nested host: `vmkping -I vmk2 -d -s 8972 10.10.30.102`
      (payload = MTU − 28).
  - id: storage
    title: Storage layout and ZFS settings
    body: |
      - Create `nvmepool` on the 1 TB NVMe (`zpool create -o ashift=12 nvmepool /dev/disk/by-id/<nvme-id>`), add it in
        Proxmox as ZFS storage `nvme-fast` with **Thin provision** enabled (sparse zvols).
      - `bulk` on the four HDDs: ZFS RAID10 (two mirrors) for better random I/O if you serve NFS; RAIDZ1 if you mainly
        store depot files and backups.
      - Cap ARC: `echo "options zfs zfs_arc_max=8589934592" > /etc/modprobe.d/zfs.conf`, then `update-initramfs -u -k all`
        and reboot (8 GiB).
      - vSAN ESA device per nested host: `pvesm alloc nvme-fast 201 vm-201-disk-9 500G`, then add to the VM config:
        `args: -drive file=/dev/zvol/nvmepool/vm-201-disk-9,if=none,id=NVME1,format=raw -device nvme,drive=NVME1,serial=esx01nvme1`.
      - In each nested ESX, confirm the device: `vdq -q` should list it as eligible for vSAN; William Lam's 9.1 workaround
        list also suggests nested-vSAN settings such as `esxcli system settings advanced set -o /LSOM/VSANDeviceMonitoring -i 0`
        (unsupported tuning; apply only if you see device-monitoring false alarms).
  - id: proxmox-vm-template
    title: Nested ESX VM definition on Proxmox
    body: |
      ```shell
      qm create 201 --name esx01 --ostype other --machine q35 --bios ovmf \
        --efidisk0 nvme-fast:1,efitype=4m,pre-enrolled-keys=0 \
        --cpu host --sockets 2 --cores 12 --numa 1 --memory 73728 --balloon 0 \
        --sata0 nvme-fast:64,ssd=1,discard=on \
        --net0 vmxnet3,bridge=vmbr0,firewall=0 --net1 vmxnet3,bridge=vmbr0,firewall=0 \
        --cdrom local:iso/<ESX-9-installer>.iso --boot "order=sata0;ide2"
      pvesm alloc nvme-fast 201 vm-201-disk-9 500G
      qm set 201 --args "-drive file=/dev/zvol/nvmepool/vm-201-disk-9,if=none,id=NVME1,format=raw -device nvme,drive=NVME1,serial=esx01nvme1"
      qm config 201
      ```

      Clone the definition for esx02/esx03 with new VM IDs, new zvols and **unique NVMe serials and MAC addresses**.
      Install ESX on `sata0`, never on the NVMe device intended for vSAN.
  - id: vcf-installer-workarounds
    title: VCF Installer lab workarounds (unsupported)
    body: |
      All from William Lam's VCF 9 posts; use at your own risk, lab only.

      | Problem in a lab | Workaround | Version notes |
      |---|---|---|
      | Fewer hosts than the minimum | Add `feature.vcf.internal.single.host.domain=true` (9.0.0) or `feature.vcf.vgl-29121.single.host.domain=true` (9.0.1) to `/home/vcf/feature.properties`, restart services with `echo 'y' \| /opt/vmware/vcf/operationsmanager/scripts/cli/sddcmanager_restart_services.sh`, deploy via **JSON** | UI still enforces the host minimum |
      | "No vSAN ESA certified disks found" | Install the vSAN ESA Hardware Mock VIB on each host, restart vSAN management service, re-validate | Not needed from 9.0.1 (installer bypass) |
      | Hosts "not on vSAN HCL" because embedded HCL JSON is >90 days old | Replace `/nfs/vmware/vcf/nfs-mount/vsan-hcl/all.json` with a current copy (also Broadcom KB 442952) | |
      | 10 GbE NIC pre-check | Disable per Lam's dedicated post | |
      | Non-certified NICs with EDP | `"hostSwitchOperationalMode": "STANDARD"` in the JSON spec | |
      | Self-signed host thumbprints / no ping to gateway | `"skipEsxThumbprintValidation": true`, `"skipGatewayPingValidation": true` | |
      | Reuse the installer as SDDC Manager | `"useExistingDeployment": true` | |
      | vSAN ESA default policy fails with < 3 hosts | Lam's `fix_vsan_esa_default_storage_policy.ps1` | |
      | Hourly NSX Manager backups fill a small lab | Reduce backup frequency | |
  - id: deployment-order
    title: Deployment order
    body: |
      1. Switch: VLANs and MTU on the server ports.
      2. Proxmox: nested KVM, pools, ARC cap, `vmbr0` (VLAN-aware, 9000).
      3. infra01 (DNS + NTP) → verify every record both ways.
      4. rtr01 → gateways reachable from VLAN 10; `ping -M do -s 8972` between sub-interfaces on 9000 VLANs.
      5. Nested ESX hosts: install, set FQDN/IP/DNS/NTP, enable SSH, regenerate the host certificate after setting the
         final hostname (per the VCF host preparation docs), confirm the NVMe device.
      6. Upload the VCF Installer OVA to esx01's local VMFS, configure the depot (offline depot on `bulk` or online).
      7. Validate the deployment spec; fix every warning you understand; snapshot the pool with all VMs off.
      8. Deploy the management domain; snapshot again.
      9. Edge cluster (vCenter → Network → Network Connectivity), Tier-0 with BGP to rtr01.
      10. Supervisor, VCF Operations content; optional VCF Automation / logs.
  - id: backups-snapshots
    title: Backups and snapshots of a nested lab
    body: |
      - **Whole-lab restore points:** shut down VCF in the documented order (or at least shut down all nested ESX VMs),
        then `zfs snapshot -r nvmepool@<name>`; roll back with `zfs rollback` per dataset/zvol (newest snapshot) with all
        VMs off. This captures the args-attached NVMe zvols that `qm snapshot` does not.
      - **Never snapshot or roll back a single nested host** of a vSAN cluster in isolation: vSAN and VCF state span all
        hosts and appliances.
      - **VCF-native backups:** configure the SFTP backup target in VCF Operations (*Fleet Management → Lifecycle →
        Settings*) pointing at storage on the HDD pool — this is also exam-relevant practice.
      - **Infra VMs:** nightly `vzdump` of infra01 and rtr01 to the HDD pool; DNS is the lab's single point of failure.
      - Keep at least one snapshot from *before* each major step (pre-bring-up, post-bring-up, post-edge). Delete old ones:
        ZFS snapshots of busy vSAN devices grow quickly on a 1 TB NVMe.

dependencyChecklist:
  - { id: dep-cpu-virt, item: "Nested virtualization enabled on Proxmox", how: "cat /sys/module/kvm_intel/parameters/nested shows Y (AMD: kvm_amd shows 1)" }
  - { id: dep-cpu-gen, item: "CPU generation checked against ESX 9 support (KB 318697)", how: "lscpu | grep 'Model name'; compare with the discontinued/deprecated table in Your Lab" }
  - { id: dep-switch, item: "Switch ports trunk all lab VLANs with jumbo MTU", how: "Switch config shows VLANs 10,20,30,40,50,60,61,70,100 tagged and MTU >= 9000 on server ports" }
  - { id: dep-bridge, item: "vmbr0 is VLAN-aware with MTU 9000 on NICs, bond and bridge", how: "ip -d link show vmbr0 shows vlan_filtering 1 and mtu 9000; ip link show bond0 shows mtu 9000" }
  - { id: dep-dns-fwd, item: "Forward DNS records for every IP plan entry", how: "dig +short <name>.vcf.lab returns the planned IP for every entry" }
  - { id: dep-dns-rev, item: "Reverse DNS (PTR) for every management IP, including the NSX VIP", how: "dig +short -x <ip> returns the same FQDN; run the loop from the DNS plan" }
  - { id: dep-ntp, item: "NTP server synchronised and reachable from all VLAN 10 clients", how: "chronyc tracking on infra01 shows a synced source; esxcli system ntp get on each host lists infra01" }
  - { id: dep-gateway, item: "Gateway .1 reachable on every VLAN", how: "From a nested host: vmkping -I <vmk> 10.10.<vlan-net>.1 for each vmknic" }
  - { id: dep-mtu, item: "Jumbo path proven on vMotion, vSAN and TEP VLANs", how: "vmkping -I <vmk> -d -s 8972 to another host succeeds; -s 1472 succeeds" }
  - { id: dep-depot, item: "VCF binaries/depot reachable from the installer", how: "Installer depot connection test succeeds; for an offline depot, the web server serves the expected directory structure (PROD/COMP/... metadata)" }
  - { id: dep-ram, item: "RAM budget leaves Proxmox headroom", how: "Sum of fixed VM memory + 12 GB host reserve <= 244 GB; free -g on Proxmox after start shows available memory" }

readinessChecklist:
  - { id: rdy-esx-version, item: "All nested hosts run the same ESX 9 build", how: "esxcli system version get on each host shows identical Version and Build" }
  - { id: rdy-esx-fqdn, item: "Each host's hostname/FQDN matches DNS", how: "esxcli system hostname get shows the FQDN; nslookup from the host resolves itself both ways" }
  - { id: rdy-esx-cert, item: "Host certificates issued for the final FQDN", how: "openssl s_client -connect esx01.vcf.lab:443 | openssl x509 -noout -subject shows esx01.vcf.lab" }
  - { id: rdy-esx-ntp, item: "Hosts use NTP and agree on time", how: "esxcli system ntp get shows enabled with infra01; date -u on each host within a second" }
  - { id: rdy-ssh, item: "SSH enabled on hosts for the installer", how: "ssh root@esx01.vcf.lab works; Host Client shows the SSH service running" }
  - { id: rdy-vsan-disk, item: "vSAN ESA device visible, empty and eligible on each host", how: "vdq -q lists the NVMe device as eligible; no leftover partitions (partedUtil getptbl shows none)" }
  - { id: rdy-nics, item: "Two vmxnet3 uplinks visible with link", how: "esxcli network nic list shows vmnic0 and vmnic1 Up" }
  - { id: rdy-installer, item: "VCF Installer deployed with correct Host Name (FQDN) and DNS Domain Name (domain only)", how: "Installer UI loads at https://sddcm01.vcf.lab; nslookup sddcm01.vcf.lab both ways from the installer" }
  - { id: rdy-spec-validated, item: "Deployment spec validation passes (or only understood lab warnings remain)", how: "VCF Installer validation report; tail /var/log/vmware/vcf/domainmanager/domainmanager.log for errors" }
  - { id: rdy-snapshot, item: "Pre-bring-up restore point exists", how: "zfs list -t snapshot | grep pre-bringup shows a snapshot for every nested ESX zvol" }
  - { id: rdy-backup-target, item: "SFTP backup target ready on the HDD pool", how: "sftp backup@infra01.vcf.lab from jump01 logs in and can write a test file" }

