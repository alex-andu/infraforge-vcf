intro: |
  This section is the build guide for a **VMware Cloud Foundation 9 home lab**: what hardware it really takes, which
  platform to run it on, how to lay out storage, networks, DNS and NTP, and in which order to deploy. Every lab in this
  course points here for the environment itself.

  Two honest ground rules:

  - **Nested labs are not supported by Broadcom.** Running ESX as a VM (on ESX, Proxmox VE or VMware Workstation) is a
    learning tool. The VCF *workflows*, UIs, APIs and failure modes you practise are the same as on real hardware;
    performance, hardware compatibility checks and some features are not.
  - **Several lab shortcuts are unsupported workarounds** documented by William Lam (Broadcom) on williamlam.com: single-host
    management domains, the vSAN ESA hardware mock VIB, HCL-file refreshes and pre-check bypasses. They are labelled as
    such below. Never use them in production, and expect them to change between 9.0.0, 9.0.1 and 9.1.

  The default VCF 9.0 topology needs **three ESX hosts with vSAN (ESA or OSA)** or **two hosts with external storage
  (FC VMFS or NFS)** for the management domain (per William Lam's single-host post, which describes these as the
  installer's default minimums). Single-node component deployments (one NSX Manager, one VCF Operations node) are
  available for small environments. The resource figures in the profiles come from William Lam's measured VCF 9.0
  lab deployment (simple, single-node components) and from Broadcom sizing KBs; where a value is an estimate, it says so.

platforms:
  - id: physical-esx
    name: Physical ESX hosts (bare metal)
    verdict: Best fidelity; the only option close to a real deployment. Needs compatible CPUs, NICs and NVMe.
    notes: |
      - **Host count**: 3 hosts for vSAN-based management domain, 2 with NFS/FC principal storage; 1 host only with the
        unsupported single-host workaround (see *VCF Installer lab workarounds*).
      - **CPU support matters in ESX 9.** Broadcom KB 318697 lists discontinued Intel families for VCF 9.x — including
        **Skylake-SP (Xeon Platinum 8100, Gold 6100/5100, Silver 4100, Bronze 3100)**, Broadwell-EP/DE, Kabylake-S and
        Skylake-S/D/W — and deprecated (still working, support ending) families including **Cascade Lake-SP (Platinum
        8200, Gold 6200/5200)**. Discontinued CPUs need the unsupported `allowLegacyCPU=true` boot option, and William Lam
        notes the CPU must still support **XSAVE**.
      - **Memory**: VCF 9.0 supports NVMe Tiering (memory tiering onto NVMe), which lets small hosts run more appliances.
        In 9.0 it is **not interoperable with nested ESX** or VMs with hardware-assisted virtualization.
      - **NICs**: VCF 9.0 can deploy with a single physical NIC (via JSON/API), but the installer pre-checks for 10 GbE;
        lab posts describe disabling that check. Enhanced Data Path is the default switch mode; non-certified NICs may need
        `"hostSwitchOperationalMode": "STANDARD"` in the deployment JSON.
      - **vSAN ESA** expects certified NVMe devices; consumer NVMe needs the mock-VIB/HCL workarounds.
  - id: nested-esx-on-esx
    name: Nested ESX on a physical ESX host
    verdict: The most common and best-documented lab approach; William Lam's automated VCF 9 lab script targets it.
    notes: |
      - Outer host: ESX 8.x/9.x managed by vCenter with DRS (the script uses a vApp). Lam's automated fleet lab asks for
        the ability to create VMs with up to **24 vCPU**, about **275 GB** of memory and **1.25 TB** thin storage, and
        uses **3 management hosts (32 vCPU / 112 GB each)** plus **3 workload hosts (16 vCPU / 32 GB each)** by default.
      - Port groups for nested hosts must allow nested VM MACs: enable **MAC Learning** or **Promiscuous mode**, plus
        **Forged transmits**.
      - Enable *Expose hardware-assisted virtualization to the guest* (VHV) on each nested ESX VM.
      - Do **not** enable NVMe Tiering on the outer ESX 9.0 host: nested ESX VMs (VHV) will fail to power on.
      - Lam's *Nested ESXi Virtual Appliance* for 9.0 is distributed via the Broadcom Support Portal (Flings) and needs a
        VCF/VVF entitlement (or VMUG Advantage with VCP-VCF).
  - id: nested-proxmox
    name: Nested ESX on Proxmox VE (KVM)
    verdict: Works for learning and is the learner's platform. Not supported by Broadcom or Proxmox for this use; requires careful VM settings.
    notes: |
      **Host preparation**
      - Enable nested virtualization in KVM: `cat /sys/module/kvm_intel/parameters/nested` must show `Y` (AMD:
        `/sys/module/kvm_amd/parameters/nested` shows `1`). If not: `echo "options kvm-intel nested=Y" > /etc/modprobe.d/kvm-intel.conf`
        and reload the module with all VMs stopped (Proxmox wiki *Nested Virtualization*).
      - AMD hosts: community reports that nested ESX 8 could not power on its own VMs on older Proxmox kernels; it was
        fixed with Proxmox 8.1 / kernel 6.5. Stay on a current Proxmox release.
      - Limit the ZFS ARC (see *Storage layout*) so ZFS caching does not compete with nested ESX memory.

      **Nested ESX VM settings**
      | Setting | Value | Why |
      |---|---|---|
      | CPU type | `host` | Passes VT-x/EPT and flags like AES-NI and 1 GB pages to ESX; NSX Edge DPDK needs AES-NI and 1 GB huge pages. VMs with nesting cannot be live-migrated. |
      | Sockets × cores, NUMA | e.g. 2 × 12, `numa: 1` | Keep each nested host inside physical NUMA boundaries where possible. |
      | Machine / firmware | `q35`; OVMF (UEFI) with an EFI disk, `pre-enrolled-keys=0` | UEFI is the modern ESX boot path. Community reports some EFI quirks (e.g. `local.sh`); SeaBIOS is a fallback. |
      | OS type | `other` | There is no ESX OS type in Proxmox. |
      | Memory | Fixed, `balloon: 0` | ESX cannot use the KVM balloon driver; do not overcommit physical RAM. |
      | Boot disk | **SATA**, 64 GB, `ssd=1`, `discard=on` | ESX has drivers for AHCI. It has **no VirtIO drivers**, so VirtIO SCSI/Block disks are invisible to it. |
      | vSAN ESA devices | **Emulated NVMe** via `args:` (`-drive ... if=none,id=NVME1 -device nvme,drive=NVME1,serial=...`) | The Proxmox GUI has no NVMe bus; QEMU's NVMe controller presents real NVMe devices, which ESA expects. Give each a unique `serial`. Verify in ESX with `vdq -q` / `esxcli storage core device list`. |
      | NICs | **vmxnet3** ×2, `bridge=vmbr0`, **no VLAN tag**, `firewall=0` | ESX has a native vmxnet3 driver; e1000e is reported unreliable in community threads and VirtIO has no ESX driver. No tag on a VLAN-aware bridge = trunk of all bridge VLANs, so ESX port groups tag VLANs themselves. |
      | MTU | Set **9000 on physical NICs, bond and vmbr0** | Proxmox sets each VM tap device to the bridge MTU at start-up (qemu-server/pve-common source). The `mtu=` NIC option is VirtIO-only. |

      **Known quirks**
      - Linux bridges learn MAC addresses by default, so nested VMs behind a nested ESX (vCenter, NSX, edges) are reachable
        without promiscuous-mode settings. Keep `firewall=0` on nested ESX NICs.
      - Community fix when the ESX Host Client returns TLS errors while ping works: disable checksum offload on the nested
        uplink, `esxcli network nic cso set -e 0 -n vmnic0` (reported for ESXi 7/8 on Proxmox; test on 9).
      - NVMe drives attached through `args:` are not managed by Proxmox (no GUI, not in `qm snapshot`). Use ZFS zvols and
        snapshot the pool for whole-lab restore points.
  - id: vmware-workstation
    name: VMware Workstation (desktop)
    verdict: Fine for ESX/vCenter fundamentals; too small for a VCF 9 management domain on typical desktops.
    notes: |
      - Supports nested ESX with *Virtualize Intel VT-x/EPT or AMD-V/RVI*. On Windows hosts with Hyper-V/VBS enabled,
        nested hardware virtualization has historically not been available — check the current Workstation release notes.
      - A VCF 9.0 management domain with single-node components needs roughly **194 GB of RAM for appliances alone**
        including VCF Automation (about **98 GB** without it) before ESX and vSAN overhead — beyond most desktops.
      - Good uses: one or two nested ESX hosts, vCenter, vSAN/NSX concepts, VCF Installer UI exploration.
      - Laptop/desktop SSD endurance and sleep/hibernate events are real risks for long-running nested vSAN.

profiles:
  - id: minimal
    name: Minimal – single host (unsupported shortcut)
    purpose: Run the core VCF 9 management components on one ESX host to learn the installer, VCF Operations and day-2 workflows with the least hardware. Uses William Lam's unsupported single-host workaround.
    cpu: "16 cores / 32 threads recommended (8c/16t boots the core stack but cannot run VCF Automation, which needs a 24-vCPU VM)"
    ram: "128 GB on a physical ESX host with NVMe Tiering; about 160 GB+ if the host is nested (NVMe Tiering does not work nested in 9.0)"
    disk: "1 x boot/OSData device + 1 x NVMe for vSAN ESA (2 TB recommended) + optional NVMe for tiering (physical only)"
    nics: "1 x 2.5/10 GbE is enough (single-NIC deployment via JSON); 2 NICs make VLAN work and recovery easier"
    storageLayout: |
      - vSAN ESA on a single host requires a storage policy without host failure tolerance; William Lam's
        `vcf-9x-in-box` repo ships a script that fixes the vSAN ESA default policy during deployment for one/two-host setups.
      - Alternative: NFS principal storage (must be on a VLAN separate from ESX management per Lam's notes; NFS normally
        needs 2 hosts).
      - Provisioned (thin) space for the core appliances is about 2.6 TB, actually used about 260 GB (Lam's measurements).
    nested: |
      Possible nested, but the memory saving from NVMe Tiering is lost. Give the nested host 16 vCPU and ~144 GB and keep
      VCF Automation out of scope. Deploy with the **JSON spec** (the installer UI still enforces the minimum host count)
      after adding the single-host feature property to the installer (see the *VCF Installer lab workarounds* section).
    network: |
      One management VLAN plus vMotion, vSAN and host TEP VLANs (vMotion/vSAN can be skipped functionally on one host but
      the spec still needs networks). Jumbo frames optional on a single host.
    vms:
      - { name: esx01, role: Single ESX host (physical, or nested VM), vcpu: 16, ramGb: 144, diskGb: 1064, notes: "Nested sizing; 64 GB boot + ~1 TB vSAN ESA device" }
      - { name: sddcm01, role: VCF Installer reused as SDDC Manager, vcpu: 4, ramGb: 16, diskGb: 931, notes: "Thin; ~77 GB used" }
      - { name: vc01, role: Management vCenter, vcpu: 4, ramGb: 21, diskGb: 642, notes: "Thin; ~30 GB used" }
      - { name: nsx01a, role: NSX Manager (single node, medium), vcpu: 6, ramGb: 24, diskGb: 300, notes: "Thin; ~14 GB used" }
      - { name: ops01, role: VCF Operations (single node), vcpu: 4, ramGb: 16, diskGb: 290, notes: "Thin; ~13 GB used" }
      - { name: opsfm01, role: VCF Operations fleet management, vcpu: 4, ramGb: 12, diskGb: 206, notes: "Thin; ~117 GB used" }
      - { name: opscp01, role: VCF Operations collector, vcpu: 4, ramGb: 16, diskGb: 280, notes: "Thin; ~11 GB used" }
    limitations:
      - Unsupported topology; the single-host feature property name differs between 9.0.0 and 9.0.1 and may change again.
      - No vSAN redundancy, no vSphere HA, no realistic maintenance-mode or upgrade behaviour.
      - No NSX Edge cluster or VCF Automation in the base footprint; north-south routing and 4.4 objectives stay theoretical.
      - Lam reports VCF Automation could not run on a 128 GB single host even with NVMe Tiering.

  - id: recommended
    name: Recommended – three nested hosts (fits the learner's server)
    purpose: A realistic VCF 9 management domain with vSAN ESA across three hosts, NSX with an edge cluster and Tier-0 BGP to a lab router, VCF Operations and fleet management. VCF Automation is a stretch goal.
    cpu: "32+ physical cores / 64+ threads (the learner has 2 x 28c/56t = 56 cores / 112 threads)"
    ram: "256 GB (tight but workable without VCF Automation running concurrently)"
    disk: "1 TB+ NVMe for all nested ESX disks (2 TB more comfortable), SSD mirror for the hypervisor, HDD pool for depot and backups"
    nics: "2 x 10 GbE (bonded) recommended; 1 x 1/2.5/10 GbE works because nearly all traffic stays inside the server"
    storageLayout: |
      | Pool | Devices | Holds |
      |---|---|---|
      | `rpool` (ZFS mirror) | 2 x 256 GB SSD | Proxmox OS, ISO library, infra01 (DNS/NTP), rtr01, jump01 |
      | `nvmepool` (ZFS, storage id `nvme-fast`, thin/sparse) | 1 TB NVMe | Nested ESX boot disks, vSAN ESA device zvols, esx01 temporary local VMFS for the installer |
      | `bulk` (ZFS RAID10 or RAIDZ1) | 4 x 2 TB HDD | VCF offline depot, SFTP backup target data, vzdump backups, ISO archive, optional NFS datastore |

      vSAN ESA inside the nested hosts stores everything twice (RAID-1, FTT=1) or 1.5x (RAID-5 2+1 on 3 hosts). With ~260 GB
      used by the core appliances, expect roughly 400–550 GB of vSAN usage plus edges and test VMs: watch the NVMe pool.
    nested: |
      Three nested ESX VMs, CPU type `host`, 2 sockets x 12 cores, NUMA on, 72 GB fixed RAM each, SATA 64 GB boot, one
      emulated NVMe device (500 GB thin zvol) for vSAN ESA, 2 x vmxnet3 on a VLAN-aware bridge (trunk). esx01 temporarily
      gets a second SATA disk (200 GB thin) as local VMFS for the VCF Installer.
    network: |
      VLAN-aware `vmbr0` with MTU 9000 trunked to the switch; VLANs per the VLAN plan (management 1500, vMotion/vSAN/TEP
      9000, edge uplinks 1500). A router VM (rtr01) provides gateways for every VLAN and BGP for the Tier-0.
    vms:
      - { name: infra01, role: "DNS (forward + reverse) and NTP server (Proxmox VM)", vcpu: 2, ramGb: 2, diskGb: 20 }
      - { name: rtr01, role: "Inter-VLAN router + BGP peer (Proxmox VM)", vcpu: 2, ramGb: 2, diskGb: 16 }
      - { name: jump01, role: "Jump host: browser, PowerCLI, ovftool, SSH (Proxmox VM, optional)", vcpu: 2, ramGb: 4, diskGb: 40 }
      - { name: esx01, role: Nested ESX management host 1, vcpu: 24, ramGb: 72, diskGb: 764, notes: "64 GB boot + 500 GB NVMe vSAN + 200 GB temporary local VMFS (all thin)" }
      - { name: esx02, role: Nested ESX management host 2, vcpu: 24, ramGb: 72, diskGb: 564 }
      - { name: esx03, role: Nested ESX management host 3, vcpu: 24, ramGb: 72, diskGb: 564 }
      - { name: sddcm01, role: VCF Installer → SDDC Manager (inside nested), vcpu: 4, ramGb: 16, diskGb: 931, notes: "Thin" }
      - { name: vc01, role: Management vCenter (inside nested), vcpu: 4, ramGb: 21, diskGb: 642, notes: "Thin" }
      - { name: nsx01a, role: NSX Manager single node medium (inside nested), vcpu: 6, ramGb: 24, diskGb: 300, notes: "Thin" }
      - { name: ops01, role: VCF Operations (inside nested), vcpu: 4, ramGb: 16, diskGb: 290, notes: "Thin" }
      - { name: opsfm01, role: VCF Operations fleet management (inside nested), vcpu: 4, ramGb: 12, diskGb: 206, notes: "Thin" }
      - { name: opscp01, role: VCF Operations collector (inside nested), vcpu: 4, ramGb: 16, diskGb: 280, notes: "Thin" }
      - { name: edge01a, role: NSX Edge node medium (inside nested), vcpu: 4, ramGb: 8, diskGb: 200 }
      - { name: edge01b, role: NSX Edge node medium (inside nested), vcpu: 4, ramGb: 8, diskGb: 200 }
      - { name: auto01, role: "VCF Automation (inside nested) – stretch goal, see yourLab", vcpu: 24, ramGb: 96, diskGb: 626, notes: "Does not fit concurrently in 256 GB without ESX memory overcommit" }
    limitations:
      - Nested on KVM is unsupported; vSAN ESA performance depends entirely on the single NVMe and is not representative.
      - 256 GB leaves no room for VCF Automation (96 GB) alongside the rest; plan a RAM upgrade (384–512 GB) if 4.4 hands-on matters.
      - Single NVMe = no redundancy for the whole nested lab; keep backups and pool snapshots on the HDD pool.
      - One physical server is one failure domain; HA and vSAN tests are logical only.
      - Hardware checks (vSAN ESA HCL, 10 GbE pre-check) need the documented lab workarounds.

  - id: real-lab
    name: Documented real lab – vcf-lab-01
    purpose: A sanitized snapshot of Alex's supplied VCF 9.0.2 topology for guide planning and evidence collection. It is a documented current state, not a recommended production design or an independently observed live state. The VM table contains only the appliance whose complete CPU, RAM and disk sizing was supplied; the topology blocks below remain authoritative for the other components.
    cpu: "Primary Proxmox node: 2 x Intel Xeon Platinum 8173M; each of the four nested ESX 9.0.2 VMs has 12 vCPU"
    ram: "Primary Proxmox node: about 251 GiB; each nested ESX VM has about 44–45 GB"
    disk: "vcf-fast: 1 TB NVMe ZFS (~899 GiB); vcf-aux: 256 GB (~231 GiB); vcf-capacity: 2 x 2 TB HDD mirror (~1.81 TB). The 256 GB nvme1n1 Proxmox OS device must not be touched."
    nics: "Four vmxnet3 NICs per nested ESX on vmbr3; management VDS MTU 1700 with vmnic0/vmnic1 active-active. Observed physical-uplink MTUs are mixed and require guide-time validation."
    storageLayout: |
      | Layer | Documented state |
      |---|---|
      | Proxmox OS | `nvme1n1`, Samsung 256 GB — **do not touch** |
      | Fast pool | `vcf-fast`, Kingston 1 TB NVMe ZFS, about 899 GiB |
      | Auxiliary pool | `vcf-aux`, Samsung 256 GB, about 231 GiB |
      | Capacity pool | `vcf-capacity`, two 2 TB HDDs in a mirror, about 1.81 TB |
      | Management-domain storage | vSAN OSA, FTT=0; datastore `mgmt-domain-cl01-ds-vsan01` |

      Preserve `VM501 infra01` and `CT106 infraforge`. The inventory did not provide complete virtual-disk sizing
      for every nested host or management appliance, so this profile does not manufacture those values.
    nested: |
      Proxmox 9.x cluster `andulab`; primary node `prox-host-00.andulab.local` (`10.10.10.99`). Four nested ESX 9.0.2
      VMs use VMIDs 701–704 and management addresses `10.100.10.11`–`10.100.10.14`. Each has 12 vCPU, about 44–45 GB
      RAM and four vmxnet3 NICs on `vmbr3`. VCF instance `vcf-lab-01` contains the single-node Standard management
      domain `mgmt-domain`, datacenter `mgmt-domain-dc01` and cluster `mgmt-domain-cl01`. Its VDS is
      `mgmt-domain-cl01-vds01`, MTU 1700, with `vmnic0` and `vmnic1` active-active.
    network: |
      `infra01` (`10.100.80.10`) supplies BIND DNS, chrony NTP and routing; the DNS zone is `vcf.home.arpa`.

      - **VLAN 110 — Management:** `10.100.10.0/24`; gateway `10.100.10.1`; MTU 1500.
      - **VLAN 120 — vMotion:** `10.100.20.0/24`; validate gateway; MTU 1500.
      - **VLAN 130 — vSAN:** `10.100.30.0/24`; validate gateway; MTU 1500.
      - **VLAN 140 — NSX TEP:** `10.100.40.0/24`; pool `.20–.79`; validate gateway and MTU.
      - **VLAN 180 — Infrastructure:** service address `10.100.80.10`; validate gateway and MTU.

      Management components: VCF Installer / SDDC Manager `vcf01` (`10.100.10.20`), vCenter `vcenter01` (`.21`),
      NSX VIP `nsx` (`.30`), NSX node `nsx01` (`.31`), Operations `ops01` (`.60`), fleet management `fleet01`
      (`.61`) and collector `collector01` (`.62`), all under `vcf.home.arpa`. The offline depot is
      `depot.vcf.home.arpa` (`10.10.30.100`).
    vms:
      - { name: nsx01, role: "Documented single NSX 9.0.2 manager node (medium)", vcpu: 6, ramGb: 24, diskGb: 300, notes: "Only appliance with complete sizing in the supplied inventory; this row is not the total lab footprint" }
    resourceTotalsComplete: false
    limitations:
      - Supplied topology is documented but not independently queried; every practical guide must capture fresh runtime evidence for the systems it touches.
      - Single-node Standard management domain, vSAN OSA FTT=0 and one Proxmox failure domain provide no representative production resilience.
      - Gateway and MTU values for several service networks still require validation; VLANs 150, 160 and 170 exist but their purposes and subnets are not yet documented.
      - Forward/reverse DNS equality and live NTP synchronization remain unverified.
      - No NSX Edge, VI Workload Domain, Supervisor, VCF Automation, Operations for Logs, Operations for Networks or HCX deployment is confirmed by the supplied inventory.
      - The documented nested speed-validation override and KVM topology are lab-specific and unsupported for production.

  - id: advanced
    name: Advanced – management + workload domain
    purpose: Full fleet practice — management domain with VCF Automation and VCF Operations for logs, plus a VI workload domain with its own vCenter/NSX and Supervisor.
    cpu: "64+ cores / 128 threads, or two servers"
    ram: "512–768 GB (Lam's automated lab uses 3 x 112 GB management + 3 x 32 GB workload hosts)"
    disk: "4 TB+ NVMe (or one NVMe per nested host group), plus bulk storage for depot and backups"
    nics: "2 x 25 GbE or 2 x 10 GbE per server; a real L3 switch with jumbo frames if two servers"
    storageLayout: |
      Management hosts and workload hosts on separate NVMe devices so vSAN I/O of one domain does not starve the other;
      optional NFS supplemental datastore from the bulk pool on its own VLAN.
    nested: |
      4 management hosts (allows maintenance mode with FTT=1 and still 3 hosts), 3 workload hosts. Same Proxmox VM
      template as the recommended profile.
    network: |
      Same VLAN plan; workload domain can share VLANs in a lab or use its own vMotion/vSAN/TEP VLANs (closer to production).
    vms:
      - { name: esx01-esx04, role: "Nested management hosts (each)", vcpu: 24, ramGb: 112, diskGb: 664 }
      - { name: esx05-esx07, role: "Nested workload domain hosts (each)", vcpu: 16, ramGb: 48, diskGb: 364 }
      - { name: auto01, role: VCF Automation, vcpu: 24, ramGb: 96, diskGb: 626, notes: "Lam: vCPU can be lowered to 16/12 at unknown performance cost" }
      - { name: logs01, role: VCF Operations for logs (small), vcpu: 4, ramGb: 8, diskGb: 530, notes: "Small = proof-of-concept size per KB 397782; disk size from 8.x sizing, verify for 9.0" }
      - { name: vc02, role: Workload domain vCenter, vcpu: 4, ramGb: 21, diskGb: 642 }
      - { name: nsx02a, role: Workload domain NSX Manager (single node), vcpu: 6, ramGb: 24, diskGb: 300 }
      - { name: edge02a-b, role: "Workload domain edges (each, medium)", vcpu: 4, ramGb: 8, diskGb: 200 }
    limitations:
      - VCF Operations for networks and HCX sizing are not covered here; check the sizing guidance for your build.
      - Still unsupported nested; licensing/entitlement required for binaries.
      - Two-server builds need a real switch fabric and reintroduce physical MTU/VLAN troubleshooting (useful practice).

yourLab: |
  ### Your server and what it can do

  | Resource | You have | Budget for the lab |
  |---|---|---|
  | CPU | 2 × 28 cores / 56 threads = **56 cores, 112 threads** | 3 nested hosts × 24 vCPU = 72 vCPU + ~6 for infra VMs: comfortable |
  | RAM | **256 GB** | The constraint. See the budget below |
  | Fast storage | 1 × 1 TB NVMe | All nested ESX disks (boot + vSAN ESA devices) |
  | SSD | 2 × 256 GB | Proxmox OS mirror + small infra VMs + ISOs |
  | HDD | 4 × 2 TB | Depot, backups, archives, optional NFS |

  **Verdict:** the **Recommended profile fits** — a three-host vSAN ESA management domain with vCenter, NSX (single
  manager), an edge cluster with Tier-0 BGP to your router VM, VCF Operations, fleet management and the collector.
  **VCF Automation (24 vCPU / 96 GB) does not fit at the same time** in 256 GB.

  **First check your CPU generation** (`lscpu | grep "Model name"`). 28-core Xeons exist in several generations:

  | If the model is… | ESX 9 status (KB 318697) | What to do |
  |---|---|---|
  | Platinum 8180/8176, Gold 6100 series (Skylake-SP) | **Discontinued** | Nested ESX will see this CPU (CPU type host). Expect the unsupported `allowLegacyCPU=true` boot option; XSAVE required |
  | Platinum 8280/8276, Gold 6258R and other 6200/5200 (Cascade Lake) | **Deprecated** | Works with warnings; fine for a lab |
  | Gold 6330/6348, Platinum 83xx (Ice Lake) or newer | Supported | Nothing special |

  ### Disk placement

  | What | Pool / device | Size (thin) | Why |
  |---|---|---|---|
  | Proxmox OS | `rpool` SSD mirror | ~30 GB | Redundant boot |
  | infra01 (DNS/NTP), rtr01, jump01 | `rpool` | ~80 GB | Must survive and start first; small |
  | ESX boot disks esx01–03 (SATA) | `nvme-fast` | 3 × 64 GB | Boot + OSData; ESX logs live here |
  | vSAN ESA devices (emulated NVMe) | `nvmepool` zvols | 3 × 500 GB (thin) | vSAN latency = NVMe latency; **never on HDD** |
  | esx01 local VMFS (installer) | `nvme-fast` | 200 GB, temporary | VCF Installer OVA; Storage vMotion to vSAN after bring-up, then remove |
  | VCF offline depot | `bulk` HDD | 200–400 GB | Sequential reads; speed not critical |
  | SFTP backup target (VCF backups) | `bulk` (served by infra01 or a small VM) | 100+ GB | Off the NVMe so a dead NVMe does not take backups with it |
  | Proxmox vzdump backups, ZFS snapshot copies | `bulk` | as needed | Restore points |
  | Optional NFS datastore (VLAN 70) | `bulk` | 1 TB | Supplemental storage for test VMs and templates |

  ### RAM budget (256 GB)

  | Consumer | GB | Note |
  |---|---|---|
  | Proxmox host + ZFS ARC capped at 8 GB | 12 | Set `zfs_arc_max`; without a cap ZFS may take much more |
  | infra01 + rtr01 | 4 | |
  | jump01 (optional) | 4 | Or use your workstation |
  | esx01 / esx02 / esx03 | 3 × 72 = 216 | Fixed, `balloon: 0` |
  | **Total** | **236** | ~20 GB headroom; never let Proxmox swap or OOM-kill a nested host |

  Inside the 216 GB the nested hosts need their own ESX + vSAN ESA overhead (estimate ~8 GB per host — measure it
  in your lab), leaving roughly 190 GB for VMs:

  | Inside nested | GB |
  |---|---|
  | SDDC Manager (reused installer) | 16 |
  | vCenter | 21 |
  | NSX Manager (single, medium) | 24 |
  | VCF Operations + fleet management + collector | 16 + 12 + 16 |
  | 2 × NSX Edge (medium) | 16 |
  | **Subtotal** | **121** |
  | Free for Supervisor, test VMs | ~70 |

  VCF Automation (96 GB) would need ESX memory overcommit (swapping to vSAN on the NVMe — very slow) or more RAM. Treat it
  as a later project after a RAM upgrade, or deploy it briefly with everything non-essential powered off and accept the
  slowness.

  ### What to deploy first

  1. **Proxmox preparation** – nested KVM, ZFS pools, ARC cap, VLAN-aware `vmbr0` at MTU 9000 (lab `lab-homelab-proxmox-prep`).
  2. **Foundations** – infra01 (DNS forward/reverse + NTP), rtr01 (gateways for all VLANs), MTU tests (lab `lab-network-readiness`).
  3. **Learn on one host** – a single nested ESX + vCenter for phases 1–4 while VCF binaries are pending (labs `lab-esx-host-first-vm`, `lab-vcenter-cluster-ha-drs`).
  4. **Three VCF-ready nested hosts** – fresh ESX 9 installs, NTP, DNS, SSH, certificates regenerated for the FQDN, vSAN ESA devices visible.
  5. **Pool snapshot** (`zfs snapshot -r nvmepool@pre-bringup`) with everything powered off.
  6. **VCF Installer → management domain** (vCenter, vSAN ESA, NSX, VCF Operations, fleet management, collector).
  7. **Snapshot again**, then NSX Edge cluster + Tier-0 BGP to rtr01, then Supervisor.
  8. Optional later: VCF Automation (RAM permitting), VCF Operations for logs.

