id: d04-vds-uplinks-teaming
title: VDS management plane, host proxy switches, uplinks and teaming
description: >
  vCenter holds the vSphere Distributed Switch definition (management plane) and pushes it to the host proxy switch
  on each ESX host (data plane). Each host maps two physical NICs to the logical uplinks uplink1 and uplink2, cabled
  to two different top-of-rack switches. Distributed port groups for management, vMotion and vSAN use "Route based
  on physical NIC load" with both uplinks active; the VM management port group uses ephemeral binding. NSX host TEPs
  use the NSX uplink profile teaming. If vmnic0 fails, the port groups fail over to vmnic1 without vCenter
  involvement.
width: 1000
height: 600
groups:
  - { id: g-vc, x: 330, y: 20, w: 340, h: 110, label: "Management plane", kind: mgmt }
  - { id: g-h1, x: 20, y: 170, w: 460, h: 300, label: "esx-01 host proxy switch (data plane)", kind: compute }
  - { id: g-h2, x: 520, y: 170, w: 460, h: 300, label: "esx-02 host proxy switch (data plane)", kind: compute }
nodes:
  - { id: vc, x: 400, y: 55, w: 200, h: 60, label: "vCenter: VDS config", sublabel: "MTU · port groups · NIOC", kind: mgmt, component: vcenter, info: "Stores the VDS definition and pushes it to every member host. If vCenter is down, no changes can be made but forwarding continues." }
  - { id: pg1, x: 40, y: 200, w: 200, h: 56, label: "PG mgmt / vMotion / vSAN", sublabel: "LBT, uplink1+2 active", kind: network, info: "Distributed port groups with 'Route based on physical NIC load' (VCF 9 recommendation). Static port binding." }
  - { id: pg2, x: 260, y: 200, w: 200, h: 56, label: "PG VM management", sublabel: "ephemeral binding", kind: mgmt, info: "Ephemeral binding lets you connect a recovered vCenter VM on the host when vCenter itself is unavailable (VCF-VDS-COM-RCMD-DPG-001)." }
  - { id: tep1, x: 150, y: 290, w: 200, h: 56, label: "NSX TEPs vmk10/vmk11", sublabel: "NSX uplink profile teaming", kind: nsx, info: "Host TEPs created by NSX host preparation; their teaming comes from the NSX uplink profile, not from a distributed port group policy you edit." }
  - { id: h1n0, x: 40, y: 390, w: 180, h: 56, label: "uplink1 = vmnic0", kind: network, info: "Logical uplink name used by policies; the physical vmnic mapping is per host." }
  - { id: h1n1, x: 260, y: 390, w: 180, h: 56, label: "uplink2 = vmnic1", kind: network, info: "Second uplink to a different ToR for redundancy." }
  - { id: pg3, x: 540, y: 200, w: 200, h: 56, label: "Same port groups", sublabel: "pushed from vCenter", kind: network, info: "Identical configuration on every host – the main benefit of a VDS over standard switches." }
  - { id: h2n0, x: 540, y: 390, w: 180, h: 56, label: "uplink1 = vmnic2", kind: network, info: "On this host the NIC is vmnic2, but policies still refer to uplink1." }
  - { id: h2n1, x: 760, y: 390, w: 180, h: 56, label: "uplink2 = vmnic3", kind: network, info: "Logical-to-physical mapping is per host." }
  - { id: nioc, x: 760, y: 200, w: 200, h: 56, label: "NIOC v3 shares", sublabel: "VM High · vSAN High · mgmt Normal · vMotion Low", kind: ops, info: "Network I/O Control divides bandwidth only when an uplink is congested. VCF defaults keep vMotion from starving storage." }
  - { id: tora, x: 200, y: 520, w: 180, h: 56, label: "ToR-A", kind: network, component: physical-network, info: "Independent uplinks, no static EtherChannel (unsupported in VCF 9)." }
  - { id: torb, x: 620, y: 520, w: 180, h: 56, label: "ToR-B", kind: network, component: physical-network, info: "Second switch. LACP only with VCF 9 conditions; independent uplinks preferred." }
edges:
  - { from: vc, to: g-h1, label: "push config", kind: mgmt, dashed: true }
  - { from: vc, to: g-h2, label: "push config", kind: mgmt, dashed: true }
  - { from: pg1, to: h1n0, kind: data }
  - { from: pg1, to: h1n1, kind: data }
  - { from: tep1, to: h1n0, kind: overlay }
  - { from: tep1, to: h1n1, kind: overlay }
  - { from: h1n0, to: tora, kind: data }
  - { from: h1n1, to: torb, kind: data }
  - { from: h2n0, to: tora, kind: data }
  - { from: h2n1, to: torb, kind: data }
steps:
  - { title: "Configure once", text: "vCenter holds the VDS and pushes identical port groups to every host.", highlight: [vc, g-h1, g-h2] }
  - { title: "Logical uplinks", text: "Policies refer to uplink1/uplink2; each host maps its own vmnics to them.", highlight: [h1n0, h1n1, h2n0, h2n1] }
  - { title: "Teaming", text: "Infrastructure port groups use load-based teaming with both uplinks active; TEPs use the NSX uplink profile.", highlight: [pg1, tep1] }
  - { title: "Failover without vCenter", text: "If ToR-A fails, the host data plane moves ports to uplink2. vCenter only reports the alarm.", highlight: [h1n1, torb, pg1] }
