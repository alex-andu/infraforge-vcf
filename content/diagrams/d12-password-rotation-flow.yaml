id: d12-password-rotation-flow
title: Update, rotate and remediate a managed password
description: >
  VCF stores the credentials it uses to talk to each component. Update sets a password you choose on the server side
  (where the account lives) and the client side (where VCF uses it). Rotate does the same with an auto-generated
  password and can be scheduled (performed through SDDC Manager in 9.0; ESX accounts can be rotated but not on a
  schedule). Remediate is the repair action: when someone changed a password directly on the component, you give VCF
  the new value so its stored credential matches again.
width: 1000
height: 520
nodes:
  - { id: admin, x: 40, y: 40, w: 180, h: 56, label: "Administrator", kind: external, info: "Needs Fleet Management > Passwords > Manage and View permissions in VCF Operations." }
  - { id: ops, x: 300, y: 40, w: 200, h: 56, label: "VCF Operations", sublabel: "Fleet Mgmt > Passwords", kind: ops, component: vcf-operations, info: "Update and Remediate for VCF Management and VCF Instances. Expiry and connection status refresh once a day here; use the SDDC Manager API for real time." }
  - { id: sddc, x: 300, y: 190, w: 200, h: 60, label: "SDDC Manager", sublabel: "credential store", kind: mgmt, component: sddc-manager, info: "Holds instance component credentials. Rotate (and scheduled rotation) lives in SDDC Manager: Security > Password Management. lookup_passwords and GET /v1/credentials read stored values." }
  - { id: fleet, x: 40, y: 190, w: 200, h: 60, label: "Fleet management", sublabel: "mgmt components", kind: ops, component: vcf-operations-fleet-management, info: "Applies updates for management component accounts (VCF Operations, Automation, Identity Broker, logs, networks)." }
  - { id: vc, x: 600, y: 120, w: 170, h: 56, label: "vCenter", sublabel: "root, svc-*", kind: mgmt, component: vcenter, info: "vCenter root expires after 90 days by default; svc-* service accounts are system managed and rotate automatically." }
  - { id: nsx, x: 600, y: 220, w: 170, h: 56, label: "NSX Manager", sublabel: "root, admin, audit", kind: nsx, component: nsx-manager, info: "root, admin and audit accounts expire after 90 days by default." }
  - { id: esx, x: 600, y: 320, w: 170, h: 56, label: "ESX hosts", sublabel: "root, svc-vcf-*", kind: compute, component: esx-host, info: "ESX root can be rotated but scheduled rotation is not supported for ESX." }
  - { id: manual, x: 820, y: 220, w: 150, h: 56, label: "Manual change", sublabel: "on the component", kind: security, info: "Someone reset a password directly on the component (or it expired and was reset). VCF's stored copy is now wrong: status shows disconnected/failed until you Remediate." }
edges:
  - { from: admin, to: ops, kind: mgmt }
  - { from: ops, to: sddc, label: "instance accounts", kind: control }
  - { from: ops, to: fleet, label: "mgmt accounts", kind: control }
  - { from: sddc, to: vc, label: "update / rotate", kind: mgmt }
  - { from: sddc, to: nsx, kind: mgmt }
  - { from: sddc, to: esx, kind: mgmt }
  - { from: manual, to: nsx, label: "out of band", kind: dependency, dashed: true }
steps:
  - { title: "Update", text: "You choose the password; VCF changes it on the component and stores it.", highlight: [admin, ops, sddc, vc] }
  - { title: "Rotate", text: "VCF generates a random password per component policy and changes both sides; schedulable in SDDC Manager.", highlight: [sddc, vc, nsx, esx] }
  - { title: "Drift", text: "A manual change on the component breaks VCF's stored credential.", highlight: [manual, nsx] }
  - { title: "Remediate", text: "Give VCF the password that is now on the component; it re-syncs its stored copy.", highlight: [ops, sddc, nsx] }
