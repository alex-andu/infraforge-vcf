  - { title: "SDDC", text: "Compute, storage and network are virtualized and lifecycle-managed as one.", highlight: [compute, storage, network, lifecycle] }
  - { title: "Operate", text: "VCF Operations gives one place to run the platform.", highlight: [operate] }
  - { title: "Consume", text: "VCF Automation adds self-service, tenancy and governance: the cloud part of private cloud.", highlight: [consume, consumers] }
