id: d-lab-enable-supervisor-logical
title: Supervisor lab – simplified Supervisor on wld01
description: >
  The simplified Supervisor runs one control plane VM on cluster wld01-cl01 (one vSphere zone), on a single VLAN 60
  distributed port group used for both management and workloads, with storage from the wld01-nfs datastore through a
  tag-based storage policy. A namespace lab-dev holds a VM created through VM Service. The stretch goal adds a
  Foundation Load Balancer, which enables Supervisor Services and vSphere Pods.
width: 1000
height: 600
groups:
  - { id: g-zone, x: 20, y: 120, w: 640, h: 460, label: "vSphere zone = wld01-cl01 (esx-21..23)", kind: compute }
nodes:
  - { id: vc, x: 40, y: 20, w: 220, h: 64, label: "vcenter-wld01", sublabel: "activates Supervisor", kind: mgmt, component: vcenter, info: "Simplified deployment flow." }
  - { id: ws, x: 720, y: 20, w: 250, h: 64, label: "Workstation (kubectl)", kind: external, info: "kubectl vsphere login to the control plane address." }
  - { id: cp, x: 60, y: 170, w: 260, h: 64, label: "Control plane VM (1)", sublabel: "10.10.60.10-14", kind: mgmt, component: supervisor, info: "Single control plane VM; scale to 3 for HA later." }
  - { id: ns, x: 60, y: 300, w: 560, h: 64, label: "Namespace lab-dev: quota, storage policy, VM class, content library", kind: vm, info: "Where the VM Service VM lives." }
  - { id: vm, x: 60, y: 420, w: 260, h: 64, label: "VM Service VM", kind: vm, info: "Created with a VirtualMachine manifest." }
  - { id: pol, x: 360, y: 420, w: 260, h: 64, label: "Policy wld01-supervisor", sublabel: "-> wld01-nfs", kind: storage, info: "Tag-based storage policy; becomes a storage class." }
  - { id: pg, x: 360, y: 170, w: 260, h: 64, label: "VLAN 60 port group", sublabel: "mgmt + workload", kind: network, info: "One network for both in the simplified model." }
  - { id: lb, x: 720, y: 200, w: 250, h: 64, label: "Foundation LB", sublabel: "stretch goal", kind: network, info: "Packaged with vCenter; VDS networking only; enables Supervisor Services and vSphere Pods." }
  - { id: svc, x: 720, y: 340, w: 250, h: 64, label: "Supervisor Service", sublabel: "stretch goal", kind: ops, info: "For example Local Consumption Interface; needs the LB." }
edges:
  - { from: vc, to: cp, label: "activate", kind: mgmt }
  - { from: cp, to: pg, kind: data }
  - { from: ws, to: cp, label: "kubectl", kind: data }
  - { from: cp, to: ns, kind: control }
  - { from: ns, to: vm, kind: data }
  - { from: vm, to: pol, kind: storage }
  - { from: lb, to: cp, kind: data, dashed: true }
  - { from: svc, to: lb, kind: dependency, dashed: true }
steps:
  - { title: "Activate", text: "vCenter activates a single control plane VM on one network.", highlight: [vc, cp, pg] }
  - { title: "Consume", text: "Namespace with policy and VM class; VM created by kubectl.", highlight: [ws, ns, vm, pol] }
  - { title: "Grow", text: "Add a Foundation LB, then Supervisor Services become possible.", highlight: [lb, svc] }
