  - { from: bond, to: dns, kind: data }
  - { from: bond, to: router, kind: data }
  - { from: bond, to: esx1, label: "vmxnet3 trunk", kind: data }
  - { from: bond, to: esx2, kind: data }
  - { from: bond, to: esx3, kind: data }
  - { from: bond, to: jump, kind: data }
  - { from: esx1, to: nvme, kind: storage, dashed: true }
  - { from: esx2, to: nvme, kind: storage, dashed: true }
  - { from: esx3, to: nvme, kind: storage, dashed: true }
  - { from: dns, to: ssd, kind: storage, dashed: true }
  - { from: jump, to: hdd, label: "depot", kind: storage, dashed: true }
steps:
  - { title: "Fabric", text: "Switch trunk and VLAN-aware vmbr0 with MTU 9000 on bond and bridge.", highlight: [sw, bond, mgmt] }
  - { title: "Foundations", text: "Build DNS/NTP and the router before any ESX host.", highlight: [dns, router] }
  - { title: "Nested hosts", text: "Three nested ESX VMs with host CPU, vmxnet3 trunks and NVMe devices.", highlight: [esx1, esx2, esx3] }
  - { title: "Storage placement", text: "Nested ESX disks on NVMe; OS and infra on the SSD mirror; depot and backups on HDD.", highlight: [ssd, nvme, hdd] }
