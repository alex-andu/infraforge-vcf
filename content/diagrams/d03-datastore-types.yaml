id: d03-datastore-types
title: How an ESX host reaches the four datastore types
description: >
  One ESX host in a VCF cluster reaches storage four ways. Through an FC HBA it sees a SAN LUN that it formats as a
  VMFS datastore (valid VCF 9.0 principal storage). Through a VMkernel adapter it mounts an NFS export from a NAS
  (NFS v3 can be principal storage, NFS 4.1 only supplemental). Its own local NVMe devices are pooled with the other
  hosts' devices into the vSAN datastore (principal storage that VCF configures itself). Software iSCSI and NVMe/TCP
  targets give supplemental VMFS datastores only. vVols containers are deprecated in VCF 9.0. All datastores are
  presented to vCenter, where SPBM policies are matched against their capabilities.
width: 1000
height: 600
groups:
  - { id: g-host, x: 20, y: 200, w: 420, h: 380, label: "ESX host (VMkernel storage stack)", kind: compute }
  - { id: g-external, x: 560, y: 20, w: 420, h: 560, label: "Storage targets", kind: storage }
nodes:
  - { id: vm, x: 50, y: 240, w: 160, h: 56, label: "VM", sublabel: ".vmx .vmdk .vswp", kind: vm, info: "A VM is a set of files. Its virtual disk is a .vmdk file on VMFS/NFS or an object on vSAN." }
  - { id: psa, x: 250, y: 240, w: 160, h: 56, label: "PSA / NMP / HPP", sublabel: "paths & multipathing", kind: compute, info: "The Pluggable Storage Architecture claims block devices and manages paths. Local NVMe devices are typically claimed by HPP." }
  - { id: fchba, x: 50, y: 340, w: 160, h: 56, label: "FC HBA", sublabel: "vmhba2", kind: storage, info: "Fibre Channel adapter. Zoning and LUN masking are done by the storage team, not by VCF." }
  - { id: vmk, x: 250, y: 340, w: 160, h: 56, label: "VMkernel NIC", sublabel: "NFS / iSCSI / vSAN", kind: network, info: "IP storage (NFS, software iSCSI, NVMe/TCP) and vSAN traffic all use VMkernel adapters, normally on dedicated VLANs." }
  - { id: nvme, x: 50, y: 470, w: 160, h: 56, label: "Local NVMe", sublabel: "contributes to vSAN", kind: storage, info: "Local devices are claimed by vSAN (ESA storage pool or OSA disk group) and are not formatted as VMFS." }
  - { id: vsanmod, x: 250, y: 470, w: 160, h: 56, label: "vSAN module", sublabel: "in the kernel", component: vsan, kind: storage, info: "vSAN runs inside the ESX kernel on every host of the cluster and pools local devices into one datastore." }
  - { id: lun, x: 600, y: 60, w: 340, h: 60, label: "SAN LUN → VMFS6", sublabel: "Principal: yes (FC)", kind: storage, info: "Fibre Channel VMFS is valid VCF 9.0 principal storage for management and VI workload domains. Provisioned outside VCF." }
  - { id: nfs, x: 600, y: 160, w: 340, h: 60, label: "NAS export → NFS datastore", sublabel: "Principal: NFS v3 only", kind: storage, info: "ESX supports NFS 3 and 4.1. VCF 9.0 accepts NFS v3 as principal storage; NFS 4.1 is supplemental only." }
  - { id: iscsi, x: 600, y: 260, w: 340, h: 60, label: "iSCSI / NVMe-oF → VMFS", sublabel: "Supplemental only", kind: storage, info: "iSCSI, NVMe/TCP, NVMe/FC and NVMe/RDMA are listed only as supplemental storage in VCF 9.0." }
  - { id: vsands, x: 600, y: 360, w: 340, h: 60, label: "vSAN datastore", sublabel: "Principal: yes (ESA, OSA, storage cluster)", kind: storage, component: vsan, info: "One datastore per vSAN cluster, built from the hosts' own devices. VCF configures it automatically during domain/cluster creation." }
  - { id: vvols, x: 600, y: 460, w: 340, h: 60, label: "vVols container", sublabel: "Deprecated in VCF 9.0", kind: external, info: "vVols are deprecated beginning with VCF/VVF 9.0 (KB 401070) and will be removed in a future release." }
edges:
  - { from: vm, to: psa, label: "I/O", kind: data }
  - { from: psa, to: fchba, kind: storage }
  - { from: fchba, to: lun, label: "FC fabric", kind: storage }
  - { from: vmk, to: nfs, label: "TCP/IP", kind: storage }
  - { from: vmk, to: iscsi, label: "TCP/IP", kind: storage, dashed: true }
  - { from: nvme, to: vsanmod, label: "claimed", kind: storage }
  - { from: vsanmod, to: vsands, label: "pooled with other hosts", kind: storage }
  - { from: vsanmod, to: vmk, label: "vSAN traffic", kind: storage, dashed: true }
steps:
  - { title: "VMs are files", text: "Every VM writes through the host's storage stack to some datastore.", highlight: [vm, psa] }
  - { title: "Block storage", text: "An FC LUN is formatted as VMFS. FC VMFS is valid principal storage in VCF 9.0, but the SAN is provisioned outside VCF.", highlight: [fchba, lun] }
  - { title: "File storage", text: "NFS exports are mounted over a VMkernel adapter. Only NFS v3 can be VCF principal storage.", highlight: [vmk, nfs] }
  - { title: "Supplemental-only protocols", text: "iSCSI and NVMe-oF datastores can be added after the cluster exists, as supplemental storage.", highlight: [iscsi] }
  - { title: "vSAN", text: "Local devices are pooled across hosts into one vSAN datastore, which VCF configures itself.", highlight: [nvme, vsanmod, vsands] }
  - { title: "vVols", text: "vVols still exist in vSphere 9 but are deprecated; do not choose them for new VCF 9 designs.", highlight: [vvols] }
