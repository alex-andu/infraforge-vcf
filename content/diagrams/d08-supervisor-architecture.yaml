id: d08-supervisor-architecture
title: vSphere Supervisor in a workload domain
description: >
  A Supervisor runs on one vSphere zone (one cluster) or three zones. Its control plane is one VM or three VMs for
  HA. Each ESX host runs Spherelet, a kubelet ported to ESX. Workloads live in vSphere Namespaces: VM Service VMs,
  VKS clusters and vSphere Pods. Networking is VCF Networking with VPC (recommended), NSX segments, or VDS; load
  balancing by NSX, Avi or the Foundation Load Balancer (VDS only). With centralized connectivity an NSX Edge cluster
  with an active-standby Tier-0 provides north-south access. Supervisor Services such as VKS, Harbor and Contour are
  registered in vCenter and installed on the Supervisor.
width: 1000
height: 600
groups:
  - { id: g-zone, x: 20, y: 150, w: 620, h: 430, label: "vSphere zone = workload domain cluster", kind: compute }
  - { id: g-ns, x: 40, y: 330, w: 580, h: 150, label: "vSphere Namespace (quotas, storage policies, VM classes)", kind: zone }
nodes:
  - { id: vc, x: 40, y: 30, w: 180, h: 64, label: "WLD vCenter", sublabel: "Supervisor management", kind: mgmt, component: vcenter, info: "Activates and manages the Supervisor; runs in the management domain." }
  - { id: cp, x: 60, y: 200, w: 260, h: 64, label: "Control plane VM(s)", sublabel: "1 or 3", kind: mgmt, component: supervisor, info: "Kubernetes API for the Supervisor. Three VMs recommended for HA and required for three zones." }
  - { id: sph, x: 360, y: 200, w: 240, h: 64, label: "ESX hosts + Spherelet", kind: compute, component: esx-host, info: "Spherelet is a kubelet ported natively to ESX; hosts become Kubernetes nodes." }
  - { id: vms, x: 60, y: 380, w: 170, h: 64, label: "VM Service VMs", kind: vm, info: "Declarative VMs; also the VMs of VKS clusters." }
  - { id: vks, x: 245, y: 380, w: 170, h: 64, label: "VKS clusters", kind: vm, info: "vSphere Kubernetes Service clusters; VKS itself is a Supervisor Service." }
  - { id: pods, x: 430, y: 380, w: 170, h: 64, label: "vSphere Pods", sublabel: "CRX", kind: vm, info: "Containers in a Container Runtime Executive with VM-level isolation; need a load balancer-backed Supervisor." }
  - { id: svc, x: 160, y: 500, w: 340, h: 56, label: "Supervisor Services: VKS, Harbor, Contour...", kind: ops, info: "Downloaded as YAML, registered in vCenter, installed on the Supervisor." }
  - { id: net, x: 700, y: 200, w: 260, h: 64, label: "Networking stack", sublabel: "VPC / NSX segments / VDS", kind: network, info: "VPC is recommended and the supported stack for VCF Automation." }
  - { id: lb, x: 700, y: 320, w: 260, h: 64, label: "Load balancer", sublabel: "NSX / Avi / Foundation LB", kind: network, info: "Foundation LB only with VDS networking; NSX LB default for VPC/segments; Avi for all (extra entitlement)." }
  - { id: edge, x: 700, y: 440, w: 260, h: 64, label: "NSX Edge cluster + Tier-0", sublabel: "active-standby", kind: nsx, component: nsx-edge-cluster, info: "Required to complete activation with centralized connectivity." }
  - { id: dev, x: 700, y: 30, w: 260, h: 64, label: "DevOps users / VCF Automation", kind: external, component: vcf-automation, info: "Consume namespaces through kubectl or VCF Automation." }
edges:
  - { from: vc, to: cp, label: "activates", kind: mgmt }
  - { from: cp, to: sph, kind: control }
  - { from: sph, to: vms, kind: data }
  - { from: sph, to: vks, kind: data }
  - { from: sph, to: pods, kind: data }
  - { from: svc, to: cp, kind: dependency, dashed: true }
  - { from: dev, to: lb, label: "kubectl / API", kind: data }
  - { from: lb, to: cp, kind: data }
  - { from: net, to: lb, kind: dependency }
  - { from: edge, to: net, label: "north-south", kind: north-south }
steps:
  - { title: "Control plane", text: "vCenter activates the Supervisor: 1 or 3 control plane VMs on the zone cluster.", highlight: [vc, cp] }
  - { title: "Hosts as nodes", text: "Spherelet turns ESX hosts into Kubernetes nodes.", highlight: [sph] }
  - { title: "Workloads", text: "Namespaces hold VM Service VMs, VKS clusters and vSphere Pods.", highlight: [vms, vks, pods] }
  - { title: "Networking", text: "VPC/NSX/VDS with NSX, Avi or Foundation LB; Edge + Tier-0 for centralized connectivity.", highlight: [net, lb, edge] }
  - { title: "Services and consumers", text: "Supervisor Services extend the platform; DevOps and VCF Automation consume it.", highlight: [svc, dev] }
