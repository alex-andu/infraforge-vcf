id: d01-cluster-ha-drs
title: A vSphere cluster with HA and DRS
description: >
  vCenter manages a cluster of three ESX hosts on shared storage. DRS (a vCenter service) places VMs at power-on and
  uses vMotion to rebalance them. vSphere HA runs an agent on every host; one host is elected primary and monitors
  the others with network heartbeats every second and datastore heartbeats. When host 3 fails, the primary restarts
  its VMs on hosts 1 and 2. HA keeps working without vCenter; DRS does not.
width: 1000
height: 580
groups:
  - { id: g-cluster, x: 20, y: 140, w: 960, h: 300, label: "vSphere cluster (HA + DRS)", kind: compute }
nodes:
  - { id: vc, x: 400, y: 30, w: 200, h: 56, label: "vCenter", sublabel: "DRS runs here", kind: mgmt, component: vcenter, info: "Configures HA and runs DRS. If vCenter is down, HA still restarts VMs; DRS stops balancing." }
  - { id: h1, x: 60, y: 200, w: 260, h: 56, label: "ESX host 1", sublabel: "HA primary", kind: compute, component: esx-host, info: "Elected primary (the host that mounts the most datastores wins the election). Monitors secondaries and protected VMs." }
  - { id: h2, x: 370, y: 200, w: 260, h: 56, label: "ESX host 2", sublabel: "HA secondary", kind: compute, component: esx-host, info: "Runs VMs and reports state to the primary." }
  - { id: h3, x: 680, y: 200, w: 260, h: 56, label: "ESX host 3", sublabel: "fails", kind: compute, component: esx-host, info: "Stops responding to network heartbeats, pings and datastore heartbeats: declared failed." }
  - { id: vms1, x: 60, y: 300, w: 260, h: 56, label: "VMs", kind: vm, info: "Workloads on host 1." }
  - { id: vms2, x: 370, y: 300, w: 260, h: 56, label: "VMs", kind: vm, info: "Workloads on host 2." }
  - { id: vms3, x: 680, y: 300, w: 260, h: 56, label: "VMs (restart elsewhere)", kind: vm, info: "Restarted by HA on surviving hosts: a reboot, not zero downtime." }
  - { id: ds, x: 300, y: 490, w: 400, h: 56, label: "Shared datastore", sublabel: "vSAN / NFS / VMFS", kind: storage, info: "All hosts must see the VMs' files so another host can start them. Also used for datastore heartbeating." }
edges:
  - { from: vc, to: h1, kind: mgmt }
  - { from: vc, to: h2, label: "DRS vMotion", kind: mgmt }
  - { from: vc, to: h3, kind: mgmt }
  - { from: h1, to: h2, label: "heartbeats", kind: control, bidirectional: true }
  - { from: h2, to: h3, label: "heartbeats", kind: control, bidirectional: true, dashed: true }
  - { from: vms3, to: ds, label: "files", kind: storage, dashed: true }
  - { from: vms1, to: ds, kind: storage }
  - { from: vms2, to: ds, kind: storage }
steps:
  - { title: "Cluster", text: "vCenter manages three hosts on shared storage.", highlight: [vc, h1, h2, h3, ds] }
  - { title: "DRS", text: "DRS places and balances VMs with vMotion (needs vCenter).", highlight: [vc, vms1, vms2] }
  - { title: "HA failure detection", text: "The primary loses heartbeats from host 3, checks datastore heartbeats, declares it failed.", highlight: [h1, h3, ds] }
  - { title: "HA restart", text: "VMs from host 3 are restarted on hosts 1 and 2.", highlight: [vms3, h1, h2] }
