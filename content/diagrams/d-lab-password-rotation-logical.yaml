id: d-lab-password-rotation-logical
title: Lab topology - password update, rotate and remediate
description: >
  The learner uses VCF Operations (Fleet Management > Passwords) to update a password, SDDC Manager (Security >
  Password Management) to rotate one, then deliberately changes the NSX audit password directly in NSX to create drift
  and fixes it with Remediate. lookup_passwords and the SDDC Manager API confirm the stored credentials.
width: 1000
height: 480
nodes:
  - { id: ws, x: 40, y: 40, w: 200, h: 56, label: "Workstation", kind: external, info: "Browser for VCF Operations, SDDC Manager and NSX; SSH to SDDC Manager." }
  - { id: ops, x: 300, y: 40, w: 220, h: 56, label: "VCF Operations", sublabel: "Fleet Mgmt > Passwords", kind: ops, component: vcf-operations, info: "Update and Remediate. Status refreshes once a day." }
  - { id: sddc, x: 300, y: 200, w: 220, h: 60, label: "SDDC Manager", sublabel: "Security > Password Mgmt", kind: mgmt, component: sddc-manager, info: "Rotate and schedules; lookup_passwords; GET /v1/credentials for real-time status." }
  - { id: vc, x: 620, y: 120, w: 200, h: 56, label: "vCenter", sublabel: "root", kind: mgmt, component: vcenter, info: "Target for the Update exercise." }
  - { id: nsx, x: 620, y: 220, w: 200, h: 56, label: "NSX Manager", sublabel: "audit", kind: nsx, component: nsx-manager, info: "Target for the drift + Remediate exercise (use the audit account, not admin, to limit risk)." }
  - { id: esx, x: 620, y: 320, w: 200, h: 56, label: "esx01", sublabel: "root", kind: compute, component: esx-host, info: "Target for an on-demand Rotate (scheduled rotation not supported for ESX)." }
  - { id: drift, x: 860, y: 220, w: 120, h: 56, label: "Manual change", kind: security, info: "You change the NSX audit password in the NSX UI to simulate an out-of-band change." }
edges:
  - { from: ws, to: ops, kind: mgmt }
  - { from: ws, to: sddc, label: "UI / SSH", kind: mgmt }
  - { from: ops, to: sddc, kind: control }
  - { from: sddc, to: vc, label: "update", kind: mgmt }
  - { from: sddc, to: nsx, label: "remediate", kind: mgmt }
  - { from: sddc, to: esx, label: "rotate", kind: mgmt }
  - { from: drift, to: nsx, kind: dependency, dashed: true }
steps:
  - { title: "Update", text: "Change vCenter root with a password you choose.", highlight: [ops, sddc, vc] }
  - { title: "Rotate", text: "Rotate esx01 root from SDDC Manager.", highlight: [sddc, esx] }
  - { title: "Drift and remediate", text: "Break the NSX audit credential on purpose, then remediate.", highlight: [drift, nsx, ops, sddc] }
