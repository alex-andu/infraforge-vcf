id: d09-vlcm-image-composition
title: Anatomy of a vSphere Lifecycle Manager image
description: >
  A vLCM image is the desired state of every host in a cluster. It is built from a mandatory ESX base image plus
  optional layers: a vendor add-on (OEM drivers and agents), a firmware and drivers add-on (delivered through a
  hardware support manager plugin from the server vendor), and individual components (for example a specific
  driver). vCenter checks each host against the image (compliance), runs a remediation pre-check, then remediates
  non-compliant hosts one at a time in maintenance mode. In VCF the image is created in the vSphere Client and
  imported into the VCF instance through VCF Operations so SDDC Manager can use it for domain, cluster and upgrade
  operations.
width: 1000
height: 560
groups:
  - { id: g-image, x: 20, y: 20, w: 420, h: 520, label: "Cluster image (desired state)", kind: zone }
  - { id: g-cluster, x: 520, y: 200, w: 460, h: 340, label: "vSphere cluster", kind: compute }
nodes:
  - { id: base, x: 60, y: 420, w: 340, h: 60, label: "ESX base image", sublabel: "required, e.g. ESX 9.0.x", kind: compute, info: "The ESX version from VMware. Mandatory. Defines the hypervisor build every host must run." }
  - { id: vendor, x: 60, y: 320, w: 340, h: 60, label: "Vendor add-on", sublabel: "optional", kind: compute, info: "OEM package (Dell, HPE, Lenovo, ...) adding drivers and agents. Choose the one matching your servers and target ESX version." }
  - { id: fw, x: 60, y: 220, w: 340, h: 60, label: "Firmware and drivers add-on", sublabel: "optional, needs HSM", kind: storage, info: "BIOS, NIC and controller firmware. Only available when a hardware support manager (vendor plugin) is registered with vCenter." }
  - { id: comp, x: 60, y: 120, w: 340, h: 60, label: "Components", sublabel: "optional, e.g. a newer driver", kind: compute, info: "Individual software components that add to or override the base image and vendor add-on contents." }
  - { id: hsm, x: 560, y: 60, w: 180, h: 60, label: "Hardware support mgr", sublabel: "vendor plugin", kind: external, info: "Vendor software that lets vLCM read and apply firmware. Without it, firmware is not part of compliance." }
  - { id: vlcm, x: 780, y: 60, w: 180, h: 60, label: "vLCM in vCenter", kind: mgmt, component: vcenter, info: "Computes compliance, runs the remediation pre-check, and remediates hosts. Baseline (VUM) management is not supported in vSphere 9." }
  - { id: h1, x: 560, y: 260, w: 180, h: 56, label: "esx-01", sublabel: "compliant", kind: compute, info: "Already matches the image: nothing to do." }
  - { id: h2, x: 780, y: 260, w: 180, h: 56, label: "esx-02", sublabel: "non-compliant", kind: compute, info: "Drifted or older: will be placed in maintenance mode and remediated." }
  - { id: h3, x: 560, y: 380, w: 180, h: 56, label: "esx-03", sublabel: "incompatible", kind: compute, info: "Hardware or component conflict with the image: the pre-check blocks remediation until fixed." }
  - { id: h4, x: 780, y: 380, w: 180, h: 56, label: "esx-04", sublabel: "unknown", kind: compute, info: "Compliance not computed yet (e.g. newly added). Run a compliance check." }
edges:
  - { from: base, to: vendor, kind: dependency }
  - { from: vendor, to: fw, kind: dependency }
  - { from: fw, to: comp, kind: dependency }
  - { from: hsm, to: fw, label: "firmware", kind: dependency, dashed: true }
  - { from: comp, to: vlcm, label: "image spec", kind: control }
  - { from: vlcm, to: h2, label: "remediate", kind: mgmt }
  - { from: vlcm, to: h1, label: "check", kind: control, dashed: true }
steps:
  - { title: "Base first", text: "Every image starts with an ESX base image.", highlight: [base] }
  - { title: "Add OEM layers", text: "Vendor add-on and, with a hardware support manager, firmware.", highlight: [vendor, fw, hsm] }
  - { title: "Pin components", text: "Add or override single components such as a driver.", highlight: [comp] }
  - { title: "Check, pre-check, remediate", text: "vLCM compares each host with the image and remediates non-compliant hosts one at a time.", highlight: [vlcm, h1, h2, h3, h4] }
