# Core VCF 9 components for the Architecture Explorer (owner: author F).
# Other authors reference these ids; keep them stable.
components:
  - id: vcf-fleet
    name: VCF Fleet
    category: fleet
    summary: Everything managed by one set of fleet-level components (VCF Operations and VCF Automation); contains one or more VCF instances.
    function: |
      The top operational container introduced in VCF 9.0. A fleet groups one or more VCF instances (and optionally
      standalone vCenter instances) under a single VCF Operations, VCF Operations fleet management appliance and
      VCF Automation. Fleet-wide services: monitoring, licensing, fleet management (lifecycle of management components,
      certificates, passwords, identity/SSO, configuration drift, tags, backup).
    runsOn: Logical construct; its fleet-level components run in the management domain of the first VCF instance.
    managedBy: VCF Operations (Fleet Management)
    dependsOn: [vcf-operations, vcf-operations-fleet-management, vcf-instance]
    communicatesWith: []
    failureImpact: |
      Not a component that "fails" by itself. If the fleet-level components are lost, every instance keeps running
      workloads but loses central monitoring, fleet management and self-service.
    verify: |
      VCF Operations inventory shows all instances of the fleet; Fleet Management → Lifecycle lists the management
      components and VCF instances.
    lessons: [vcf9-architecture-overview, vcf-deployment-models]
    labs: [lab-explore-vcf-fleet]

  - id: vcf-instance
    name: VCF Instance
    category: fleet
    parent: vcf-fleet
    summary: One VCF deployment (typically one site) - a management domain plus optional workload domains, with its own SDDC Manager.
    function: |
      "Compute, storage, networking virtual infrastructure that runs business workloads". Consists of exactly one
      management domain and optional VI workload domains. Each instance has one SDDC Manager, one VCF Operations
      collector (at least) and its own core-component binaries and host inventory.
    runsOn: Its management domain and workload domain clusters.
    managedBy: SDDC Manager (orchestration), driven from VCF Operations
    dependsOn: [management-domain, sddc-manager, dns-service, ntp-service, physical-network]
    communicatesWith:
      - { id: vcf-operations, purpose: "Registered in VCF Operations through the VMware Cloud Foundation integration account" }
    failureImpact: |
      Losing an instance's management domain removes management of all its domains; its workload VMs keep running
      on ESX. Other instances in the fleet are not affected (unless it is the first instance hosting fleet services).
    verify: |
      SDDC Manager API `GET /v1/domains`; VCF Operations inventory shows the instance with its domains.
    lessons: [vcf9-architecture-overview, management-domain]
    labs: [lab-explore-vcf-fleet]

  - id: management-domain
    name: Management Domain
    category: management
    parent: vcf-instance
    summary: The first domain of every VCF instance; hosts instance management, workload-domain management appliances and (first instance) fleet services.
    function: |
      Created during deployment or convergence. Hosts vCenter, a dedicated NSX Manager and SDDC Manager of the
      instance, the vCenter/NSX Manager appliances of all workload domains of the instance, VCF Operations collectors
      and, in the first instance, VCF Operations, the fleet management appliance and VCF Automation. May also run NSX
      Edge nodes and business workloads (use resource pools).
    runsOn: Default management cluster - minimum 3 ESX hosts (simple) or 4 (highly available); principal storage vSAN ESA/OSA, FC or NFS v3.
    managedBy: Management vCenter; SDDC Manager; VCF Operations
    dependsOn: [esx-host, vsan, vds, vcenter, nsx-manager, dns-service, ntp-service, physical-network]
    communicatesWith:
      - { id: workload-domain, purpose: "Its appliances (WLD vCenter, NSX Manager) manage the workload domain hosts" }
    failureImpact: |
      Management plane loss for every domain of the instance (and the fleet services if this is the first instance).
      Workload VMs in workload domains continue to run but cannot be managed.
    verify: |
      `GET /v1/domains` shows type MANAGEMENT; management vCenter shows all appliances healthy; vSAN health green.
    lessons: [management-domain, vcf9-architecture-overview]
    labs: [lab-explore-vcf-fleet, lab-deploy-vcf-management-domain]

  - id: workload-domain
    name: VI Workload Domain
    category: compute
    parent: vcf-instance
    summary: An isolated unit of application-ready infrastructure with its own vCenter and SSO domain and a dedicated or shared NSX instance.
    function: |
      Created from VCF Operations (executed by SDDC Manager) on commissioned hosts. Gets a dedicated vCenter and
      dedicated vCenter SSO domain; NSX is dedicated or shared with other workload domains. Runs business workloads,
      NSX Edge nodes and optionally vSphere Supervisor. Up to 24 per instance per the workload domain models page.
    runsOn: Its own vSphere clusters (minimum 3 hosts each); its vCenter and NSX Manager appliances run in the management domain.
    managedBy: Its vCenter and NSX Manager; SDDC Manager for lifecycle; VCF Operations as console
    dependsOn: [management-domain, vcenter, nsx-manager, esx-host, sddc-manager]
    communicatesWith:
      - { id: nsx-edge-cluster, purpose: "North-south connectivity for its workloads" }
    failureImpact: |
      Isolated: a failure of one workload domain's vCenter or clusters does not affect other domains, unless they
      share its NSX Manager or edge cluster.
    verify: |
      VCF Operations inventory; `GET /v1/domains` shows type VI; vCenter of the domain healthy.
    lessons: [workload-domains-architecture]
    labs: [lab-commission-hosts-create-wld, lab-explore-vcf-fleet]

  - id: vcf-installer
    name: VCF Installer
    fullName: VMware Cloud Foundation Installer
    category: management
    version: vcf9
    summary: Appliance that deploys a new fleet, a new instance in an existing fleet, or converges existing vSphere into VCF (replaces Cloud Builder).
    purpose: |
      Turns prepared hosts, networks, DNS, NTP and downloaded product binaries into a consistent first VCF instance.
      It owns initial bring-up and convergence, then hands day-2 ownership to SDDC Manager and VCF Operations.
    function: |
      Downloads and manages binaries, validates hosts and network, and deploys the management domain components
      (vCenter, NSX, SDDC Manager, VCF Operations + fleet management + collector, VCF Automation) in a simple or
      high-availability model, from a wizard or a JSON specification. Ships in the SDDC Manager appliance OVA; if
      deployed on a host that will become part of the management domain it switches into SDDC Manager mode.
    capabilities:
      - Validate deployment prerequisites before bring-up.
      - Deploy a new VCF fleet or add an instance to an existing fleet.
      - Converge eligible existing vSphere infrastructure into VCF.
      - Accept the guided wizard or a version-matched JSON deployment specification.
      - Download, stage and consume the binaries required by the selected deployment model.
    limitations:
      - It is not the day-2 lifecycle, monitoring or workload-management console.
      - It cannot compensate for broken DNS, NTP, routing, VLAN or MTU prerequisites.
      - A successful validation does not make an unsupported nested design production-supported.
    managementSurfaces:
      - VCF Installer web interface at the installer appliance FQDN.
      - Version-matched JSON deployment specification for repeatable or advanced input.
      - Installer task and validation views for bring-up progress and failures.
    commonMistakes:
      - Calling the VCF 9 appliance Cloud Builder, which is the earlier-generation deployment model.
      - Expecting the installer to remain the normal administration console after handoff.
      - Reusing example host names, VLANs or network pools without reconciling the deployment design.
    examFocus: |
      Recognize the Installer as the entry point for new deployment and convergence. Scenario questions commonly test
      prerequisite validation, deployment models, wizard versus JSON input and the handoff to SDDC Manager.
    runsOn: A VM outside the target management domain (installer mode) or on a management host (becomes SDDC Manager).
    managedBy: The deploying administrator
    dependsOn: [dns-service, ntp-service, physical-network, esx-host]
    communicatesWith:
      - { id: esx-host, purpose: "Validate and configure the hosts of the new management domain" }
      - { id: vcenter, purpose: "Deploy and configure the management vCenter" }
      - { id: sddc-manager, purpose: "Hand over to SDDC Manager after bring-up" }
    failureImpact: |
      Only matters during deployment: a failed run stops bring-up (fix and retry). Running environments do not depend on it.
    verify: |
      Validation results in the installer UI; successful deployment shows the new instance in VCF Operations.
    lessons: [vcf-deployment-models, vcf-installer-workflow]
    labs: [lab-deploy-vcf-management-domain]

  - id: sddc-manager
    name: SDDC Manager
    fullName: Software-Defined Data Center Manager
    category: management
    parent: management-domain
    summary: Per-instance orchestrator for core components - domains, host commissioning, core lifecycle, certificates and passwords - driven from VCF Operations.
    purpose: |
      Maintains the desired inventory and lifecycle state of one VCF instance. It coordinates multi-component workflows
      so ESX, vCenter and NSX remain compatible instead of being upgraded or expanded as unrelated products.
    function: |
      One per VCF instance (VCF-SDDCM-REQD-CFG-001). Provides, in VCF Operations: lifecycle management for ESX,
      vCenter and NSX; deployment of workload domains; import of vCenter instances as workload domains; vSAN stretched
      cluster configuration; automated certificate replacement and password management. Stores core-component
      binaries, holds resource locks during upgrades. Its UI is deprecated in 9.0 (to be removed in a future major
      release); its API remains.
    capabilities:
      - Commission hosts and allocate them to VCF domains and clusters.
      - Create and expand VI workload domains through coordinated workflows.
      - Orchestrate core-component lifecycle according to the VCF bill of materials.
      - Coordinate supported certificate, password and selected topology workflows.
      - Expose instance inventory and workflow state through its API.
    limitations:
      - It is not the primary fleet-wide monitoring and capacity analytics engine.
      - It does not replace vCenter or NSX for their element-level configuration and troubleshooting.
      - It does not carry workload traffic and its outage does not stop running VMs.
    managementSurfaces:
      - VCF Operations Fleet Management for normal VCF 9 workflows.
      - SDDC Manager API for automation and inventory queries.
      - SDDC Manager appliance logs and the deprecated local UI for diagnostics where documented.
    commonMistakes:
      - Adding hosts or changing VCF-owned settings directly in vCenter and creating inventory drift.
      - Treating SDDC Manager as a global singleton; each VCF instance has its own appliance.
      - Assuming an SDDC Manager outage immediately stops ESX workloads.
    examFocus: |
      Distinguish instance orchestration from fleet operations and element management. Know which workflows belong to
      SDDC Manager, which component executes them, and why direct changes can break future lifecycle operations.
    runsOn: Appliance VM in the management domain, first availability zone, VM management network.
    managedBy: VCF Operations (fleet management); updated first in the core-component upgrade order
    dependsOn: [vcenter, nsx-manager, dns-service, ntp-service, vcf-operations]
    communicatesWith:
      - { id: vcenter, purpose: "Deploy/upgrade vCenter, create clusters, manage hosts", protocol: "HTTPS API" }
      - { id: nsx-manager, purpose: "Deploy/upgrade NSX, prepare transport nodes", protocol: "HTTPS API" }
      - { id: esx-host, purpose: "Commission hosts, rotate passwords, replace certificates" }
      - { id: vcf-operations, purpose: "Receives fleet management requests; registered as VMware Cloud Foundation integration", protocol: "HTTPS" }
    failureImpact: |
      No new domains, host commissioning, core lifecycle, password rotation or certificate replacement for that
      instance. Running workloads, vCenter and NSX keep working.
    verify: |
      `POST /v1/tokens` then `GET /v1/domains`; domain workflows logged in
      `/var/log/vmware/vcf/domainmanager/domainmanager.log`.
    lessons: [vcf-operations-fleet-management, vcf9-architecture-overview, component-communication]
    labs: [lab-explore-vcf-fleet]

  - id: vcf-operations
    name: VCF Operations
    fullName: VMware Cloud Foundation Operations
    category: operations
    parent: vcf-fleet
    summary: Mandatory central console of the fleet - monitoring, licensing and fleet management (formerly Aria Operations).
    purpose: |
      Gives operators one fleet-level place to understand health, capacity, compliance, cost and lifecycle posture
      across VCF instances while delegating execution to the responsible instance or management appliance.
    function: |
      Fleet console: inventory, dashboards, alerts, capacity, cost, compliance, licensing (connected/disconnected
      with the VCF Business Services console) and the Fleet Management menu (lifecycle, passwords, certificates,
      identity, drift, tags, backup). Models: simple (1 node), high availability (3 nodes: primary, replica, data),
      continuous availability (node pairs across two zones, max 10 ms).
    capabilities:
      - Collect and analyze inventory, health, performance, capacity, cost and alert data.
      - Present fleet inventory and launch lifecycle, identity, certificate, password and drift workflows.
      - Manage VCF licensing workflows and integration with the business-services console.
      - Integrate instance collectors and optional VCF Operations products.
    limitations:
      - It does not replace vCenter, NSX Manager or SDDC Manager as their execution and element-management planes.
      - Monitoring data does not itself prove root cause; alerts must be correlated with component evidence.
      - Loss of the console removes observability and orchestration access but does not stop workload data planes.
    managementSurfaces:
      - VCF Operations web interface for fleet, dashboards, alerts, capacity and administration.
      - Fleet Management area for supported platform workflows.
      - Administration interface for cluster and node health where applicable.
    commonMistakes:
      - Treating VCF Operations as only a renamed metrics dashboard and missing its fleet-management role.
      - Assuming it directly performs every core-component action rather than delegating to SDDC Manager.
      - Equating a green aggregate badge with complete end-to-end validation.
    examFocus: |
      Expect scenarios about dashboards, alerts, policies, capacity, compliance, fleet inventory and the boundary
      between VCF Operations, SDDC Manager and the individual product consoles.
    runsOn: Management domain of the first VCF instance, VM management network by default.
    managedBy: VCF Operations fleet management appliance (lifecycle)
    dependsOn: [vcf-operations-collector, vcf-operations-fleet-management, dns-service, ntp-service]
    communicatesWith:
      - { id: vcf-operations-collector, purpose: "Receives collected data from each instance" }
      - { id: sddc-manager, purpose: "Drives core-component fleet management per instance", protocol: "HTTPS" }
      - { id: vcf-operations-fleet-management, purpose: "Lifecycle and deployment of management components", protocol: "HTTPS" }
      - { id: vcf-identity-broker, purpose: "VCF SSO login" }
    failureImpact: |
      No monitoring, fleet management UI or license reporting. All instances keep running workloads; component
      consoles (vCenter, NSX) still work.
    verify: |
      UI login; cluster status in the admin console; inventory shows all instances; collectors report as online.
    lessons: [vcf-operations-fleet-management, vcf9-architecture-overview, vcf-deployment-models]
    labs: [lab-explore-vcf-fleet, lab-vcf-ops-dashboards-alerts]

  - id: vcf-operations-fleet-management
    name: VCF Operations fleet management appliance
    fullName: VMware Cloud Foundation Operations Fleet Management Appliance
    category: operations
    parent: vcf-fleet
    summary: Deploys, lifecycles and configures fleet-level management components (formerly Aria Suite Lifecycle).
    purpose: |
      Provides the deployment and lifecycle engine for management products that exist at fleet scope rather than
      inside one SDDC Manager core stack.
    function: |
      "Provides support for deployment, lifecycle management, and configuration for the VCF Operations, VCF
      Automation, and VCF Identity Broker" - and also VCF Operations for logs and for networks. Stores binaries for
      management components (Fleet Management → Lifecycle → Binary Management). Single node in both simple and HA
      models. Upgraded first in a maintenance release.
    capabilities:
      - Deploy and lifecycle VCF Operations, Automation and Identity Broker.
      - Deploy and lifecycle supported Operations for logs and Operations for networks components.
      - Store and manage product binaries used by fleet-level management workflows.
      - Apply supported configuration and integration workflows for managed products.
    limitations:
      - It does not lifecycle ESX, vCenter or NSX; those core components belong to each instance's SDDC Manager.
      - It is not an analytics collector or a workload self-service portal.
      - Its single appliance is not made highly available merely because VCF Operations uses an HA model.
    managementSurfaces:
      - VCF Operations > Fleet Management > Lifecycle.
      - Binary Management for fleet-product installation media.
      - Product and environment workflow views for deployment and upgrade status.
    commonMistakes:
      - Confusing the fleet management appliance with the VCF Operations collector.
      - Sending core ESX/vCenter/NSX lifecycle work to the fleet-level appliance.
      - Assuming all fleet components share the same availability model.
    examFocus: |
      Know the split between fleet-level product lifecycle and SDDC Manager core lifecycle, including which appliance
      handles VCF Automation, Identity Broker, logs and networks products.
    runsOn: Management domain of the first VCF instance.
    managedBy: VCF Operations
    dependsOn: [vcf-operations, dns-service, ntp-service]
    communicatesWith:
      - { id: vcf-operations, purpose: "Upgrade/configure", protocol: "HTTPS" }
      - { id: vcf-automation, purpose: "Deploy/upgrade/configure", protocol: "HTTPS" }
      - { id: vcf-identity-broker, purpose: "Deploy/upgrade the appliance", protocol: "HTTPS" }
      - { id: vcf-operations-logs, purpose: "Deploy/upgrade", protocol: "HTTPS" }
      - { id: vcf-operations-networks, purpose: "Deploy/upgrade", protocol: "HTTPS" }
    failureImpact: |
      No deployment or lifecycle of management components; monitoring and core-component tasks via SDDC Manager are
      not affected.
    verify: |
      Fleet Management → Lifecycle → VCF Management shows components and versions; binaries listed under Binary Management.
    lessons: [vcf-operations-fleet-management]
    labs: [lab-explore-vcf-fleet]

  - id: vcf-operations-collector
    name: VCF Operations collector (cloud proxy)
    fullName: VMware Cloud Foundation Operations Collector
    category: operations
    parent: vcf-instance
    summary: Instance-level appliance that collects and monitors data locally in a VCF instance for VCF Operations.
    purpose: |
      Keeps data collection close to each VCF instance and forwards that operational data to the fleet's central
      VCF Operations cluster.
    function: |
      "Collects and monitors data locally in the VCF Instance". Deployed with every VCF instance (mandatory during
      installation). In the HA model it can be expanded into a collector group. Recommended on the VM management
      network of the instance's management domain.
    capabilities:
      - Collect inventory, metrics, events and integration data from one VCF instance.
      - Forward instance data to central VCF Operations across the approved management path.
      - Scale collection through a collector group where the documented model supports it.
    limitations:
      - It does not store the authoritative VCF inventory or execute SDDC Manager workflows.
      - It does not replace product-specific collectors used by optional Operations products.
      - Its failure affects freshness and visibility, not workload packet forwarding.
    managementSurfaces:
      - VCF Operations collector and cloud-proxy inventory/status views.
      - VCF Operations integrations for the associated VCF instance.
      - Appliance diagnostics when collection or forwarding fails.
    commonMistakes:
      - Confusing the collector with the fleet management appliance because both are management VMs.
      - Diagnosing stale metrics as an ESX workload outage before checking collector health.
      - Assuming one collector is automatically shared by every independent VCF instance.
    examFocus: |
      Understand why every instance needs a collection path, what becomes stale when it fails and how that differs
      from failures of VCF Operations itself or SDDC Manager.
    runsOn: Management domain of each VCF instance.
    managedBy: VCF Operations
    dependsOn: [vcf-operations, dns-service, ntp-service]
    communicatesWith:
      - { id: vcenter, purpose: "Collect inventory, metrics, events" }
      - { id: nsx-manager, purpose: "Collect NSX data" }
      - { id: sddc-manager, purpose: "Collect VCF instance data" }
      - { id: vcf-operations, purpose: "Forward collected data" }
    failureImpact: |
      Stale or missing data for that instance in VCF Operations; no impact on workloads or element management.
    verify: |
      Collector status online in VCF Operations; data for the instance's objects is current.
    lessons: [vcf9-architecture-overview, component-communication]
    labs: [lab-explore-vcf-fleet]

  - id: vcf-automation
    name: VCF Automation
    category: automation
    parent: vcf-fleet
    summary: Self-service, multi-tenant consumption layer of the fleet (formerly Aria Automation).
    function: |
      Provides organizations, regions, projects and self-service of VMs, networks and Kubernetes on top of VCF
      instances. Runs as containerized services in a Kubernetes cluster on dedicated appliances provisioned and
      managed by fleet management. Simple model 1 node (POC/dev), HA model 3 nodes (production).
    runsOn: Management domain of the first VCF instance.
    managedBy: VCF Operations fleet management appliance
    dependsOn: [vcf-operations-fleet-management, vcf-identity-broker, vcenter, nsx-manager, dns-service, ntp-service]
    communicatesWith:
      - { id: vcenter, purpose: "Provision workloads in its regions" }
      - { id: nsx-manager, purpose: "Networking for organizations" }
      - { id: supervisor, purpose: "Namespaces and Kubernetes services" }
    failureImpact: |
      Self-service provisioning unavailable; existing workloads keep running. In DR designs VCF Automation is
      recovered by backup and restore.
    verify: |
      UI login (provider and tenant portals); node status in fleet management.
    lessons: [vcf9-architecture-overview, vcf-deployment-models, vcf-automation-architecture]
    labs: [lab-vcfa-organization-setup]

  - id: vcf-operations-hcx
    name: VCF Operations HCX
    category: operations
    parent: vcf-fleet
    summary: Workload mobility, encrypted site interconnect and temporary Layer 2 network extension across VCF and supported vSphere environments.
    function: |
      HCX Manager appliances at source and destination form Site Pairs for management and orchestration. Network and
      Compute Profiles define service intent; a Service Mesh deploys HCX-IX migration/interconnect appliances,
      HCX-NET-EXT bridges and optional Sentinel appliances for non-vSphere migration. Supports Bulk, vMotion, Cold,
      Replication Assisted vMotion, OS Assisted Migration and Direct cross-vCenter vMotion orchestration.
    runsOn: HCX Manager in each site's management zone; service appliances on clusters selected by Compute Profiles.
    managedBy: Local HCX Manager consoles; integrated into the VCF Operations HCX workload-mobility capability.
    dependsOn: [vcenter, dns-service, ntp-service, physical-network]
    communicatesWith:
      - { id: vcenter, purpose: "Inventory, service-appliance deployment and VM migration" }
      - { id: nsx-manager, purpose: "Required at private-cloud destination and used for supported network extension/mapping" }
      - { id: vcf-identity-broker, purpose: "Optional VCF SSO authentication and role mapping" }
    failureImpact: |
      New migrations, site-pair orchestration and extension changes fail when a manager is unavailable. Existing HCX
      data-plane services depend on the health of HCX-IX/HCX-NET-EXT appliances and their tunnels; migrated workloads
      already on ordinary destination networks continue to run independently.
    verify: |
      Manager services healthy at both sites; Site Pair Connected; Compute Profiles valid; Service Mesh and required
      appliances Up/Healthy; data-plane diagnostics pass; migration and extension state match the approved plan.
    lessons: [vcf9-architecture-overview, vcf-operations-hcx]
    labs: [lab-vcf-operations-hcx]

  - id: vcf-identity-broker
    name: VCF Identity Broker
    category: security
    parent: vcf-fleet
    summary: Connects an external identity provider to VCF components for VCF single sign-on (replaces Workspace ONE Access in this role).
    function: |
      Brokers authentication for VCF SSO to vCenter, NSX, VCF Operations, VCF Automation, VCF Operations for logs,
      for networks, orchestrator and HCX (not SDDC Manager or ESX). Deployment: embedded in the management domain
      vCenter, or a 3-node appliance cluster. Scope: fleet-wide, cross-instance or per-instance SSO models.
    runsOn: Embedded in the management vCenter, or appliance nodes in the management domain.
    managedBy: VCF Operations (Fleet Management → identity); lifecycle by fleet management appliance
    dependsOn: [vcenter, dns-service, ntp-service]
    communicatesWith:
      - { id: vcenter, purpose: "SSO for vCenter" }
      - { id: vcf-operations, purpose: "SSO for VCF Operations" }
      - { id: vcf-automation, purpose: "SSO for VCF Automation" }
      - { id: nsx-manager, purpose: "SSO for NSX" }
    failureImpact: |
      SSO logins fail for every component in its scope (single point of failure per scope); local accounts still work.
      Embedded mode is protected only by vSphere HA.
    verify: |
      SSO login works through the IdP; identity configuration status in VCF Operations.
    lessons: [vcf9-architecture-overview, vcf-deployment-models, vcf-identity-sso-rbac]
    labs: [lab-explore-vcf-fleet]

  - id: vcenter
    name: vCenter
    fullName: VMware vCenter Server
    category: management
    parent: management-domain
    summary: Virtualization management for one VCF domain; every domain has exactly one, and all run in the management domain.
    purpose: |
      Provides the authoritative inventory and management plane for the hosts, clusters, virtual machines, networks
      and storage policies of one VCF domain.
    function: |
      Manages ESX hosts, clusters (HA/DRS), vSphere Lifecycle Manager images, VDS and storage of one domain. Each
      workload domain gets a dedicated vCenter and SSO domain. Registered in NSX Manager as a compute manager.
    capabilities:
      - Organize datacenters, clusters, hosts, resource pools, virtual machines and templates.
      - Operate vSphere HA, DRS, vMotion, distributed switching and storage policies.
      - Provide RBAC, tasks, events, alarms, APIs and lifecycle services for its domain.
      - Integrate its domain inventory with NSX, SDDC Manager and VCF Operations.
    limitations:
      - It does not provide the NSX overlay/control plane or SDDC Manager's cross-product lifecycle orchestration.
      - One domain's vCenter does not directly manage hosts assigned to another VCF domain.
      - Direct changes can be technically possible but unsupported when a VCF-owned workflow exists.
    managementSurfaces:
      - vSphere Client at the domain vCenter FQDN.
      - vCenter Server Management Interface for appliance administration.
      - vSphere API, PowerCLI and supported automation interfaces.
    commonMistakes:
      - Treating vCenter as the manager of the complete VCF fleet.
      - Adding or removing VCF hosts directly instead of using the VCF workflow.
      - Confusing vCenter appliance health with cluster or workload health.
    examFocus: |
      Expect inventory, cluster, VM, distributed-switch, storage-policy, permissions and lifecycle scenarios. Always
      distinguish a vCenter task from an SDDC Manager or NSX task.
    runsOn: Appliance VM in the management domain of its instance (also for workload domains).
    managedBy: SDDC Manager (lifecycle, passwords, certificates), VCF Operations (console)
    dependsOn: [esx-host, dns-service, ntp-service, physical-network]
    communicatesWith:
      - { id: esx-host, purpose: "Host management via vpxa/hostd; host heartbeat to vCenter on UDP 902", protocol: "TCP 443/902; UDP 902 (heartbeat)" }
      - { id: nsx-manager, purpose: "NSX compute manager registration" }
      - { id: vcf-identity-broker, purpose: "VCF SSO" }
    failureImpact: |
      The domain cannot be managed (no vMotion, DRS, provisioning); VMs keep running and vSphere HA still restarts
      VMs after host failures. SDDC Manager workflows for that domain fail.
    verify: |
      vSphere Client login, appliance health (VAMI), hosts connected.
    lessons: [vcf9-architecture-overview, workload-domains-architecture, component-communication]
    labs: [lab-vcenter-cluster-ha-drs, lab-explore-vcf-fleet]

  - id: esx-host
    name: ESX host
    category: compute
    summary: The hypervisor (called ESX, not ESXi, in VCF 9); commissioned into an instance and assigned to domain clusters.
    purpose: |
      Supplies the compute and local virtualization data plane on which management appliances and business workloads
      run. In VCF it also participates in vSAN and the NSX host data plane when those services are enabled.
    function: |
      Runs VMs, vSAN, NSX data plane (TEPs, distributed routing/firewall). Hosts are prepared, commissioned into SDDC
      Manager inventory with a network pool, then used to create or expand clusters.
    capabilities:
      - Run and isolate virtual machines using CPU, memory, storage and network virtualization.
      - Provide VMkernel services such as management, vMotion and vSAN traffic.
      - Participate in HA, DRS, vSphere Lifecycle Manager, vSAN and NSX transport-node workflows.
      - Expose host telemetry, logs, ESXCLI and supported APIs for operations.
    limitations:
      - A standalone host does not provide cluster HA, DRS or distributed resource coordination.
      - The host does not replace vCenter, NSX Manager or SDDC Manager control planes.
      - Direct host changes can create configuration drift from the VCF desired state.
    managementSurfaces:
      - vSphere Client through the domain vCenter.
      - Direct ESX Host Client for documented recovery and host-specific operations.
      - ESXCLI, DCUI and supported APIs for diagnostics and controlled administration.
    commonMistakes:
      - Calling every VCF 9 host ESXi without recognizing the VCF 9 product naming.
      - Overcommitting nested-host memory and interpreting lab contention as VCF appliance failure.
      - Applying a direct host fix without checking whether VCF owns the setting.
    examFocus: |
      Know host commissioning, VMkernel networking, maintenance mode, lifecycle, services, logs and the boundary
      between direct host operations and domain-level VCF workflows.
    runsOn: Physical servers (or nested VMs in a lab).
    managedBy: vCenter of its domain; SDDC Manager for commissioning and lifecycle
    dependsOn: [physical-network, dns-service, ntp-service]
    communicatesWith:
      - { id: vcenter, purpose: "Heartbeat every 10 s, 60 s without heartbeat = disconnected", protocol: "UDP 902" }
      - { id: nsx-manager, purpose: "Management channel (1234) and control channel (1235)", protocol: "TCP 1234, TCP 1235" }
      - { id: esx-host, purpose: "Overlay traffic between TEPs", protocol: "Geneve UDP 6081" }
    failureImpact: |
      VMs on the host restart elsewhere (vSphere HA); vSAN components on the host become absent and rebuild if
      capacity and host count allow.
    verify: |
      Host connected in vCenter; `esxcli system time get`; NSX `get managers` / `get controllers`.
    lessons: [vcf9-architecture-overview, component-communication]
    labs: [lab-esx-host-first-vm, lab-explore-vcf-fleet]

  - id: vsan
    name: vSAN
    fullName: Virtual Storage Area Network
    category: storage
    summary: Default principal storage of VCF clusters (ESA or OSA); also as vSAN storage cluster or vSAN compute cluster.
    purpose: |
      Aggregates storage devices in ESX hosts into a policy-driven shared datastore so VM availability and placement
      requirements are expressed per object rather than by manually selecting a traditional storage tier.
    function: |
      Hyperconverged storage built from the hosts' local devices. Principal storage option for the management
      default cluster (ESA or OSA) and for workload domains (also storage cluster / compute cluster models there).
    capabilities:
      - Pool host-local devices into a distributed datastore managed with vCenter.
      - Apply availability, performance and space-efficiency requirements through storage policies.
      - Rebuild or resynchronize components after supported failures and topology changes.
      - Provide principal storage for management and VI workload-domain clusters.
    limitations:
      - It does not create physical redundancy when all nested hosts depend on one physical server or device.
      - FTT=0 cannot tolerate a data-component failure even if the cluster remains operational.
      - ESA and OSA have different architecture and hardware requirements and are not interchangeable labels.
    managementSurfaces:
      - vSphere Client > cluster > Configure/Monitor > vSAN.
      - VM Storage Policies for workload-level availability and performance intent.
      - Skyline Health and ESX/vSAN diagnostic tools for cluster evidence.
    commonMistakes:
      - Equating datastore free capacity with policy compliance and usable protected capacity.
      - Assuming an FTT policy protects against a failure domain the physical design does not provide.
      - Mixing vSAN traffic with unrelated services or changing MTU on only one part of the path.
    examFocus: |
      Distinguish ESA from OSA, principal-storage choices, storage policies, failures to tolerate, health evidence,
      resynchronization and the relationship between vSAN design and vSphere HA capacity.
    runsOn: ESX hosts of a cluster.
    managedBy: vCenter of the domain; SDDC Manager (stretched cluster configuration)
    dependsOn: [esx-host, vds, physical-network]
    communicatesWith:
      - { id: esx-host, purpose: "vSAN traffic between hosts on the vSAN network" }
    failureImpact: |
      Host loss: objects degraded; with 3 hosts no rebuild to compliance, with 4+ automatic rebuild. Network
      partition can make objects inaccessible.
    verify: |
      vSAN Skyline health in vCenter; object health.
    lessons: [management-domain, workload-domains-architecture]
    labs: [lab-vsan-esa-cluster]

  - id: nsx-manager
    name: NSX Manager
    fullName: VMware NSX Manager
    category: network
    parent: management-domain
    summary: NSX management and control plane for one domain, or shared by several workload domains.
    purpose: |
      Defines and distributes the networking and security intent used by NSX transport nodes and Edge nodes while
      giving administrators one API and interface for the NSX environment.
    function: |
      Network virtualization and security management. The management domain has a dedicated NSX Manager; workload
      domains get a dedicated instance or share one. Models: simple (1 node + VIP), HA (3 nodes + VIP), HA with
      external load balancer.
    capabilities:
      - Manage transport zones, host transport nodes, segments, gateways and security policy.
      - Register vCenter as a compute manager and discover eligible clusters.
      - Program the distributed host data plane and the centralized Edge services.
      - Operate as a single-node lab model or a resilient three-node manager cluster.
    limitations:
      - It does not forward ordinary workload packets; prepared hosts and Edge nodes provide the data plane.
      - It does not replace vCenter host/VM management or SDDC Manager lifecycle orchestration.
      - Manager availability cannot repair an incorrect VLAN, MTU or physical underlay design.
    managementSurfaces:
      - NSX Manager web interface at the cluster VIP or documented manager FQDN.
      - NSX Policy API for automation.
      - NSX CLI and support bundles for component diagnostics.
    commonMistakes:
      - Assuming Manager loss immediately stops already-programmed east-west forwarding.
      - Confusing a Manager node, a host transport node and an Edge transport node.
      - Editing VCF-owned NSX lifecycle settings outside the supported VCF workflow.
    examFocus: |
      Distinguish management, control and data planes; know compute-manager integration, transport-node preparation,
      policy ownership and what continues to work during a Manager outage.
    runsOn: Appliance VMs in the management domain (also for workload domains).
    managedBy: SDDC Manager (deploy, lifecycle, passwords, certificates) driven from VCF Operations
    dependsOn: [vcenter, dns-service, ntp-service]
    communicatesWith:
      - { id: vcenter, purpose: "Compute manager - discover clusters, deploy edges" }
      - { id: esx-host, purpose: "Management and control channels with transport nodes", protocol: "TCP 1234 / 1235" }
      - { id: nsx-edge-cluster, purpose: "Configure edge nodes", protocol: "TCP 1234 / 1235" }
    failureImpact: |
      No NSX configuration changes for the domains it serves; existing data plane keeps forwarding. A shared NSX
      Manager failure affects all domains that share it.
    verify: |
      NSX UI cluster status; on hosts `get managers` / `get controllers`; `GET /v1/nsx-t-clusters` on SDDC Manager.
    lessons: [workload-domains-architecture, component-communication, nsx-architecture]
    labs: [lab-nsx-segments-tier1]

  - id: nsx-edge-cluster
    name: NSX Edge cluster
    fullName: VMware NSX Edge Cluster
    category: network
    parent: workload-domain
    summary: Edge nodes providing north-south routing and centralized services; shareable between domains that share an NSX Manager.
    purpose: |
      Supplies the centralized data-plane capacity required when traffic must leave an overlay, reach a physical
      network or consume a stateful service that cannot run only in the distributed host kernel.
    function: |
      Hosts Tier-0/Tier-1 service routers, NAT, gateway firewall, load balancing. Virtual appliances (vCenter/NSX
      deployed, VCF Operations lifecycle) or bare metal. Models: host, rack or availability-zone fault tolerant.
    capabilities:
      - Host Tier-0 and Tier-1 service routers and north-south uplinks.
      - Run BGP or static routing toward the physical network.
      - Provide centralized NAT, gateway firewall and supported load-balancing services.
      - Form resilient Edge clusters with service-router placement and failover.
    limitations:
      - It is not required for every east-west flow between workloads on prepared hosts.
      - It cannot provide north-south reachability without a correct physical uplink and routing design.
      - Sharing an Edge cluster extends its failure and capacity considerations across every consuming domain.
    managementSurfaces:
      - NSX Manager > System > Fabric for Edge transport-node health.
      - NSX Manager > Networking for gateways, routing and centralized services.
      - Edge CLI for documented diagnostics.
    commonMistakes:
      - Placing the Tier-0 service-router function on ESX hosts instead of Edge nodes.
      - Treating an Edge node as an NSX Manager node.
      - Ignoring TEP, uplink-VLAN, BGP and capacity dependencies when a gateway exists but traffic fails.
    examFocus: |
      Know which services require an Edge, how Tier-0/Tier-1 distributed and service-router functions differ, and how
      BGP, TEPs, uplinks and Edge-cluster availability affect north-south connectivity.
    runsOn: Workload domain clusters (also allowed in the management domain).
    managedBy: NSX Manager
    dependsOn: [nsx-manager, esx-host, physical-network]
    communicatesWith:
      - { id: physical-network, purpose: "North-south uplinks, BGP or static routing" }
      - { id: esx-host, purpose: "Geneve overlay with host TEPs", protocol: "Geneve UDP 6081" }
    failureImpact: |
      Loss of north-south connectivity and centralized services for segments using it (for all domains sharing it).
    verify: |
      Edge node status in NSX; BGP neighbors established; north-south ping.
    lessons: [workload-domains-architecture, nsx-edge-nodes-clusters]
    labs: [lab-nsx-tier0-bgp-edge]

  - id: vds
    name: vSphere Distributed Switch
    fullName: VMware vSphere Distributed Switch
    category: network
    summary: Per-cluster virtual switch carrying management, vMotion, storage and NSX host traffic.
    purpose: |
      Applies one centrally managed switching configuration across the hosts in a cluster so port groups, uplinks,
      VLANs, MTU and traffic policies remain consistent.
    function: |
      Configured by VCF during domain/cluster creation; port groups for management, vMotion, vSAN and NSX TEP traffic.
    capabilities:
      - Provide distributed port groups with consistent VLAN and security policies.
      - Map physical uplinks and VMkernel services across cluster hosts.
      - Support teaming, failover, Network I/O Control and health checks.
      - Carry VCF system traffic and provide the host-switch foundation used by NSX designs.
    limitations:
      - It cannot correct an upstream physical-switch VLAN or MTU mismatch.
      - It is a vSphere switching construct, not an NSX overlay segment or Tier gateway.
      - Changing the switch MTU does not guarantee that every existing VMkernel adapter uses the same MTU.
    managementSurfaces:
      - vSphere Client > Networking > distributed switch.
      - Distributed port-group and host-networking workflows in vSphere Client.
      - Supported vSphere API and PowerCLI cmdlets.
    commonMistakes:
      - Changing only the VDS MTU and assuming the complete end-to-end path is ready.
      - Confusing a distributed port group with an NSX segment.
      - Bypassing the VCF workflow for a VCF-created switch without evaluating drift.
    examFocus: |
      Expect VLAN, MTU, uplink, teaming, VMkernel and distributed-port-group scenarios and be able to separate VDS
      underlay responsibilities from NSX overlay responsibilities.
    runsOn: ESX hosts, managed by vCenter.
    managedBy: vCenter
    dependsOn: [vcenter, physical-network]
    communicatesWith: []
    failureImpact: |
      Misconfiguration (VLAN, MTU, teaming) breaks vMotion, vSAN or overlay traffic for the cluster.
    verify: |
      VDS health check; vmkping with jumbo frames between hosts.
    lessons: [management-domain, vsphere-distributed-switch]
    labs: [lab-network-readiness]

  - id: vcf-operations-logs
    name: VCF Operations for logs
    category: operations
    parent: vcf-fleet
    summary: Fleet log collection and analysis (successor of Aria Operations for Logs).
    function: |
      Receives logs via CFAPI (9000 / 9543 SSL) or syslog (514 UDP/TCP, 1514 UDP, 6514 TLS). Simple model 1 node,
      HA model 3 nodes with integrated load balancer. Deployed on Day 2 from fleet management.
    runsOn: Management domain of the first VCF instance (by default).
    managedBy: VCF Operations fleet management appliance
    dependsOn: [vcf-operations-fleet-management, dns-service, ntp-service]
    communicatesWith:
      - { id: vcf-operations, purpose: "Log integration and launch-in-context" }
    failureImpact: |
      Log ingestion and search unavailable; no impact on workloads.
    verify: |
      UI login; recent events from vCenter/ESX/NSX visible.
    lessons: [vcf9-architecture-overview, component-communication, vcf-operations-logs-network-ops]
    labs: [lab-vcf-ops-logs-network]

  - id: vcf-operations-networks
    name: VCF Operations for networks
    category: operations
    parent: vcf-fleet
    summary: Network visibility and flow analytics for the fleet; its collector is an instance-level component.
    function: |
      Platform nodes plus collectors. Simple: one platform node and one collector. "HA": three-node platform cluster
      for performance and scale, not redundancy.
    runsOn: Management domain (platform); collectors on each instance's VM management network.
    managedBy: VCF Operations fleet management appliance
    dependsOn: [vcf-operations-fleet-management, vcenter, nsx-manager]
    communicatesWith:
      - { id: vcenter, purpose: "Inventory and flow data" }
      - { id: nsx-manager, purpose: "NSX configuration and flows" }
    failureImpact: |
      No network analytics; no impact on traffic.
    verify: |
      Data sources healthy in the product UI.
    lessons: [vcf-deployment-models, vcf-operations-logs-network-ops]
    labs: [lab-vcf-ops-logs-network]

  - id: supervisor
    name: vSphere Supervisor
    category: compute
    parent: workload-domain
    summary: Workload domain capability that provides a declarative API for VMs, Kubernetes clusters and services.
    function: |
      Activated on workload domain clusters (vSphere zones). Control plane simple (1 VM) or HA (3 VMs); networking
      via NSX VPC/segments, Avi or Foundation Load Balancer. Consumed by VCF Automation and kubectl users.
    runsOn: Workload domain clusters.
    managedBy: vCenter of the domain
    dependsOn: [vcenter, nsx-manager, esx-host]
    communicatesWith:
      - { id: vcf-automation, purpose: "Consumed as region capacity" }
    failureImpact: |
      Control plane loss stops Kubernetes API/self-service for that Supervisor; running workloads continue.
    verify: |
      Supervisor status in vCenter Workload Management.
    lessons: [workload-domains-architecture, supervisor-in-workload-domain]
    labs: [lab-enable-supervisor]

  - id: dns-service
    name: DNS service
    fullName: Domain Name System
    category: external
    summary: External forward and reverse name resolution for every host and appliance - a hard VCF dependency.
    purpose: |
      Gives every VCF host and appliance a stable name-to-address and address-to-name identity used by deployment,
      certificates, APIs, authentication and operational troubleshooting.
    function: |
      Every component addresses others by FQDN and certificates carry FQDNs. Forward and reverse records must exist
      before deployment, domain creation or host commissioning.
    capabilities:
      - Resolve management FQDNs to addresses and addresses back to canonical FQDNs.
      - Provide stable identities used in certificates and component registrations.
      - Forward public or external-zone queries according to enterprise DNS policy.
    limitations:
      - It does not provide time synchronization, routing or certificate issuance.
      - A successful lookup from one workstation does not prove that every VCF component uses the same resolver path.
      - Multiple or stale PTR answers can still fail VCF validation even when forward lookup succeeds.
    managementSurfaces:
      - Enterprise DNS administration platform outside VCF.
      - Host and appliance resolver settings for the client side of the dependency.
      - Standard DNS query tools for forward and reverse verification.
    commonMistakes:
      - Creating only A records and omitting matching PTR records.
      - Using short names where the workflow requires an FQDN.
      - Treating a client-side cache result as proof of authoritative-zone correctness.
    examFocus: |
      DNS is candidate-profile foundation knowledge and a common root cause in deployment, certificate and component-
      communication scenarios. Test forward/reverse consistency and the resolver perspective.
    runsOn: Customer infrastructure (outside VCF).
    managedBy: Customer network/AD team
    dependsOn: []
    communicatesWith: []
    failureImpact: |
      Validations fail, API calls between components fail, certificate trust breaks, logins fail.
    verify: |
      `nslookup <fqdn>` and `nslookup <ip>` from appliances and hosts return matching results.
    lessons: [component-communication, dns-ntp-dependencies]
    labs: [lab-network-readiness]

  - id: ntp-service
    name: NTP service
    fullName: Network Time Protocol Service
    category: external
    summary: Common time source for all hosts and appliances.
    purpose: |
      Keeps VCF systems on a common timeline so certificates, authentication tokens, distributed workflows and log
      correlation operate predictably.
    function: |
      Time synchronization; tokens, SSO and certificates are time-sensitive and logs need consistent timestamps.
    capabilities:
      - Synchronize hosts and appliances to approved enterprise time sources.
      - Provide offsets, peer state and reachability evidence for troubleshooting.
      - Support consistent event ordering across otherwise independent components.
    limitations:
      - A configured server entry does not prove the client is currently synchronized.
      - NTP does not resolve names or repair expired/misissued certificates.
      - One unreachable source provides no redundancy even when every client has the same configuration.
    managementSurfaces:
      - Enterprise NTP/chrony service outside VCF.
      - vSphere Client, Host Client and appliance-management time pages.
      - Component CLI diagnostics for configured peers, selection, reach and offset.
    commonMistakes:
      - Checking only the configured server and not live peer selection or offset.
      - Allowing different components to use unrelated time sources with inconsistent time.
      - Restarting services before recording the state that explains the failure.
    examFocus: |
      Treat NTP as a prerequisite and dependency behind authentication, certificate and log-correlation symptoms.
      Separate configuration intent from evidence of active synchronization.
    runsOn: Customer infrastructure (outside VCF).
    managedBy: Customer network team
    dependsOn: []
    communicatesWith: []
    failureImpact: |
      Clock skew causes authentication/token failures between components, certificate validity issues and
      unreadable log timelines.
    verify: |
      `esxcli system time get` on hosts; NTP status on appliances; offsets within seconds.
    lessons: [component-communication, dns-ntp-dependencies]
    labs: [lab-network-readiness]

  - id: physical-network
    name: Physical network
    fullName: Physical Data Center Network
    category: external
    summary: Top-of-rack switches and routers providing VLANs, MTU, routing and uplinks for VCF.
    purpose: |
      Provides the underlay that transports every VCF management, storage, mobility and overlay packet between hosts,
      appliances, Edge nodes and external networks.
    function: |
      Carries management, vMotion, vSAN, host/edge TEP and edge uplink VLANs; provides gateways and BGP/static
      routing for NSX Edges. Jumbo frames recommended; overlay needs MTU of at least 1600.
    capabilities:
      - Carry required VLANs between host and Edge uplinks.
      - Provide gateway, routed reachability and external connectivity.
      - Support the path MTU, redundancy and bandwidth required by each traffic type.
      - Exchange routes with NSX Edge nodes through BGP or supported static routing.
    limitations:
      - It does not create NSX logical segments, distributed firewall policy or VMkernel services.
      - A large switch MTU cannot compensate for a smaller VMkernel, virtual-switch or intermediate-path MTU.
      - A home-lab bridge can prove logical reachability without reproducing production failure domains or throughput.
    managementSurfaces:
      - Physical switch and router management platforms.
      - Cabling, interface, VLAN, routing and telemetry views owned by the network team.
      - VCF-side path tests such as VMkernel ping and NSX tunnel/route health.
    commonMistakes:
      - Treating a successful small ping as proof that jumbo frames work end to end.
      - Configuring a VLAN on the host side but not allowing it on every trunk in the path.
      - Troubleshooting an NSX overlay before proving the IP underlay and TEP path.
    examFocus: |
      Map symptoms to VLAN, MTU, gateway, routing, redundancy and underlay/overlay boundaries. Know what VCF or NSX
      can configure and what remains the responsibility of the physical network.
    runsOn: Physical switches/routers.
    managedBy: Network team
    dependsOn: []
    communicatesWith:
      - { id: nsx-edge-cluster, purpose: "North-south routing" }
    failureImpact: |
      Data plane outages: VM traffic, vSAN, vMotion and overlay can fail; MTU mismatches cause partial failures.
    verify: |
      vmkping with large packets and don't-fragment between hosts; BGP neighbor status.
    lessons: [component-communication, network-fundamentals-for-vcf]
    labs: [lab-network-readiness]
